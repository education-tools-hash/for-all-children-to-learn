<div id="donomanaLockToast" role="alert" aria-live="assertive" style="position:fixed;top:112px;left:50%;transform:translateX(-50%) translateY(-10px);background:#c0392b;color:#fff;font-size:14px;font-weight:700;padding:10px 20px;border-radius:40px;box-shadow:0 4px 24px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:100000;white-space:nowrap;"></div>
<script>
(function(){
  var locked=false, toastTimer=null;
  function toast(msg){
    var el=document.getElementById('donomanaLockToast');
    if(!el)return;
    el.textContent=msg;
    el.style.opacity='1'; el.style.transform='translateX(-50%) translateY(0)';
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){el.style.opacity='0';el.style.transform='translateX(-50%) translateY(-10px)';},2200);
  }
  function setLock(on){
    locked=on;
    var btn=document.getElementById('donomanaLockBtn');
    if(btn){
      btn.textContent=on?'🔒':'🔓';
      btn.style.background=on?'rgba(255,80,80,0.92)':'rgba(255,255,255,0.92)';
      btn.setAttribute('aria-label',on?'ロックちゅう（タップでかいじょ）':'がめんをロック');
    }
    if(on){
      history.pushState({donomanaLocked:true},'');
      history.pushState({donomanaLocked:true},'');
      toast('🔒 がめんをロックしたよ');
    } else {
      toast('🔓 ロックをかいじょしたよ');
    }
  }
  window.addEventListener('popstate',function(){
    if(locked){history.pushState({donomanaLocked:true},'');toast('🔒 まえの がめんには もどれないよ');}
  });
  window.addEventListener('beforeunload',function(e){
    if(locked){e.preventDefault();e.returnValue='';}
  });
  document.addEventListener('DOMContentLoaded',function(){
    var lockBtn=document.getElementById('donomanaLockBtn');
    if(lockBtn)lockBtn.addEventListener('click',function(){setLock(!locked);});
    var homeBtn=document.getElementById('donomanaHomeBtn');
    if(homeBtn){
      homeBtn.addEventListener('click',function(e){
        if(locked){e.preventDefault();toast('🔒 まえの がめんには もどれないよ');}
      });
    }
    var fsBtn=document.getElementById('donomanaFsBtn');
    function inFS(){return !!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement);}
    function updateFsBtn(){if(fsBtn){fsBtn.textContent=inFS()?'⊡':'⛶';fsBtn.setAttribute('aria-label',inFS()?'全画面を解除':'全画面表示');}}
    ['fullscreenchange','webkitfullscreenchange','mozfullscreenchange'].forEach(function(ev){document.addEventListener(ev,updateFsBtn);});
    if(fsBtn)fsBtn.addEventListener('click',function(){
      if(!inFS()){
        var el=document.documentElement;
        var req=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen;
        if(req)req.call(el);
      } else {
        var ex=document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen;
        if(ex)ex.call(document);
      }
    });
  });
})();
</script>

<div id="donomanaAnnouncePolite" role="status" aria-live="polite" aria-atomic="true" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;padding:0;margin:-1px;"></div>
<div id="donomanaAnnounceAssertive" role="alert" aria-live="assertive" aria-atomic="true" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;padding:0;margin:-1px;"></div>
<script>
(function(){
  if (window.donomanaAnnounce) return;
  var politeTimer = null, assertiveTimer = null;
  function donomanaAnnounce(message, options){
    if (typeof message !== 'string') return;
    if (message.trim() === '') return;
    var opts = options || {};
    var priority = (opts.priority === 'assertive') ? 'assertive' : 'polite';
    var clearDelay = (typeof opts.clearDelay === 'number' && Number.isFinite(opts.clearDelay) && opts.clearDelay >= 0) ? opts.clearDelay : 50;
    var elId = (priority === 'assertive') ? 'donomanaAnnounceAssertive' : 'donomanaAnnouncePolite';
    var live = document.getElementById(elId);
    if (!live) return;
    if (priority === 'assertive') { clearTimeout(assertiveTimer); } else { clearTimeout(politeTimer); }
    live.textContent = '';
    var timer = setTimeout(function(){ live.textContent = message; }, clearDelay);
    if (priority === 'assertive') { assertiveTimer = timer; } else { politeTimer = timer; }
  }
  window.donomanaAnnounce = donomanaAnnounce;
})();
</script>

<script>
/* ================================================================
   Phase FISHING-APP-IMPLEMENTATION-1 — Pilot: mode="free" x reelMethod="hold" のみ。
   Source of Truth: docs/design-system/donomana-fishing-app-design-contract-v1_0.md
   および docs/design-system/donomana-fishing-app-implementation-plan-v1_0.md
================================================================ */

/* ---- State Machine (Implementation Plan 5章) ---- */
var STATE = { IDLE:'IDLE', CASTING:'CASTING', WAITING:'WAITING', BITTEN:'BITTEN', REELING:'REELING', CAUGHT:'CAUGHT' };
var state = STATE.IDLE;

/* Canonical Session State（Design Contract 7.1章） */
var reelProgress = 0;      // 0-100, monotonically non-decreasing (9章)
var hookedFishId = null;
var currentFish = null;    // {color, emoji} — presentation only
var caughtLanded = false;  // guards landFish() double-fire (5.4章)
var sessionId = null;
var trialNumber = 0;
var castStartedAt = 0;
var lastInputMethod = null;

/* Transient Interaction State（17.1章）— kept structurally separate from the above */
var isPhysicallyHeld = false;
var holdInputMethod = null;
var holdTimer = null;
var castTimer = null, waitTimer = null, biteTimer = null, caughtTimer = null, pointerWatchdog = null;

var HOLD_TICK_MS = 120;
var HOLD_TICK_AMOUNT = 3;       // ~4s of continuous holding to land a fish
var CASTING_MS = 500;
var WAITING_MIN_MS = 1200, WAITING_MAX_MS = 2200; // "厳密なランダム性は不要" (Phase指示9章)
var BITTEN_MS = 500;
var CAUGHT_DISPLAY_MS = 2600;
var POINTER_WATCHDOG_MS = 20000; // stale-input safety net (5.3.1章)
var FISH_START_PCT = 12, FISH_HOOK_PCT = 88;
var FISH_PALETTE = [
  { color: 'red',    emoji: '🐟' },
  { color: 'blue',   emoji: '🐠' },
  { color: 'yellow', emoji: '🐡' }
];

var elStart = document.getElementById('start-screen');
var elFishing = document.getElementById('fishing-screen');
var elStatus = document.getElementById('status-text');
var elFish = document.getElementById('fish');
var elProgressFill = document.getElementById('progress-fill');
var elProgressText = document.getElementById('progress-text');
var elCastBtn = document.getElementById('cast-btn');
var elReelBtn = document.getElementById('reel-hold-btn');
var elCatchResult = document.getElementById('catch-result');
var elCatchMessage = document.getElementById('catch-message');
var elAgainBtn = document.getElementById('again-btn');
var elSoundToggle = document.getElementById('sound-toggle');

function lerp(a, b, t) { return a + (b - a) * t; }
function randomBetween(min, max) { return min + Math.random() * (max - min); }
function announce(msg) { if (typeof window.donomanaAnnounce === 'function') window.donomanaAnnounce(msg); }
function makeSessionId() { return 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

/* ---- Reaction Layer (Implementation Plan 10章) ----
   Reuses sawatte-hirogaru-app.html's ensureAudioContext/unlockAudioContext/discrete-tone
   pattern (single AudioContext, pure synthesis, no external audio assets). The continuous
   reel tone is new (no prior art in this repo): explicit start/update/stop lifecycle so no
   AudioNode is ever leaked or double-started. */
var audioCtx = null, masterGain = null;
var soundOn = true;
var reelOsc = null, reelGain = null;

function ensureAudioContext() {
  if (audioCtx) return audioCtx;
  var Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return null;
  audioCtx = new Ctx();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 1;
  masterGain.connect(audioCtx.destination);
  return audioCtx;
}
function unlockAudioContext() {
  var ctx = ensureAudioContext();
  if (ctx && ctx.state === 'suspended') ctx.resume().catch(function () {});
}
function playTone(freq, durationMs, type) {
  if (!soundOn) return;
  var ctx = ensureAudioContext();
  if (!ctx) return;
  var osc = ctx.createOscillator();
  var gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  osc.connect(gain).connect(masterGain);
  var now = ctx.currentTime;
  gain.gain.setValueAtTime(0.001, now);
  gain.gain.exponentialRampToValueAtTime(0.22, now + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, now + durationMs / 1000);
  osc.start(now);
  osc.stop(now + durationMs / 1000 + 0.02);
}
function playBiteSound() { playTone(660, 140, 'triangle'); }
function playCaughtSound() {
  playTone(523.25, 150, 'triangle');
  setTimeout(function () { playTone(783.99, 260, 'triangle'); }, 130);
}
function startReelSoundActive() {
  if (!soundOn || reelOsc) return;
  var ctx = ensureAudioContext();
  if (!ctx) return;
  reelOsc = ctx.createOscillator();
  reelGain = ctx.createGain();
  reelOsc.type = 'sine';
  reelOsc.frequency.value = 220;
  reelGain.gain.value = 0.0001;
  reelOsc.connect(reelGain).connect(masterGain);
  reelOsc.start();
  reelGain.gain.linearRampToValueAtTime(0.05, ctx.currentTime + 0.08);
}
function stopReelSoundActive() {
  if (!reelOsc) return;
  var ctx = audioCtx, osc = reelOsc, gain = reelGain;
  reelOsc = null; reelGain = null;
  if (ctx && gain) {
    gain.gain.cancelScheduledValues(ctx.currentTime);
    gain.gain.setValueAtTime(gain.gain.value, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + 0.08);
  }
  setTimeout(function () { try { osc.stop(); } catch (e) {} }, 120);
}
elSoundToggle.addEventListener('change', function (e) {
  soundOn = e.target.checked;
  if (!soundOn) stopReelSoundActive();
});

/* ---- Rendering ---- */
function renderFishPosition() {
  var t = reelProgress / 100;
  elFish.style.left = lerp(FISH_START_PCT, FISH_HOOK_PCT, t) + '%';
}
function renderProgress() {
  elProgressFill.style.width = reelProgress + '%';
  elProgressText.textContent = reelProgress >= 100 ? 'つれた！' : ('のこり ' + Math.max(0, 100 - Math.round(reelProgress)) + '%');
}
var STATUS_LABELS = {
  IDLE: 'キャストしよう',
  CASTING: 'しかけを なげているよ…',
  WAITING: 'さかなを まっているよ…',
  BITTEN: 'さかなが かかったよ！',
  REELING: 'おしつづけて まきとろう',
  CAUGHT: 'やったね！'
};
function updateUI() {
  elStatus.textContent = STATUS_LABELS[state];
  elCastBtn.disabled = (state !== STATE.IDLE);
  var reeling = (state === STATE.REELING);
  elReelBtn.setAttribute('aria-disabled', reeling ? 'false' : 'true');
  elReelBtn.classList.toggle('inactive', !reeling);
  var fishVisible = (state === STATE.WAITING || state === STATE.BITTEN || state === STATE.REELING || state === STATE.CAUGHT);
  elFish.style.display = fishVisible ? '' : 'none';
  elFish.classList.toggle('swimming', state === STATE.WAITING);
  elFish.classList.toggle('bitten', state === STATE.BITTEN);
  elCatchResult.hidden = (state !== STATE.CAUGHT);
  elAgainBtn.hidden = (state !== STATE.CAUGHT);
  if (state === STATE.IDLE) { elProgressText.textContent = 'まだ キャストしていないよ'; elProgressFill.style.width = '0%'; }
}

/* ---- Stale-input safety (Implementation Plan 5.3.1章) ----
   "疑わしい場合はfalse側に倒す": every one of these independently forces
   isPhysicallyHeld back to false and stops any active hold timer/sound. */
function armPointerWatchdog() {
  clearTimeout(pointerWatchdog);
  pointerWatchdog = setTimeout(function () { markReleased(); }, POINTER_WATCHDOG_MS);
