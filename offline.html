<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>オフラインです | どのまな</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#00A99D">
<style>
:root{
  --teal:#00A99D; --teal-dark:#00857B; --ink:#3B4A54; --ink-soft:#5C6B75;
  --paper:#FFFFFF; --cream:#FBFBF8; --teal-tint:#E6F6F5; --line:#EDF1F0;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;
  color:var(--ink); background:var(--cream); min-height:100vh; display:flex;
  align-items:center; justify-content:center; padding:24px; line-height:1.9}
a:focus-visible,button:focus-visible{outline:3px solid var(--teal-dark); outline-offset:3px; border-radius:6px}
.card{max-width:440px; width:100%; background:var(--paper); border-radius:24px; border:1px solid var(--line);
  box-shadow:0 4px 20px rgba(59,74,84,.08); padding:40px 32px; text-align:center}
.icon{font-size:48px; margin-bottom:18px}
h1{font-size:1.25rem; font-weight:900; letter-spacing:.04em; margin-bottom:14px}
p{font-size:.95rem; color:var(--ink-soft); font-weight:500; margin-bottom:10px}
.actions{margin-top:26px; display:flex; flex-direction:column; gap:12px}
.btn{display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:10px 24px;
  border-radius:999px; font:inherit; font-weight:900; letter-spacing:.03em; text-decoration:none; cursor:pointer; border:none}
.btn-primary{background:var(--teal); color:#fff}
.btn-primary:hover{background:var(--teal-dark)}
.btn-secondary{background:var(--teal-tint); color:var(--teal-dark)}
.btn-secondary:hover{background:#d7efed}
@media (min-width:480px){ .actions{flex-direction:row; justify-content:center} }
</style>
</head>
<body>
<main class="card">
  <div class="icon" aria-hidden="true">📡</div>
  <h1>インターネットに接続できません</h1>
  <p>一度開いたことのある教材は、オフラインでも利用できる場合があります。</p>
  <p>電波の良いところで、もう一度お試しください。</p>
  <div class="actions">
    <a class="btn btn-primary" href="/">ホームへもどる</a>
    <button type="button" class="btn btn-secondary" id="retry-btn">もう一度読み込む</button>
  </div>
</main>
<script>
document.getElementById('retry-btn').addEventListener('click', function () {
  location.reload();
});
</script>
</body>
</html>
