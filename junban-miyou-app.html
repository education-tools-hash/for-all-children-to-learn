    <button data-a11y-sr="off" style="flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;padding:8px 4px;border-radius:8px;border:2px solid #ddd;background:#fff;font-size:12px;font-weight:700;cursor:pointer;">オフ</button>
    <button data-a11y-sr="on" style="flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;padding:8px 4px;border-radius:8px;border:2px solid #ddd;background:#fff;font-size:12px;font-weight:700;cursor:pointer;">オン</button>
  </div>
  <button id="donomanaA11yReset" style="width:100%;min-height:44px;display:flex;align-items:center;justify-content:center;padding:8px;border-radius:8px;border:none;background:#f0f0f0;color:#333;font-size:12px;font-weight:900;cursor:pointer;">↺ すべてリセット</button>

<div id="donomanaA11yStatus" role="status" aria-live="polite" aria-atomic="true" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;padding:0;margin:-1px;"></div>
<script>
(function(){
  var P = 'donomana-a11y-';
  function all(sel){return document.querySelectorAll(sel);}
  function mark(sel, dataAttr, value){
    all(sel).forEach(function(b){
      var on = b.dataset[dataAttr] === value;
      b.style.background = on ? '#00A99D' : '#fff';
      b.style.color = on ? '#fff' : '#333';
      b.style.borderColor = on ? '#00A99D' : '#ddd';
    });
  }
  var donomanaAnnounceA11yTimer = null;
  function donomanaAnnounceA11y(msg){
    var live = document.getElementById('donomanaA11yStatus');
    if (!live) return;
    clearTimeout(donomanaAnnounceA11yTimer);
    live.textContent = '';
    donomanaAnnounceA11yTimer = setTimeout(function(){ live.textContent = msg; }, 50);
  }
  function applyContrast(mode){
    document.documentElement.style.filter = (mode === 'hc') ? 'invert(1) hue-rotate(180deg)' : '';
    mark('[data-a11y-contrast]', 'a11yContrast', mode);
    localStorage.setItem(P + 'contrast', mode);
  }
  function applyFont(size){
    var zoomMap = { normal: '', large: '125%', xlarge: '150%' };
    document.body.style.zoom = zoomMap[size] || '';
    mark('[data-a11y-font]', 'a11yFont', size);
    localStorage.setItem(P + 'font', size);
  }

  var srEnabled = false;
  function speak(text){
    if (!srEnabled || !window.speechSynthesis || !text) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text.trim());
    u.lang = 'ja-JP'; u.rate = 0.95;
    window.speechSynthesis.speak(u);
  }
  function onGlobalSpeakClick(e){
    if (!srEnabled) return;
    if (e.target.closest('#donomanaA11yPanel, #donomanaA11yBtn')) return;
    var el = e.target.closest('button, a, [role="button"]');
    if (!el) return;
    var text = (el.getAttribute('aria-label') || el.textContent || '').trim();
    if (text) speak(text);
  }
  function applyScreenReader(enabled){
    srEnabled = enabled;
    mark('[data-a11y-sr]', 'a11ySr', enabled ? 'on' : 'off');
    localStorage.setItem(P + 'sr', enabled ? '1' : '0');
    if (enabled) {
      speak('読み上げ機能をオンにしました');
      document.addEventListener('click', onGlobalSpeakClick, true);
    } else {
      window.speechSynthesis && window.speechSynthesis.cancel();
      document.removeEventListener('click', onGlobalSpeakClick, true);
    }
  }
  document.addEventListener('DOMContentLoaded', function(){
    var btn = document.getElementById('donomanaA11yBtn');
    var panel = document.getElementById('donomanaA11yPanel');
    if (!btn || !panel) return;
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var open = panel.style.display === 'block';
      panel.style.display = open ? 'none' : 'block';
      btn.setAttribute('aria-expanded', open ? 'false' : 'true');
      panel.setAttribute('aria-hidden', open ? 'true' : 'false');
    });
    document.addEventListener('click', function(e){
      if (!panel.contains(e.target) && e.target !== btn) {
        panel.style.display = 'none';
        btn.setAttribute('aria-expanded', 'false');
        panel.setAttribute('aria-hidden', 'true');
      }
    });
    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape' && panel.style.display === 'block') btn.click();
    });
    all('[data-a11y-contrast]').forEach(function(b){ b.addEventListener('click', function(){
      applyContrast(b.dataset.a11yContrast);
      donomanaAnnounceA11y(b.dataset.a11yContrast === 'hc' ? 'ハイコントラストをオンにしました' : 'ハイコントラストをオフにしました');
    }); });
    all('[data-a11y-font]').forEach(function(b){ b.addEventListener('click', function(){
      applyFont(b.dataset.a11yFont);
      donomanaAnnounceA11y('文字の大きさを' + ({normal:'標準',large:'大',xlarge:'特大'}[b.dataset.a11yFont] || '標準') + 'にしました');
    }); });
    all('[data-a11y-sr]').forEach(function(b){ b.addEventListener('click', function(){
      applyScreenReader(b.dataset.a11ySr === 'on');
      donomanaAnnounceA11y(b.dataset.a11ySr === 'on' ? '読み上げ機能をオンにしました' : '読み上げ機能をオフにしました');
    }); });

    var proxyBtn = document.getElementById('donomanaSettingsProxy');
    if (proxyBtn) {
      function donomanaIsFocusable(el){
        if (!el || !el.isConnected || el.disabled || el.tabIndex === -1) return false;
        if (el.hasAttribute('hidden') || el.closest('[hidden]') || el.closest('[inert]')) return false;
        if (el.getClientRects().length === 0) return false;
        var cs = getComputedStyle(el);
        if (cs.display === 'none' || cs.visibility === 'hidden' || cs.visibility === 'collapse') return false;
        if (Number.parseFloat(cs.opacity) === 0) return false;
        return true;
      }
      function donomanaFirstFocusable(root){
        if (!root) return null;
        var cands = root.querySelectorAll('button, input, select, textarea, a[href], [tabindex]');
        for (var i = 0; i < cands.length; i++) { if (donomanaIsFocusable(cands[i])) return cands[i]; }
        return null;
      }
      proxyBtn.addEventListener('click', function(e){
        e.stopPropagation();
        var candidates = Array.from(document.querySelectorAll("#setBtn"));
        var original = candidates.find(function(el){ return el.offsetParent !== null; }) || candidates[0];
        panel.style.display = 'none';
        btn.setAttribute('aria-expanded', 'false');
        panel.setAttribute('aria-hidden', 'true');
        if (!original) return;
        var controlsId = original.getAttribute('aria-controls');
        var beforeVisible = null;
        if (!controlsId) {
          beforeVisible = new Set();
          document.querySelectorAll('body *').forEach(function(el){
            if (el.getClientRects().length > 0) beforeVisible.add(el);
          });
        }
        original.focus();
        original.click();
        setTimeout(function(){
          var active = document.activeElement;
          var needsFallback = (active === document.body) || (active === original && !donomanaIsFocusable(original));
          if (!needsFallback) return;
          var target = null;
          if (controlsId) {
            target = donomanaFirstFocusable(document.getElementById(controlsId));
          } else {
            var newly = [];
            document.querySelectorAll('body *').forEach(function(el){
              if (el.getClientRects().length > 0 && !beforeVisible.has(el)) newly.push(el);
            });
            for (var i = 0; i < newly.length; i++) {
              if (/^(BUTTON|INPUT|SELECT|TEXTAREA|A)$/.test(newly[i].tagName) && donomanaIsFocusable(newly[i])) { target = newly[i]; break; }
            }
          }
          if (target) target.focus();
        }, 100);
      });
    }
    var resetBtn = document.getElementById('donomanaA11yReset');
    if (resetBtn) resetBtn.addEventListener('click', function(){
      applyContrast('normal'); applyFont('normal'); applyScreenReader(false);
      localStorage.removeItem(P + 'contrast'); localStorage.removeItem(P + 'font'); localStorage.removeItem(P + 'sr');
      donomanaAnnounceA11y('設定をリセットしました');
    });
    applyContrast(localStorage.getItem(P + 'contrast') || 'normal');
    applyFont(localStorage.getItem(P + 'font') || 'normal');
    applyScreenReader(localStorage.getItem(P + 'sr') === '1');
  });
})();
</script>

<script>
'use strict';

/* =====================================================================
   Passengers / Train assets (Phase M10-C — Visual Source of Truth:
   User提供の高解像度個別asset。Reference Sheetからの再トリミングは廃止。
   Ready/Activeは単一の高解像度passenger画像をcarriage画像の上へCSSで
   layer合成することで表現する(専用のActive画像は使用しない)。
===================================================================== */
var PASSENGERS = [
  { id: 'rabbit', label: 'うさぎ', car: 'pink' },
  { id: 'cat',    label: 'ねこ',   car: 'blue' },
  { id: 'dog',    label: 'いぬ',   car: 'purple' },
  { id: 'bear',   label: 'くま',   car: 'orange' },
  { id: 'chick',  label: 'ひよこ', car: 'green' }
];
var PASSENGER_BY_ID = {};
PASSENGERS.forEach(function(p){ PASSENGER_BY_ID[p.id] = p; });
var ASSET_BASE = 'assets/junban-miyou/';
function passengerImg(id) { return ASSET_BASE + 'passengers/' + id + '.png'; }
function carriageImg(color) { return ASSET_BASE + 'train/carriage-' + color + '.png'; }
var LOCOMOTIVE_IMG = ASSET_BASE + 'train/locomotive.png';

var ALL_POSITIONS = ['left','right','upper-left','upper-right','lower-left','lower-right','center'];
// Phase M10-C: Achievement/Accumulation UX Fix — 全Levelで5キャラクター全員を使用する。
var LEVEL_POSITIONS = { 1: ['center'], 2: ALL_POSITIONS, 3: ['center'] };
var LEVEL_SEQUENCE_LEN = { 1: 5, 2: 5, 3: 5 };
var LEVEL_NAME = { 1: 'ひとつずつ', 2: 'つぎはどこ？', 3: 'みんなでしゅっぱつ！' };

var DWELL_MS = 900;
var ACTIVATION_LOCK_MS = 300;
var SCAN_INTERVAL_MS = 1500;
var BOARD_ANIM_MS = 480;
var NEXT_APPEAR_DELAY_MS = 650;
var DEPARTURE_MS = 1000;
var COMPLETE_HOLD_MS = 750;       // 完成列車を見せてからdepartureへ移る余韻(§11: 500-1000ms)
var ROUND_RESET_DELAY_MS = 1600;

/* =====================================================================
   Canonical / Transient state (§34-35)
===================================================================== */
var canonical = {
  level: 1,
  phase: 'ready',          // 'ready' | 'boarding' | 'departing'
  sequenceIndex: 0,
  currentPassengerId: null,
  completedPassengerIds: [],
  trialIndex: 0,
  activationCount: 0,
  sessionStart: Date.now()
};
var transient = {
  gazePassengerId: null, gazeStartedAt: 0, gazeAwaitingLeaveId: null,
  scanIndex: -1, scanTimer: null,
  inputLockUntil: 0,
  feedbackTimer: null, nextAppearTimer: null, roundResetTimer: null, guidedAttentionTimer: null,
  touchStartPos: null,
  previousPassengerId: null, previousPosition: null,
  sequence: []           // 今ラウンドのpassenger idの並び
};
var trialStartedAt = performance.now();
var lastDwellDurationMs = null;
var currentInputMethod = 'unknown';
var suppressNextClick = false;

/* =====================================================================
   Settings / storage
===================================================================== */
var STORAGE_LOG_KEY = 'junban_miyou_log';
var STORAGE_SETTINGS_KEY = 'junban_miyou_settings';
var soundEnabled = true;
var gazeEnabled = false;
var scanMode = false;

function loadSettings() {
  try {
    var raw = localStorage.getItem(STORAGE_SETTINGS_KEY);
    if (!raw) return;
    var s = JSON.parse(raw);
    if (typeof s.soundEnabled === 'boolean') soundEnabled = s.soundEnabled;
  } catch (e) {}
}
function saveSettings() {
  try { localStorage.setItem(STORAGE_SETTINGS_KEY, JSON.stringify({ soundEnabled: soundEnabled })); } catch (e) {}
}
function readLog() {
  try { var raw = localStorage.getItem(STORAGE_LOG_KEY); return raw ? JSON.parse(raw) : []; } catch (e) { return []; }
}
function writeLog(log) { try { localStorage.setItem(STORAGE_LOG_KEY, JSON.stringify(log)); } catch (e) {} }
function addLog(entry) { var log = readLog(); log.push(entry); writeLog(log); }

/* =====================================================================
   Sound — short synthesized tones via Web Audio. No external assets, no BGM (§39).
===================================================================== */
var audioCtx = null;
function tone(specs) {
  if (!soundEnabled) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    var now = audioCtx.currentTime;
    specs.forEach(function(spec) {
      var freq = spec[0], start = now + spec[1], dur = spec[2], peak = spec[3] || 0.13;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(peak, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(start); osc.stop(start + dur + 0.02);
    });
  } catch (e) {}
}
function playBoardSound() { tone([[720, 0, 0.10, 0.14], [960, 0.07, 0.11, 0.12]]); }      // ぽん♪
function playAppearSound() { tone([[1300, 0, 0.07, 0.06]]); }                              // きらん♪(控えめ)
function playDepartSound() { tone([[300, 0, 0.09, 0.15], [220, 0.09, 0.13, 0.13]]); }      // ガタン♪

/* =====================================================================
   Sequence generation (§36) — 5passengerから重複なしで抽出、直前ラウンド
   と完全一致回避、直前passengerの連続repeat抑制。
===================================================================== */
function pickSequence(level) {
  var len = LEVEL_SEQUENCE_LEN[level];
  var pool = PASSENGERS.map(function(p){ return p.id; });
  var seq = [];
  var avoid = transient.previousPassengerId;
  for (var i = 0; i < len; i++) {
    var candidates = pool.filter(function(id){ return seq.indexOf(id) === -1 && id !== avoid; });
    if (candidates.length === 0) candidates = pool.filter(function(id){ return seq.indexOf(id) === -1; });
    if (candidates.length === 0) candidates = pool.slice();
    var pick = candidates[Math.floor(Math.random() * candidates.length)];
    seq.push(pick);
    avoid = pick;
  }
  // 直前ラウンドと完全一致した場合は先頭2つを入れ替えて回避(len>=2のときのみ意味を持つ)
  if (len > 1 && transient.previousSequence && seq.join(',') === transient.previousSequence.join(',')) {
    var tmp = seq[0]; seq[0] = seq[1]; seq[1] = tmp;
  }
  return seq;
}
function pickPosition(level) {
  var slots = LEVEL_POSITIONS[level];
  var candidates = slots.filter(function(p){ return p !== transient.previousPosition; });
  if (candidates.length === 0) candidates = slots.slice();
  var pos = candidates[Math.floor(Math.random() * candidates.length)];
  transient.previousPosition = pos;
  return pos;
}

/* =====================================================================
   Round / trial control
===================================================================== */
var stage = document.getElementById('stage');
var targetArea = document.getElementById('targetArea');
var trainDock = document.getElementById('trainDock');
var guideText = document.getElementById('guideText');
var departureBanner = document.getElementById('departureBanner');

function clearAllTimers() {
  clearTimeout(transient.feedbackTimer);
  clearTimeout(transient.nextAppearTimer);
  clearTimeout(transient.roundResetTimer);
  clearTimeout(transient.guidedAttentionTimer);
}

function startNewRound() {
  clearAllTimers();
  canonical.trialIndex += 1;
  canonical.sequenceIndex = 0;
  canonical.completedPassengerIds = [];
  canonical.phase = 'ready';
  transient.sequence = pickSequence(canonical.level);
  renderTrainDock();
  departureBanner.classList.remove('on');
  trainDock.classList.remove('departing');
  document.getElementById('softCompleteText').textContent = '';
  showNextPassenger();
}
function currentSequenceLength() { return transient.sequence.length; }

function showNextPassenger() {
  clearTimeout(transient.nextAppearTimer);
  resetDwellState();
  var idx = canonical.sequenceIndex;
  if (idx >= currentSequenceLength()) return; // ラウンド完了(departureへ)
  var passengerId = transient.sequence[idx];
  canonical.currentPassengerId = passengerId;
  canonical.phase = 'ready';
  var pos = pickPosition(canonical.level);
  transient.previousPassengerId = passengerId;
  trialStartedAt = performance.now();

  renderTargetArea(passengerId, pos);
  var label = PASSENGER_BY_ID[passengerId].label;
  guideText.textContent = (currentSequenceLength() > 1)
    ? ('つぎは「' + label + '」だよ！ (' + (idx + 1) + '/' + currentSequenceLength() + ')')
    : ('「' + label + '」が きたよ！');
  donomanaAnnounce('つぎは' + label);
  playAppearSound();

  if (scanMode) { refreshSwitchScanItems(); startAutoScan(); }
}

function renderTargetArea(passengerId, pos) {
  targetArea.innerHTML = '';
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'jm-passenger-btn appear ga-active jm-pos-' + pos + ' scannable';
  btn.dataset.scan = '1';
  btn.dataset.passengerId = passengerId;
  btn.tabIndex = 0;
  btn.setAttribute('aria-label', PASSENGER_BY_ID[passengerId].label + 'に はたらきかける');

  var glow = document.createElement('span'); glow.className = 'jm-ga-glow'; btn.appendChild(glow);
  var ring = document.createElement('span'); ring.className = 'jm-ga-ring'; btn.appendChild(ring);

  var img = document.createElement('img');
  img.className = 'jm-passenger-img';
  img.src = passengerImg(passengerId);
  img.alt = '';
  img.draggable = false;
  btn.appendChild(img);

  var gazeRing = document.createElement('span'); gazeRing.className = 'jm-gaze-ring'; btn.appendChild(gazeRing);

  attachPassengerHandlers(btn, passengerId);
  targetArea.appendChild(btn);
}

function attachPassengerHandlers(btn, passengerId) {
  btn.addEventListener('click', function() {
    if (suppressNextClick) { suppressNextClick = false; return; }
    activatePassenger(passengerId, currentInputMethod);
  });
  btn.addEventListener('pointerdown', function(e) {
    if (e.pointerType === 'touch' || e.pointerType === 'mouse') {
      transient.touchStartPos = { x: e.clientX, y: e.clientY };
      btn.classList.add('pressed');
    }
  });
  btn.addEventListener('pointerup', function() { btn.classList.remove('pressed'); transient.touchStartPos = null; });
  btn.addEventListener('pointercancel', function() { btn.classList.remove('pressed'); transient.touchStartPos = null; });
  btn.addEventListener('pointermove', function(e) {
    if (!transient.touchStartPos) return;
    var dx = e.clientX - transient.touchStartPos.x, dy = e.clientY - transient.touchStartPos.y;
    if (Math.sqrt(dx * dx + dy * dy) > 8) { suppressNextClick = true; btn.classList.remove('pressed'); }
  });
  btn.addEventListener('keydown', function(e) {
    if (scanMode && (e.key === ' ' || e.key === 'Spacebar')) return;
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      activatePassenger(passengerId, 'keyboard');
    }
  });
}
document.addEventListener('pointerdown', function(e) {
  currentInputMethod = (e.pointerType === 'touch') ? 'touch' : 'click';
}, true);

/* =====================================================================
   Semantic Activation API (§31-33) — 1 physical input = 1 semantic activation。
   Touch/Gaze/Switch/Keyboardは全てこの一箇所へ合流する。
===================================================================== */
function activatePassenger(passengerId, inputMethod) {
  if (canonical.phase !== 'ready') return;
  var now = performance.now();
  if (now < transient.inputLockUntil) return;
  if (passengerId !== canonical.currentPassengerId) return;

  transient.inputLockUntil = now + ACTIVATION_LOCK_MS;
  var responseTime = Math.round(now - trialStartedAt);
  var dwellDuration = (inputMethod === 'gaze') ? lastDwellDurationMs : null;
  lastDwellDurationMs = null;
  currentInputMethod = inputMethod;
  resetDwellState();
  if (scanMode) { stopAutoScan(); clearScanHighlight_classOnly(); }

  canonical.activationCount += 1;
  canonical.phase = 'boarding';

  var btn = targetArea.querySelector('.jm-passenger-btn');
  if (btn) { btn.classList.remove('ga-active'); btn.classList.add('boarding'); }
  playBoardSound();
  spawnSparkle();

  addLog({
    time: new Date().toISOString(), level: canonical.level,
    passenger: PASSENGER_BY_ID[passengerId].label, sequenceIndex: canonical.sequenceIndex + 1,
    sequenceLength: currentSequenceLength(), inputMethod: inputMethod,
    responseTime: responseTime, dwellDuration: dwellDuration, trialIndex: canonical.trialIndex
  });

  transient.feedbackTimer = setTimeout(function() {
    canonical.completedPassengerIds.push(passengerId);
    boardCar(passengerId);
    canonical.sequenceIndex += 1;
    targetArea.innerHTML = '';
    if (canonical.sequenceIndex >= currentSequenceLength()) {
      // 全Level共通：5体全員が乗車したら、完成した列車をしばらく見せてから
      // しゅっぱつへつなげる(Phase M10-C Achievement/Accumulation UX Fix §5,7,9,11)。
      showSoftCompletion();
      transient.roundResetTimer = setTimeout(startDeparture, COMPLETE_HOLD_MS);
    } else {
      transient.nextAppearTimer = setTimeout(showNextPassenger, NEXT_APPEAR_DELAY_MS);
    }
  }, BOARD_ANIM_MS);
}

function spawnSparkle() {
  var btn = targetArea.querySelector('.jm-passenger-btn');
  if (!btn) return;
  var rect = btn.getBoundingClientRect();
  var stageRect = stage.getBoundingClientRect();
  var el = document.createElement('span');
  el.className = 'jm-sparkle-pop';
  el.textContent = '✨';
  el.style.left = (rect.left - stageRect.left + rect.width / 2 - 12) + 'px';
  el.style.top = (rect.top - stageRect.top - 6) + 'px';
  stage.appendChild(el);
  requestAnimationFrame(function() { el.classList.add('on'); });
  setTimeout(function() { el.remove(); }, 750);
}

function showSoftCompletion() {
  var el = document.getElementById('softCompleteText');
  el.textContent = 'みんな のった！';
  guideText.textContent = '';
  donomanaAnnounce('みんなのった！');
}

function startDeparture() {
  canonical.phase = 'departing';
  guideText.textContent = 'しゅっぱつ！';
  donomanaAnnounce('しゅっぱつ！', { priority: 'assertive' });
  playDepartSound();
  departureBanner.classList.add('on');
  trainDock.classList.add('departing');
  if (scanMode) { stopAutoScan(); clearScanHighlight(); }
  transient.roundResetTimer = setTimeout(function() {
    transient.previousSequence = transient.sequence.slice();
    startNewRound();
  }, ROUND_RESET_DELAY_MS);
}

/* =====================================================================
   Train dock rendering
===================================================================== */
function renderTrainDock() {
  trainDock.innerHTML = '';
  var loco = document.createElement('img');
  loco.className = 'jm-loco-img';
  loco.src = LOCOMOTIVE_IMG;
  loco.alt = '';
  loco.draggable = false;
  trainDock.appendChild(loco);

  transient.sequence.forEach(function(passengerId) {
    var slot = document.createElement('span');
    slot.className = 'jm-car-slot empty';
    slot.dataset.passengerId = passengerId;
    var carImg = document.createElement('img');
    carImg.className = 'jm-car-img';
    carImg.src = carriageImg(PASSENGER_BY_ID[passengerId].car);
    carImg.alt = '';
    carImg.draggable = false;
    slot.appendChild(carImg);
    trainDock.appendChild(slot);
  });
}
function boardCar(passengerId) {
  var slot = trainDock.querySelector('.jm-car-slot[data-passenger-id="' + passengerId + '"]');
  if (!slot) return;
  slot.classList.remove('empty');
  slot.classList.add('boarded');
  // carriage画像はそのまま(色付き空車両)、その上にpassenger画像をlayer合成する
  // (専用のActive画像は使用せず、高解像度passenger単体assetを再利用する)
  var rider = document.createElement('img');
  rider.className = 'jm-car-rider';
  rider.src = passengerImg(passengerId);
  rider.alt = '';
  rider.draggable = false;
  slot.appendChild(rider);
}

/* =====================================================================
   Level switching
===================================================================== */
var levelBtns = Array.from(document.querySelectorAll('.level-btn'));
function setLevel(n) {
  clearAllTimers();
  canonical.level = n;
  transient.previousPosition = null;
  transient.previousPassengerId = null;
  levelBtns.forEach(function(b) {
    var on = Number(b.dataset.level) === n;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  document.getElementById('softCompleteText').textContent = '';
  departureBanner.classList.remove('on');
  trainDock.classList.remove('departing');
  startNewRound();
}
levelBtns.forEach(function(b) { b.addEventListener('click', function() { setLevel(Number(b.dataset.level)); }); });

/* =====================================================================
   Gaze / dwell (established pattern, reused verbatim — §29)
===================================================================== */
var lastGazeX = null, lastGazeY = null;
var gazeRafId = null;
function getGazeTargets() {
  if (!settingsPanelHidden()) return [];
  if (canonical.phase !== 'ready') return [];
  return Array.from(targetArea.querySelectorAll('.jm-passenger-btn'));
}
function resetDwellState() {
  if (transient.gazePassengerId) {
    var el = targetArea.querySelector('[data-passenger-id="' + transient.gazePassengerId + '"]');
    if (el) { el.classList.remove('gaze-dwelling'); el.style.removeProperty('--dwell-ratio'); }
  }
  transient.gazePassengerId = null;
  transient.gazeStartedAt = 0;
}
function onGazeMove(e) { lastGazeX = e.clientX; lastGazeY = e.clientY; }
function gazeTick() {
  if (gazeEnabled && lastGazeX !== null) {
    var el = document.elementFromPoint(lastGazeX, lastGazeY);
    var targets = getGazeTargets();
    var hit = null;
    if (el) { for (var i = 0; i < targets.length; i++) { if (targets[i] === el || targets[i].contains(el)) { hit = targets[i]; break; } } }
    var hitId = hit ? hit.dataset.passengerId : null;

    if (transient.gazeAwaitingLeaveId && hitId !== transient.gazeAwaitingLeaveId) {
      transient.gazeAwaitingLeaveId = null;
    }
    if (hitId !== transient.gazePassengerId) {
      resetDwellState();
      if (hit && hitId !== transient.gazeAwaitingLeaveId) {
        transient.gazePassengerId = hitId;
        transient.gazeStartedAt = performance.now();
        hit.classList.add('gaze-dwelling');
      }
    } else if (transient.gazePassengerId && hitId !== transient.gazeAwaitingLeaveId) {
      var ratio = Math.min(1, (performance.now() - transient.gazeStartedAt) / DWELL_MS);
      var dwellEl = targetArea.querySelector('[data-passenger-id="' + transient.gazePassengerId + '"]');
      if (dwellEl) dwellEl.style.setProperty('--dwell-ratio', String(ratio));
      if (ratio >= 1) {
        var activatedId = transient.gazePassengerId;
        lastDwellDurationMs = Math.round(performance.now() - transient.gazeStartedAt);
        resetDwellState();
        transient.gazeAwaitingLeaveId = activatedId;
        activatePassenger(activatedId, 'gaze');
      }
    }
  }
  gazeRafId = requestAnimationFrame(gazeTick);
}
function enableGaze() {
  if (gazeRafId) return;
  document.addEventListener('mousemove', onGazeMove);
  gazeRafId = requestAnimationFrame(gazeTick);
}
function disableGaze() {
  document.removeEventListener('mousemove', onGazeMove);
  if (gazeRafId) { cancelAnimationFrame(gazeRafId); gazeRafId = null; }
  resetDwellState();
  transient.gazeAwaitingLeaveId = null;
  lastGazeX = null; lastGazeY = null;
}
function setGazeEnabled(on) { gazeEnabled = on; if (on) enableGaze(); else disableGaze(); }
var toggleGaze = document.getElementById('toggleGaze');
toggleGaze.addEventListener('change', function() { setGazeEnabled(toggleGaze.checked); });

/* =====================================================================
   Switch Scan — Level1 Direct Activation, Level2/3 Auto Scan (§26-27)
===================================================================== */
function settingsPanelHidden() { return settingsPanel.hidden; }
function commonChromeCandidates() {
  return [document.getElementById('donomanaA11yBtn')].filter(Boolean);
}
function isVisibleEnabled(el) {
  if (!el || !el.isConnected || el.disabled) return false;
  if (el.closest('[hidden]')) return false;
  var cs = getComputedStyle(el);
  if (cs.display === 'none' || cs.visibility === 'hidden') return false;
  return true;
}
function buildScanItems() {
  var items = [];
  if (!settingsPanelHidden()) {
    items = Array.from(settingsPanel.querySelectorAll('[tabindex="0"], input, button'));
  } else {
    items = items.concat(levelBtns);
    if (canonical.phase === 'ready') items = items.concat(Array.from(targetArea.querySelectorAll('.jm-passenger-btn')));
    items.push(setBtn);
  }
  items = items.concat(commonChromeCandidates());
  return items.filter(isVisibleEnabled);
}
var scanTargets = [];
var scanFocusIndex = -1;
var scanInterval = null;
function refreshSwitchScanItems() {
  scanFocusIndex = -1;
  scanTargets = buildScanItems();
  clearScanHighlight_classOnly();
  if (scanTargets.length) {
    scanFocusIndex = 0;
    scanTargets[0].focus({ preventScroll: true });
    scanTargets[0].classList.add('scan-focus');
  }
}
function clearScanHighlight_classOnly() {
  document.querySelectorAll('.scan-focus').forEach(function(el) { el.classList.remove('scan-focus'); });
}
function clearScanHighlight() {
  document.body.classList.remove('scan-mode');
  clearScanHighlight_classOnly();
}
function startAutoScan() {
  stopAutoScan();
  if (settingsPanelHidden() && canonical.level === 1) return; // Direct Activation
  scanInterval = setInterval(function() {
    var targets = buildScanItems();
    if (!targets.length) return;
    scanTargets = targets;
    if (scanFocusIndex >= targets.length) scanFocusIndex = 0;
    scanFocusIndex = (scanFocusIndex + 1) % targets.length;
    var t = targets[scanFocusIndex];
    if (t) { clearScanHighlight_classOnly(); t.focus({ preventScroll: true }); t.classList.add('scan-focus'); }
  }, SCAN_INTERVAL_MS);
}
function stopAutoScan() { clearInterval(scanInterval); scanInterval = null; }
function startSwitchScan() {
  document.body.classList.add('scan-mode');
  setTimeout(function() { if (scanMode) refreshSwitchScanItems(); }, 200);
  startAutoScan();
}
function stopSwitchScan() { stopAutoScan(); clearScanHighlight(); }
function activateCurrentScanItem() {
  var el = document.activeElement;
  if (!el || el === document.body) return;
  if (el.classList.contains('jm-passenger-btn')) {
    activatePassenger(el.dataset.passengerId, 'switch');
  } else {
    el.click();
  }
}
function setScanMode(on) { scanMode = on; if (on) { startSwitchScan(); } else { stopSwitchScan(); } }
var toggleScan = document.getElementById('toggleScan');
toggleScan.addEventListener('change', function() { setScanMode(toggleScan.checked); });

document.addEventListener('keydown', function(e) {
  if (e.key === ' ' || e.key === 'Spacebar') {
    if (scanMode) {
      if (settingsPanelHidden() && canonical.level === 1) {
        if (canonical.phase === 'ready' && canonical.currentPassengerId) activatePassenger(canonical.currentPassengerId, 'switch');
      } else {
        e.preventDefault();
        activateCurrentScanItem();
      }
    }
  }
});

/* =====================================================================
   Settings panel open/close
===================================================================== */
var setBtn = document.getElementById('setBtn');
var settingsPanel = document.getElementById('settingsPanel');
var settingsCloseBtn = document.getElementById('settingsCloseBtn');
function openSettings() {
  settingsPanel.hidden = false;
  setBtn.setAttribute('aria-expanded', 'true');
  renderRecords();
  if (scanMode) { refreshSwitchScanItems(); startAutoScan(); }
}
function closeSettings() {
  settingsPanel.hidden = true;
  setBtn.setAttribute('aria-expanded', 'false');
  if (scanMode) { refreshSwitchScanItems(); startAutoScan(); }
}
setBtn.addEventListener('click', function() { settingsPanel.hidden ? openSettings() : closeSettings(); });
settingsCloseBtn.addEventListener('click', closeSettings);
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && !settingsPanel.hidden) closeSettings();
});

var toggleSound = document.getElementById('toggleSound');
toggleSound.addEventListener('change', function() { soundEnabled = toggleSound.checked; saveSettings(); });

/* =====================================================================
   Records / CSV — observed events only (§37-38)
===================================================================== */
var recordsShowAll = false;
var RECORDS_SHOW_INITIAL = 5;
function groupIntoSessions(log) {
  var GAP_MS = 5 * 60 * 1000;
  var sessions = [];
  var current = null;
  var lastTime = null;
  log.forEach(function(entry) {
    var t = new Date(entry.time).getTime();
    var startsNew = !current || (lastTime !== null && (t - lastTime) > GAP_MS) || current.level !== entry.level;
    if (startsNew) { current = { level: entry.level, entries: [] }; sessions.push(current); }
    current.entries.push(entry);
    lastTime = t;
  });
  return sessions;
}
function formatRecordDate(iso) {
  try {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  } catch (e) { return ''; }
}
var INPUT_LABEL = { touch: 'タッチ', click: 'タッチ', gaze: 'しせん', switch: 'スイッチ', keyboard: 'キーボード' };
function summarizeSession(sess) {
  var first = sess.entries[0], last = sess.entries[sess.entries.length - 1];
  var durationMs = first && last ? (new Date(last.time) - new Date(first.time)) : 0;
  var inputCounts = {};
  sess.entries.forEach(function(e) { inputCounts[e.inputMethod] = (inputCounts[e.inputMethod] || 0) + 1; });
  var mainInput = Object.keys(inputCounts).sort(function(a, b) { return inputCounts[b] - inputCounts[a]; })[0] || '-';
  return {
    dateStr: first ? formatRecordDate(first.time) : '',
    title: 'レベル' + sess.level + '（' + (LEVEL_NAME[sess.level] || '') + '）',
    lines: ['活動時間：約' + Math.max(1, Math.round(durationMs / 1000)) + '秒 ／ のせた回数：' + sess.entries.length + '回 ／ 主な入力：' + (INPUT_LABEL[mainInput] || mainInput)]
  };
}
function renderRecords() {
  var sessions = groupIntoSessions(readLog()).reverse();
  var list = document.getElementById('recordsList');
  var empty = document.getElementById('recordsEmpty');
  var showMoreBtn = document.getElementById('recordsShowMoreBtn');
  var csvBtn = document.getElementById('recordsCsvBtn');
  var deleteBtn = document.getElementById('recordsDeleteBtn');
  list.innerHTML = '';
  if (sessions.length === 0) {
    empty.hidden = false; showMoreBtn.hidden = true; csvBtn.hidden = true; deleteBtn.hidden = true;
    return;
  }
  empty.hidden = true; csvBtn.hidden = false; deleteBtn.hidden = false;
  var visibleCount = recordsShowAll ? sessions.length : Math.min(RECORDS_SHOW_INITIAL, sessions.length);
  for (var i = 0; i < visibleCount; i++) {
    var s = summarizeSession(sessions[i]);
    var item = document.createElement('div');
    item.className = 'record-item';
    var title = document.createElement('div');
    title.style.fontWeight = '700';
    title.textContent = (s.dateStr ? s.dateStr + '　' : '') + s.title;
    item.appendChild(title);
    s.lines.forEach(function(line) { var p = document.createElement('div'); p.textContent = line; item.appendChild(p); });
    list.appendChild(item);
  }
  showMoreBtn.hidden = recordsShowAll || sessions.length <= RECORDS_SHOW_INITIAL;
}
document.getElementById('recordsShowMoreBtn').addEventListener('click', function() {
  recordsShowAll = true; renderRecords();
  if (scanMode) refreshSwitchScanItems();
});

var CSV_HEADERS = ['日時', 'レベル', 'なかま', 'じゅんばん', 'ぜんたい数', '入力方法', '反応時間ms', '注視時間ms', 'trial'];
function csvEscape(value) {
  var s = (value === null || value === undefined) ? '' : String(value);
  if (/[",\n\r]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function formatRecordDateTimeFull(iso) {
  try {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    function pad(n) { return n < 10 ? '0' + n : String(n); }
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  } catch (e) { return ''; }
}
function buildRecordsCsvRows() {
  var rows = [CSV_HEADERS.slice()];
  readLog().forEach(function(e) {
    rows.push([
      formatRecordDateTimeFull(e.time), e.level, e.passenger, e.sequenceIndex, e.sequenceLength,
      INPUT_LABEL[e.inputMethod] || e.inputMethod, e.responseTime,
      (e.dwellDuration === null || e.dwellDuration === undefined) ? '' : e.dwellDuration,
      e.trialIndex
    ]);
  });
  return rows;
}
function downloadRecordsCsv() {
  var rows = buildRecordsCsvRows();
  var csv = rows.map(function(r) { return r.map(csvEscape).join(','); }).join('\r\n');
  var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'junban-miyou-records.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
document.getElementById('recordsCsvBtn').addEventListener('click', downloadRecordsCsv);
document.getElementById('recordsDeleteBtn').addEventListener('click', function() {
  document.getElementById('recordsConfirm').hidden = false;
});
document.getElementById('recordsConfirmDelete').addEventListener('click', function() {
  writeLog([]);
  document.getElementById('recordsConfirm').hidden = true;
  renderRecords();
  document.getElementById('recordsStatus').textContent = 'きろくをすべて消しました';
  if (scanMode) refreshSwitchScanItems();
});
document.getElementById('recordsConfirmCancel').addEventListener('click', function() {
  document.getElementById('recordsConfirm').hidden = true;
});

/* =====================================================================
   init
===================================================================== */
loadSettings();
toggleSound.checked = soundEnabled;
startNewRound();
</script>
