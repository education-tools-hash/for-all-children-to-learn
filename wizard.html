<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アプリをさがす | どのまな</title>
<style>
  :root {
    --primary: #00A99D;
    --primary-light: #4DBFB3;
    --primary-pale: #E6F6F5;
    --accent: #F5A623;
    --accent-light: #FEF4E2;
    --text: #3B4A54;
    --text-sub: #5C6B75;
    --bg: #FBFBF8;
    --white: #FFFFFF;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 4px 20px rgba(0,169,157,0.10);
    --shadow-hover: 0 8px 28px rgba(0,169,157,0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 0 60px;
  }

  /* ヘッダー */
  .site-header {
    background: var(--primary);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .site-header a {
    color: rgba(255,255,255,0.75);
    text-decoration: none;
    font-size: 0.82rem;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .site-header a:hover { color: #fff; }

  /* メインコンテナ */
  .container {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 16px;
  }

  /* ページタイトル */
  .page-hero {
    text-align: center;
    padding: 36px 0 28px;
  }
  .page-hero .emoji { font-size: 2.8rem; display: block; margin-bottom: 12px; }
  .page-hero h1 {
    font-size: 1.55rem;
    font-weight: 800;
    color: var(--primary);
    line-height: 1.35;
    margin-bottom: 8px;
  }
  .page-hero p {
    font-size: 0.92rem;
    color: var(--text-sub);
    line-height: 1.7;
  }

  /* ステップインジケーター */
  .step-indicator {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    margin-bottom: 28px;
  }
  .step-dot {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: #E6F6F5;
    color: #00857B;
    font-size: 0.8rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s;
    position: relative;
    z-index: 1;
  }
  .step-dot.active {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 0 0 4px var(--primary-pale);
  }
  .step-dot.done {
    background: var(--primary-light);
    color: #fff;
  }
  .step-line {
    width: 48px; height: 3px;
    background: #E6F6F5;
    transition: background 0.3s;
  }
  .step-line.done { background: var(--primary-light); }

  /* 質問カード */
  .question-card {
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px 24px 24px;
    margin-bottom: 20px;
    display: none;
    animation: fadeUp 0.35s ease;
  }
  .question-card.active { display: block; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .question-label {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--primary-light);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .question-text {
    font-size: 1.15rem;
    font-weight: 800;
    color: var(--text);
    line-height: 1.45;
    margin-bottom: 20px;
  }
  /* Q1の補足説明(タッチが標準対応であることを短く伝える)。Q1以外では使わない */
  .question-text + .question-sub {
    margin: -12px 0 20px;
    font-size: 0.85rem;
    color: var(--text-sub);
    line-height: 1.6;
  }

  /* 選択肢ボタン */
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn {
    background: var(--bg);
    border: 2.5px solid #E6F6F5;
    border-radius: var(--radius-sm);
    padding: 14px 18px;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: inherit;
    width: 100%;
    min-height: 48px;
    -webkit-tap-highlight-color: transparent;
  }
  .option-btn:hover, .option-btn:focus {
    border-color: var(--primary);
    background: var(--primary-pale);
    outline: none;
  }
  .option-btn:focus-visible {
    outline: 3px solid var(--primary);
    outline-offset: 2px;
  }
  .option-btn[aria-checked="true"] {
    border-color: var(--primary);
    background: var(--primary-pale);
  }
  .option-icon {
    font-size: 1.6rem;
    flex-shrink: 0;
    width: 36px;
    text-align: center;
  }
  .option-body { flex: 1; }
  .option-title {
    font-size: 0.97rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 2px;
  }
  .option-desc {
    font-size: 0.8rem;
    color: var(--text-sub);
    line-height: 1.5;
  }

  /* 戻るボタン */
  .back-btn {
    background: none;
    border: none;
    color: var(--text-sub);
    font-size: 0.85rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 0;
    font-family: inherit;
    margin-top: 8px;
    min-height: 44px;
  }
  .back-btn:hover { color: var(--primary); }
  .back-btn:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

  /* 結果カード */
  .result-section { display: none; animation: fadeUp 0.4s ease; }
  .result-section.active { display: block; }

  .result-header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    border-radius: var(--radius);
    padding: 24px 22px;
    margin-bottom: 18px;
    color: #fff;
    text-align: center;
  }
  .result-header .icon { font-size: 2.2rem; margin-bottom: 8px; }
  .result-header h2 { font-size: 1.15rem; font-weight: 800; margin-bottom: 4px; }
  .result-header p { font-size: 0.85rem; opacity: 0.85; line-height: 1.6; }

  .result-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: rgba(255,255,255,0.2);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 0.75rem;
    font-weight: 700;
    margin: 6px 3px 0;
  }

  /* グループ見出し */
  .result-group-title {
    font-size: 0.95rem;
    font-weight: 800;
    color: var(--text);
    margin: 22px 0 10px;
    padding-left: 2px;
  }
  .result-group-title:first-of-type { margin-top: 4px; }

  /* アプリカード */
  .app-card {
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 20px 16px;
    margin-bottom: 14px;
    transition: box-shadow 0.2s, transform 0.2s;
  }
  .app-card:hover {
    box-shadow: var(--shadow-hover);
    transform: translateY(-2px);
  }
  .app-card-top {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 12px;
  }
  .app-emoji {
    font-size: 2.2rem;
    flex-shrink: 0;
    width: 48px; height: 48px;
    background: var(--primary-pale);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .app-info { flex: 1; }
  .app-name {
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 4px;
  }
  .app-desc {
    font-size: 0.82rem;
    color: var(--text-sub);
    line-height: 1.6;
  }
  .app-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }
  .tag {
    background: var(--primary-pale);
    color: var(--primary);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 0.72rem;
    font-weight: 700;
  }
  /* 入力対応バッジ: apps-data.jsonのinput配列から生成。色だけに依存せずアイコン+テキストで示す */
  .tag.input-badge {
    background: var(--accent-light);
    color: #B87800;
  }
  .open-btn {
    display: block;
    width: 100%;
    background: var(--primary);
    color: #fff;
    text-align: center;
    text-decoration: none;
    border-radius: var(--radius-sm);
    padding: 12px;
    font-size: 0.92rem;
    font-weight: 700;
    transition: background 0.2s;
    min-height: 44px;
  }
  .open-btn:hover { background: var(--primary-light); }
  .open-btn:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }

  /* ほかにも使えるアプリ（折りたたみ、ネイティブdetails要素） */
  .more-apps {
    margin-top: 6px;
  }
  .more-apps summary {
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 800;
    color: var(--text);
    padding: 12px 2px;
    min-height: 44px;
    display: flex;
    align-items: center;
    list-style: none;
  }
  .more-apps summary::-webkit-details-marker { display: none; }
  .more-apps summary::before {
    content: '▶';
    display: inline-block;
    margin-right: 8px;
    font-size: 0.7rem;
    color: var(--primary);
    transition: transform 0.2s;
  }
  .more-apps[open] summary::before { transform: rotate(90deg); }
  .more-apps summary:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

  /* 0件・エラー表示 */
  .empty-state, .error-state {
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px 22px;
    text-align: center;
    color: var(--text-sub);
    font-size: 0.9rem;
    line-height: 1.8;
  }
  .error-state { color: #A94442; }
  .error-state a, .empty-state a { color: var(--primary); font-weight: 700; }

  /* もう一度ボタン */
  .retry-wrap {
    text-align: center;
    margin-top: 28px;
    padding-top: 20px;
    border-top: 2px dashed #E6F6F5;
  }
  .retry-btn {
    background: none;
    border: 2.5px solid var(--primary);
    color: var(--primary);
    border-radius: 40px;
    padding: 11px 28px;
    font-size: 0.92rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
    min-height: 44px;
  }
  .retry-btn:hover {
    background: var(--primary);
    color: #fff;
  }
  .retry-btn:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

  /* 全部みるリンク */
  .see-all {
    display: block;
    text-align: center;
    margin-top: 12px;
    color: var(--text-sub);
    font-size: 0.85rem;
    text-decoration: none;
    min-height: 44px;
    line-height: 44px;
  }
  .see-all:hover { color: var(--primary); text-decoration: underline; }

  @media (prefers-reduced-motion: reduce) {
    .question-card, .result-section { animation: none; }
    .option-btn, .app-card, .step-dot, .step-line, .open-btn, .retry-btn { transition: none; }
    .app-card:hover { transform: none; }
  }
</style>
<!-- pwa-manifest: 自動挿入 (generate.js) -->
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#00A99D">
  <!-- /pwa-manifest -->

<body>

<header class="site-header">
  <a href="https://donomana.jp/">
    ← トップページにもどる
  </a>
</header>

<div class="container">

  <div class="page-hero">
    <span class="emoji">🔍</span>
    <h1>ぴったりのアプリを<br>さがす</h1>
    <p>3つの質問に答えるだけで、<br>お子さんに合ったアプリがすぐ見つかります。</p>
  </div>

  <!-- ステップインジケーター -->
  <div class="step-indicator" id="stepIndicator">
    <div class="step-dot active" id="dot1">1</div>
    <div class="step-line" id="line1"></div>
    <div class="step-dot" id="dot2">2</div>
    <div class="step-line" id="line2"></div>
    <div class="step-dot" id="dot3">3</div>
  </div>

  <!-- Q1: 追加の操作方法（Phase APP-RECOMMENDER-TOUCH-SEMANTICS-IMPLEMENTATION-1で
       Design Option B(docs/design-system/donomana-app-recommender-touch-semantics-
       design-v1_0.md)を実装。Touch metadataがapps-data.json上で36/36(全アプリ)へ
       補正されたことを踏まえ、「操作方法を選ぶ」質問から「タッチは標準対応の
       前提で、ほかに使いたい入力方法があるか」を尋ねる質問へ再構成した。
       touchはQ1のhard filter選択肢から外し、switch/gazeのみ既存のhard filter
       ロジック(filterAndRank、本Phaseでは無変更)をそのまま流用する。
       keyboardはDesign documentのOption B具体例(§6)に明記が無く、Option Aの
       説明にのみ「(＋必要ならkeyboard)」と限定的に触れられているのみのため、
       Design conformanceを優先し今回はQ1へ追加しない。 -->
  <div class="question-card active" id="q1">
    <div class="question-label">質問 1 / 3</div>
    <div class="question-text">ほかに使いたい<br>操作方法はありますか？</div>
    <div class="question-sub">どのアプリもタッチ操作で使えます。スイッチや視線入力を使う場合は選んでください。</div>
    <div class="options" role="radiogroup" aria-label="追加の操作方法">
      <button class="option-btn" role="radio" aria-checked="false" onclick="answer(this, 1, 'switch')">
        <span class="option-icon" aria-hidden="true">🔘</span>
        <span class="option-body">
          <span class="option-title">外部スイッチを使う</span>
          <span class="option-desc">Blue2などの外部スイッチ</span>
        </span>
      </button>
      <button class="option-btn" role="radio" aria-checked="false" onclick="answer(this, 1, 'gaze')">
        <span class="option-icon" aria-hidden="true">👀</span>
        <span class="option-body">
          <span class="option-title">視線入力を使う</span>
          <span class="option-desc">Tobii視線入力など</span>
        </span>
      </button>
      <button class="option-btn" role="radio" aria-checked="false" onclick="answer(this, 1, 'any')">
        <span class="option-icon" aria-hidden="true">👆</span>
        <span class="option-body">
          <span class="option-title">特にない（タッチで使う）</span>
          <span class="option-desc">指でタップするなど、ふつうの操作でよい</span>
        </span>
      </button>
    </div>
  </div>

  <!-- Q2: カテゴリ（既存apps-data.jsonのcategory値、4種にそのまま対応させる。
       新しい分類軸は作らず、サイト全体で既に使われているカテゴリをそのまま使う） -->
  <div class="question-card" id="q2">
    <div class="question-label">質問 2 / 3</div>
    <div class="question-text">今、いちばん育てたい力は<br>何ですか？</div>
    <div class="options" role="radiogroup" aria-label="育てたい力">
      <button class="option-btn" role="radio" aria-checked="false" onclick="answer(this, 2, '学習アプリ')">
        <span class="option-icon" aria-hidden="true">✏️</span>
        <span class="option-body">
          <span class="option-title">もじ・かずなどの学習</span>
          <span class="option-desc">ひらがな・カタカナ・数字・なぞり書きなど</span>
        </span>
      </button>
      <button class="option-btn" role="radio" aria-checked="false" onclick="answer(this, 2, '自立活動')">
        <span class="option-icon" aria-hidden="true">🌟</span>
        <span class="option-body">
          <span class="option-title">生活スキル・気持ちを伝える</span>
          <span class="option-desc">お金・時計・スケジュール・AAC・SSTなど</span>
        </span>
      </button>
      <button class="option-btn" role="radio" aria-checked="false" onclick="answer(this, 2, '認知支援')">
        <span class="option-icon" aria-hidden="true">🧠</span>
        <span class="option-body">
          <span class="option-title">みる・くらべる・おぼえる</span>
          <span class="option-desc">注視・追視・記憶・比較など</span>
        </span>
      </button>
      <button class="option-btn" role="radio" aria-checked="false" onclick="answer(this, 2, '創作表現')">
        <span class="option-icon" aria-hidden="true">🎨</span>
        <span class="option-body">
          <span class="option-title">つくる・えがく・表現する</span>
          <span class="option-desc">お絵かき・音楽・作品づくりなど</span>
        </span>
      </button>
    </div>
    <button class="back-btn" onclick="goBack(1)">← もどる</button>
  </div>

  <!-- Q3: さらに大切にしたいこと。apps-data.jsonの既存need配列
       (literacy/life/social/time/communicate)と選択肢を直接対応させる
       (Phase APP-RECOMMENDER-INPUT-CATEGORY-FINALIZE-2)。「使う場面」の
       ような推測的な意味づけは行わない。除外はせず、Q1/Q2の結果内での
       並び替えにのみ使用する(詳細はfilterAndRank/q3Scoreのコメント参照)。 -->
  <div class="question-card" id="q3">
    <div class="question-label">質問 3 / 3</div>
    <div class="question-text">さらに、どんなことを<br>大切にしたいですか？</div>
    <div class="options" role="radiogroup" aria-label="大切にしたいこと">
      <button class="option-btn" role="radio" aria-checked="false" onclick="answer(this, 3, 'literacy')">
        <span class="option-icon" aria-hidden="true">📖</span>
        <span class="option-body">
          <span class="option-title">ことば・読み書き</span>
          <span class="option-desc">文字の読み書き、語彙、読解など</span>
        </span>
      </button>
      <button class="option-btn" role="radio" aria-checked="false" onclick="answer(this, 3, 'time')">
        <span class="option-icon" aria-hidden="true">🕐</span>
        <span class="option-body">
          <span class="option-title">時間や見通し</span>
          <span class="option-desc">時計・時刻表・スケジュールなど</span>
        </span>
      </button>
      <button class="option-btn" role="radio" aria-checked="false" onclick="answer(this, 3, 'communicate')">
        <span class="option-icon" aria-hidden="true">💬</span>
        <span class="option-body">
          <span class="option-title">気持ち・コミュニケーション</span>
          <span class="option-desc">意思表示、AAC、気持ちの共有など</span>
        </span>
      </button>
      <button class="option-btn" role="radio" aria-checked="false" onclick="answer(this, 3, 'life_social')">
        <span class="option-icon" aria-hidden="true">🌱</span>
        <span class="option-body">
          <span class="option-title">生活や社会性</span>
          <span class="option-desc">お金・買い物・防災・やりとりなど</span>
        </span>
      </button>
      <button class="option-btn" role="radio" aria-checked="false" onclick="answer(this, 3, 'none')">
        <span class="option-icon" aria-hidden="true">✨</span>
        <span class="option-body">
          <span class="option-title">特にこだわらない</span>
          <span class="option-desc">この並び順のままでよい</span>
        </span>
      </button>
    </div>
    <button class="back-btn" onclick="goBack(2)">← もどる</button>
  </div>

  <!-- 結果 -->
  <div class="result-section" id="result" aria-live="polite">
    <div class="result-header" id="resultHeader">
      <div class="icon" id="resultIcon">🎯</div>
      <h2 id="resultTitle">おすすめのアプリ</h2>
      <p id="resultDesc"></p>
      <div id="resultTags"></div>
    </div>
    <div id="resultBody"></div>
    <div class="retry-wrap">
      <button class="retry-btn" onclick="restart()">🔄 もう一度さがす</button>
      <a class="see-all" href="https://donomana.jp/app-intro.html">すべてのアプリを見る →</a>
    </div>
  </div>

</div><!-- /container -->

<script>
// ============================================================
// Phase APP-RECOMMENDER-INPUT-CATEGORY-HARDENING-1
// apps-data.json を Source of Truth として動的に候補を生成する。
// wizard独自の手書きアプリDB・固定4件テーブルは廃止した。
// ============================================================

var ALL_APPS = null;      // apps-data.json読み込み結果をキャッシュ
var loadFailed = false;

function loadAppsData() {
  return fetch('apps-data.json')
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function (data) {
      var apps = Array.isArray(data) ? data : (data && Array.isArray(data.apps) ? data.apps : null);
      if (!apps) throw new Error('unexpected apps-data.json shape');
      ALL_APPS = apps;
      return apps;
    })
    .catch(function (err) {
      loadFailed = true;
      console.error('apps-data.json の読み込みに失敗しました', err);
      throw err;
    });
}

// 入力方式バッジ表示用ラベル(apps-data.jsonのinput配列の値から生成、
// wizard独自の判定は持たない。色だけに依存せずアイコン+テキストで示す)
var INPUT_BADGE_LABEL = {
  touch: '👆 タッチ',
  switch: '🔘 スイッチ',
  gaze: '👀 視線',
  keyboard: '⌨️ キーボード',
  gamepad: '🎮 ゲームパッド'
};

function inputBadgesHTML(app) {
  var input = Array.isArray(app.input) ? app.input : [];
  // 結果画面のバッジはタッチ/スイッチ/視線の3種のみ表示する(質問の選択肢と対応させるため)
  return ['touch', 'switch', 'gaze']
    .filter(function (k) { return input.indexOf(k) !== -1; })
    .map(function (k) { return '<span class="tag input-badge">' + INPUT_BADGE_LABEL[k] + '</span>'; })
    .join('');
}

// ===== 状態管理 =====
var answers = { q1: null, q2: null, q3: null };
var currentStep = 1;

function answer(el, step, value) {
  answers['q' + step] = value;
  var group = document.querySelectorAll('#q' + step + ' [role="radio"]');
  group.forEach(function (btn) {
    btn.setAttribute('aria-checked', String(btn === el));
  });
  if (step < 3) {
    showStep(step + 1);
  } else {
    showResult();
  }
}

function goBack(toStep) {
  answers['q' + (toStep + 1)] = null;
  showStep(toStep);
}

function showStep(step) {
  currentStep = step;
  document.querySelectorAll('.question-card').forEach(function (c) { c.classList.remove('active'); });
  document.getElementById('result').classList.remove('active');
  var card = document.getElementById('q' + step);
  if (card) card.classList.add('active');
  updateIndicator(step);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateIndicator(step) {
  [1, 2, 3].forEach(function (i) {
    var dot = document.getElementById('dot' + i);
    dot.classList.remove('active', 'done');
    if (i < step) dot.classList.add('done');
    else if (i === step) dot.classList.add('active');
  });
  [1, 2].forEach(function (i) {
    document.getElementById('line' + i).classList.toggle('done', i < step);
  });
}

// ===== フィルタ・並び替え(透明なルール、複雑なスコアリングは作らない) =====
// 1. Q1(追加の操作方法)一致は必須フィルタ。Phase APP-RECOMMENDER-TOUCH-
//    SEMANTICS-IMPLEMENTATION-1(Design Option B)により、touchはQ1の
//    選択肢・filter値として使わない(touchはapps-data.json上36/36で標準
//    対応のため)。'any'(特にない=タッチで使う)のときは除外しない。
//    input配列が空のアプリは「すべて対応」とはみなさず、switch/gazeを
//    選んだ場合は候補から外れる(指示§9の通り、ロジック自体は無変更)。
// 2. Q2(カテゴリ)が一致するアプリを「おすすめ」、それ以外を「ほかにも
//    使えるアプリ」の2群に分ける。除外はしない(指示§12: 表示上の都合で
//    対応アプリを無条件に捨てない)。
// 3. Q3(さらに大切にしたいこと)は、apps-data.jsonの既存need配列
//    (literacy/life/social/time/communicate)を使った同点内の並び替えに
//    のみ使用する(Phase APP-RECOMMENDER-INPUT-CATEGORY-FINALIZE-2)。
//    Q3の選択肢はneed値と直接対応させ、「利用場面」のような推測的な
//    意味づけ(lesson/daily/homeなど)は行わない:
//      ことば・読み書き   → literacy
//      時間や見通し       → time
//      気持ち・コミュニケーション → communicate
//      生活や社会性       → life・social(実装アプリ分布を確認のうえ
//                             1つの選択肢にまとめた。life単独6件・
//                             social単独4件で、まとめても選択肢が
//                             肥大化しない範囲に収まるため)
//      特にこだわらない   → 並び替えなし(Q1/Q2の順序をそのまま維持)
//    software.required(Tobii等専用ソフト必須)は、Q3のランキングには
//    一切使用しない。「専用ソフトが要る=家庭利用に不向き」という一律の
//    解釈はしない、との指示による(指示§12/§13)。need配列を持たない
//    アプリは加点なし(どちらの群にいてもapps-data.json自体の並び順の
//    まま)。
// 4. 除外を伴わない同点内ソートのみで、新しい複雑なスコアリングシステムは
//    作らない。並び替えは安定ソートとし、無関係な項目同士の順序は
//    apps-data.json自体の並び順のまま変えない。
var Q3_NEED_MAP = {
  literacy: ['literacy'],
  time: ['time'],
  communicate: ['communicate'],
  life_social: ['life', 'social']
  // 'none'(こだわらない)はここに含めない -> q3Scoreが常に0を返し、
  // 安定ソートにより元の順序がそのまま保たれる。
};

function q3Score(app, q3) {
  if (!q3 || !Q3_NEED_MAP[q3]) return 0;
  var needs = Array.isArray(app.need) ? app.need : [];
  return Q3_NEED_MAP[q3].some(function (n) { return needs.indexOf(n) !== -1; }) ? 1 : 0;
}

function stableSortByQ3(list, q3) {
  return list
    .map(function (a, i) { return { a: a, i: i, s: q3Score(a, q3) }; })
    .sort(function (x, y) { return (y.s - x.s) || (x.i - y.i); })
    .map(function (x) { return x.a; });
}

function filterAndRank(apps, ans) {
  var inputFiltered = (ans.q1 === 'any')
    ? apps.slice()
    : apps.filter(function (a) {
        return Array.isArray(a.input) && a.input.indexOf(ans.q1) !== -1;
      });

  var recommended = [];
  var others = [];
  inputFiltered.forEach(function (a) {
    if (ans.q2 && a.category === ans.q2) recommended.push(a);
    else others.push(a);
  });

  recommended = stableSortByQ3(recommended, ans.q3);
  others = stableSortByQ3(others, ans.q3);

  return { recommended: recommended, others: others, total: inputFiltered.length };
}

var Q1_LABEL = { switch: '🔘 外部スイッチ', gaze: '👀 視線入力', any: '👆 タッチ操作' };
var Q3_LABEL = { literacy: '📖 ことば・読み書き', time: '🕐 時間や見通し', communicate: '💬 気持ち・コミュニケーション', life_social: '🌱 生活や社会性', none: '✨ こだわらない' };

function appCardHTML(app) {
  var badges = inputBadgesHTML(app);
  var tagsHTML = '<span class="tag">' + app.category + '</span>' + badges;
  var url = 'https://donomana.jp/' + app.filename + '.html';
  return '' +
    '<div class="app-card">' +
    '  <div class="app-card-top">' +
    '    <div class="app-emoji" style="' + (app.iconColor ? 'background:' + app.iconColor + '22;' : '') + '">' + (app.icon || '📱') + '</div>' +
    '    <div class="app-info">' +
    '      <div class="app-name">' + app.title + '</div>' +
    '      <div class="app-desc">' + (app.tags_display || '') + '</div>' +
    '    </div>' +
    '  </div>' +
    '  <div class="app-tags">' + tagsHTML + '</div>' +
    '  <a class="open-btn" href="' + url + '" target="_blank" rel="noopener">▶ このアプリを開く</a>' +
    '</div>';
}

function showResult() {
  document.querySelectorAll('.question-card').forEach(function (c) { c.classList.remove('active'); });

  var resultTitle = document.getElementById('resultTitle');
  var resultDesc = document.getElementById('resultDesc');
  var resultTags = document.getElementById('resultTags');
  var body = document.getElementById('resultBody');

  // タグ表示(Q1/Q2/Q3の回答をそのまま表示。Q3は絞り込み〈除外〉には使わず
  // 同点内の並び替えにのみ使うが〈filterAndRank内のstableSortByQ3を参照〉、
  // 回答した内容が画面に反映されていることが分かるよう表示は残す)
  var tags = [Q1_LABEL[answers.q1], answers.q2, Q3_LABEL[answers.q3]].filter(Boolean);
  resultTags.innerHTML = tags.map(function (t) { return '<span class="result-tag">' + t + '</span>'; }).join('');

  if (loadFailed || !ALL_APPS) {
    resultTitle.textContent = 'アプリを読み込めませんでした';
    resultDesc.textContent = '';
    body.innerHTML = '' +
      '<div class="error-state">' +
      '通信状態などにより、アプリの一覧を読み込めませんでした。<br>' +
      '時間をおいて、もう一度お試しください。<br><br>' +
      '<a href="https://donomana.jp/app-intro.html">アプリ一覧ページを見る →</a>' +
      '</div>';
    finishResultDisplay();
    return;
  }

  var result = filterAndRank(ALL_APPS, answers);

  if (result.total === 0) {
    resultTitle.textContent = 'ぴったりのアプリが見つかりませんでした';
    resultDesc.textContent = '';
    body.innerHTML = '' +
      '<div class="empty-state">' +
      'この条件にぴったり合うアプリは、現在まだありません。<br>' +
      '入力方法や学習目的を少し広げて探してみてください。<br><br>' +
      '<a href="https://donomana.jp/app-intro.html">すべてのアプリを見る →</a>' +
      '</div>';
    finishResultDisplay();
    return;
  }

  resultTitle.textContent = 'おすすめのアプリ（' + result.total + '件見つかりました）';
  resultDesc.textContent = Q1_LABEL[answers.q1] + ' で使えるアプリをご紹介します。';

  var html = '';
  if (result.recommended.length) {
    html += '<div class="result-group-title">✨ おすすめ</div>';
    html += result.recommended.map(appCardHTML).join('');
  }
  if (result.others.length) {
    if (result.recommended.length) {
      html += '' +
        '<details class="more-apps">' +
        '<summary>ほかにも使えるアプリ（' + result.others.length + '件）</summary>' +
        result.others.map(appCardHTML).join('') +
        '</details>';
    } else {
      // Q2に一致するアプリがなかった場合は、group見出しなしで全件をそのまま表示する
      html += result.others.map(appCardHTML).join('');
    }
  }
  body.innerHTML = html;
  finishResultDisplay();
}

function finishResultDisplay() {
  [1, 2, 3].forEach(function (i) {
    var dot = document.getElementById('dot' + i);
    dot.classList.remove('active');
    dot.classList.add('done');
    dot.textContent = '✓';
  });
  [1, 2].forEach(function (i) { document.getElementById('line' + i).classList.add('done'); });

  document.getElementById('result').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restart() {
  answers = { q1: null, q2: null, q3: null };
  document.querySelectorAll('[role="radio"]').forEach(function (b) { b.setAttribute('aria-checked', 'false'); });
  document.getElementById('result').classList.remove('active');
  document.querySelectorAll('.step-dot').forEach(function (dot, i) {
    dot.classList.remove('active', 'done');
    dot.textContent = i + 1;
  });
  showStep(1);
}

// 初回ロード。失敗してもQ1〜Q3の回答自体は進められ、結果画面で
// エラー状態を表示する(壊れた一覧を出さない、指示§23)。
loadAppsData().catch(function () { /* showResult内でloadFailedを見て処理する */ });
</script>
</body>
</html>
