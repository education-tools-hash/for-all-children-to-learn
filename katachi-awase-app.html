     (#FAF7F2, not a design-tokens value — deliberately its own local color rather than
     reusing --dm-color-soft/--dm-color-border, both of which are already used elsewhere
     in this file as fills/tracks that need to read against a plain white page; reusing
     either here would make those collide with the new page color). This is untouched by

  html, body { margin: 0; padding: 0; background: #FAF7F2; color: var(--dm-color-ink,#3B4A54); font-family: 'BIZ UDPGothic','Noto Sans JP',sans-serif; }

  .app-title { font-size: var(--dm-font-size-heading,1.5rem); margin: 0; }
  .settings-toggle-btn { min-height: 44px; padding: var(--dm-space-2,8px) var(--dm-space-4,16px); border-radius: var(--dm-radius-md,9px); border: 2px solid var(--dm-color-border,#EDF1F0); background: #fff; font-size: 0.9375rem; font-weight: 700; cursor: pointer; }

  /* Phase26-I2: .concept-row reuses the exact same row/button styling as .level-row/
     .count-row (no new visual pattern) — kept `hidden` today (see the HTML), but styled
     now so a future phase enabling it doesn't also need new CSS. */
  .level-row, .count-row, .concept-row { display: flex; flex-wrap: wrap; gap: var(--dm-space-2,8px); margin: var(--dm-space-2,8px) 0; }
  .level-row[hidden], .count-row[hidden], .concept-row[hidden] { display: none; }
  .level-btn, .count-btn, .concept-btn { min-height: 44px; padding: var(--dm-space-2,8px) var(--dm-space-4,16px); border-radius: var(--dm-radius-pill,999px); border: 2px solid var(--dm-color-border,#EDF1F0); background: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; }
  .level-btn.active, .count-btn.active, .concept-btn.active { background: var(--dm-color-primary,#00A99D); border-color: var(--dm-color-primary,#00A99D); color: #fff; }

  #progressArea { margin: var(--dm-space-2,8px) 0; }
  #progressText { font-weight: 700; font-size: 1.0625rem; }
  #progressBar { width: 100%; height: 14px; border-radius: var(--dm-radius-pill,999px); background: var(--dm-color-soft,#F6F9FA); overflow: hidden; margin-top: 4px; }
  #progressBarFill { height: 100%; background: var(--dm-color-primary,#00A99D); width: 0%; transition: width .25s ease; }

  #feedbackText { min-height: 1.6em; font-size: 1.25rem; font-weight: 700; text-align: center; margin: var(--dm-space-2,8px) 0; color: var(--dm-color-primary-dark,#00857B); }

  /* Phase26-H: gap widened from space-4(16px) to space-6(24px) now that shape/target boxes
     are larger, so the row still reads as evenly spread rather than crowded; margin trimmed
     from space-3(12px) to space-2(8px) to reclaim some of the inter-tray whitespace for the
     larger boxes instead. Mobile keeps the original 16px gap (see the ≤480px block below) —
     at 375px width the wider gap would leave the 3-target/3-shape row too tight against the
     larger mobile box size. */
  .tray { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--dm-space-6,24px); margin: var(--dm-space-2,8px) 0; }
  .tray-label { width: 100%; text-align: center; font-size: 0.875rem; color: var(--dm-color-sub,#5E6D78); margin-bottom: 4px; }

  /* Phase26-H: enlarged from 96px (base tier) per real-device feedback that the shapes read
     too small; see the ≤480px and ≥1024px blocks below for the mobile and desktop tiers.
     The D8 triangle stroke math (below) is derived from fixed px offsets independent of box
     size, so it stays correct at every size here unchanged. */
  .shape-btn, .target-btn {
    min-width: 112px; min-height: 112px; width: 112px; height: 112px;
    border: none; background: transparent; padding: 6px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    border-radius: var(--dm-radius-md,9px);
  }
  .shape-btn:focus-visible, .target-btn:focus-visible {
    outline: var(--dm-focus-width,3px) solid var(--dm-focus-color,#00A99D); outline-offset: var(--dm-focus-offset,2px);
  }
  .shape-visual { width: 100%; height: 100%; }
  .shape-visual.shape-circle { border-radius: 50%; }
  .shape-visual.shape-square { border-radius: var(--dm-radius-sm,5px); }
  .shape-visual.shape-triangle { clip-path: polygon(50% 4%, 4% 96%, 96% 96%); border-radius: 0; }
  /* Phase26-I3: おおきさ concept's large/small visual sizing. Resizes .shape-visual's own
     layout box (width/height), NOT a transform:scale() — a transform would shrink the D8
     triangle stroke's clip-path result proportionally along with everything else (an
     already-rendered 5px stroke becoming ~3px at 60%), undoing the fixed-px-offset design
     that keeps the stroke ~5px regardless of box size (verified across Phase26-H's 88-128px
     button tiers). Resizing the box instead lets that same box-size-independent math simply
     recompute correctly at the smaller size. .shape-btn/.target-btn themselves (the actual
     touch/drag/Switch Scan/gaze hit area) are never touched by this — only the visual drawn
     inside shrinks; the parent's flex centering (above) keeps it centered automatically.
     "large" needs no override (100%/100% is .shape-visual's existing default). Ratio
     100:60 = 1.67, matching kurabeyou-app's >=1.6 large/small floor (Phase26-C6.1). */
  .shape-visual.size-small { width: 60%; height: 60%; }

  .shape-btn .shape-visual { background: var(--shape-color, #00A99D); }
  /* Phase26-H: was --dm-color-soft, which is now the same tone the progress-bar track and
     other "soft" fills use — against the new page background (also a similar pale tone,
     see html/body above) that made the selected-shape highlight barely visible. Switching
     to --dm-color-surface (plain white) makes the selected shape read as a raised white
     card against the paper-toned page, which is more visible, not less. */
  .shape-btn[aria-pressed="true"] { background: var(--dm-color-surface,#fff); box-shadow: inset 0 0 0 3px var(--dm-color-primary-dark,#00857B); }
  .shape-btn.shape-placed { visibility: hidden; pointer-events: none; }
  /* touch-action:none is scoped to shape buttons only (never body/page) so a swipe
     starting anywhere else keeps scrolling normally (Phase26-D7 §24/§46); it tells the
     browser upfront not to claim this element for native panning, avoiding the
     preventDefault-timing race that a plain "wait for the move event" approach would hit. */
  .shape-btn { touch-action: none; }
  .shape-btn.dragging { opacity: .35; }
  .drag-proxy { transform: scale(1.08); box-shadow: 0 6px 16px rgba(0,0,0,.28); z-index: 1000; }
  .target-btn.drag-hover { outline: 3px dashed var(--dm-color-primary-dark,#00857B); outline-offset: 2px; }

  /* outline/silhouette rendering for un-filled targets: a box-shadow inset does not clip cleanly
     along a clip-path polygon's diagonal edges (the triangle's slanted sides barely rendered),
     so the outline is built from two stacked layers instead — an outer border-color shape and an
     inset ::after in the page background color, both clipped identically — which stays crisp for
     every shape type including angled ones. Phase26-D6: the outer layer's own color was
     --dm-color-border (#EDF1F0), a near-white gray with too little contrast against the white
     page background to read as a target on an ordinary (non-high-contrast) screen — the inset
     width was a secondary issue. Switched to --dm-color-sub (#5E6D78, already used elsewhere in
     this app as body-text-adjacent gray) and widened the visible ring from 3px to 5px. */
  .target-btn .shape-visual { position: relative; background: var(--dm-color-sub,#5E6D78); }
  .target-btn .shape-visual::after { content: ''; position: absolute; inset: 5px; background: var(--dm-color-bg,#fff); }
  .target-btn .shape-visual.shape-circle::after { border-radius: 50%; }
  .target-btn .shape-visual.shape-square::after { border-radius: var(--dm-radius-sm,5px); }
  /* Phase26-D8: reusing the outer triangle's percentage-based polygon on the ::after box (which was
     only inset:5px, i.e. smaller by the same 5px on every side) scales the whole triangle down
     around its own center rather than offsetting each edge inward by an equal perpendicular
     distance. Because the slanted edges are far from vertical/horizontal, that uniform box shrink
     leaves only ~2px of perpendicular gap on the two slanted sides versus ~4.6px on the horizontal
     base — the base reads as visibly thicker than the sides. Fix: this override resets inset to 0
     (so the triangle's ::after is the same size/coordinate-space as the outer shape, unlike
     circle/square which still rely on the shared inset:5px above) and clips it with a true mitered
     inward offset of the outer triangle's 3 edges by 5px each (matching the circle/square 5px
     ring), computed from the outer polygon's fixed 1:2 edge slope: the apex moves down by
     5*sqrt(5)px and each base corner moves inward by 5*phi px (phi = golden ratio, an artifact of
     that slope) while both stay 5px above the base — independent of the target's box size, so the
     same calc() values also cover the 88px mobile target from the 480px breakpoint below. */
  .target-btn .shape-visual.shape-triangle::after { inset: 0; clip-path: polygon(50% calc(4% + 11.18px), calc(4% + 8.09px) calc(96% - 5px), calc(96% - 8.09px) calc(96% - 5px)); }
  .target-btn.target-filled .shape-visual { background: var(--fill-color, var(--dm-color-primary,#00A99D)); }
  .target-btn.target-filled .shape-visual::after { display: none; }
  .target-btn.target-filled { pointer-events: none; }

  body.no-animation .shape-btn, body.no-animation .target-btn { transition: none !important; }
  .shape-btn, .target-btn { transition: transform .15s; }
  body:not(.no-animation) .tap-pulse { transform: scale(1.08); }

  #sessionCompleteArea, #recordsEmpty { text-align: center; padding: var(--dm-space-6,24px); }

  body.high-contrast { filter: invert(1) hue-rotate(180deg); }

  /* Phase26-H: 88px -> 100px. Gap stays at the original 16px (not the wider 24px the
     tablet/desktop tiers now use above) — at 375px width, 3 boxes at 100px plus a 24px gap
     would leave the row only 11px short of overflowing; 16px keeps the same comfortable
     margin the previous 88px/16px combination had. */
  @media (max-width: 480px) {

  /* .app's max-width:720px only centers content clear of the fixed left/right common buttons once
     the viewport is wide enough (~800px+); below that, .app's content edge still falls within the
     fixed home button's (top:12px;left:12px;44px) and lock/fullscreen pair's (top:64px;right:12px;
     44px each) reach, so both need explicit clearance up to that width, not just under 480px.
     Phase26-I3: this clearance now belongs to .concept-row rather than .level-row, since
     .concept-row is the first full-width row after the header now that it's shown (previously
     .level-row held that position while .concept-row was hidden). Moving the clearance rather
     than duplicating it keeps the net height added by showing .concept-row down to just its own
     ~44px + one normal inter-row gap, instead of stacking a second 76px reservation underneath
     it — the difference that keeps 375x667 scroll-free (see the concept-row/mobile validation
     notes in docs/katachi-awase-size-learning-design-v1.md). */
  @media (max-width: 800px) {
    .app { padding-top: var(--dm-space-4,16px); }
    .app-header { padding-left: 52px; }
    .concept-row { margin-top: 76px; }

  /* Phase26-H: desktop tier. Widening .app's max-width still leaves >=56px clear of the
     fixed home/lock/fullscreen buttons' 12px-inset+44px reach even at this breakpoint's own

     padding is needed here; the centering margin alone is already enough. This tier only
     kicks in well past 800px, so it never overlaps with that clearance block. */
  @media (min-width: 1024px) {

    .shape-btn, .target-btn { width: 128px; height: 128px; min-width: 128px; min-height: 128px; }

  }

<div id="donomanaA11yStatus" role="status" aria-live="polite" aria-atomic="true" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;padding:0;margin:-1px;"></div>
<script>
(function(){
  var P = 'donomana-a11y-';
  function all(sel){return document.querySelectorAll(sel);}
  function mark(sel, dataAttr, value){
    all(sel).forEach(function(b){
      var on = b.dataset[dataAttr] === value;
      b.style.background = on ? '#00A99D' : '#fff';
      b.style.color = on ? '#fff' : '#333';
      b.style.borderColor = on ? '#00A99D' : '#ddd';
    });
  }
  var donomanaAnnounceA11yTimer = null;
  function donomanaAnnounceA11y(msg){
    var live = document.getElementById('donomanaA11yStatus');
    if (!live) return;
    clearTimeout(donomanaAnnounceA11yTimer);
    live.textContent = '';
    donomanaAnnounceA11yTimer = setTimeout(function(){ live.textContent = msg; }, 50);
  }
  function applyContrast(mode){
    // 背景を黒・文字を白に反転する方式(弱視・色覚特性のある方向けに、
    // 単純なコントラスト強調より確実に見やすくなるため)
    document.documentElement.style.filter = (mode === 'hc') ? 'invert(1) hue-rotate(180deg)' : '';
    mark('[data-a11y-contrast]', 'a11yContrast', mode);
    localStorage.setItem(P + 'contrast', mode);
  }
  function applyFont(size){
    var zoomMap = { normal: '', large: '125%', xlarge: '150%' };
    document.body.style.zoom = zoomMap[size] || '';
    mark('[data-a11y-font]', 'a11yFont', size);
    localStorage.setItem(P + 'font', size);
  }
  
  document.addEventListener('DOMContentLoaded', function(){
    var btn = document.getElementById('donomanaA11yBtn');
    var panel = document.getElementById('donomanaA11yPanel');
    if (!btn || !panel) return;
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var open = panel.style.display === 'block';
      panel.style.display = open ? 'none' : 'block';
      btn.setAttribute('aria-expanded', open ? 'false' : 'true');
      panel.setAttribute('aria-hidden', open ? 'true' : 'false');
    });
    document.addEventListener('click', function(e){
      if (!panel.contains(e.target) && e.target !== btn) {
        panel.style.display = 'none';
        btn.setAttribute('aria-expanded', 'false');
        panel.setAttribute('aria-hidden', 'true');
      }
    });
    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape' && panel.style.display === 'block') btn.click();
    });
    all('[data-a11y-contrast]').forEach(function(b){ b.addEventListener('click', function(){
      applyContrast(b.dataset.a11yContrast);
      donomanaAnnounceA11y(b.dataset.a11yContrast === 'hc' ? 'ハイコントラストをオンにしました' : 'ハイコントラストをオフにしました');
    }); });
    all('[data-a11y-font]').forEach(function(b){ b.addEventListener('click', function(){
      applyFont(b.dataset.a11yFont);
      donomanaAnnounceA11y('文字の大きさを' + ({normal:'標準',large:'大',xlarge:'特大'}[b.dataset.a11yFont] || '標準') + 'にしました');
    }); });
    
    
  var proxyBtn = document.getElementById('donomanaSettingsProxy');
  if (proxyBtn) {
    // フォーカス可能条件の最小十分セット(Phase16.44-C横断調査で導出、Phase16.45-Bでdisplay/opacity判定を追加):
    // 接続済み・disabledでない・tabIndex!==-1・hidden属性/祖先なし・inert配下でない・
    // クライアント矩形を持つ・display:noneでない・visibility:hidden/collapseでない・opacity:0でない。
    // pointer-events:noneはキーボードフォーカス可否と一致しないため判定条件に含めない。
    function donomanaIsFocusable(el){
      if (!el || !el.isConnected || el.disabled || el.tabIndex === -1) return false;
      if (el.hasAttribute('hidden') || el.closest('[hidden]') || el.closest('[inert]')) return false;
      if (el.getClientRects().length === 0) return false;
      var cs = getComputedStyle(el);
      if (cs.display === 'none' || cs.visibility === 'hidden' || cs.visibility === 'collapse') return false;
      if (Number.parseFloat(cs.opacity) === 0) return false;
      return true;
    }
    function donomanaFirstFocusable(root){
      if (!root) return null;
      var cands = root.querySelectorAll('button, input, select, textarea, a[href], [tabindex]');
      for (var i = 0; i < cands.length; i++) { if (donomanaIsFocusable(cands[i])) return cands[i]; }
      return null;
    }
    proxyBtn.addEventListener('click', function(e){
      // 実際のクリックイベントがこのままdocumentまでバブリングすると、
      // アプリ側の「パネル外をクリックしたら閉じる」処理が、いま開いたばかりの
      // 設定パネルを"外側クリック"と誤認してすぐ閉じてしまう(反応しないように見えるバグの原因)。
      // これを防ぐため、実クリックの伝播はここで止める。
      e.stopPropagation();
      var candidates = Array.from(document.querySelectorAll("#settingsBtn"));
      // 複数該当する場合、実際に表示されている（offsetParentがnullでない）ものを優先
      var original = candidates.find(function(el){ return el.offsetParent !== null; }) || candidates[0];
      panel.style.display = 'none';
      btn.setAttribute('aria-expanded', 'false');
      panel.setAttribute('aria-hidden', 'true');
      if (!original) return;
      // Phase16.45-A: 上のpanel非表示により、フォーカス中だった#donomanaSettingsProxyの祖先が
      // display:noneになる。ブラウザは非同期にfocusout(relatedTarget=null)を発生させdocument.body
      // へフォーカスを落とす(Phase16.43調査で確認した既存の構造的バグ)。originalへ明示的にfocusして
      // からclickすることで大半のアプリではこれを未然に防げるが、original自身がdisplay:none等で
      // フォーカス不能なアプリも存在するため(Phase16.44-C調査)、その場合に備えたfallbackも用意する。
      var controlsId = original.getAttribute('aria-controls');
      var beforeVisible = null;
      if (!controlsId) {
        // aria-controlsが無いアプリ向け: クリック前の可視要素集合を保存し、
        // fallback時にクリック後との差分(新たに可視化された要素)を求める。
        beforeVisible = new Set();
        document.querySelectorAll('body *').forEach(function(el){
          if (el.getClientRects().length > 0) beforeVisible.add(el);
        });
      }
      original.focus();
      original.click();
      // BODYへ落ちた場合に加え、original.focus()自体は成功しているがoriginalがgenerate.jsにより
      // 恒常的にopacity:0/display:noneで隠されているため、キーボード操作者から見て不可視なフォーカス
      // (例: time-timerの#settingsToggle)が残るケースも救済する(Phase16.45-B)。アプリ独自のfocus処理が
      // 既にoriginal以外の要素へ移動させている場合はここで何もしない(既存の独自focus処理を壊さないため)。
      // janken-app/register-app等、自前で約50ms後にfocusを移すアプリより十分後の100msで判定する。
      setTimeout(function(){
        var active = document.activeElement;
        var needsFallback = (active === document.body) || (active === original && !donomanaIsFocusable(original));
        if (!needsFallback) return;
        var target = null;
        if (controlsId) {
          target = donomanaFirstFocusable(document.getElementById(controlsId));
        } else {
          var newly = [];
          document.querySelectorAll('body *').forEach(function(el){
            if (el.getClientRects().length > 0 && !beforeVisible.has(el)) newly.push(el);
          });
          for (var i = 0; i < newly.length; i++) {
            if (/^(BUTTON|INPUT|SELECT|TEXTAREA|A)$/.test(newly[i].tagName) && donomanaIsFocusable(newly[i])) { target = newly[i]; break; }
          }
        }
        if (target) target.focus();
      }, 100);
    });
  }
    var resetBtn = document.getElementById('donomanaA11yReset');
    if (resetBtn) resetBtn.addEventListener('click', function(){
      applyContrast('normal'); applyFont('normal'); 
      localStorage.removeItem(P + 'contrast'); localStorage.removeItem(P + 'font'); 
      donomanaAnnounceA11y('設定をリセットしました');
    });
    applyContrast(localStorage.getItem(P + 'contrast') || 'normal');
    applyFont(localStorage.getItem(P + 'font') || 'normal');
    
  });
})();
</script>

<style>#donomanaLockBtn:focus-visible,#donomanaFsBtn:focus-visible{outline:3px solid #00A99D;outline-offset:2px;}</style>
<div style="position:fixed;top:64px;right:12px;z-index:99999;display:flex;gap:8px;">
  <button id="donomanaLockBtn" class="scannable" data-scan="1" aria-label="がめんをロック" title="がめんをロック（画面がうしろに戻るのをふせぎます）" style="min-width:44px;min-height:44px;border-radius:50%;border:none;background:rgba(255,255,255,0.92);font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.2);display:flex;align-items:center;justify-content:center;">🔓</button>
  <button id="donomanaFsBtn" class="scannable" data-scan="1" aria-label="全画面表示" title="全画面表示" style="min-width:44px;min-height:44px;border-radius:50%;border:none;background:rgba(255,255,255,0.92);font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.2);display:flex;align-items:center;justify-content:center;">⛶</button>
</div>
<div id="donomanaLockToast" role="alert" aria-live="assertive" style="position:fixed;top:112px;left:50%;transform:translateX(-50%) translateY(-10px);background:#c0392b;color:#fff;font-size:14px;font-weight:700;padding:10px 20px;border-radius:40px;box-shadow:0 4px 24px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:100000;white-space:nowrap;"></div>
<script>
(function(){
  var locked=false, toastTimer=null;
  function toast(msg){
    var el=document.getElementById('donomanaLockToast');
    if(!el)return;
    el.textContent=msg;
    el.style.opacity='1'; el.style.transform='translateX(-50%) translateY(0)';
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){el.style.opacity='0';el.style.transform='translateX(-50%) translateY(-10px)';},2200);
  }
  function setLock(on){
    locked=on;
    var btn=document.getElementById('donomanaLockBtn');
    if(btn){
      btn.textContent=on?'🔒':'🔓';
      btn.style.background=on?'rgba(255,80,80,0.92)':'rgba(255,255,255,0.92)';
      btn.setAttribute('aria-label',on?'ロックちゅう（タップでかいじょ）':'がめんをロック');
    }
    if(on){
      history.pushState({donomanaLocked:true},'');
      history.pushState({donomanaLocked:true},'');
      toast('🔒 がめんをロックしたよ');
    } else {
      toast('🔓 ロックをかいじょしたよ');
    }
  }
  window.addEventListener('popstate',function(){
    if(locked){history.pushState({donomanaLocked:true},'');toast('🔒 まえの がめんには もどれないよ');}
  });
  window.addEventListener('beforeunload',function(e){
    if(locked){e.preventDefault();e.returnValue='';}
  });
  document.addEventListener('DOMContentLoaded',function(){
    var lockBtn=document.getElementById('donomanaLockBtn');
    if(lockBtn)lockBtn.addEventListener('click',function(){setLock(!locked);});
    var homeBtn=document.getElementById('donomanaHomeBtn');
    if(homeBtn){
      homeBtn.addEventListener('click',function(e){
        if(locked){e.preventDefault();toast('🔒 まえの がめんには もどれないよ');}
      });
    }
    var fsBtn=document.getElementById('donomanaFsBtn');
    function inFS(){return !!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement);}
    function updateFsBtn(){if(fsBtn){fsBtn.textContent=inFS()?'⊡':'⛶';fsBtn.setAttribute('aria-label',inFS()?'全画面を解除':'全画面表示');}}
    ['fullscreenchange','webkitfullscreenchange','mozfullscreenchange'].forEach(function(ev){document.addEventListener(ev,updateFsBtn);});
    if(fsBtn)fsBtn.addEventListener('click',function(){
      if(!inFS()){
        var el=document.documentElement;
        var req=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen;
        if(req)req.call(el);
      } else {
        var ex=document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen;
        if(ex)ex.call(document);
      }
    });
  });
})();
</script>

// miru-hirogaru never passes erosion (its spacing uses CSS gap instead),

function hitTestGazeTargets(x, y, targets, options) {

<script>
/* Donomana Learning Record Foundation (Phase T5-B PoC) — shared localStorage-backed

function donomanaRecordReadLog(storageKey) {
  try { var raw = localStorage.getItem(storageKey); return raw ? JSON.parse(raw) : []; } catch (e) { return []; }
}
function donomanaRecordWriteLog(storageKey, log) {
  try { localStorage.setItem(storageKey, JSON.stringify(log)); } catch (e) {}
}
function donomanaRecordAddLog(storageKey, entry) {

  donomanaRecordWriteLog(storageKey, log);

}

}
// schemaVersion欠落 = legacy v1として扱う(Standard §9)。既存フィールドは書き換えない。
function donomanaRecordNormalizeLegacy(entry) {
  if (entry && typeof entry === 'object' && entry.schemaVersion == null) entry.schemaVersion = 1;
  return entry;
}
// Standard Core Schemaに沿った新規recordを組み立てる(将来のnested payload移行用。
// 既存2 Pilotの実データ形式は変更しない。関数として提供し単体テストのみ対象)。
function donomanaRecordCreate(appId, activity, inputMethod, payload) {
  return {
    timestamp: new Date().toISOString(),
    appId: appId,
    activity: activity,
    inputMethod: (typeof inputMethod === 'string') ? inputMethod : null,
    schemaVersion: 1,
    payload: payload || {}

}
// UTF-8 BOM付きCSV文字列を組み立てる(Standard §17)。rows: 2次元配列(先頭行=header)。
// ダウンロードUI自体は各アプリの既存実装を維持し、統一しない。
function donomanaRecordBuildCsv(rows) {
  function esc(v) {
    var s = (v === null || v === undefined) ? '' : String(v);
    return /["\,\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

// 指定fieldだけを読み書きし、他のpropertyを完全に保持する(既知/未知を問わず)。

function donomanaRecordReadNestedCollection(storageKey, field) {

// donomanaRecordFormatDateTimeと同じlocal basisに揃え、UTCとの新たな時差混乱を作らない)。
// 解析できない場合は元の文字列をdateへそのまま保持し(空白化・推測変換はしない)、timeは
// 空文字を返す。
function donomanaRecordFormatCsvDateTime(timeValue) {
  try {
    if (timeValue === null || timeValue === undefined || timeValue === '') return { date: '', time: '' };
    var d = (timeValue instanceof Date) ? timeValue : new Date(timeValue);
    if (isNaN(d.getTime())) return { date: String(timeValue), time: '' };
    var p = function (n) { return n < 10 ? '0' + n : String(n); };
    var date = d.getFullYear() + '.' + p(d.getMonth() + 1) + '.' + p(d.getDate());
    var time = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
    return { date: date, time: time };
  } catch (e) { return { date: (timeValue === null || timeValue === undefined) ? '' : String(timeValue), time: '' }; }

// 場合はentry.timeを使う。解析できないtimestampのentryは「日付不明」groupへ末尾でまとめる
// (無視・削除はしない)。
function donomanaRecordGroupByDate(entries, getTimeFn) {
  function dateKey(d) {
    var p = function (n) { return n < 10 ? '0' + n : String(n); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  var todayKey = dateKey(new Date());
  var yesterdayKey = dateKey(new Date(Date.now() - 86400000));
  var groups = {};
  (entries || []).forEach(function (entry) {
    var raw = getTimeFn ? getTimeFn(entry) : entry.time;
    var d = new Date(raw);
    var valid = !isNaN(d.getTime());
    var key = valid ? dateKey(d) : '__unknown__';
    if (!groups[key]) groups[key] = [];
    groups[key].push({ entry: entry, ms: valid ? d.getTime() : -1 });

  });
  return keys.map(function (key) {
    var items = groups[key].slice().sort(function (a, b) { return b.ms - a.ms; });
    var label = key === '__unknown__' ? '日付不明'
      : key === todayKey ? 'きょう'
      : key === yesterdayKey ? 'きのう'
      : (function () { var p = key.split('-'); return parseInt(p[1], 10) + '/' + parseInt(p[2], 10); })();
    return { dateLabel: label, entries: items.map(function (x) { return x.entry; }) };
  });
}

// 未知の値・null/undefinedはnullを返す。呼び出し側はnullのとき「不明」等を表示せず、

function donomanaRecordFormatInputMethod(inputMethod) {
  var MAP = { touch: 'タッチ', gaze: '視線', switch: 'スイッチ', keyboard: 'キーボード', click: 'クリック' };
  if (inputMethod === null || inputMethod === undefined) return null;
  return MAP[inputMethod] || null;
}
// hiragana-learn/katakana-appのtracingJudgmentLevel(easy/standard/precise)を
// 利用者向け日本語ラベルへ変換する。フィールド欠落(legacy record)・未知の値はnullを返す。
function donomanaRecordFormatTracingLevel(level) {
  var MAP = { easy: 'やさしく', standard: 'ひょうじゅん', precise: 'ていねいに' };
  return MAP[level] || null;
}
</script>

// Phase T5-E-B: Donomana Learning Record Foundationへ委譲する(呼び出し側のシグネチャ・
// entry形状・LOG_MAX retention・storage keyは無変更)。新規recordにはschemaVersion:1を
// 付与する(既存呼び出し元のリテラルは変更しない、ここで一元的に補う)。
function addLog(entry) {
  if (entry && entry.schemaVersion === undefined) entry.schemaVersion = 1;
  var log = readLog();
  log.push(entry);
  if (log.length > LOG_MAX) log = log.slice(log.length - LOG_MAX);
  donomanaRecordWriteLog(STORAGE_LOG_KEY, log);
}
function readLog() {
  var log = donomanaRecordReadLog(STORAGE_LOG_KEY);
  return Array.isArray(log) ? log : [];
}
function saveSettings() {
  var s = {
    level: level, questionCount: questionCount, tts: ttsEnabled, animation: animationEnabled,
    gazeEnabled: gazeEnabled, scanSpeed: scanSpeed,
    dwellDurationMs: dwellDurationMs, entryDelayMs: entryDelayMs, cooldownMs: cooldownMs,
    dwellProgressVisible: dwellProgressVisible, gazeTargetScalePct: gazeTargetScalePct,
    targetSpacingWide: targetSpacingWide, motionSpeedLevel: motionSpeedLevel
  };
  try { localStorage.setItem(STORAGE_SETTINGS_KEY, JSON.stringify(s)); } catch (e) {}
}
function loadSettings() {
  try {
    var raw = localStorage.getItem(STORAGE_SETTINGS_KEY);
    if (!raw) return;
    var s = JSON.parse(raw);
    if (!s) return;
    level = (s.level === 2 || s.level === 3) ? s.level : 1;
    questionCount = [3, 5, 10].indexOf(s.questionCount) !== -1 ? s.questionCount : 5;
    ttsEnabled = (typeof s.tts === 'boolean') ? s.tts : true;
    animationEnabled = (typeof s.animation === 'boolean') ? s.animation : true;
    gazeEnabled = (typeof s.gazeEnabled === 'boolean') ? s.gazeEnabled : false;
    scanSpeed = (typeof s.scanSpeed === 'number') ? s.scanSpeed : 1400;
    // Gaze Standard settings: existing saved objects predate these fields, so a
    // missing/malformed field always safely merges to its documented default
    // (no migration step needed).
    dwellDurationMs = (typeof s.dwellDurationMs === 'number') ? clamp(s.dwellDurationMs, DWELL_MIN_MS, DWELL_MAX_MS) : DWELL_MS;
    entryDelayMs = (typeof s.entryDelayMs === 'number') ? clamp(s.entryDelayMs, ENTRY_DELAY_MIN_MS, ENTRY_DELAY_MAX_MS) : 0;
    cooldownMs = (typeof s.cooldownMs === 'number') ? clamp(s.cooldownMs, COOLDOWN_MIN_MS, COOLDOWN_MAX_MS) : 900;
    dwellProgressVisible = (typeof s.dwellProgressVisible === 'boolean') ? s.dwellProgressVisible : true;
    gazeTargetScalePct = (s.gazeTargetScalePct === TARGET_SCALE_LARGE) ? TARGET_SCALE_LARGE : TARGET_SCALE_STANDARD;
    targetSpacingWide = (typeof s.targetSpacingWide === 'boolean') ? s.targetSpacingWide : false;
    motionSpeedLevel = (s.motionSpeedLevel === 'slow') ? 'slow' : 'normal';
  } catch (e) {}
}

/* =====================================================================
   canonical task generation — semantic mapping is always (shape type, shape
   size) === (target type, target size); DOM order, left/right position and
   color never encode correctness. This generator is the "かたち" concept only
   (size is always null); see generateSizeTask above for "おおきさ".
===================================================================== */
function generateTask(lvl) {
  var n = (lvl === 1) ? 1 : lvl;
  var types = shuffleArray(SHAPE_TYPES).slice(0, n);
  var colors = pickColors(n);
  var shapeOrder = shuffleArray(types);
  var targetOrder = shuffleArray(types);
  return {
    level: lvl,
    shapes: shapeOrder.map(function(t, i) { return { id: makeShapeId(t, null), shapeType: t, size: null, color: colors[types.indexOf(t)], placed: false }; }),
    targets: targetOrder.map(function(t) { return { id: makeShapeId(t, null), shapeType: t, size: null, filled: false }; }),
    selectedShapeId: null,
    placedShapeIds: [],
    mistakes: [], // {shapeId, selectedTargetType, expectedType, attempt}
    attemptsByShape: {}, // shapeId -> array of wrong target *types* tried, in order (semantic, not id — see handleWrongPlacement)
    shapeStartedAt: null,
    startedAt: Date.now()
  };
}

/* =====================================================================
   rendering
===================================================================== */
function renderTask() {
  shapesTray.innerHTML = '';
  targetsTray.innerHTML = '';
  if (!task) return;

  task.targets.forEach(function(t) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'target-btn' + (t.filled ? ' target-filled' : '');
    btn.tabIndex = 0;
    btn.dataset.targetId = t.id;
    btn.setAttribute('aria-label', shapeSpokenLabel(t) + ' の ばしょ' + (t.filled ? '（うめた）' : ''));
    var visual = document.createElement('div');
    visual.className = 'shape-visual shape-' + t.shapeType + (t.size ? ' size-' + t.size : '');
    if (t.filled) {
      var filledShape = task.shapes.filter(function(s) { return s.id === t.id; })[0];
      if (filledShape) visual.style.setProperty('--fill-color', filledShape.color);
    }
    var ring = document.createElement('div');
    ring.className = 'gaze-dwell-ring';
    btn.appendChild(visual);
    btn.appendChild(ring);
    btn.addEventListener('click', function() { onTargetActivate(t.id, currentInputMethod || 'click'); });
    targetsTray.appendChild(btn);
  });

  task.shapes.forEach(function(s) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'shape-btn' + (s.placed ? ' shape-placed' : '');
    btn.tabIndex = 0;
    btn.dataset.shapeId = s.id;
    btn.setAttribute('aria-pressed', (task.selectedShapeId === s.id) ? 'true' : 'false');
    btn.setAttribute('aria-label', shapeSpokenLabel(s));
    btn.style.setProperty('--shape-color', s.color);
    var visual = document.createElement('div');
    visual.className = 'shape-visual shape-' + s.shapeType + (s.size ? ' size-' + s.size : '');
    var ring = document.createElement('div');
    ring.className = 'gaze-dwell-ring';
    btn.appendChild(visual);
    btn.appendChild(ring);
    btn.addEventListener('click', function() {
      if (suppressNextClick) { suppressNextClick = false; return; } // a real drag just completed via this same gesture
      onShapeActivate(s.id, currentInputMethod || 'click');
    });
    btn.addEventListener('pointerdown', function(e) { onShapePointerDown(e, s.id); });
    btn.addEventListener('pointermove', onShapePointerMove);
    btn.addEventListener('pointerup', onShapePointerUp);
    btn.addEventListener('pointercancel', onShapePointerCancel);
    btn.addEventListener('lostpointercapture', onShapePointerLostCapture);
    shapesTray.appendChild(btn);
  });
}

function renderProgress() {
  if (!session) { progressArea.hidden = true; return; }
  progressArea.hidden = false;
  progressText.textContent = session.current + ' / ' + session.total;
  progressBar.setAttribute('aria-valuemax', String(session.total));
  progressBar.setAttribute('aria-valuenow', String(session.current));
  progressBarFill.style.width = (session.total ? (session.current / session.total * 100) : 0) + '%';
}

/* =====================================================================
   two-stage state machine
   waitingShape -> shapeSelected(waitingTarget) -> feedback -> waitingShape
   all shapes placed -> problemComplete -> next problem or sessionComplete
===================================================================== */
function shouldShowQuestionCount() { return level === 2 || level === 3; }

function startProblem() {
  cancelActiveDrag();
  clearPendingFeedback();
  task = (currentConcept === 'size') ? generateSizeTask(level) : generateTask(level);
  phase = 'waitingShape';
  feedbackText.textContent = '';
  sessionCompleteArea.hidden = true;
  resetDwellState();
  renderTask();
  if (scanMode) refreshSwitchScanItems();
}

function startLevel(n) {
  clearPendingFeedback();
  level = n;
  levelBtns.forEach(function(b) {
    var on = Number(b.dataset.level) === n;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  countRow.hidden = !shouldShowQuestionCount();
  if (shouldShowQuestionCount()) {
    session = { total: questionCount, current: 0, startedAt: Date.now() };
  } else {
    session = null;
  }
  renderProgress();
  startProblem();
  saveSettings();
}

// Phase26-I3: switching concept always restarts at that concept's Level1 — startLevel()
// already does the full safe reset this needs (cancelActiveDrag/clearPendingFeedback
// again defensively, session/progress reset, fresh task/render), so a concept switch can
// never leave a stale selection, drag gesture, pending feedback timeout, or progress count
// pointed at the concept being left. Always resetting to Level1 (rather than keeping
// whatever level number was active) avoids any confusion between the two concepts'
// different level meanings at the same number.
function setConcept(concept) {
  if (concept === currentConcept) return;
  cancelActiveDrag();
  clearPendingFeedback();
  currentConcept = concept;
  conceptBtns.forEach(function(b) {
    var on = b.dataset.concept === concept;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  updateLevelLabels();
  startLevel(1);
}

function setQuestionCount(n) {
  if ([3, 5, 10].indexOf(n) === -1) return;
  if (questionCount === n) return;
  questionCount = n;
  countBtns.forEach(function(b) {
    var on = Number(b.dataset.count) === n;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  saveSettings();
  if (shouldShowQuestionCount()) startLevel(level);
}

// unconditional "select this shape" — always ends in a fresh waitingTarget selection,
// regardless of what was selected before (including this same shape). Used by
// onShapeActivate's fresh-pick branch AND by drag-drop success (Phase26-D7), which must
// never trigger the toggle-to-deselect behavior a plain re-tap would: a completed drag
// onto a valid target is unambiguous positive intent, not a "did I mean to deselect?".
function selectShapeFresh(shapeId, inputMethod, startedAtOverride) {
  var shape = task.shapes.filter(function(s) { return s.id === shapeId && !s.placed; })[0];
  if (!shape) return false;
  currentInputMethod = inputMethod;
  task.selectedShapeId = shapeId;
  // drag routes both the "select" and "place" calls through this function back-to-back at
  // drop time (Phase26-D7), so Date.now() here would always read ~0ms of response time
  // instead of the actual pick-up-to-drop duration tap's timing captures naturally —
  // callers that already know when the user first engaged the shape pass that timestamp.
  task.shapeStartedAt = startedAtOverride || Date.now();
  phase = 'waitingTarget';
  speak(shapeSpokenLabel(shape));
  resetDwellState();
  renderTask();
  if (scanMode) refreshSwitchScanItems();
  return true;
}

// handles three cases via the same entry point (Phase26-D6):
//   waitingShape, any unplaced shape        -> fresh selection
//   waitingTarget, a DIFFERENT unplaced shape -> switch selection (old shape's UI clears)
//   waitingTarget, the SAME shape again       -> deselect back to waitingShape
// None of these three touch task.mistakes/attemptsByShape — only onTargetActivate's
// wrong-target branch records a mistake, so changing your mind is never logged as one.
function onShapeActivate(shapeId, inputMethod) {
  if (!task) return;
  if (phase !== 'waitingShape' && phase !== 'waitingTarget') return; // feedback: no shape candidates
  var shape = task.shapes.filter(function(s) { return s.id === shapeId && !s.placed; })[0];
  if (!shape) return;
  currentInputMethod = inputMethod;

  if (phase === 'waitingTarget' && task.selectedShapeId === shapeId) {
    task.selectedShapeId = null;
    phase = 'waitingShape';
    resetDwellState();
    renderTask();
    if (scanMode) refreshSwitchScanItems();
    return;
  }

  selectShapeFresh(shapeId, inputMethod);
}

function onTargetActivate(targetId, inputMethod) {
  if (!task || phase !== 'waitingTarget') return;
  var shapeId = task.selectedShapeId;
  var shape = task.shapes.filter(function(s) { return s.id === shapeId; })[0];
  if (!shape) return;
  var target = task.targets.filter(function(t) { return t.id === targetId; })[0];
  if (!target) return;
  currentInputMethod = inputMethod;

  // semantic mapping only — never DOM index/left-right/color. Compares (type, size)
  // explicitly (Phase26-I2) rather than the old `targetId === shape.shapeType`
  // shortcut, which only worked because target.id happened to equal target.shapeType
  // when every id was a bare type string; that stops holding once composite type+size
  // ids exist. size is always null on both sides in the current "かたち" concept, so
  // this produces identical results to before.
  if (target.shapeType === shape.shapeType && target.size === shape.size) {
    handleCorrectPlacement(shape, targetId);
  } else {
    // Phase26-I3.1: pass a minimal {shapeType, size} snapshot rather than the whole
    // target object — target.id is an internal composite id (e.g. "circle-large") that
    // must never end up in records/CSV, so it's deliberately left out here rather than
    // filtered out later.
    handleWrongPlacement(shape, { shapeType: target.shapeType, size: target.size });
  }
}

/* =====================================================================
   drag placement (Phase26-D7) — an OPTIONAL alternative to tap-tap, not a
   replacement. Pointer Events unify touch/mouse in one implementation
   (no separate touch/mouse code paths). Every drag ends by routing through
   selectShapeFresh()/onTargetActivate() — the exact same functions tap
   uses — so feedback/TTS/records/progress/canonical state are identical
   regardless of which input produced them; this file adds no second
   correctness path.

   dragState is transient UI-only state (pointer id, start coords, the
   visual proxy element) and is never merged into task — task stays the
   single canonical source of what's selected/placed, as before. Nothing
   in task is touched until a drop actually lands on a target: dropping
   outside any target is therefore a true no-op on canonical state (the
   pre-drag selection, whatever it was, is simply still there), which is
   what makes "outside drop = cancel, not a mistake" free rather than
   something that needs explicit save/restore logic.
===================================================================== */
var dragState = null; // { shapeId, pointerId, startX, startY, dragging, proxyEl, originalEl }
var DRAG_THRESHOLD_PX = 8;
var suppressNextClick = false; // set once a real drag completes, so the browser's
                                // post-pointerup synthetic click doesn't also fire
                                // onShapeActivate (Phase26-D6.1 "1 gesture = 1 activation")

// single idempotent cleanup path for every way a drag gesture can end (successful drop,
// outside-drop cancel, pointercancel, blur/visibilitychange, and lostpointercapture as a
// fallback — Phase26-G). Unconditionally safe to call even for a gesture that never
// crossed the drag threshold (proxyEl is null, the 'dragging' class was never added —
// both are no-ops) since pointer capture is now claimed at pointerdown time (see
// onShapePointerDown) and must be released either way.
function finishDragVisuals(ds) {
  if (!ds) return;
  if (ds.proxyEl && ds.proxyEl.parentNode) ds.proxyEl.parentNode.removeChild(ds.proxyEl);
  document.querySelectorAll('.target-btn.drag-hover').forEach(function(el) { el.classList.remove('drag-hover'); });
  if (ds.originalEl) {
    ds.originalEl.classList.remove('dragging');
    try { ds.originalEl.releasePointerCapture(ds.pointerId); } catch (e) {}
  }
}

function cancelActiveDrag() {
  if (!dragState) return;
  var ds = dragState;
  dragState = null;
  finishDragVisuals(ds);
}

function createDragProxy(originalEl) {
  var rect = originalEl.getBoundingClientRect();
  var proxy = originalEl.cloneNode(true);
  proxy.removeAttribute('id');
  proxy.removeAttribute('tabindex');
  proxy.setAttribute('aria-hidden', 'true');
  proxy.className = 'shape-btn drag-proxy';
  proxy.style.position = 'fixed';
  proxy.style.left = rect.left + 'px';
  proxy.style.top = rect.top + 'px';
  proxy.style.width = rect.width + 'px';
  proxy.style.height = rect.height + 'px';
  proxy.style.margin = '0';
  proxy.style.pointerEvents = 'none'; // excluded from elementFromPoint() hit-testing
  proxy._offsetX = rect.width / 2;
  proxy._offsetY = rect.height / 2;
  return proxy;
}
function positionDragProxy(proxy, clientX, clientY) {
  proxy.style.left = (clientX - proxy._offsetX) + 'px';
  proxy.style.top = (clientY - proxy._offsetY) + 'px';
}
function hitTestTarget(clientX, clientY) {
  var el = document.elementFromPoint(clientX, clientY);
  if (!el) return null;
  var targetBtn = el.closest ? el.closest('.target-btn') : null;
  if (!targetBtn || targetBtn.classList.contains('target-filled')) return null;
  return targetBtn;
}
function updateDragHoverHighlight(clientX, clientY) {
  var hit = hitTestTarget(clientX, clientY);
  document.querySelectorAll('.target-btn.drag-hover').forEach(function(el) { if (el !== hit) el.classList.remove('drag-hover'); });
  if (hit) hit.classList.add('drag-hover');
}

function onShapePointerDown(e, shapeId) {
  if (e.pointerType === 'mouse' && e.button !== 0) return; // left button only
  if (dragState) return; // one active drag at a time (Phase26-D7 multi-pointer guard)
  if (!task) return;
  // Mirrors onShapeActivate's tap guard (Phase26-G): 'feedback' is a brief transitional
  // phase (700-900ms after a placement) with its own pending setTimeout that will call
  // renderTask() when it fires. Starting a NEW drag during that window let a still-active
  // gesture's originalEl/proxy survive past the render that swaps in fresh shape/target
  // buttons — the render destroys originalEl (pointer capture is implicitly released,
  // so this gesture's eventual pointerup never reaches onShapePointerUp), leaving
  // dragState stuck non-null (blocking all future drags via the guard above) and the
  // proxy — appended directly to document.body, untouched by the tray rebuild —
  // orphaned on screen. This is the consecutive-drag freeze reported in Phase26-G.
  if (phase !== 'waitingShape' && phase !== 'waitingTarget') return;
  var shape = task.shapes.filter(function(s) { return s.id === shapeId && !s.placed; })[0];
  if (!shape) return;
  dragState = { shapeId: shapeId, pointerId: e.pointerId, startX: e.clientX, startY: e.clientY, startTime: Date.now(), dragging: false, proxyEl: null, originalEl: e.currentTarget };
  // Claim pointer capture immediately, not lazily once the movement threshold is first
  // crossed (Phase26-G). Before capture is set, pointermove/pointerup route via normal
  // hit-testing at the pointer's current screen position. For a fast/long gesture toward
  // a distant target (a real swipe), the very first move sample can already land outside
  // originalEl's bounds — onShapePointerMove (bound only to .shape-btn elements) then
  // never fires again for this pointerId, the threshold never registers as crossed, and
  // the eventual pointerup lands on whatever element the pointer ended up over (e.g. a
  // .target-btn, which has no matching handler), stranding dragState permanently and
  // blocking every future drag via the guard above. Capturing here guarantees every event
  // for this gesture keeps reaching originalEl regardless of how far/fast the pointer moves.
  try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
}
function onShapePointerMove(e) {
  if (!dragState || e.pointerId !== dragState.pointerId) return;
  var dx = e.clientX - dragState.startX, dy = e.clientY - dragState.startY;
  if (!dragState.dragging) {
    if (Math.hypot(dx, dy) < DRAG_THRESHOLD_PX) return; // still just a tap-in-progress
    dragState.dragging = true;
    dragState.originalEl.classList.add('dragging');
    dragState.proxyEl = createDragProxy(dragState.originalEl);
    document.body.appendChild(dragState.proxyEl);
  }
  e.preventDefault(); // only once a drag is confirmed — before that, ordinary page
                       // scroll starting on a shape is left alone (touch-action:none
                       // on .shape-btn handles the initial-gesture race; see CSS)
  positionDragProxy(dragState.proxyEl, e.clientX, e.clientY);
  updateDragHoverHighlight(e.clientX, e.clientY);
}
function onShapePointerUp(e) {
  if (!dragState || e.pointerId !== dragState.pointerId) return;
  var ds = dragState;
  dragState = null;
  var dropTarget = ds.dragging ? hitTestTarget(e.clientX, e.clientY) : null;
  finishDragVisuals(ds); // always release the capture claimed at pointerdown, even if the
                          // threshold was never crossed (proxy/class cleanup are no-ops then)
  if (!ds.dragging) return; // never crossed the threshold — let the normal click handle it as a tap

  suppressNextClick = true;
  setTimeout(function() { suppressNextClick = false; }, 0);

  if (!task) return; // level/session changed mid-drag
  var stillAvailable = task.shapes.some(function(s) { return s.id === ds.shapeId && !s.placed; });
  if (!stillAvailable) return; // stale drag from a since-replaced problem

  if (dropTarget) {
    if (!selectShapeFresh(ds.shapeId, 'drag', ds.startTime)) return;
    onTargetActivate(dropTarget.dataset.targetId, 'drag');
  }
  // else: dropped outside any target — cancel. task.selectedShapeId was never touched
  // during this drag, so whatever was selected before (this shape, a different shape,
  // or nothing) is already exactly as it was; nothing to restore.
}
function onShapePointerCancel(e) {
  if (!dragState || e.pointerId !== dragState.pointerId) return;
  cancelActiveDrag();
}
// Safety-net fallback (Phase26-G): if the captured element is ever removed from the DOM
// while capture is still held, the browser implicitly releases capture and fires this
// event on it — but does not reliably also fire pointercancel in every browser. Routing
// it through the same idempotent cancelActiveDrag() guarantees dragState/proxy/pointer
// capture never gets stuck even if some other, not-yet-identified path recreates the
// render-during-drag race the phase guard above closes off.
function onShapePointerLostCapture(e) {
  if (!dragState || e.pointerId !== dragState.pointerId) return;
  cancelActiveDrag();
}
window.addEventListener('blur', cancelActiveDrag);
document.addEventListener('visibilitychange', function() { if (document.hidden) cancelActiveDrag(); });

// Phase26-I2: takes the wrongly-chosen target's semantic *type+size*, not its id —
// attemptsByShape feeds buildRecordsCsvRows()'s "間違えた内容" column via
// shapeSpokenLabel() (see below), which only resolves correctly for a real
// {shapeType, size} pair, not a composite type+size id. Passing a plain
// {shapeType, size} object here (rather than a raw target id or the whole target,
// which also carries its internal composite id) keeps that lookup correct and never
// lets an internal id like "circle-large" reach records/CSV.
// Phase26-I3.1: size was dropped here even though target.size was already available at
// the call site — attemptsByShape stored shapeType only, so "おおきさ" mistakes lost
// which size was picked (e.g. a small-circle-onto-large-circle-target miss recorded only
// "まる", identical to a correct-size miss). Now stores the full {shapeType, size} pair;
// for "かたち" concept size is always undefined, so this is a no-op there.
function handleWrongPlacement(shape, wrongTarget) {
  if (!task.attemptsByShape[shape.id]) task.attemptsByShape[shape.id] = [];
  task.attemptsByShape[shape.id].push(wrongTarget);
  task.mistakes.push({ shapeId: shape.id, selectedTargetType: wrongTarget.shapeType, selectedTargetSize: wrongTarget.size, expectedType: shape.shapeType });
  phase = 'feedback';
  feedbackText.textContent = 'もういちど';
  speak('もういちど');
  resetDwellState();
  if (scanMode) refreshSwitchScanItems(); // feedback: 0 learning candidates
  var capturedTask = task;
  feedbackTimeoutId = setTimeout(function() {
    feedbackTimeoutId = null;
    if (task !== capturedTask) return; // level/question-count change or restart superseded this task
    phase = 'waitingTarget'; // selected shape is retained; only the target step retries
    feedbackText.textContent = '';
    resetDwellState();
    renderTask();
    if (scanMode) refreshSwitchScanItems();
  }, effMs(1000));
}

function handleCorrectPlacement(shape, targetId) {
  shape.placed = true;
  task.placedShapeIds.push(shape.id);
  var target = task.targets.filter(function(t) { return t.id === targetId; })[0];
  if (target) target.filled = true;

  if (level !== 1) {
    var logEntry = {
      time: new Date().toISOString(),
      level: level,
      concept: currentConcept, // Phase26-I3: new field, always present going forward; absent on any pre-existing entry, which callers should treat as 'shape'
      questionIndex: session ? session.current + 1 : 1,
      questionTotal: session ? session.total : 1,
      shape: shape.shapeType,
      expected: shape.shapeType,
      selected: shape.shapeType,
      correct: true,
      mistakes: (task.attemptsByShape[shape.id] || []).length,
      mistakeSelections: (task.attemptsByShape[shape.id] || []).slice(),
      responseTimeMs: task.shapeStartedAt ? (Date.now() - task.shapeStartedAt) : null,
      inputMethod: currentInputMethod || 'unknown'
    };
    // Phase26-I3: shapeSize is only ever added for the おおきさ concept, so a plain
    // "かたち" log entry's set of keys stays exactly what it was before this concept
    // existed — existing readers of the log never see a key they don't already handle.
    if (shape.size) logEntry.shapeSize = shape.size;
    addLog(logEntry);
  }

  task.selectedShapeId = null;
  phase = 'feedback';
  var allPlaced = task.shapes.every(function(s) { return s.placed; });
  feedbackText.textContent = 'ぴったり！';
  speak('ぴったり');
  resetDwellState();
  renderTask();
  if (scanMode) refreshSwitchScanItems();

  var capturedTask = task;
  feedbackTimeoutId = setTimeout(function() {
    feedbackTimeoutId = null;
    if (task !== capturedTask) return;
    feedbackText.textContent = '';
    if (allPlaced) {
      onProblemComplete();
    } else {
      phase = 'waitingShape';
      resetDwellState();
      renderTask();
      if (scanMode) refreshSwitchScanItems();
    }
  }, effMs(level === 1 ? 700 : 900));
}

function onProblemComplete() {

// order/positions are unchanged so any external tooling built against the old 11-column CSV
// keeps working; the new column is simply blank for かたち-concept rows (no shapeSize recorded).
var CSV_HEADERS = ['日付', '時刻', 'レベル', '問題番号', '問題数', '形', '正しい場所', '選択した場所', '正誤', '再試行回数', '間違えた内容', '反応時間ms', 'おおきさ'];
function csvEscape(value) {
  var s = (value === null || value === undefined) ? '' : String(value);
  if (/[",\n\r]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
  return s;
}
// Phase T5-E-B: T5-E-A'で確立したExcel互換CSV日時形式(日付=YYYY.MM.DD、時刻=HH:mm:ss)を
// Learning Record Foundationの既存donomanaRecordFormatCsvDateTime()で適用する
// (旧formatRecordDateTimeFull()の単一「日時」列はExcelで#######になる不具合があった)。
function buildRecordsCsvRows() {
  var rows = [CSV_HEADERS.slice()];
  readLog().forEach(function(e) {
    var entryConcept = e.concept || 'shape';
    var levelName = (LEVEL_LABELS[entryConcept] && LEVEL_LABELS[entryConcept][e.level]) || ('レベル' + e.level);
    var dt = donomanaRecordFormatCsvDateTime(e.time);
    rows.push([
      dt.date,
      dt.time,
      levelName,
      e.questionIndex, e.questionTotal,
      SHAPE_LABEL[e.shape] || e.shape,
      SHAPE_LABEL[e.expected] || e.expected,
      SHAPE_LABEL[e.selected] || e.selected,
      e.correct ? 'せいかい' : 'まちがい',
      e.mistakes,
      // Phase26-I3.1: mistakeSelections entries are {shapeType, size} objects going
      // forward (see handleWrongPlacement) so size-aware labels reuse shapeSpokenLabel()
      // — the same helper TTS/aria-label already use, no new label logic. Pre-I3.1
      // records still hold plain shapeType strings (an おおきさ concept could only have
      // existed since I3, so any pre-I3.1 mistakeSelections is unambiguously "かたち"
      // and never needed a size label anyway); both forms are handled here.
      (e.mistakeSelections || []).map(function(m) {
        return typeof m === 'string' ? (SHAPE_LABEL[m] || m) : shapeSpokenLabel(m);
      }).join('、'),
      e.responseTimeMs,
      e.shapeSize ? SIZE_LABEL[e.shapeSize] : ''
    ]);
  });
  return rows;
}
function downloadRecordsCsv() {
  var log = readLog();
  if (log.length === 0) return;
  var rows = buildRecordsCsvRows();
  var csvBody = rows.map(function(row) { return row.map(csvEscape).join(','); }).join('\r\n');
  var UTF8_BOM = '﻿';
  var blob = new Blob([UTF8_BOM + csvBody], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var d = new Date();
  function pad(n) { return n < 10 ? '0' + n : String(n); }
  var a = document.createElement('a');
  a.href = url;
  a.download = 'katachi-awase-records-' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
}
recordsCsvBtn.addEventListener('click', downloadRecordsCsv);

/* =====================================================================
   init
===================================================================== */
loadSettings();
toggleTts.checked = ttsEnabled;
toggleAnimation.checked = animationEnabled;
document.body.classList.toggle('no-animation', !animationEnabled);
toggleScan.checked = false; // scanMode itself always starts OFF regardless of stored gazeEnabled
scanSpeedRange.value = String(scanSpeed);
countBtns.forEach(function(b) {
  var on = Number(b.dataset.count) === questionCount;
  b.classList.toggle('active', on);
  b.setAttribute('aria-pressed', on ? 'true' : 'false');
});

// Gaze Accessibility Standard v1.0 §16: apply the loaded (or default) values
// to every control's displayed state and underlying live effect. The
// stepper/checkbox wiring above already ran with default values at parse
// time (before loadSettings() had anything to load), so their initial
// refresh()/apply*() calls must be re-run here now that persisted values
// are known.
refreshDwellVal(); refreshEntryDelayVal(); refreshCooldownVal();
toggleGazeProgress.checked = dwellProgressVisible; applyDwellProgressVisible(dwellProgressVisible);
toggleGazeEnlarge.checked = (gazeTargetScalePct === TARGET_SCALE_LARGE); applyTargetScale(gazeTargetScalePct === TARGET_SCALE_LARGE);
toggleGazeSpacing.checked = targetSpacingWide; applyTargetSpacing(targetSpacingWide);
toggleGazeSlowMotion.checked = (motionSpeedLevel === 'slow'); applyMotionSpeed(motionSpeedLevel);
toggleGaze.checked = gazeEnabled;
setGazeEnabled(gazeEnabled); // starts the rAF loop (and dims/undims gazeSubSettings) only if the persisted value was true

startLevel(level);
</script>
