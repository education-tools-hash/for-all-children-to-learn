<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Phase APP-DETAILS-VISUAL-ENHANCEMENT-SAWATTE-MOCKUP-C-1 で確認した対策。

  このCloud環境には日本語フォント「IPAゴシック」(IPA Font License v1.0、
  パッケージ fonts-ipafont-gothic)が既にインストールされているが、
  fontconfigの既定の優先順位では、汎用 sans-serif(lang=ja) に対して
  中国語フォントの文泉驛正黑(WenQuanYi Zen Hei)の方が先に選ばれてしまう。

  sawatte-hirogaru-app.html 等、OS付属フォント名("Hiragino Maru Gothic
  ProN","BIZ UDPGothic" 等)をfont-familyに直接指定しWebフォントを読み込まない
  アプリは、このままではCloudでの撮影時に中国語フォントの字形で描画されてしまう。

  この設定ファイルは、tools/make-mockups.py 実行時だけ環境変数
  FONTCONFIG_FILE でこのファイルを指すことで、lang=ja の sans-serif 解決を
  インストール済みのIPAゴシックに向けるスコープ限定の上書きである。
  システム全体のfontconfig設定ファイル(/etc/fonts/等)は変更しない。
  アプリ本体のCSSも変更しない。新規フォントのインストールも行わない
  (IPAゴシックは導入済みのものを使うだけ)。

  使い方:
    FONTCONFIG_FILE=tools/mockup-font-fallback.conf python3 tools/make-mockups.py sawatte-hirogaru-app
-->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <match target="pattern">
    <test name="lang"><string>ja</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>IPAGothic</string></edit>
  </match>
</fontconfig>
