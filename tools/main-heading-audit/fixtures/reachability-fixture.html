<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><title>Reachability Fixture</title></head>
<body>
  <!-- A. 通常表示h1 -> reachable, visible -->
  <h1 id="case-a">Case A: normal</h1>

  <!-- B. display:none親内h1 -> unreachable -->
  <div style="display:none">
    <h1 id="case-b">Case B: display:none parent</h1>
  </div>

  <!-- C. hidden属性親内h1 -> unreachable -->
  <div hidden>
    <h1 id="case-c">Case C: hidden attribute parent</h1>
  </div>

  <!-- D. aria-hidden="true"親内h1 -> unreachable -->
  <div aria-hidden="true">
    <h1 id="case-d">Case D: aria-hidden parent</h1>
  </div>

  <!-- E. inert親内h1 -> unreachable -->
  <div inert>
    <h1 id="case-e">Case E: inert parent</h1>
  </div>

  <!-- F. 閉じたmodal内h1(tyushi方式: display:none, .openで解除) -> unreachable -->
  <style>#case-f-modal{display:none} #case-f-modal.open{display:flex}</style>
  <div id="case-f-modal">
    <h1 id="case-f">Case F: closed modal (tyushi pattern)</h1>
  </div>

  <!-- G. visually-hidden(register-app/schedule-app方式) -> unreachable(visual)だがreachable(a11y) -->
  <h1 id="case-g" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;padding:0;margin:-1px;">Case G: visually-hidden static h1</h1>

  <!-- 追加: visibility:hidden祖先 -> unreachable(displayとは別のプロパティであることの確認用) -->
  <div style="visibility:hidden">
    <h1 id="case-h">Case H: visibility:hidden parent</h1>
  </div>
</body>
</html>
