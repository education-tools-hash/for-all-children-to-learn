<!-- announce-helper: 自動挿入 (generate.js) -->
<div id="donomanaAnnouncePolite" role="status" aria-live="polite" aria-atomic="true" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;padding:0;margin:-1px;"></div>
<div id="donomanaAnnounceAssertive" role="alert" aria-live="assertive" aria-atomic="true" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;padding:0;margin:-1px;"></div>
<script>
(function(){
  if (window.donomanaAnnounce) return;
  var politeTimer = null, assertiveTimer = null;
  function donomanaAnnounce(message, options){
    if (typeof message !== 'string') return;
    if (message.trim() === '') return;
    var opts = options || {};
    var priority = (opts.priority === 'assertive') ? 'assertive' : 'polite';
    var clearDelay = (typeof opts.clearDelay === 'number' && Number.isFinite(opts.clearDelay) && opts.clearDelay >= 0) ? opts.clearDelay : 50;
    var elId = (priority === 'assertive') ? 'donomanaAnnounceAssertive' : 'donomanaAnnouncePolite';
    var live = document.getElementById(elId);
    if (!live) return;
    if (priority === 'assertive') { clearTimeout(assertiveTimer); } else { clearTimeout(politeTimer); }
    live.textContent = '';
    var timer = setTimeout(function(){ live.textContent = message; }, clearDelay);
    if (priority === 'assertive') { assertiveTimer = timer; } else { politeTimer = timer; }
  }
  window.donomanaAnnounce = donomanaAnnounce;
})();
</script>

<div id="donomanaA11yStatus" role="status" aria-live="polite" aria-atomic="true" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;padding:0;margin:-1px;"></div>
<script>
(function(){
  var P = 'donomana-a11y-';
  function all(sel){return document.querySelectorAll(sel);}
  function mark(sel, dataAttr, value){
    all(sel).forEach(function(b){
      var on = b.dataset[dataAttr] === value;
      b.style.background = on ? '#00A99D' : '#fff';
      b.style.color = on ? '#fff' : '#333';
      b.style.borderColor = on ? '#00A99D' : '#ddd';
    });
  }
  var donomanaAnnounceA11yTimer = null;
  function donomanaAnnounceA11y(msg){
    var live = document.getElementById('donomanaA11yStatus');
    if (!live) return;
    clearTimeout(donomanaAnnounceA11yTimer);
    live.textContent = '';
    donomanaAnnounceA11yTimer = setTimeout(function(){ live.textContent = msg; }, 50);
  }
  function applyContrast(mode){
    document.documentElement.style.filter = (mode === 'hc') ? 'invert(1) hue-rotate(180deg)' : '';
    mark('[data-a11y-contrast]', 'a11yContrast', mode);
    localStorage.setItem(P + 'contrast', mode);
  }
  function applyFont(size){
    var zoomMap = { normal: '', large: '125%', xlarge: '150%' };
    document.body.style.zoom = zoomMap[size] || '';
    mark('[data-a11y-font]', 'a11yFont', size);
    localStorage.setItem(P + 'font', size);
  }

  document.addEventListener('DOMContentLoaded', function(){
    var btn = document.getElementById('donomanaA11yBtn');
    var panel = document.getElementById('donomanaA11yPanel');
    if (!btn || !panel) return;
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var open = panel.style.display === 'block';
      panel.style.display = open ? 'none' : 'block';
      btn.setAttribute('aria-expanded', open ? 'false' : 'true');
      panel.setAttribute('aria-hidden', open ? 'true' : 'false');
    });
    document.addEventListener('click', function(e){
      if (!panel.contains(e.target) && e.target !== btn) {
        panel.style.display = 'none';
        btn.setAttribute('aria-expanded', 'false');
        panel.setAttribute('aria-hidden', 'true');
      }
    });
    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape' && panel.style.display === 'block') btn.click();
    });
    all('[data-a11y-contrast]').forEach(function(b){ b.addEventListener('click', function(){
      applyContrast(b.dataset.a11yContrast);
      donomanaAnnounceA11y(b.dataset.a11yContrast === 'hc' ? 'ハイコントラストをオンにしました' : 'ハイコントラストをオフにしました');
    }); });
    all('[data-a11y-font]').forEach(function(b){ b.addEventListener('click', function(){
      applyFont(b.dataset.a11yFont);
      donomanaAnnounceA11y('文字の大きさを' + ({normal:'標準',large:'大',xlarge:'特大'}[b.dataset.a11yFont] || '標準') + 'にしました');
    }); });


  var proxyBtn = document.getElementById('donomanaSettingsProxy');
  if (proxyBtn) {
    function donomanaIsFocusable(el){
      if (!el || !el.isConnected || el.disabled || el.tabIndex === -1) return false;
      if (el.hasAttribute('hidden') || el.closest('[hidden]') || el.closest('[inert]')) return false;
      if (el.getClientRects().length === 0) return false;
      var cs = getComputedStyle(el);
      if (cs.display === 'none' || cs.visibility === 'hidden' || cs.visibility === 'collapse') return false;
      if (Number.parseFloat(cs.opacity) === 0) return false;
      return true;
    }
    function donomanaFirstFocusable(root){
      if (!root) return null;
      var cands = root.querySelectorAll('button, input, select, textarea, a[href], [tabindex]');
      for (var i = 0; i < cands.length; i++) { if (donomanaIsFocusable(cands[i])) return cands[i]; }
      return null;
    }
    proxyBtn.addEventListener('click', function(e){
      e.stopPropagation();
      var candidates = Array.from(document.querySelectorAll("#settingsBtn"));
      var original = candidates.find(function(el){ return el.offsetParent !== null; }) || candidates[0];
      panel.style.display = 'none';
      btn.setAttribute('aria-expanded', 'false');
      panel.setAttribute('aria-hidden', 'true');
      if (!original) return;
      var controlsId = original.getAttribute('aria-controls');
      var beforeVisible = null;
      if (!controlsId) {
        beforeVisible = new Set();
        document.querySelectorAll('body *').forEach(function(el){
          if (el.getClientRects().length > 0) beforeVisible.add(el);
        });
      }
      original.focus();
      original.click();
      setTimeout(function(){
        var active = document.activeElement;
        var needsFallback = (active === document.body) || (active === original && !donomanaIsFocusable(original));
        if (!needsFallback) return;
        var target = null;
        if (controlsId) {
          target = donomanaFirstFocusable(document.getElementById(controlsId));
        } else {
          var newly = [];
          document.querySelectorAll('body *').forEach(function(el){
            if (el.getClientRects().length > 0 && !beforeVisible.has(el)) newly.push(el);
          });
          for (var i = 0; i < newly.length; i++) {
            if (/^(BUTTON|INPUT|SELECT|TEXTAREA|A)$/.test(newly[i].tagName) && donomanaIsFocusable(newly[i])) { target = newly[i]; break; }
          }
        }
        if (target) target.focus();
      }, 100);
    });
  }
    var resetBtn = document.getElementById('donomanaA11yReset');
    if (resetBtn) resetBtn.addEventListener('click', function(){
      applyContrast('normal'); applyFont('normal');
      localStorage.removeItem(P + 'contrast'); localStorage.removeItem(P + 'font');
      donomanaAnnounceA11y('設定をリセットしました');
    });
    applyContrast(localStorage.getItem(P + 'contrast') || 'normal');
    applyFont(localStorage.getItem(P + 'font') || 'normal');

  });
})();
</script>

</div>
<div id="donomanaLockToast" role="alert" aria-live="assertive" style="position:fixed;top:112px;left:50%;transform:translateX(-50%) translateY(-10px);background:#c0392b;color:#fff;font-size:14px;font-weight:700;padding:10px 20px;border-radius:40px;box-shadow:0 4px 24px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:100000;white-space:nowrap;"></div>
<script>
(function(){
  var locked=false, toastTimer=null;
  function toast(msg){
    var el=document.getElementById('donomanaLockToast');
    if(!el)return;
    el.textContent=msg;
    el.style.opacity='1'; el.style.transform='translateX(-50%) translateY(0)';
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){el.style.opacity='0';el.style.transform='translateX(-50%) translateY(-10px)';},2200);
  }
  function setLock(on){
    locked=on;
    var btn=document.getElementById('donomanaLockBtn');
    if(btn){
      btn.textContent=on?'🔒':'🔓';
      btn.style.background=on?'rgba(255,80,80,0.92)':'rgba(255,255,255,0.92)';
      btn.setAttribute('aria-label',on?'ロックちゅう（タップでかいじょ）':'がめんをロック');
    }
    if(on){
      history.pushState({donomanaLocked:true},'');
      history.pushState({donomanaLocked:true},'');
      toast('🔒 がめんをロックしたよ');
    } else {
      toast('🔓 ロックをかいじょしたよ');
    }
  }
  window.addEventListener('popstate',function(){
    if(locked){history.pushState({donomanaLocked:true},'');toast('🔒 まえの がめんには もどれないよ');}
  });
  window.addEventListener('beforeunload',function(e){
    if(locked){e.preventDefault();e.returnValue='';}
  });
  document.addEventListener('DOMContentLoaded',function(){
    var lockBtn=document.getElementById('donomanaLockBtn');
    if(lockBtn)lockBtn.addEventListener('click',function(){setLock(!locked);});
    var homeBtn=document.getElementById('donomanaHomeBtn');
    if(homeBtn){
      homeBtn.addEventListener('click',function(e){
        if(locked){e.preventDefault();toast('🔒 まえの がめんには もどれないよ');}
      });
    }
    var fsBtn=document.getElementById('donomanaFsBtn');
    function inFS(){return !!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement);}
    function updateFsBtn(){if(fsBtn){fsBtn.textContent=inFS()?'⊡':'⛶';fsBtn.setAttribute('aria-label',inFS()?'全画面を解除':'全画面表示');}}
    ['fullscreenchange','webkitfullscreenchange','mozfullscreenchange'].forEach(function(ev){document.addEventListener(ev,updateFsBtn);});
    if(fsBtn)fsBtn.addEventListener('click',function(){
      if(!inFS()){
        var el=document.documentElement;
        var req=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen;
        if(req)req.call(el);
      } else {
        var ex=document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen;
        if(ex)ex.call(document);
      }
    });
  });
})();
</script>

<style>
  /* =====================================================================
     Prototype note (Phase M12-B): World = 「えらべるひろば」— a neutral,
     category-agnostic sky+ground stage, deliberately distinct in palette/
     composition from miru-hirogaru-app's warm toy-room world (M12-A design
     doc §8 differentiation policy).
     Phase M12-B' update: the Phase M12-B hand-built placeholder SVG icons
     have been replaced with User-approved PNG illustrations
     (assets/dotchiga-ii/apple.png, banana.png, dog.png, cat.png). Still a
     Local Prototype — not Production-final (apps-data.json unregistered).
     Phase M12-C update: added Level2「すきなのはどっち？」/ Level3「どっちに
     する？」+ an Activity Selector. Level3 originally used the「たいこ／
     ベル」instrument pair with NO approved illustration, rendered as an
     explicit PROTOTYPE PLACEHOLDER (dashed card + glyph + "プロトタイプ"
     tag) — see the M12-C'' note below for its replacement.
     Phase M12-C' update: the Activity Selector moved from the Settings
     panel to an always-visible Activity Tabs row between the header and
     the stage, so a child can switch activity without opening Settings
     first (Agency — see design doc §35). Settings' 「あそび」group keeps
     only えらぶかいすう now; the activity buttons themselves (.activity-btn)
     are unchanged, just relocated.
     Phase M12-C'' update: drum/bell now use User-approved illustrations
     (assets/dotchiga-ii/drum.png, bell.png), so the Phase M12-C PROTOTYPE
     PLACEHOLDER (.choice-placeholder markup/CSS + renderChoiceIcon()) has
     been removed entirely — Level3 renders through the same plain <img>
     path as every other choice now (see design doc §36).
  ===================================================================== */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Noto Sans JP', sans-serif;
    background: linear-gradient(180deg, #BEE3F8 0%, #EAF6FF 55%, #EAF6FF 100%);
    color: var(--dm-color-ink);
    min-height: 100vh;
  }
  .app { max-width: 900px; margin: 0 auto; padding: var(--dm-space-6) var(--dm-space-4) var(--dm-space-9); position: relative; min-height: 100vh; }
  .app-header {
    display: flex; align-items: center; justify-content: space-between;
    gap: var(--dm-space-3); margin-bottom: var(--dm-space-5);
    /* clears the fixed common home button (top:12px;left:12px;width:44px) —
       .app's max-width matches or exceeds most viewports, so content starts
       flush at the left edge directly under it (same fix as kurabeyou-app). */
    padding-left: 52px;
  }
  .app-title { font-size: var(--dm-font-size-heading); font-weight: 900; margin: 0; color: #2C5F7C; }
  .activity-label { font-size: var(--dm-font-size-body); font-weight: 700; margin: 2px 0 0; color: #00857B; }
  .settings-toggle-btn {
    min-width: 44px; min-height: 44px; padding: var(--dm-space-2) var(--dm-space-4);
    border-radius: var(--dm-radius-pill); border: 2px solid var(--dm-color-primary);
    background: #fff; color: var(--dm-color-primary-dark); font-weight: 900; cursor: pointer;
    font-size: var(--dm-font-size-caption); font-family: inherit;
  }

  /* ===== decorative world (clouds/ground) — non-interactive, kept subtle so
     it never competes visually with the two choices (M12-A design doc §17
     "Visual hierarchy": choice is always the most prominent element) ===== */
  .world-deco { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .world-cloud { position: absolute; opacity: 0.8; }
  .world-ground { position: absolute; left: 0; right: 0; bottom: 0; height: 14vh; min-height: 90px; background: linear-gradient(180deg, #BFEFC8 0%, #A6E6B4 100%); border-top-left-radius: 50% 30px; border-top-right-radius: 50% 30px; }
  .world-star { position: absolute; opacity: 0.55; }

  /* ===== stage: 2 choices ===== */
  .stage {
    position: relative; z-index: 1;
    display: flex; align-items: center; justify-content: center;
    gap: var(--dm-space-8); flex-wrap: wrap;
    min-height: 50vh; margin-bottom: var(--dm-space-6);
  }
  @media (max-width: 480px) {
    .stage { flex-direction: column; gap: var(--dm-space-6); min-height: 60vh; }
  }
  .choice-card {
    position: relative;
    width: 220px; height: 220px;
    border: none; border-radius: var(--dm-radius-md,9px) * 3;
    border-radius: 28px;
    background: #fff;
    box-shadow: 0 6px 18px rgba(44,95,124,0.18);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding: var(--dm-space-4);
    transition: transform var(--dm-duration-base) var(--dm-easing-standard), box-shadow var(--dm-duration-base) var(--dm-easing-standard);
  }
  @media (min-width: 481px) and (max-width: 700px) {
    .choice-card { width: 180px; height: 180px; }
  }
  .choice-card:focus-visible { outline: var(--dm-focus-width,3px) solid var(--dm-focus-color,#00A99D); outline-offset: 4px; }
  .scan-focus { outline: var(--dm-focus-width,3px) solid var(--dm-focus-color,#00A99D) !important; outline-offset: 4px; }
  .choice-card .choice-icon { width: 100%; height: 100%; object-fit: contain; display: block; }
  .choice-card.selected { transform: scale(1.12); box-shadow: 0 10px 28px rgba(244,180,40,0.45); }
  .choice-card.selected::after {
    content: ''; position: absolute; inset: -10px; border-radius: 34px;
    background: radial-gradient(circle, rgba(255,214,102,0.55) 0%, rgba(255,214,102,0) 70%);
    z-index: -1;
  }
  body.no-animation .choice-card { transition: none; }

  /* gaze dwell progress ring (Gaze Standard §11.2) */
  .choice-card.gaze-dwell { position: relative; }
  .choice-card.gaze-dwell::before {
    content: ''; position: absolute; inset: -8px; border-radius: 36px;
    background: conic-gradient(rgba(0,169,157,.85) calc(var(--dwell-ratio,0)*360deg), rgba(0,0,0,0.08) 0deg);
    pointer-events: none; z-index: 5;
  }
  body.gaze-progress-hidden .choice-card.gaze-dwell::before { opacity: 0; }

  /* small sparkle burst on selection (kept modest — one animation only, per
     M12-A design doc §9 "刺激過多にしない") */
  .sparkle { position: absolute; inset: 0; pointer-events: none; z-index: 4; opacity: 0; }
  .choice-card.selected .sparkle { opacity: 1; animation: dotchi-sparkle 700ms ease-out; }
  @keyframes dotchi-sparkle {
    0% { opacity: 0; transform: scale(0.6); }
    40% { opacity: 1; }
    100% { opacity: 0; transform: scale(1.3); }
  }

  /* ===== settings panel (non-modal, inline) — reuses the exact class names
     Reference Set / Group B use so Shared Foundation CSS (.stepper-btn etc.)
     applies without local overrides fighting it ===== */
  .settings-panel {
    position: relative; z-index: 2;
    background: var(--dm-color-surface); border: 2px solid var(--dm-color-border);
    border-radius: var(--dm-radius-md); padding: var(--dm-space-5);
    margin-bottom: var(--dm-space-6);
  }
  .settings-panel[hidden] { display: none; }
  .settings-title { font-size: var(--dm-font-size-subheading); margin: 0 0 var(--dm-space-4); }
  .setting-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: var(--dm-space-3); padding: var(--dm-space-3) 0;
    border-bottom: 1px solid var(--dm-color-border);
  }
  .setting-row:last-of-type { border-bottom: none; }
  .setting-label { font-weight: 700; font-size: var(--dm-font-size-body); }
  .setting-group-title { font-size: 0.8125rem; font-weight: 700; color: var(--dm-color-sub,#5E6D78); margin: var(--dm-space-3,12px) 0 var(--dm-space-1,4px); }
  #gazeSubSettings { transition: opacity var(--dm-duration-fast,150ms) ease; }
  #gazeSubSettings.dimmed { opacity: 0.45; }
  .settings-reset-btn { min-height: 44px; padding: var(--dm-space-2) var(--dm-space-4); border-radius: var(--dm-radius-md); border: 2px solid var(--dm-color-border); background: #fff; font-size: 0.875rem; font-weight: 700; cursor: pointer; margin-top: var(--dm-space-2); font-family: inherit; }
  .count-buttons { display: flex; gap: var(--dm-space-2); flex-wrap: wrap; }
  .count-btn {
    min-width: 44px; min-height: 44px; padding: var(--dm-space-2) var(--dm-space-4);
    border-radius: var(--dm-radius-pill); border: 2px solid var(--dm-color-border);
    background: #fff; color: var(--dm-color-ink); font-weight: 900; cursor: pointer;
    font-size: var(--dm-font-size-caption); font-family: inherit;
  }
  .count-btn.active { background: var(--dm-color-primary); border-color: var(--dm-color-primary); color: #fff; }

  /* ===== Activity Tabs (Phase M12-C' §2/§17) — the single source of truth
     for switching activity, always visible above the stage. Deliberately
     kept LESS visually prominent than the 2 choices (still the primary
     element) and than .activity-label (the current-activity heading);
     see design doc revision for the full priority-order rationale. Reuses
     .activity-btn/aria-pressed from Phase M12-C's Settings-panel selector
     unchanged (same pill look, same selected-state color) — only the
     wrapper/placement is new, so no separate "tab" visual language had to
     be invented. Not role="tablist"/role="tab": this app's Keyboard/Switch
     Scan model is "whatever has DOM focus, Enter/Space activates it" via a
     single global keydown handler (no arrow-key roving-tabindex support
     exists anywhere in this app), so real ARIA tabs semantics would over-
     promise arrow-key navigation that isn't implemented. role="group" +
     aria-pressed matches the exact pattern already proven for
     .count-btn/.activity-btn in this file and needs no new interaction
     code (§23). */
  .activity-tabs {
    position: relative; z-index: 1;
    display: flex; justify-content: center; align-items: stretch;
    gap: var(--dm-space-3); flex-wrap: wrap;
    /* padding-top (not margin-top — adjacent block margins collapse, and
       .app-header's own 20px margin-bottom would have swallowed a smaller
       margin-top here with zero visible effect): clears the fixed lock/
       fullscreen button cluster (top:64px..bottom:108px) — without it the
       header's natural height leaves the tabs starting at y≈106px, 2px
       into that band (measured overlap at 375–390px widths, §3/§28 Common
       Chrome collision). Phase M12-D's Gaze-geometry matrix (100%/150% ×
       normal/wide spacing × all 5 required viewports) additionally found
       a 1px overlap at 150% enlargement between a tab's *enlarged* hit-box
       and the raw lock/fullscreen buttons (12px of raw clearance leaves
       only 1px once the tab's own ~11px gaze padding is added) — bumped
       to 16px raw clearance for real margin at max enlargement.
       margin-bottom: at Gaze target-enlargement max (150%, §12.3) a
       choice-card's padded hit-box extends ~55px beyond its own edges and
       a tab's ~11px beyond its own — so the visible gap between the
       nearest tab and the nearest choice card must clear >=66px or their
       padded hit-boxes intersect (§9/§21, a Stop Condition per §35). Both
       values were sized against the shortest required viewport (375×667)
       and confirmed overlap-free there via automated bounding-rect
       measurement (see Phase M12-C' report). */
    padding-top: var(--dm-space-4);
    margin: 0 0 calc(var(--dm-space-9) + 12px);
  }
  @media (min-width: 701px) {
    .activity-tabs { gap: var(--dm-space-5); }
  }
  .activity-btn {
    min-height: 44px; padding: var(--dm-space-2) var(--dm-space-4);
    border-radius: var(--dm-radius-pill); border: 2px solid var(--dm-color-border);
    background: #fff; color: var(--dm-color-ink); font-weight: 900; cursor: pointer;
    font-size: var(--dm-font-size-caption); font-family: inherit;
  }
  .activity-btn:focus-visible { outline: var(--dm-focus-width,3px) solid var(--dm-focus-color,#00A99D); outline-offset: 2px; }
  .activity-btn[aria-pressed="true"] { background: var(--dm-color-primary); border-color: var(--dm-color-primary); color: #fff; }
  .records-section { padding: var(--dm-space-2) 0 var(--dm-space-3); border-bottom: 1px solid var(--dm-color-border); }
  .record-empty { color: var(--dm-color-sub,#5E6D78); font-size: 0.875rem; margin: 0 0 var(--dm-space-2); }

  .record-list li {

  .record-list li:last-child { border-bottom: none; }
  .record-list .record-time { color: var(--dm-color-sub,#5E6D78); font-variant-numeric: tabular-nums; }
  .record-list .record-choice { font-weight: 700; }
  .record-buttons { display: flex; gap: var(--dm-space-2); flex-wrap: wrap; }
  .record-buttons .settings-reset-btn { margin-top: 0; }

  .record-confirm p { margin: 0 0 var(--dm-space-2); font-weight: 700; font-size: 0.875rem; }

  .toggle { position: relative; width: 50px; height: 27px; flex-shrink: 0; display: inline-block; }
  .toggle input { position: absolute; opacity: 0; width: 44px; height: 44px; top: -8px; left: -3px; margin: 0; cursor: pointer; }
  .toggle-slider { position: absolute; inset: 0; background: #ccc; border-radius: 27px; transition: background var(--dm-duration-base); pointer-events: none; }
  .toggle-slider::before { content: ''; position: absolute; width: 21px; height: 21px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform var(--dm-duration-base); box-shadow: 0 1px 4px rgba(0,0,0,.2); }
  .toggle input:checked + .toggle-slider { background: var(--dm-color-primary); }

  .stepper { display: flex; align-items: center; gap: var(--dm-space-2); }
  .settings-close-btn {
    margin-top: var(--dm-space-4); width: 100%; min-height: 44px;
    border-radius: var(--dm-radius-pill); border: none; background: var(--dm-color-soft);
    color: var(--dm-color-ink); font-weight: 900; cursor: pointer; font-family: inherit;
    font-size: var(--dm-font-size-body);

  .primary-btn { min-height: 48px; padding: var(--dm-space-3) var(--dm-space-6); border-radius: var(--dm-radius-pill); border: none; background: var(--dm-color-primary); color: #fff; font-size: 1.0625rem; font-weight: 700; cursor: pointer; }

<body>
<main id="app" class="app">
  <div class="world-deco" aria-hidden="true">
    <svg class="world-cloud" style="top:8%;left:6%;width:80px;" viewBox="0 0 100 60"><ellipse cx="30" cy="35" rx="28" ry="18" fill="#fff"/><ellipse cx="55" cy="28" rx="24" ry="20" fill="#fff"/><ellipse cx="75" cy="38" rx="20" ry="14" fill="#fff"/></svg>
    <svg class="world-cloud" style="top:14%;right:8%;width:60px;" viewBox="0 0 100 60"><ellipse cx="30" cy="35" rx="28" ry="18" fill="#fff"/><ellipse cx="55" cy="28" rx="24" ry="20" fill="#fff"/></svg>
    <svg class="world-star" style="top:6%;left:40%;width:22px;" viewBox="0 0 24 24"><path d="M12 1l2.9 6.9L22 9l-5.5 5 1.6 7.9L12 18l-6.1 3.9L7.5 14 2 9l7.1-1.1z" fill="#FFE08A"/></svg>
    <svg class="world-star" style="top:20%;right:22%;width:16px;" viewBox="0 0 24 24"><path d="M12 1l2.9 6.9L22 9l-5.5 5 1.6 7.9L12 18l-6.1 3.9L7.5 14 2 9l7.1-1.1z" fill="#FFE08A"/></svg>

  <header class="app-header">
    <div>
      <h1 class="app-title">どっちがいい？</h1>
      <p class="activity-label" id="activityLabel">どっち？</p>
    </div>
    <button id="settingsBtn" class="settings-toggle-btn scannable" data-scan="1" tabindex="0" aria-expanded="false" aria-controls="settingsPanel">⚙️ せってい</button>
  </header>

  <div class="activity-tabs" role="group" aria-label="かつどうを えらぶ">
    <button type="button" class="activity-btn" data-activity="level1" tabindex="0" aria-pressed="true">どっち？</button>
    <button type="button" class="activity-btn" data-activity="level2" tabindex="0" aria-pressed="false">すきなのはどっち？</button>
    <button type="button" class="activity-btn" data-activity="level3" tabindex="0" aria-pressed="false">どっちにする？</button>
  </div>

  <section class="stage" id="stage">
    <button type="button" class="choice-card" id="choiceA" data-choice-id="" tabindex="0" aria-label="">
      <span class="sparkle" aria-hidden="true"></span>
      <img class="choice-icon" id="choiceAIcon" alt="" aria-hidden="true">
    </button>
    <button type="button" class="choice-card" id="choiceB" data-choice-id="" tabindex="0" aria-label="">
      <span class="sparkle" aria-hidden="true"></span>
      <img class="choice-icon" id="choiceBIcon" alt="" aria-hidden="true">
    </button>
  </section>

  <section id="settingsPanel" class="settings-panel" hidden>
    <h2 class="settings-title">せってい</h2>

    <div class="setting-group-title">あそび</div>
    <div class="setting-row">
      <span class="setting-label" id="countLabel">えらぶかいすう</span>
      <div class="count-buttons" role="group" aria-labelledby="countLabel">
        <button class="count-btn" data-count="3" tabindex="0" aria-pressed="false">3かい</button>
        <button class="count-btn" data-count="5" tabindex="0" aria-pressed="true">5かい</button>
        <button class="count-btn" data-count="10" tabindex="0" aria-pressed="false">10かい</button>
      </div>
    </div>

    <div class="setting-group-title">おと・ひょうじ</div>
    <div class="setting-row">
      <span class="setting-label">🔊 おと</span>
      <label class="toggle"><input type="checkbox" id="toggleSound" tabindex="0" checked><span class="toggle-slider"></span></label>
    </div>
    <div class="setting-row">
      <span class="setting-label">🗣️ こえで いう</span>
      <label class="toggle"><input type="checkbox" id="toggleSpeech" tabindex="0" checked><span class="toggle-slider"></span></label>
    </div>
    <div class="setting-row">
      <span class="setting-label">🎬 うごき</span>
      <label class="toggle"><input type="checkbox" id="toggleAnimation" tabindex="0" checked><span class="toggle-slider"></span></label>
    </div>
    <div class="setting-row">
      <span class="setting-label">↔️ ひだり・みぎを いれかえる</span>
      <label class="toggle"><input type="checkbox" id="toggleRandomize" tabindex="0" checked><span class="toggle-slider"></span></label>

    <div class="setting-group-title">しせん</div>

    <div id="gazeSubSettings" class="dimmed">
      <div class="setting-group-title">選択</div>

        <span id="dwellLabel">見つめて決めるまでの時間</span>

      </div>
      <div class="setting-row">
        <span id="entryDelayLabel">見はじめのゆとり</span>

        <label for="toggleGazeProgress">見つめている印</label>

      </div>
      <div class="setting-row">
        <label for="toggleGazeEnlarge">見やすさ・押しやすさの範囲を広げる</label>

      </div>
      <div class="setting-row">
        <label for="toggleGazeSpacing">ボタンの間隔を広げる</label>
        <label class="toggle"><input type="checkbox" id="toggleGazeSpacing" tabindex="0"><span class="toggle-slider"></span></label>
      </div>
      <div class="setting-group-title">動き</div>
      <div class="setting-row">
        <label for="toggleGazeSlowMotion">動きをゆっくりにする</label>
        <label class="toggle"><input type="checkbox" id="toggleGazeSlowMotion" tabindex="0"><span class="toggle-slider"></span></label>
      </div>
      <button type="button" id="gazeSettingsResetBtn" class="settings-reset-btn" tabindex="0">視線入力の設定を既定にもどす</button>
    </div>

    <div class="setting-group-title">スイッチ</div>
    <div class="setting-row">
      <span class="setting-label" id="scanLabel">🔘 スイッチスキャン</span>
      <label class="toggle"><input type="checkbox" id="toggleScan" tabindex="0" aria-labelledby="scanLabel"><span class="toggle-slider"></span></label>
    </div>
    <div class="setting-row">
      <span class="setting-label" id="scanSpeedLabel">スキャンかんかく</span>
      <div class="stepper">
        <button class="stepper-btn" id="scanSpeedMinus" tabindex="0" aria-label="スキャンかんかくを短く">－</button>
        <span id="scanSpeedDisplay" aria-live="off">1.5秒</span>
        <button class="stepper-btn" id="scanSpeedPlus" tabindex="0" aria-label="スキャンかんかくを長く">＋</button>
      </div>
    </div>

    <div class="setting-group-title">きろく</div>
    <div class="records-section">
      <p class="record-empty" id="recordEmptyMsg">まだ きろくが ありません。</p>
      <ul class="record-list" id="recordList" hidden></ul>
      <button type="button" id="recordMoreBtn" class="settings-reset-btn" tabindex="0" hidden>もっと みる</button>
      <div class="record-buttons">
        <button type="button" id="recordCsvBtn" class="settings-reset-btn" tabindex="0">📄 CSVで だしゅつ</button>
        <button type="button" id="recordDeleteBtn" class="settings-reset-btn" tabindex="0">きろくを ぜんぶ けす</button>

      <div class="record-confirm" id="recordConfirm" hidden>

        <button type="button" id="recordCancelBtn" class="settings-reset-btn" tabindex="0">キャンセル</button>
        <button type="button" id="recordConfirmBtn" class="settings-reset-btn" tabindex="0">けす</button>
      </div>
    </div>

    <button id="settingsCloseBtn" class="settings-close-btn" tabindex="0">とじる</button>
  </section>

  <section class="complete-area" id="completeArea" hidden>
    <p class="complete-text" id="completeText">いっぱい えらべたね</p>
    <button type="button" class="primary-btn" id="restartBtn" tabindex="0">もういちど</button>
  </section>
</main>

<script>
/* Donomana Gaze Foundation (Phase M11.4-A/B) — SAFE TO SHARE constants and
   pure helper functions common to Gaze Accessibility Standard v1.0
   implementations (docs/design-system/donomana-gaze-accessibility-standard-v1_0.md
   §33.3/§34/§35). Auto-injected by generate.js — edit generate.js's
   buildGazeSharedFoundationJSHTML() instead of this block directly. */
var DWELL_MIN_MS = 300, DWELL_MAX_MS = 3000, DWELL_STEP_MS = 100;               // §8.2
var ENTRY_DELAY_MIN_MS = 0, ENTRY_DELAY_MAX_MS = 500, ENTRY_DELAY_STEP_MS = 50;  // §9.3
var COOLDOWN_MIN_MS = 300, COOLDOWN_MAX_MS = 3000, COOLDOWN_STEP_MS = 100;       // §10
var TARGET_SCALE_STANDARD = 100, TARGET_SCALE_LARGE = 150;                      // §12.3
var MOTION_SLOW_FACTOR = 1.4;                                                   // §14.2
function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
function effMs(baseMs) { return (motionSpeedLevel === 'slow') ? Math.round(baseMs * MOTION_SLOW_FACTOR) : baseMs; }
function formatSecondsLabel(ms) { return (ms / 1000).toFixed(1) + '秒'; }
function wireStepper(minusId, plusId, valId, get, set, min, max, step, format) {
  var valEl = document.getElementById(valId);
  function refresh() { valEl.textContent = format(get()); }
  document.getElementById(minusId).addEventListener('click', function() { set(clamp(get() - step, min, max)); refresh(); saveSettings(); });
  document.getElementById(plusId).addEventListener('click', function() { set(clamp(get() + step, min, max)); refresh(); saveSettings(); });
  refresh();
  return refresh;
}
// hitTestGazeTargets: SAFE TO SHARE (Phase M11.4-B, §35.2). options:
// { scale: <percent, default 100>, erosion: <px, default 0> }. At the
// default (scale<=100, erosion<=0) this is byte-identical to a plain
// elementFromPoint()-based hit test.
function hitTestGazeTargets(x, y, targets, options) {
  var opts = options || {};
  var scalePct = (typeof opts.scale === 'number') ? opts.scale : 100;
  var erosionPx = (typeof opts.erosion === 'number') ? opts.erosion : 0;
  if (scalePct <= 100 && erosionPx <= 0) {
    var el = document.elementFromPoint(x, y);
    if (!el) return null;
    for (var i = 0; i < targets.length; i++) { if (targets[i] === el || targets[i].contains(el)) return targets[i]; }
    return null;
  }
  var scale = scalePct / 100;
  var best = null, bestArea = Infinity;
  for (var j = 0; j < targets.length; j++) {
    var r = targets[j].getBoundingClientRect();
    var padX = Math.max(0, (r.width * (scale - 1) / 2) - erosionPx);
    var padY = Math.max(0, (r.height * (scale - 1) / 2) - erosionPx);
    if (x >= r.left - padX && x <= r.right + padX && y >= r.top - padY && y <= r.bottom + padY) {
      var area = r.width * r.height;
      if (area < bestArea) { bestArea = area; best = targets[j]; }
    }
  }
  return best;
}
</script>

<script>
'use strict';

/* =====================================================================
   Phase M12-C Local Prototype — 3 activities: どっち？(Level1)／
   すきなのはどっち？(Level2, 食べ物・動物, same pairs as Level1)／
   どっちにする？(Level3, 楽器カテゴリー — drum/bell use PROTOTYPE
   PLACEHOLDER visuals, no approved instrument asset yet; see CHOICES
   below and the M12-C final report's "User Asset Review Required").
   Not registered in apps-data.json — no Production publication this Phase.
===================================================================== */

var STORAGE_SETTINGS_KEY = 'dotchiga_ii_settings';
var STORAGE_LOG_KEY = 'dotchiga_ii_log';

/* ---- data-driven choice + activity definitions (Phase M12-C §22/§23) ----
   Each choice belongs to a category; same-trial pairs are always built
   within one category (§23 — no food-vs-animal pairs). `asset` is a
   User-approved illustration. Phase M12-C'' replaced drum/bell's Phase
   M12-C PROTOTYPE PLACEHOLDER (prototypePlaceholder:true/placeholderGlyph,
   now removed along with the .choice-placeholder markup/CSS/renderer they
   drove) with User-approved assets/dotchiga-ii/drum.png and bell.png —
   see design doc §36 for the transparency/visual-weight review. `sound` is
   a soft Web Audio tone (NOT a sampled instrument recording, §18) used
   only by Level3's result handler. */
var CHOICES = {
  apple:  { category: 'food',       label: 'りんご', asset: 'assets/dotchiga-ii/apple.png' },
  banana: { category: 'food',       label: 'バナナ', asset: 'assets/dotchiga-ii/banana.png' },
  dog:    { category: 'animal',     label: 'いぬ',   asset: 'assets/dotchiga-ii/dog.png' },
  cat:    { category: 'animal',     label: 'ねこ',   asset: 'assets/dotchiga-ii/cat.png' },
  drum:   { category: 'instrument', label: 'たいこ', asset: 'assets/dotchiga-ii/drum.png',
            sound: { freq: 130, type: 'triangle', durationMs: 220 } },
  bell:   { category: 'instrument', label: 'ベル',   asset: 'assets/dotchiga-ii/bell.png',
            sound: { freq: 1180, type: 'sine', durationMs: 260 } }
};

function pairsForCategories(categories) {
  var pairs = [];
  categories.forEach(function(cat) {
    var ids = Object.keys(CHOICES).filter(function(id) { return CHOICES[id].category === cat; });
    for (var i = 0; i < ids.length; i++) {
      for (var j = i + 1; j < ids.length; j++) pairs.push([ids[i], ids[j]]);
    }
  });
  return pairs;
}

/* Level1/Level2 intentionally share the same category pool (§11) — the
   difference between them is entirely in framing/feedback language
   (handleLevel1Result / handleLevel2Result below), never in which pairs
   appear. */
var ACTIVITIES = {
  level1: { id: 'level1', label: 'どっち？',           categories: ['food', 'animal'] },
  level2: { id: 'level2', label: 'すきなのはどっち？', categories: ['food', 'animal'] },
  level3: { id: 'level3', label: 'どっちにする？',     categories: ['instrument'] }
};
var ACTIVITY_ORDER = ['level1', 'level2', 'level3'];
ACTIVITY_ORDER.forEach(function(id) { ACTIVITIES[id].pairs = pairsForCategories(ACTIVITIES[id].categories); });

/* ---- state ---- */
var soundEnabled = true;
var speechEnabled = true;
var animationEnabled = true;
var randomizeEnabled = true;
var trialCount = 5;
var gazeEnabled = false;
var scanMode = false;
var scanSpeed = 1500;

var dwellDurationMs = 900; // §8, adjustable 300–3000ms, Standard default
var entryDelayMs = 0;
var cooldownMs = 900;
var dwellProgressVisible = true;
var gazeTargetScalePct = TARGET_SCALE_STANDARD;
var targetSpacingWide = false;
var motionSpeedLevel = 'normal';
var SPACING_EROSION_PX = 8;

var currentActivity = 'level1';
var currentPairs = ACTIVITIES[currentActivity].pairs;
var trialIndex = 0;
var currentPair = null; // [choiceIdLeft, choiceIdRight] in current visual L/R order
var isShowingResult = false;
var currentInputMethod = null;
var pendingTrialTimeout = null; // must be cleared on activity switch (§30/§36)
var scanTargets = [];
var scanFocusIndex = -1;
var scanInterval = null;

/* ---- gaze tick state ---- */
var dwellTarget = null;
var dwellStart = 0;
var dwellEntryAt = 0;
var lastGazeDwellActualMs = null; // §37 record field, gaze-only
var gazeAwaitingLeaveEl = null;
var gazeAwaitingLeaveUntil = 0;
var lastGazeX = null, lastGazeY = null;
var gazeRafId = null;

/* ---- DOM ---- */
var stage = document.getElementById('stage');
var choiceA = document.getElementById('choiceA');
var choiceB = document.getElementById('choiceB');
var choiceAIcon = document.getElementById('choiceAIcon');
var choiceBIcon = document.getElementById('choiceBIcon');
var activityLabelEl = document.getElementById('activityLabel');
var activityBtns = Array.from(document.querySelectorAll('.activity-btn'));
var settingsBtn = document.getElementById('settingsBtn');
var settingsPanel = document.getElementById('settingsPanel');
var settingsCloseBtn = document.getElementById('settingsCloseBtn');
var settingsOpen = false;
var completeArea = document.getElementById('completeArea');
var restartBtn = document.getElementById('restartBtn');
var toggleSound = document.getElementById('toggleSound');
var toggleSpeech = document.getElementById('toggleSpeech');
var toggleAnimation = document.getElementById('toggleAnimation');
var toggleRandomize = document.getElementById('toggleRandomize');
var countBtns = Array.from(document.querySelectorAll('.count-btn'));
var toggleGaze = document.getElementById('toggleGaze');
var toggleScan = document.getElementById('toggleScan');
var scanSpeedMinus = document.getElementById('scanSpeedMinus');
var scanSpeedPlus = document.getElementById('scanSpeedPlus');
var scanSpeedDisplay = document.getElementById('scanSpeedDisplay');
var toggleGazeProgress = document.getElementById('toggleGazeProgress');
var toggleGazeEnlarge = document.getElementById('toggleGazeEnlarge');
var toggleGazeSpacing = document.getElementById('toggleGazeSpacing');
var toggleGazeSlowMotion = document.getElementById('toggleGazeSlowMotion');
var gazeSettingsResetBtn = document.getElementById('gazeSettingsResetBtn');

/* =====================================================================
   persistence
===================================================================== */
function saveSettings() {
  var s = {
    soundEnabled: soundEnabled, speechEnabled: speechEnabled, animationEnabled: animationEnabled,
    randomizeEnabled: randomizeEnabled, trialCount: trialCount,
    gazeEnabled: gazeEnabled, scanSpeed: scanSpeed,
    dwellDurationMs: dwellDurationMs, entryDelayMs: entryDelayMs, cooldownMs: cooldownMs,
    dwellProgressVisible: dwellProgressVisible, gazeTargetScalePct: gazeTargetScalePct,
    targetSpacingWide: targetSpacingWide, motionSpeedLevel: motionSpeedLevel,
    currentActivity: currentActivity
  };
  try { localStorage.setItem(STORAGE_SETTINGS_KEY, JSON.stringify(s)); } catch (e) {}
}
function loadSettings() {
  var raw = null;
  try { raw = localStorage.getItem(STORAGE_SETTINGS_KEY); } catch (e) {}
  var s = {};
  if (raw) { try { s = JSON.parse(raw) || {}; } catch (e) { s = {}; } }
  soundEnabled = (typeof s.soundEnabled === 'boolean') ? s.soundEnabled : true;
  speechEnabled = (typeof s.speechEnabled === 'boolean') ? s.speechEnabled : true;
  animationEnabled = (typeof s.animationEnabled === 'boolean') ? s.animationEnabled : true;
  randomizeEnabled = (typeof s.randomizeEnabled === 'boolean') ? s.randomizeEnabled : true;
  trialCount = ([3, 5, 10].indexOf(s.trialCount) !== -1) ? s.trialCount : 5;
  gazeEnabled = (typeof s.gazeEnabled === 'boolean') ? s.gazeEnabled : false;
  scanSpeed = (typeof s.scanSpeed === 'number' && s.scanSpeed >= 600 && s.scanSpeed <= 3000) ? s.scanSpeed : 1500;
  dwellDurationMs = (typeof s.dwellDurationMs === 'number') ? clamp(s.dwellDurationMs, DWELL_MIN_MS, DWELL_MAX_MS) : 900;
  entryDelayMs = (typeof s.entryDelayMs === 'number') ? clamp(s.entryDelayMs, ENTRY_DELAY_MIN_MS, ENTRY_DELAY_MAX_MS) : 0;
  cooldownMs = (typeof s.cooldownMs === 'number') ? clamp(s.cooldownMs, COOLDOWN_MIN_MS, COOLDOWN_MAX_MS) : 900;
  dwellProgressVisible = (typeof s.dwellProgressVisible === 'boolean') ? s.dwellProgressVisible : true;
  gazeTargetScalePct = (s.gazeTargetScalePct === TARGET_SCALE_LARGE) ? TARGET_SCALE_LARGE : TARGET_SCALE_STANDARD;
  targetSpacingWide = (typeof s.targetSpacingWide === 'boolean') ? s.targetSpacingWide : false;
  motionSpeedLevel = (s.motionSpeedLevel === 'slow') ? 'slow' : 'normal';
  currentActivity = (ACTIVITIES.hasOwnProperty(s.currentActivity)) ? s.currentActivity : 'level1';
  currentPairs = ACTIVITIES[currentActivity].pairs;
}

/* ---- record (M12-A design doc §20 / M12-B §28 / M12-C §37: no correct/result column) ---- */
function loadLog() {
  var log = [];
  try {
    var raw = localStorage.getItem(STORAGE_LOG_KEY);
    if (raw) log = JSON.parse(raw) || [];
    if (!Array.isArray(log)) log = [];
  } catch (e) { log = []; }
  return log;
}
function addLog(entry) {
  var log = loadLog();
  log.push(entry);
  if (log.length > 200) log = log.slice(log.length - 200);
  try { localStorage.setItem(STORAGE_LOG_KEY, JSON.stringify(log)); } catch (e) {}
}

/* =====================================================================
   sound / speech
===================================================================== */
var audioCtx = null;
function beep(freq, durationMs) {
  if (!soundEnabled) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sine'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durationMs / 1000);
    osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + durationMs / 1000);
  } catch (e) {}
}
/* Level3 result sound (§18/§19): a soft Web Audio tone standing in for the
   instrument, NOT a claim of realism. Slightly softer gain than beep()
   since Level3's sound IS the result, not just reinforcement. */
function playTone(freq, type, durationMs) {
  if (!soundEnabled) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = type || 'sine'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durationMs / 1000);
    osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + durationMs / 1000);
  } catch (e) {}
}
function speak(text) {
  if (!speechEnabled) return;
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP'; u.rate = 0.95; u.pitch = 1.05;
  window.speechSynthesis.speak(u);
}

/* =====================================================================
   trial flow
===================================================================== */
function startTrial() {
  isShowingResult = false;
  choiceA.classList.remove('selected');
  choiceB.classList.remove('selected');
  var pairSource = currentPairs[trialIndex % currentPairs.length];
  var order = (randomizeEnabled && Math.random() < 0.5) ? [pairSource[1], pairSource[0]] : [pairSource[0], pairSource[1]];
  currentPair = order;
  choiceA.dataset.choiceId = order[0];
  choiceB.dataset.choiceId = order[1];
  choiceAIcon.src = CHOICES[order[0]].asset;
  choiceBIcon.src = CHOICES[order[1]].asset;
  choiceA.setAttribute('aria-label', CHOICES[order[0]].label);
  choiceB.setAttribute('aria-label', CHOICES[order[1]].label);
  resetDwellState();
  if (scanMode) refreshSwitchScanItems();
}

function getChoiceEl(choiceId) {
  if (choiceA.dataset.choiceId === choiceId) return choiceA;
  if (choiceB.dataset.choiceId === choiceId) return choiceB;
  return null;
}

/* Level-specific result handlers (§27) — activation itself stays common
   (single activateChoice() below, §26); only feedback language/sound
   differs per activity. None of these decide correct/incorrect (§4/§40 —
   there is no such concept here). */
function handleLevel1Result(choiceId, def) {
  beep(660, 180);
  speak(def.label);
}
function handleLevel2Result(choiceId, def) {
  // §13: acknowledge the choice, never assert a preference ("好きなんだね").
  beep(660, 180);
  speak(def.label + ' を えらんだね');
}
function handleLevel3Result(choiceId, def) {
  // §14/§18: the sound IS the result, not mere reinforcement — and it may
  // overlap the selection beep only in spirit, never in timing, so we skip
  // beep() here and let the instrument tone stand alone before speech (§21).
  var s = def.sound;
  if (s) playTone(s.freq, s.type, s.durationMs);
  setTimeout(function() { speak(def.label); }, 220);
}
var RESULT_HANDLERS = { level1: handleLevel1Result, level2: handleLevel2Result, level3: handleLevel3Result };

/* Semantic Activation Architecture (Program design doc §22.1 Foundation A):
   every input method funnels into this single function. */
function activateChoice(choiceId, inputMethod) {
  if (isShowingResult || settingsOpen || !completeArea.hidden) return;
  var el = getChoiceEl(choiceId);
  if (!el) return;
  isShowingResult = true;
  currentInputMethod = inputMethod;
  var dwellForLog = (inputMethod === 'gaze') ? lastGazeDwellActualMs : null;
  resetDwellState();
  // Restart (not stop) so the tabs-only scan set from buildScanItems()'s
  // isShowingResult branch takes over during feedback — keeps Activity
  // Tabs Switch-reachable through the whole ~1.6s window (§16), while the
  // 2 choices themselves are still excluded via activateChoice()'s own
  // isShowingResult guard above, so no duplicate selection is possible.
  if (scanMode) startSwitchScan();

  el.classList.add('selected');
  var def = CHOICES[choiceId];
  (RESULT_HANDLERS[currentActivity] || handleLevel1Result)(choiceId, def);
  donomanaAnnounce(def.label + ' を えらんだよ');

  addLog({
    time: new Date().toISOString(),
    activity: currentActivity,
    category: def.category,
    pair: currentPair.slice().sort().join('_'),
    selectedChoice: choiceId,
    inputMethod: inputMethod,
    trialIndex: trialIndex + 1,
    trialTotal: trialCount,
    dwellDuration: dwellForLog
  });

  pendingTrialTimeout = setTimeout(function() {
    pendingTrialTimeout = null;
    trialIndex++;
    if (trialIndex >= trialCount) {
      showComplete();
    } else {
      startTrial();
      if (scanMode) startSwitchScan();
    }
  }, effMs(1600));
}

function showComplete() {
  stage.hidden = true;
  completeArea.hidden = false;
  if (scanMode) refreshSwitchScanItems();
  donomanaAnnounce('いっぱい えらべたね');
}
function restart() {
  trialIndex = 0;
  stage.hidden = false;
  completeArea.hidden = true;
  startTrial();
  if (scanMode) startSwitchScan();
}
restartBtn.addEventListener('click', restart);

/* =====================================================================
   Activity switching (§8/§30/§36) — trialIndex/pair/result/Gaze/Switch
   state must never bleed from one activity into the next.
===================================================================== */
function clearGazeCandidateState() {
  resetDwellState();
  gazeAwaitingLeaveEl = null;
  gazeAwaitingLeaveUntil = 0;
}
function updateActivityLabel() {
  activityLabelEl.textContent = ACTIVITIES[currentActivity].label;
  activityBtns.forEach(function(b) {
    var on = b.dataset.activity === currentActivity;
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
}
function switchActivity(newId) {
  if (!ACTIVITIES[newId] || newId === currentActivity) return;
  // Settings keeps exclusive interaction focus while open — same rule
  // activateChoice() already applies to the 2 choices (§16 scope is
  // isShowingResult, not settingsOpen; this mirrors the pre-existing
  // choice-area convention for consistency across all 3 activatable
  // groups: choices / tabs / settings).
  if (settingsOpen) return;
  if (pendingTrialTimeout) { clearTimeout(pendingTrialTimeout); pendingTrialTimeout = null; }
  if (scanMode) stopSwitchScan();
  currentActivity = newId;
  currentPairs = ACTIVITIES[newId].pairs;
  trialIndex = 0;
  isShowingResult = false;
  currentPair = null;
  stage.hidden = false;
  completeArea.hidden = true;
  choiceA.classList.remove('selected');
  choiceB.classList.remove('selected');
  clearGazeCandidateState();
  updateActivityLabel();
  startTrial();
  if (scanMode) startSwitchScan();
  saveSettings();
  donomanaAnnounce(ACTIVITIES[newId].label + ' に かわりました');
}
activityBtns.forEach(function(b) {
  b.addEventListener('click', function() { switchActivity(b.dataset.activity); });
});

/* =====================================================================
   Touch / click (native button click covers Touch). Click handlers trust
   currentInputMethod when the keyboard/switch adapter or gazeTick already
   tagged it right before calling .click() (Reference Set pattern — see
   kurabeyou-app's onTargetActivate(t.id, currentInputMethod || 'click'));
   otherwise it's a genuine fresh pointer event and falls back to 'touch'.
===================================================================== */
choiceA.addEventListener('click', function() { activateChoice(choiceA.dataset.choiceId, currentInputMethod || 'touch'); });
choiceB.addEventListener('click', function() { activateChoice(choiceB.dataset.choiceId, currentInputMethod || 'touch'); });
document.addEventListener('pointerdown', function(e) {
  if (e.pointerType === 'touch' || (e.pointerType === 'mouse' && !gazeEnabled)) currentInputMethod = 'touch';
}, true);

/* =====================================================================
   Keyboard + Switch Scan (helper6 pattern, kurabeyou/katachi-awase-proven):
   a single keydown handler drives BOTH — Switch Scan cycling moves real DOM
   focus (see highlightScanItem() below), so "whatever has focus, Enter/
   Space activates it" is correct whether focus got there via Tab (a real
   keyboard) or via scan auto-cycling (an external switch, which is itself
   a keyboard-equivalent device). This is why the Program convention tags
   both as 'keyboard' rather than inventing a separate 'switch' value —
   and, critically, having exactly one listener (not one per input method)
   is what prevents the same physical keypress from reaching two competing
   activation paths (M12-B brief §9 Duplicate Prevention).
===================================================================== */
function activateCurrentScanItem() {
  var el = document.activeElement;
  if (el && el !== document.body) el.click();
}
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') return;
  if (settingsOpen) return;
  var tag = document.activeElement ? document.activeElement.tagName : '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if ((e.key === ' ' || e.key === 'Enter') && document.activeElement && document.activeElement !== document.body) {
    var el = document.activeElement;
    if (el.tagName === 'BUTTON' || el.hasAttribute('tabindex')) {
      e.preventDefault();
      currentInputMethod = 'keyboard';
      activateCurrentScanItem();
    }
  }
});

/* =====================================================================
   Switch Scan — teaching targets only, Common Chrome kept separate
   (M12-A design doc §17/§22.1 Foundation A).
===================================================================== */
function isVisibleEnabled(el) {
  if (!el) return false;
  if (el.hidden || el.closest('[hidden]')) return false;
  var cs = getComputedStyle(el);
  if (cs.display === 'none' || cs.visibility === 'hidden') return false;
  if (el.disabled) return false;
  return el.getClientRects().length > 0;
}
function buildScanItems() {
  // Activity Tabs Standard §11/§12: recommended scan order is the 3 tabs
  // first, then the trial's own targets — and §16 requires tabs to stay
  // Switch-operable even mid-feedback (isShowingResult), unlike the
  // choices, which must NOT be re-selectable during that window.
  if (settingsOpen) return [];
  if (isShowingResult) return activityBtns.filter(isVisibleEnabled);
  if (!completeArea.hidden) return activityBtns.concat([restartBtn]).filter(isVisibleEnabled);
  return activityBtns.concat([choiceA, choiceB]).filter(isVisibleEnabled);
}
function clearScanHighlight() {
  document.querySelectorAll('.scan-focus').forEach(function(el) { el.classList.remove('scan-focus'); });
}
function refreshSwitchScanItems() {
  scanFocusIndex = -1;
  scanTargets = buildScanItems();
  clearScanHighlight();
  if (scanTargets.length) {
    scanFocusIndex = 0;
    scanTargets[0].focus({ preventScroll: true });
    scanTargets[0].classList.add('scan-focus');
  }
}
function startSwitchScan() {
  stopSwitchScan();
  refreshSwitchScanItems();
  scanInterval = setInterval(function() {
    var targets = buildScanItems();
    if (!targets.length) return;
    scanTargets = targets;
    if (scanFocusIndex >= targets.length) scanFocusIndex = 0;
    scanFocusIndex = (scanFocusIndex + 1) % targets.length;
    clearScanHighlight();
    targets[scanFocusIndex].focus({ preventScroll: true });
    targets[scanFocusIndex].classList.add('scan-focus');
  }, scanSpeed);
}
function stopSwitchScan() {
  if (scanInterval) { clearInterval(scanInterval); scanInterval = null; }
  clearScanHighlight();
}
function setScanMode(on) {
  scanMode = on;
  if (on) { startSwitchScan(); } else { stopSwitchScan(); }
}

/* =====================================================================
   Gaze / dwell (Gaze Accessibility Standard v1.0)
===================================================================== */
function getGazeTargets() {
  // Same tabs-always-reachable rule as buildScanItems() above (§9/§16).
  if (settingsOpen) return [];
  if (isShowingResult) return activityBtns.slice();
  if (!completeArea.hidden) return activityBtns.slice();
  return activityBtns.concat([choiceA, choiceB]);
}
function resetDwellState() {
  if (dwellTarget) { dwellTarget.classList.remove('gaze-dwell'); dwellTarget.style.removeProperty('--dwell-ratio'); }
  dwellTarget = null;
  dwellStart = 0;
  dwellEntryAt = 0;
}
function onGazeMove(e) { lastGazeX = e.clientX; lastGazeY = e.clientY; }
function gazeTick() {
  if (gazeEnabled && lastGazeX !== null) {
    var targets = getGazeTargets();
    var hit = hitTestGazeTargets(lastGazeX, lastGazeY, targets, { scale: gazeTargetScalePct, erosion: targetSpacingWide ? SPACING_EROSION_PX : 0 });
    var now = performance.now();

    if (gazeAwaitingLeaveEl && hit !== gazeAwaitingLeaveEl && now >= gazeAwaitingLeaveUntil) {
      gazeAwaitingLeaveEl = null;
    }

    if (hit !== dwellTarget) {
      resetDwellState();
      if (hit && hit !== gazeAwaitingLeaveEl) {
        dwellTarget = hit;
        dwellEntryAt = now;
      }
    } else if (dwellTarget && hit !== gazeAwaitingLeaveEl) {
      if (dwellStart === 0) {
        if (now - dwellEntryAt >= entryDelayMs) {
          dwellStart = now;
          dwellTarget.classList.add('gaze-dwell');
        }
      } else {
        var ratio = Math.min(1, (now - dwellStart) / dwellDurationMs);
        if (dwellProgressVisible) dwellTarget.style.setProperty('--dwell-ratio', String(ratio));
        if (ratio >= 1) {
          var target = dwellTarget;
          lastGazeDwellActualMs = Math.round(now - dwellStart); // §37 record field
          resetDwellState();
          gazeAwaitingLeaveEl = target;
          gazeAwaitingLeaveUntil = now + cooldownMs;
          currentInputMethod = 'gaze';
          target.click();
        }
      }
    }
  }
  gazeRafId = requestAnimationFrame(gazeTick);
}
function enableGaze() {
  if (gazeRafId) return;
  document.addEventListener('mousemove', onGazeMove);
  gazeRafId = requestAnimationFrame(gazeTick);
}
function disableGaze() {
  document.removeEventListener('mousemove', onGazeMove);
  if (gazeRafId) { cancelAnimationFrame(gazeRafId); gazeRafId = null; }
  resetDwellState();
  gazeAwaitingLeaveEl = null;
  gazeAwaitingLeaveUntil = 0;
  lastGazeX = null; lastGazeY = null;
}

/* Decision A (Gaze Standard §0): Gaze and Switch Scan are NOT mutually
   exclusive; both may be ON simultaneously, and activateChoice()'s own
   isShowingResult guard is what actually prevents duplicate activation,
   regardless of which input methods are enabled. */
function setGazeEnabled(on) {
  gazeEnabled = on;
  if (on) { enableGaze(); } else { disableGaze(); }
  var sub = document.getElementById('gazeSubSettings');
  if (sub) sub.classList.toggle('dimmed', !on);
  saveSettings();
}

/* =====================================================================
   settings panel open/close
===================================================================== */
function openSettings() {
  settingsOpen = true;
  settingsPanel.hidden = false;
  settingsBtn.setAttribute('aria-expanded', 'true');
  resetDwellState();
  recordVisibleCount = RECORD_PAGE_SIZE;
  resetRecordConfirmUI();
  renderRecordList();
  if (scanMode) refreshSwitchScanItems();
}
function closeSettings() {
  settingsOpen = false;
  settingsPanel.hidden = true;
  settingsBtn.setAttribute('aria-expanded', 'false');
  if (scanMode) refreshSwitchScanItems();
  (document.getElementById('donomanaA11yBtn') || settingsBtn).focus();
}
settingsBtn.addEventListener('click', function() { settingsPanel.hidden ? openSettings() : closeSettings(); });
settingsCloseBtn.addEventListener('click', closeSettings);
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && settingsOpen) closeSettings();
});

/* =====================================================================
   settings controls
===================================================================== */
toggleSound.addEventListener('change', function() { soundEnabled = toggleSound.checked; saveSettings(); });
toggleSpeech.addEventListener('change', function() { speechEnabled = toggleSpeech.checked; saveSettings(); });
toggleAnimation.addEventListener('change', function() {
  animationEnabled = toggleAnimation.checked;
  document.body.classList.toggle('no-animation', !animationEnabled);
  saveSettings();
});
toggleRandomize.addEventListener('change', function() { randomizeEnabled = toggleRandomize.checked; saveSettings(); });
countBtns.forEach(function(b) {
  b.addEventListener('click', function() {
    trialCount = Number(b.dataset.count);
    countBtns.forEach(function(x) {
      var on = x === b;
      x.classList.toggle('active', on);
      x.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    saveSettings();
  });
});

toggleGaze.addEventListener('change', function() { setGazeEnabled(toggleGaze.checked); });
toggleScan.addEventListener('change', function() { setScanMode(toggleScan.checked); saveSettings(); });
scanSpeedMinus.addEventListener('click', function() {
  scanSpeed = Math.max(600, scanSpeed - 200);
  scanSpeedDisplay.textContent = (scanSpeed / 1000).toFixed(1) + '秒';
  saveSettings();
  if (scanMode) startSwitchScan();
});
scanSpeedPlus.addEventListener('click', function() {
  scanSpeed = Math.min(3000, scanSpeed + 200);
  scanSpeedDisplay.textContent = (scanSpeed / 1000).toFixed(1) + '秒';
  saveSettings();
  if (scanMode) startSwitchScan();
});

var refreshDwellVal = wireStepper('dwellMinusBtn', 'dwellPlusBtn', 'dwellVal',
  function() { return dwellDurationMs; }, function(v) { dwellDurationMs = v; },
  DWELL_MIN_MS, DWELL_MAX_MS, DWELL_STEP_MS, formatSecondsLabel);
var refreshEntryDelayVal = wireStepper('entryDelayMinusBtn', 'entryDelayPlusBtn', 'entryDelayVal',
  function() { return entryDelayMs; }, function(v) { entryDelayMs = v; },
  ENTRY_DELAY_MIN_MS, ENTRY_DELAY_MAX_MS, ENTRY_DELAY_STEP_MS,
  function(ms) { return ms === 0 ? 'なし' : (ms / 1000).toFixed(2).replace(/0$/, '') + '秒'; });
var refreshCooldownVal = wireStepper('cooldownMinusBtn', 'cooldownPlusBtn', 'cooldownVal',
  function() { return cooldownMs; }, function(v) { cooldownMs = v; },
  COOLDOWN_MIN_MS, COOLDOWN_MAX_MS, COOLDOWN_STEP_MS, formatSecondsLabel);

function applyDwellProgressVisible(on) {
  dwellProgressVisible = on;
  document.body.classList.toggle('gaze-progress-hidden', !on);
}
toggleGazeProgress.addEventListener('change', function() { applyDwellProgressVisible(toggleGazeProgress.checked); saveSettings(); });

function applyTargetScale(large) { gazeTargetScalePct = large ? TARGET_SCALE_LARGE : TARGET_SCALE_STANDARD; }
toggleGazeEnlarge.addEventListener('change', function() { applyTargetScale(toggleGazeEnlarge.checked); saveSettings(); });

function applyTargetSpacing(wide) { targetSpacingWide = wide; }
toggleGazeSpacing.addEventListener('change', function() { applyTargetSpacing(toggleGazeSpacing.checked); saveSettings(); });

function applyMotionSpeed(level) { motionSpeedLevel = level; }
toggleGazeSlowMotion.addEventListener('change', function() { applyMotionSpeed(toggleGazeSlowMotion.checked ? 'slow' : 'normal'); saveSettings(); });

function resetGazeSettingsToDefault() {
  setGazeEnabled(false); toggleGaze.checked = false;
  dwellDurationMs = 900; refreshDwellVal();
  entryDelayMs = 0; refreshEntryDelayVal();
  cooldownMs = 900; refreshCooldownVal();
  applyDwellProgressVisible(true); toggleGazeProgress.checked = true;
  applyTargetScale(false); toggleGazeEnlarge.checked = false;
  applyTargetSpacing(false); toggleGazeSpacing.checked = false;
  applyMotionSpeed('normal'); toggleGazeSlowMotion.checked = false;
  saveSettings();
  donomanaAnnounce('視線入力の設定を既定にもどしました');
}
gazeSettingsResetBtn.addEventListener('click', resetGazeSettingsToDefault);

/* =====================================================================
   record UI (§37/§38) — embedded in the settings panel, mirroring the
   existing donomana in-panel records-section pattern (kurabeyou-app.html):
   list newest-first + CSV export + delete-all behind a two-step inline
   confirm (no native confirm()/alert()). Only shows what §39 allows —
   when/what/which activity/which input method — never a preference score
   or diagnostic label. CSV is always built from the canonical stored log,
   never from the rendered DOM (New App Development Standard §26).
===================================================================== */
var recordEmptyMsg = document.getElementById('recordEmptyMsg');
var recordListEl = document.getElementById('recordList');
var recordMoreBtn = document.getElementById('recordMoreBtn');
var recordCsvBtn = document.getElementById('recordCsvBtn');
var recordDeleteBtn = document.getElementById('recordDeleteBtn');
var recordConfirmEl = document.getElementById('recordConfirm');
var recordCancelBtn = document.getElementById('recordCancelBtn');
var recordConfirmBtn = document.getElementById('recordConfirmBtn');
var RECORD_PAGE_SIZE = 20;
var recordVisibleCount = RECORD_PAGE_SIZE;
var INPUT_METHOD_LABELS = { touch: 'タッチ', keyboard: 'キーボード', gaze: 'しせん' };

function formatRecordTime(iso) {
  var d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  var pad = function(n) { return String(n).length < 2 ? '0' + n : String(n); };
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function renderRecordList() {
  var log = loadLog();
  var reversed = log.slice().reverse(); // newest first
  if (!log.length) {
    recordEmptyMsg.hidden = false;
    recordListEl.hidden = true;
    recordMoreBtn.hidden = true;
    return;
  }
  recordEmptyMsg.hidden = true;
  recordListEl.hidden = false;
  recordListEl.innerHTML = '';
  reversed.slice(0, recordVisibleCount).forEach(function(entry) {
    var li = document.createElement('li');
    var activityLabel = (ACTIVITIES[entry.activity] || {}).label || entry.activity || '';
    var choiceLabel = (CHOICES[entry.selectedChoice] || {}).label || entry.selectedChoice || '';
    var inputLabel = INPUT_METHOD_LABELS[entry.inputMethod] || entry.inputMethod || '';
    li.innerHTML =
      '<span class="record-time">' + formatRecordTime(entry.time) + '</span>' +
      '<span>' + activityLabel + '</span>' +
      '<span class="record-choice">' + choiceLabel + '</span>' +
      '<span>' + inputLabel + '</span>';
    recordListEl.appendChild(li);
  });
  recordMoreBtn.hidden = reversed.length <= recordVisibleCount;
}
recordMoreBtn.addEventListener('click', function() { recordVisibleCount += RECORD_PAGE_SIZE; renderRecordList(); });

var RECORD_CSV_COLUMNS = ['time', 'activity', 'category', 'pair', 'selectedChoice', 'inputMethod', 'trialIndex', 'trialTotal', 'dwellDuration'];
function buildRecordsCsvRows(log) {
  var rows = [RECORD_CSV_COLUMNS.join(',')];
  log.forEach(function(entry) {
    var cells = RECORD_CSV_COLUMNS.map(function(key) {
      var v = entry[key];
      if (v === undefined || v === null) v = '';
      v = String(v).replace(/"/g, '""');
      return /[",\n]/.test(v) ? '"' + v + '"' : v;
    });
    rows.push(cells.join(','));
  });
  return rows;
}
function downloadRecordsCsv() {
  var log = loadLog();
  if (!log.length) { donomanaAnnounce('きろくが ありません'); return; }
  var UTF8_BOM = '﻿';
  var csv = UTF8_BOM + buildRecordsCsvRows(log).join('\r\n');
  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'dotchiga-ii-kiroku-' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
  donomanaAnnounce('CSVを だしゅつしました');
}
recordCsvBtn.addEventListener('click', downloadRecordsCsv);

function resetRecordConfirmUI() {
  recordConfirmEl.hidden = true;
  recordDeleteBtn.hidden = false;
}
recordDeleteBtn.addEventListener('click', function() {
  recordDeleteBtn.hidden = true;
  recordConfirmEl.hidden = false;
  recordConfirmBtn.focus();
});
recordCancelBtn.addEventListener('click', function() { resetRecordConfirmUI(); recordDeleteBtn.focus(); });
recordConfirmBtn.addEventListener('click', function() {
  localStorage.removeItem(STORAGE_LOG_KEY);
  recordVisibleCount = RECORD_PAGE_SIZE;
  renderRecordList();
  resetRecordConfirmUI();
  donomanaAnnounce('きろくを けしました');
});

/* =====================================================================
   init
===================================================================== */
function init() {
  loadSettings();
  toggleSound.checked = soundEnabled;
  toggleSpeech.checked = speechEnabled;
  toggleAnimation.checked = animationEnabled;
  document.body.classList.toggle('no-animation', !animationEnabled);
  toggleRandomize.checked = randomizeEnabled;
  countBtns.forEach(function(b) {
    var on = Number(b.dataset.count) === trialCount;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  toggleScan.checked = false; // scanMode itself always starts OFF regardless of stored gazeEnabled
  scanSpeedDisplay.textContent = (scanSpeed / 1000).toFixed(1) + '秒';
  updateActivityLabel();

  refreshDwellVal(); refreshEntryDelayVal(); refreshCooldownVal();
  toggleGazeProgress.checked = dwellProgressVisible; applyDwellProgressVisible(dwellProgressVisible);
  toggleGazeEnlarge.checked = (gazeTargetScalePct === TARGET_SCALE_LARGE); applyTargetScale(gazeTargetScalePct === TARGET_SCALE_LARGE);
  toggleGazeSpacing.checked = targetSpacingWide; applyTargetSpacing(targetSpacingWide);
  toggleGazeSlowMotion.checked = (motionSpeedLevel === 'slow'); applyMotionSpeed(motionSpeedLevel);
  toggleGaze.checked = gazeEnabled;
  setGazeEnabled(gazeEnabled);

  startTrial();
}
init();
</script>
</body>
</html>
