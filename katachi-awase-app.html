(function(){
  if (window.donomanaAnnounce) return;
  var politeTimer = null, assertiveTimer = null;
  function donomanaAnnounce(message, options){
    if (typeof message !== 'string') return;
    if (message.trim() === '') return;
    var opts = options || {};
    var priority = (opts.priority === 'assertive') ? 'assertive' : 'polite';
    var clearDelay = (typeof opts.clearDelay === 'number' && Number.isFinite(opts.clearDelay) && opts.clearDelay >= 0) ? opts.clearDelay : 50;
    var elId = (priority === 'assertive') ? 'donomanaAnnounceAssertive' : 'donomanaAnnouncePolite';
    var live = document.getElementById(elId);
    if (!live) return;
    if (priority === 'assertive') { clearTimeout(assertiveTimer); } else { clearTimeout(politeTimer); }
    live.textContent = '';
    var timer = setTimeout(function(){ live.textContent = message; }, clearDelay);
    if (priority === 'assertive') { assertiveTimer = timer; } else { politeTimer = timer; }
  }
  window.donomanaAnnounce = donomanaAnnounce;
})();
</script>

      // 実際のクリックイベントがこのままdocumentまでバブリングすると、
      // アプリ側の「パネル外をクリックしたら閉じる」処理が、いま開いたばかりの
      // 設定パネルを"外側クリック"と誤認してすぐ閉じてしまう(反応しないように見えるバグの原因)。
      // これを防ぐため、実クリックの伝播はここで止める。
      e.stopPropagation();
      var candidates = Array.from(document.querySelectorAll("#settingsBtn"));
      // 複数該当する場合、実際に表示されている（offsetParentがnullでない）ものを優先
      var original = candidates.find(function(el){ return el.offsetParent !== null; }) || candidates[0];
      panel.style.display = 'none';
      btn.setAttribute('aria-expanded', 'false');
      panel.setAttribute('aria-hidden', 'true');
      if (!original) return;
      // Phase16.45-A: 上のpanel非表示により、フォーカス中だった#donomanaSettingsProxyの祖先が
      // display:noneになる。ブラウザは非同期にfocusout(relatedTarget=null)を発生させdocument.body
      // へフォーカスを落とす(Phase16.43調査で確認した既存の構造的バグ)。originalへ明示的にfocusして
      // からclickすることで大半のアプリではこれを未然に防げるが、original自身がdisplay:none等で
      // フォーカス不能なアプリも存在するため(Phase16.44-C調査)、その場合に備えたfallbackも用意する。
      var controlsId = original.getAttribute('aria-controls');
      var beforeVisible = null;
      if (!controlsId) {
        // aria-controlsが無いアプリ向け: クリック前の可視要素集合を保存し、
        // fallback時にクリック後との差分(新たに可視化された要素)を求める。
        beforeVisible = new Set();
        document.querySelectorAll('body *').forEach(function(el){
          if (el.getClientRects().length > 0) beforeVisible.add(el);
        });
      }
      original.focus();
      original.click();
      // BODYへ落ちた場合に加え、original.focus()自体は成功しているがoriginalがgenerate.jsにより
      // 恒常的にopacity:0/display:noneで隠されているため、キーボード操作者から見て不可視なフォーカス
      // (例: time-timerの#settingsToggle)が残るケースも救済する(Phase16.45-B)。アプリ独自のfocus処理が
      // 既にoriginal以外の要素へ移動させている場合はここで何もしない(既存の独自focus処理を壊さないため)。
      // janken-app/register-app等、自前で約50ms後にfocusを移すアプリより十分後の100msで判定する。
      setTimeout(function(){
        var active = document.activeElement;
        var needsFallback = (active === document.body) || (active === original && !donomanaIsFocusable(original));
        if (!needsFallback) return;
        var target = null;
        if (controlsId) {
          target = donomanaFirstFocusable(document.getElementById(controlsId));
        } else {
          var newly = [];
          document.querySelectorAll('body *').forEach(function(el){
            if (el.getClientRects().length > 0 && !beforeVisible.has(el)) newly.push(el);
          });
          for (var i = 0; i < newly.length; i++) {
            if (/^(BUTTON|INPUT|SELECT|TEXTAREA|A)$/.test(newly[i].tagName) && donomanaIsFocusable(newly[i])) { target = newly[i]; break; }
          }
        }
        if (target) target.focus();
      }, 100);
    });
  }
    var resetBtn = document.getElementById('donomanaA11yReset');
    if (resetBtn) resetBtn.addEventListener('click', function(){
      applyContrast('normal'); applyFont('normal'); 
      localStorage.removeItem(P + 'contrast'); localStorage.removeItem(P + 'font'); 
      donomanaAnnounceA11y('設定をリセットしました');
    });
    applyContrast(localStorage.getItem(P + 'contrast') || 'normal');
    applyFont(localStorage.getItem(P + 'font') || 'normal');
    
  });
})();
</script>

<script>
/* =====================================================================
   basic elements / canonical settings state
===================================================================== */
var levelBtns = Array.from(document.querySelectorAll('.level-btn'));
var countBtns = Array.from(document.querySelectorAll('.count-btn'));
var countRow = document.getElementById('countRow');
var progressArea = document.getElementById('progressArea');
var progressText = document.getElementById('progressText');
var progressBar = document.getElementById('progressBar');
var progressBarFill = document.getElementById('progressBarFill');
var feedbackText = document.getElementById('feedbackText');
var shapesTray = document.getElementById('shapesTray');
var targetsTray = document.getElementById('targetsTray');
var sessionCompleteArea = document.getElementById('sessionCompleteArea');
var restartBtn = document.getElementById('restartBtn');
var settingsBtn = document.getElementById('settingsBtn');
var settingsPanel = document.getElementById('settingsPanel');
var settingsCloseBtn = document.getElementById('settingsCloseBtn');
var toggleTts = document.getElementById('toggleTts');
var toggleAnimation = document.getElementById('toggleAnimation');
var toggleGaze = document.getElementById('toggleGaze');
var toggleScan = document.getElementById('toggleScan');
var scanSpeedRange = document.getElementById('scanSpeedRange');
var recordsEmpty = document.getElementById('recordsEmpty');
var recordsList = document.getElementById('recordsList');
var recordsShowMoreBtn = document.getElementById('recordsShowMoreBtn');
var recordsStatus = document.getElementById('recordsStatus');
var recordsCsvBtn = document.getElementById('recordsCsvBtn');
var recordsDeleteBtn = document.getElementById('recordsDeleteBtn');
var recordsConfirm = document.getElementById('recordsConfirm');
var recordsConfirmDelete = document.getElementById('recordsConfirmDelete');
var recordsConfirmCancel = document.getElementById('recordsConfirmCancel');

var STORAGE_SETTINGS_KEY = 'katachi_settings';
var STORAGE_LOG_KEY = 'katachi_log';
var LOG_MAX = 200;
var RECORDS_SHOW_INITIAL = 8;

var SHAPE_TYPES = ['circle', 'triangle', 'square'];
var SHAPE_LABEL = { circle: 'まる', triangle: 'さんかく', square: 'しかく' };
/* presentation-only palette: which shape gets which color is randomized
   per task and carries no learning meaning; correctness is always derived
   from shape id alone (see selectTarget). Targets never show a fill color
   until placed, so color can never be used as a matching cue. */
var PALETTE = ['#00A99D', '#F5A623', '#4A8FD9', '#D9639C', '#8B6FD9', '#7CB342'];
function shuffleArray(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function pickColors(n) { return shuffleArray(PALETTE).slice(0, n); }

var level = 1;
var questionCount = 5;
var ttsEnabled = true;
var animationEnabled = true;
var gazeEnabled = false;
var scanMode = false;
var scanSpeed = 1400;
var currentInputMethod = null;

var session = null; // {total, current, startedAt} — Level2/3 only; single source of truth for progress
var task = null; // canonical state for the CURRENT problem (1 problem = 1 full shape/target set)
var phase = 'waitingShape'; // 'waitingShape' | 'waitingTarget' | 'feedback'
var feedbackTimeoutId = null;

/* =====================================================================
   TTS
===================================================================== */
function speak(text) {
  if (!ttsEnabled) return;
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  u.rate = 0.9;
  u.pitch = 1.05;
  window.speechSynthesis.speak(u);
}

/* =====================================================================
   log / settings persistence
===================================================================== */
function addLog(entry) {
  var log = [];
  try {
    var raw = localStorage.getItem(STORAGE_LOG_KEY);
    if (raw) log = JSON.parse(raw) || [];
    if (!Array.isArray(log)) log = [];
  } catch (e) { log = []; }
  log.push(entry);
  if (log.length > LOG_MAX) log = log.slice(log.length - LOG_MAX);
  try { localStorage.setItem(STORAGE_LOG_KEY, JSON.stringify(log)); } catch (e) {}
}
function readLog() {
  try {
    var raw = localStorage.getItem(STORAGE_LOG_KEY);
    var log = raw ? JSON.parse(raw) : [];
    return Array.isArray(log) ? log : [];
  } catch (e) { return []; }
}
function saveSettings() {
  var s = { level: level, questionCount: questionCount, tts: ttsEnabled, animation: animationEnabled, gazeEnabled: gazeEnabled, scanSpeed: scanSpeed };
  try { localStorage.setItem(STORAGE_SETTINGS_KEY, JSON.stringify(s)); } catch (e) {}
}
function loadSettings() {
  try {
    var raw = localStorage.getItem(STORAGE_SETTINGS_KEY);
    if (!raw) return;
    var s = JSON.parse(raw);
    if (!s) return;
    level = (s.level === 2 || s.level === 3) ? s.level : 1;
    questionCount = [3, 5, 10].indexOf(s.questionCount) !== -1 ? s.questionCount : 5;
    ttsEnabled = (typeof s.tts === 'boolean') ? s.tts : true;
    animationEnabled = (typeof s.animation === 'boolean') ? s.animation : true;
    gazeEnabled = (typeof s.gazeEnabled === 'boolean') ? s.gazeEnabled : false;
    scanSpeed = (typeof s.scanSpeed === 'number') ? s.scanSpeed : 1400;
  } catch (e) {}
}

/* =====================================================================
   canonical task generation — semantic mapping is always shape id === target
   id; DOM order, left/right position and color never encode correctness.
===================================================================== */
function generateTask(lvl) {
  var n = (lvl === 1) ? 1 : lvl;
  var types = shuffleArray(SHAPE_TYPES).slice(0, n);
  var colors = pickColors(n);
  var shapeOrder = shuffleArray(types);
  var targetOrder = shuffleArray(types);
  return {
    level: lvl,
    shapes: shapeOrder.map(function(t, i) { return { id: t, shapeType: t, color: colors[types.indexOf(t)], placed: false }; }),
    targets: targetOrder.map(function(t) { return { id: t, shapeType: t, filled: false }; }),
    selectedShapeId: null,
    placedShapeIds: [],
    mistakes: [], // {shapeId, selectedTargetId, expectedTargetId, attempt}
    attemptsByShape: {}, // shapeId -> array of wrong target ids tried, in order
    shapeStartedAt: null,
    startedAt: Date.now()
  };
}

/* =====================================================================
   rendering
===================================================================== */
function renderTask() {
  shapesTray.innerHTML = '';
  targetsTray.innerHTML = '';
  if (!task) return;

  task.targets.forEach(function(t) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'target-btn' + (t.filled ? ' target-filled' : '');
    btn.tabIndex = 0;
    btn.dataset.targetId = t.id;
    btn.setAttribute('aria-label', SHAPE_LABEL[t.shapeType] + ' の ばしょ' + (t.filled ? '（うめた）' : ''));
    var visual = document.createElement('div');
    visual.className = 'shape-visual shape-' + t.shapeType;
    if (t.filled) {
      var filledShape = task.shapes.filter(function(s) { return s.id === t.id; })[0];
      if (filledShape) visual.style.setProperty('--fill-color', filledShape.color);
    }
    var ring = document.createElement('div');
    ring.className = 'gaze-dwell-ring';
    btn.appendChild(visual);
    btn.appendChild(ring);
    btn.addEventListener('click', function() { onTargetActivate(t.id, currentInputMethod || 'click'); });
    targetsTray.appendChild(btn);
  });

  task.shapes.forEach(function(s) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'shape-btn' + (s.placed ? ' shape-placed' : '');
    btn.tabIndex = 0;
    btn.dataset.shapeId = s.id;
    btn.setAttribute('aria-pressed', (task.selectedShapeId === s.id) ? 'true' : 'false');
    btn.setAttribute('aria-label', SHAPE_LABEL[s.shapeType]);
    btn.style.setProperty('--shape-color', s.color);
    var visual = document.createElement('div');
    visual.className = 'shape-visual shape-' + s.shapeType;
    var ring = document.createElement('div');
    ring.className = 'gaze-dwell-ring';
    btn.appendChild(visual);
    btn.appendChild(ring);
    btn.addEventListener('click', function() { onShapeActivate(s.id, currentInputMethod || 'click'); });
    shapesTray.appendChild(btn);
  });
}

function renderProgress() {
  if (!session) { progressArea.hidden = true; return; }
  progressArea.hidden = false;
  progressText.textContent = session.current + ' / ' + session.total;
  progressBar.setAttribute('aria-valuemax', String(session.total));
  progressBar.setAttribute('aria-valuenow', String(session.current));
  progressBarFill.style.width = (session.total ? (session.current / session.total * 100) : 0) + '%';
}

/* =====================================================================
   two-stage state machine
   waitingShape -> shapeSelected(waitingTarget) -> feedback -> waitingShape
   all shapes placed -> problemComplete -> next problem or sessionComplete
===================================================================== */
function shouldShowQuestionCount() { return level === 2 || level === 3; }

function startProblem() {
  clearPendingFeedback();
  task = generateTask(level);
  phase = 'waitingShape';
  feedbackText.textContent = '';
  sessionCompleteArea.hidden = true;
  resetDwellState();
  renderTask();
  if (scanMode) refreshSwitchScanItems();
}

function startLevel(n) {
  clearPendingFeedback();
  level = n;
  levelBtns.forEach(function(b) {
    var on = Number(b.dataset.level) === n;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  countRow.hidden = !shouldShowQuestionCount();
  if (shouldShowQuestionCount()) {
    session = { total: questionCount, current: 0, startedAt: Date.now() };
  } else {
    session = null;
  }
  renderProgress();
  startProblem();
  saveSettings();
}

function setQuestionCount(n) {
  if ([3, 5, 10].indexOf(n) === -1) return;
  if (questionCount === n) return;
  questionCount = n;
  countBtns.forEach(function(b) {
    var on = Number(b.dataset.count) === n;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  saveSettings();
  if (shouldShowQuestionCount()) startLevel(level);
}

// handles three cases via the same entry point (Phase26-D6):
//   waitingShape, any unplaced shape        -> fresh selection
//   waitingTarget, a DIFFERENT unplaced shape -> switch selection (old shape's UI clears)
//   waitingTarget, the SAME shape again       -> deselect back to waitingShape
// None of these three touch task.mistakes/attemptsByShape — only onTargetActivate's
// wrong-target branch records a mistake, so changing your mind is never logged as one.
function onShapeActivate(shapeId, inputMethod) {
  if (!task) return;
  if (phase !== 'waitingShape' && phase !== 'waitingTarget') return; // feedback: no shape candidates
  var shape = task.shapes.filter(function(s) { return s.id === shapeId && !s.placed; })[0];
  if (!shape) return;
  currentInputMethod = inputMethod;

  if (phase === 'waitingTarget' && task.selectedShapeId === shapeId) {
    task.selectedShapeId = null;
    phase = 'waitingShape';
    resetDwellState();
    renderTask();
    if (scanMode) refreshSwitchScanItems();
    return;
  }

  task.selectedShapeId = shapeId;
  task.shapeStartedAt = Date.now();
  phase = 'waitingTarget';
  speak(SHAPE_LABEL[shape.shapeType]);
  resetDwellState();
  renderTask();
  if (scanMode) refreshSwitchScanItems();
}

function onTargetActivate(targetId, inputMethod) {
  if (!task || phase !== 'waitingTarget') return;
  var shapeId = task.selectedShapeId;
  var shape = task.shapes.filter(function(s) { return s.id === shapeId; })[0];
  if (!shape) return;
  currentInputMethod = inputMethod;

  // semantic mapping only — never DOM index/left-right/color
  if (targetId === shape.shapeType) {
    handleCorrectPlacement(shape, targetId);
  } else {
    handleWrongPlacement(shape, targetId);
  }
}

function handleWrongPlacement(shape, wrongTargetId) {
  if (!task.attemptsByShape[shape.id]) task.attemptsByShape[shape.id] = [];
  task.attemptsByShape[shape.id].push(wrongTargetId);
  task.mistakes.push({ shapeId: shape.id, selectedTargetId: wrongTargetId, expectedTargetId: shape.shapeType });
  phase = 'feedback';
  feedbackText.textContent = 'もういちど';
  speak('もういちど');
  resetDwellState();
  if (scanMode) refreshSwitchScanItems(); // feedback: 0 learning candidates
  var capturedTask = task;
  feedbackTimeoutId = setTimeout(function() {
    feedbackTimeoutId = null;
    if (task !== capturedTask) return; // level/question-count change or restart superseded this task
    phase = 'waitingTarget'; // selected shape is retained; only the target step retries
    feedbackText.textContent = '';
    resetDwellState();
    renderTask();
    if (scanMode) refreshSwitchScanItems();
  }, 1000);
}

function handleCorrectPlacement(shape, targetId) {
  shape.placed = true;
  task.placedShapeIds.push(shape.id);
  var target = task.targets.filter(function(t) { return t.id === targetId; })[0];
  if (target) target.filled = true;

  if (level !== 1) {
    addLog({
      time: new Date().toISOString(),
      level: level,
      questionIndex: session ? session.current + 1 : 1,
      questionTotal: session ? session.total : 1,
      shape: shape.shapeType,
      expected: shape.shapeType,
      selected: shape.shapeType,
      correct: true,
      mistakes: (task.attemptsByShape[shape.id] || []).length,
      mistakeSelections: (task.attemptsByShape[shape.id] || []).slice(),
      responseTimeMs: task.shapeStartedAt ? (Date.now() - task.shapeStartedAt) : null,
      inputMethod: currentInputMethod || 'unknown'
    });
  }

  task.selectedShapeId = null;
  phase = 'feedback';
  var allPlaced = task.shapes.every(function(s) { return s.placed; });
  feedbackText.textContent = 'ぴったり！';
  speak('ぴったり');
  resetDwellState();
  renderTask();
  if (scanMode) refreshSwitchScanItems();

  var capturedTask = task;
  feedbackTimeoutId = setTimeout(function() {
    feedbackTimeoutId = null;
    if (task !== capturedTask) return;
    feedbackText.textContent = '';
    if (allPlaced) {
      onProblemComplete();
    } else {
      phase = 'waitingShape';
      resetDwellState();
      renderTask();
      if (scanMode) refreshSwitchScanItems();
    }
  }, level === 1 ? 700 : 900);
}

function onProblemComplete() {
  if (level === 1) { startProblem(); return; } // free play: loop immediately, no session
  session.current++;
  renderProgress();
  if (session.current >= session.total) {
    onSessionComplete();
  } else {
    startProblem();
  }
}

function onSessionComplete() {
  clearPendingFeedback();
  task = null;
  phase = 'waitingShape';
  shapesTray.innerHTML = '';
  targetsTray.innerHTML = '';
  feedbackText.textContent = '';
  sessionCompleteArea.hidden = false;
  resetDwellState();
  if (scanMode) refreshSwitchScanItems();
}

function clearPendingFeedback() {
  if (feedbackTimeoutId) { clearTimeout(feedbackTimeoutId); feedbackTimeoutId = null; }
}

levelBtns.forEach(function(b) { b.addEventListener('click', function() { startLevel(Number(b.dataset.level)); }); });
countBtns.forEach(function(b) { b.addEventListener('click', function() { setQuestionCount(Number(b.dataset.count)); }); });
restartBtn.addEventListener('click', function() { startLevel(level); });

/* =====================================================================
   Switch Scan helper6 (donomana Switch Scan spec v1.8 contract)
===================================================================== */
function isVisibleEnabled(el) {
  if (!el || !el.isConnected || el.disabled) return false;
  if (el.hasAttribute('hidden') || el.closest('[hidden]')) return false;
  var cs = getComputedStyle(el);
  if (cs.display === 'none' || cs.visibility === 'hidden') return false;
  if (el.getClientRects().length === 0) return false;
  return true;
}
function commonChromeCandidates() {
  return Array.from(document.querySelectorAll('.scannable[data-scan="1"]'));
}
function buildScanItems() {
  var items = [];
  if (settingsPanel.hidden === false) {
    items = Array.from(settingsPanel.querySelectorAll('[tabindex="0"]'));
  } else if (task) {
    if (phase === 'waitingShape') {
      items = Array.from(shapesTray.querySelectorAll('.shape-btn:not(.shape-placed)'));
    } else if (phase === 'waitingTarget') {
      // Phase26-D6: Switch users get full reselect/deselect capability — every unplaced
      // shape (including the currently selected one, for deselect) stays a candidate
      // alongside the targets. Switch requires an explicit press, so re-landing on the
      // same shape is a deliberate action, not passive lingering (unlike gaze — see
      // getGazeTargets() below, which excludes the selected shape for that reason).
      items = Array.from(shapesTray.querySelectorAll('.shape-btn:not(.shape-placed)'))
        .concat(Array.from(targetsTray.querySelectorAll('.target-btn:not(.target-filled)')));
    } // feedback: 0 learning candidates
  } else if (!sessionCompleteArea.hidden) {
    items = [restartBtn];
  }
  if (settingsPanel.hidden !== false) {
    items = items.concat(levelBtns);
    if (shouldShowQuestionCount()) items = items.concat(countBtns);
    items.push(settingsBtn);
  }
  items = items.concat(commonChromeCandidates());
  return items.filter(isVisibleEnabled);
}
var scanTargets = [];
var scanFocusIndex = -1;
var scanInterval = null;
function refreshSwitchScanItems() {
  scanFocusIndex = -1;
  scanTargets = buildScanItems();
  clearScanHighlight_classOnly();
  if (scanTargets.length) {
    scanFocusIndex = 0;
    scanTargets[0].focus({ preventScroll: true });
    scanTargets[0].classList.add('scan-focus');
  }
}
function clearScanHighlight_classOnly() {
  document.querySelectorAll('.scan-focus').forEach(function(el) { el.classList.remove('scan-focus'); });
}
function clearScanHighlight() {
  document.body.classList.remove('scan-mode');
  clearScanHighlight_classOnly();
}
function startAutoScan() {
  stopAutoScan();
  scanInterval = setInterval(function() {
    var targets = buildScanItems();
    if (!targets.length) return;
    scanTargets = targets;
    if (scanFocusIndex >= targets.length) scanFocusIndex = 0;
    scanFocusIndex = (scanFocusIndex + 1) % targets.length;
    var t = targets[scanFocusIndex];
    if (t) {
      clearScanHighlight_classOnly();
      t.focus({ preventScroll: true });
      t.classList.add('scan-focus');
    }
  }, scanSpeed);
}
function stopAutoScan() { clearInterval(scanInterval); scanInterval = null; }
function startSwitchScan() {
  document.body.classList.add('scan-mode');
  setTimeout(function() { if (scanMode) refreshSwitchScanItems(); }, 200);
  startAutoScan();
}
function stopSwitchScan() { stopAutoScan(); clearScanHighlight(); }
function activateCurrentScanItem() {
  var el = document.activeElement;
  if (el && el !== document.body) el.click();
}
function setScanMode(on) {
  scanMode = on;
  if (on) {
    gazeEnabled = false;
    toggleGaze.checked = false;
    disableGaze();
    startSwitchScan();
  } else {
    stopSwitchScan();
  }
}
toggleScan.addEventListener('change', function() { setScanMode(toggleScan.checked); });
scanSpeedRange.addEventListener('input', function() {
  scanSpeed = Number(scanSpeedRange.value);
  saveSettings();
  if (scanMode) startAutoScan();
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') return;
  var tag = document.activeElement ? document.activeElement.tagName : '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if ((e.key === ' ' || e.key === 'Enter') && document.activeElement && document.activeElement !== document.body) {
    var el = document.activeElement;
    if (el.tagName === 'BUTTON' || el.hasAttribute('tabindex')) {
      e.preventDefault();
      currentInputMethod = 'keyboard';
      activateCurrentScanItem();
    }
  }
});
// records the observed input signal for a genuine pointer interaction before its click event
// fires, so button click handlers can report what actually triggered them (touch/click) instead
// of a hardcoded guess — keyboard/Switch activations go through el.click() with no pointerdown at
// all, so currentInputMethod is left as whatever the keydown handler above just set for those.
document.addEventListener('pointerdown', function(e) {
  currentInputMethod = (e.pointerType === 'touch') ? 'touch' : 'click';
}, true);

/* =====================================================================
   gaze / dwell — requestAnimationFrame-driven so a genuinely still fixation
   still completes (a still mouse stops emitting mousemove; real gaze
   devices don't). Two-stage transition guard (34章): every activation
   resets dwell state immediately so a shape-select and the following
   target-select always require two independent, full dwell periods —
   leftover accumulated dwell can never chain into a second activation.
===================================================================== */
var DWELL_MS = 900;
var dwellTarget = null;
var dwellStart = 0;
var lastGazeX = null, lastGazeY = null;
var gazeRafId = null;

function getGazeTargets() {
  if (settingsPanel.hidden === false) return [];
  if (!task) return [];
  if (phase === 'waitingShape') return Array.from(shapesTray.querySelectorAll('.shape-btn:not(.shape-placed)'));
  if (phase === 'waitingTarget') {
    // Phase26-D6: gaze may switch to a DIFFERENT unplaced shape (A dwell -> B dwell -> B
    // selected), but the currently selected shape is deliberately excluded from its own
    // candidate set here. Unlike touch/keyboard/Switch — each a discrete, deliberate
    // action — gaze can linger on the shape a user just picked simply while they think
    // about which target to choose next; if that shape stayed a candidate, 900ms of
    // ordinary thinking-glance would silently deselect it. Re-selecting to deselect via
    // gaze is deferred pending user review (see Phase26-D6 report) rather than shipped
    // with this known false-deselect risk.
    var otherShapes = Array.from(shapesTray.querySelectorAll('.shape-btn:not(.shape-placed)'))
      .filter(function(el) { return el.dataset.shapeId !== task.selectedShapeId; });
    var targets = Array.from(targetsTray.querySelectorAll('.target-btn:not(.target-filled)'));
    return otherShapes.concat(targets);
  }
  return []; // feedback
}
function resetDwellState() {
  if (dwellTarget) { dwellTarget.classList.remove('gaze-dwelling'); dwellTarget.style.removeProperty('--dwell-ratio'); }
  dwellTarget = null;
  dwellStart = 0;
}
function onGazeMove(e) { lastGazeX = e.clientX; lastGazeY = e.clientY; }
function gazeTick() {
  if (gazeEnabled && lastGazeX !== null) {
    var el = document.elementFromPoint(lastGazeX, lastGazeY);
    var targets = getGazeTargets();
    var hit = null;
    if (el) {
      for (var i = 0; i < targets.length; i++) { if (targets[i] === el || targets[i].contains(el)) { hit = targets[i]; break; } }
    }
    if (hit !== dwellTarget) {
      resetDwellState();
      dwellTarget = hit;
      if (dwellTarget) { dwellStart = performance.now(); dwellTarget.classList.add('gaze-dwelling'); }
    } else if (dwellTarget) {
      var ratio = Math.min(1, (performance.now() - dwellStart) / DWELL_MS);
      dwellTarget.style.setProperty('--dwell-ratio', String(ratio));
      if (ratio >= 1) {
        var activated = dwellTarget;
        resetDwellState();
        currentInputMethod = 'gaze';
        if (activated.classList.contains('shape-btn')) onShapeActivate(activated.dataset.shapeId, 'gaze');
        else if (activated.classList.contains('target-btn')) onTargetActivate(activated.dataset.targetId, 'gaze');
      }
    }
  }
  gazeRafId = requestAnimationFrame(gazeTick);
}
function enableGaze() {
  if (gazeRafId) return;
  document.addEventListener('mousemove', onGazeMove);
  gazeRafId = requestAnimationFrame(gazeTick);
}
function disableGaze() {
  document.removeEventListener('mousemove', onGazeMove);
  if (gazeRafId) { cancelAnimationFrame(gazeRafId); gazeRafId = null; }
  resetDwellState();
  lastGazeX = null; lastGazeY = null;
}
function setGazeEnabled(on) {
  gazeEnabled = on;
  if (on) {
    if (scanMode) { scanMode = false; toggleScan.checked = false; stopSwitchScan(); }
    enableGaze();
  } else {
    disableGaze();
  }
  saveSettings();
}
toggleGaze.addEventListener('change', function() { setGazeEnabled(toggleGaze.checked); });

/* =====================================================================
   settings panel open/close
===================================================================== */
function openSettings() {
  settingsPanel.hidden = false;
  settingsBtn.setAttribute('aria-expanded', 'true');
  renderRecords();
  if (scanMode) refreshSwitchScanItems();
}
function closeSettings() {
  settingsPanel.hidden = true;
  settingsBtn.setAttribute('aria-expanded', 'false');
  if (scanMode) refreshSwitchScanItems();
}
settingsBtn.addEventListener('click', function() { settingsPanel.hidden ? openSettings() : closeSettings(); });
settingsCloseBtn.addEventListener('click', closeSettings);
toggleTts.addEventListener('change', function() { ttsEnabled = toggleTts.checked; saveSettings(); });
toggleAnimation.addEventListener('change', function() {
  animationEnabled = toggleAnimation.checked;
  document.body.classList.toggle('no-animation', !animationEnabled);
  saveSettings();
});

/* =====================================================================
   records ("きろく") — record data / detail button / aria-controls /
   detail panel are bound 1:1 via a dedicated per-record function so each
   call gets its own closure scope (donomana new-app standard v1.0 §24).
===================================================================== */
var RECORDS_LEVEL_NAME = { 2: 'ふたつ', 3: 'みっつ' };
var recordsShowAll = false;

function groupLogIntoSessions(log) {
  // unlike a single-entry-per-question log, katachi logs one entry per PLACED SHAPE, so several
  // consecutive entries can legitimately share the same questionIndex (every shape in one problem).
  // A new session only starts when questionIndex drops back to 1 after having been > 1 — a bare
  // "entry.questionIndex === 1" check would wrongly split each problem's own shapes apart.
  var sessions = [];
  var current = null;
  var lastQuestionIndex = null;
  log.forEach(function(entry) {
    var startsNew = !current || current.level !== entry.level || (entry.questionIndex === 1 && lastQuestionIndex !== null && lastQuestionIndex !== 1);
    if (startsNew) { current = { level: entry.level, entries: [] }; sessions.push(current); }
    current.entries.push(entry);
    lastQuestionIndex = entry.questionIndex;
  });
  return sessions;
}
function formatRecordDate(iso) {
  try {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    function pad(n) { return n < 10 ? '0' + n : String(n); }
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  } catch (e) { return ''; }
}
// groups a session's per-shape log entries by questionIndex — each group is one
// "問題" (all shapes placed within a single problem), never one shape alone.
function groupEntriesByProblem(entries) {
  var byIndex = {};
  var order = [];
  entries.forEach(function(e) {
    if (!byIndex[e.questionIndex]) { byIndex[e.questionIndex] = []; order.push(e.questionIndex); }
    byIndex[e.questionIndex].push(e);
  });
  return order.map(function(qi) { return { questionIndex: qi, shapes: byIndex[qi] }; });
}
function summarizeSession(sess) {
  var levelName = RECORDS_LEVEL_NAME[sess.level] || ('レベル' + sess.level);
  var last = sess.entries[sess.entries.length - 1];
  var total = last ? last.questionTotal : null;
  var problems = groupEntriesByProblem(sess.entries);
  var mistakeTotal = sess.entries.reduce(function(sum, e) { return sum + (e.mistakes || 0); }, 0);
  return {
    dateStr: sess.entries[0] ? formatRecordDate(sess.entries[0].time) : '',
    title: levelName,
    lines: ['問題数：' + (total || problems.length) + '問 ／ 完了：' + problems.length + '問 ／ まちがえた回数：' + mistakeTotal + '回']
  };
}
function katachiQuestionDetails(sess) {
  var problems = groupEntriesByProblem(sess.entries);
  return problems.map(function(p) {
    var shapesText = p.shapes.map(function(e) {
      return SHAPE_LABEL[e.shape] + (e.mistakes > 0 ? '（' + e.mistakes + '回やりなおし）' : '');
    }).join('、');
    return p.questionIndex + '問目：' + shapesText;
  });
}
function appendRecordDetailToggle(item, detailLines, index) {
  var detailId = 'recordDetail' + index;
  var detailBox = document.createElement('div');
  detailBox.className = 'record-detail';
  detailBox.id = detailId;
  detailBox.hidden = true;
  detailLines.forEach(function(line) {
    var dp = document.createElement('div');
    dp.textContent = line;
    detailBox.appendChild(dp);
  });
  var expandBtn = document.createElement('button');
  expandBtn.type = 'button';
  expandBtn.className = 'record-expand-btn';
  expandBtn.tabIndex = 0;
  expandBtn.textContent = 'くわしく見る';
  expandBtn.setAttribute('aria-expanded', 'false');
  expandBtn.setAttribute('aria-controls', detailId);
  expandBtn.addEventListener('click', function() {
    var willShow = detailBox.hidden;
    detailBox.hidden = !willShow;
    expandBtn.textContent = willShow ? 'とじる' : 'くわしく見る';
    expandBtn.setAttribute('aria-expanded', willShow ? 'true' : 'false');
    if (scanMode) refreshSwitchScanItems();
  });
  item.appendChild(expandBtn);
  item.appendChild(detailBox);
}
function renderRecords() {
  var sessions = groupLogIntoSessions(readLog()).reverse();
  recordsList.innerHTML = '';
  if (sessions.length === 0) {
    recordsEmpty.hidden = false;
    recordsShowMoreBtn.hidden = true;
    recordsDeleteBtn.hidden = true;
    recordsCsvBtn.hidden = true;
    return;
  }
  recordsEmpty.hidden = true;
  recordsDeleteBtn.hidden = false;
  recordsCsvBtn.hidden = false;
  var visibleCount = recordsShowAll ? sessions.length : Math.min(RECORDS_SHOW_INITIAL, sessions.length);
  for (var i = 0; i < visibleCount; i++) {
    var sess = sessions[i];
    var s = summarizeSession(sess);
    var item = document.createElement('div');
    item.className = 'record-item';
    var titleEl = document.createElement('div');
    titleEl.className = 'record-item-title';
    titleEl.textContent = (s.dateStr ? s.dateStr + '　' : '') + s.title;
    item.appendChild(titleEl);
    s.lines.forEach(function(line) {
      var p = document.createElement('div');
      p.textContent = line;
      item.appendChild(p);
    });
    var detailLines = katachiQuestionDetails(sess);
    if (detailLines.length) appendRecordDetailToggle(item, detailLines, i);
    recordsList.appendChild(item);
  }
  recordsShowMoreBtn.hidden = recordsShowAll || sessions.length <= RECORDS_SHOW_INITIAL;
}
recordsShowMoreBtn.addEventListener('click', function() {
  recordsShowAll = true;
  renderRecords();
  if (scanMode) refreshSwitchScanItems();
});
recordsDeleteBtn.addEventListener('click', function() {
  recordsDeleteBtn.hidden = true;
  recordsConfirm.hidden = false;
  if (scanMode) refreshSwitchScanItems();
});
recordsConfirmCancel.addEventListener('click', function() {
  recordsConfirm.hidden = true;
  recordsDeleteBtn.hidden = false;
  if (scanMode) refreshSwitchScanItems();
});
recordsConfirmDelete.addEventListener('click', function() {
  try { localStorage.removeItem(STORAGE_LOG_KEY); } catch (e) {}
  recordsConfirm.hidden = true;
  recordsShowAll = false;
  renderRecords();
  recordsStatus.textContent = '';
  setTimeout(function() { recordsStatus.textContent = 'きろくをすべて消しました'; }, 30);
  if (scanMode) refreshSwitchScanItems();
});

/* =====================================================================
   CSV export — generated from canonical log data only, never from DOM.
===================================================================== */
var CSV_HEADERS = ['日時', 'レベル', '問題番号', '問題数', '形', '正しい場所', '選択した場所', '正誤', '再試行回数', '間違えた内容', '反応時間ms'];
function csvEscape(value) {
  var s = (value === null || value === undefined) ? '' : String(value);
  if (/[",\n\r]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function formatRecordDateTimeFull(iso) {
  try {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    function pad(n) { return n < 10 ? '0' + n : String(n); }
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  } catch (e) { return ''; }
}
function buildRecordsCsvRows() {
  var rows = [CSV_HEADERS.slice()];
  readLog().forEach(function(e) {
    rows.push([
      formatRecordDateTimeFull(e.time),
      RECORDS_LEVEL_NAME[e.level] || ('レベル' + e.level),
      e.questionIndex, e.questionTotal,
      SHAPE_LABEL[e.shape] || e.shape,
      SHAPE_LABEL[e.expected] || e.expected,
      SHAPE_LABEL[e.selected] || e.selected,
      e.correct ? 'せいかい' : 'まちがい',
      e.mistakes,
      (e.mistakeSelections || []).map(function(m) { return SHAPE_LABEL[m] || m; }).join('、'),
      e.responseTimeMs
    ]);
  });
  return rows;
}
function downloadRecordsCsv() {
  var log = readLog();
  if (log.length === 0) return;
  var rows = buildRecordsCsvRows();
  var csvBody = rows.map(function(row) { return row.map(csvEscape).join(','); }).join('\r\n');
  var UTF8_BOM = '﻿';
  var blob = new Blob([UTF8_BOM + csvBody], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var d = new Date();
  function pad(n) { return n < 10 ? '0' + n : String(n); }
  var a = document.createElement('a');
  a.href = url;
  a.download = 'katachi-awase-records-' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
}
recordsCsvBtn.addEventListener('click', downloadRecordsCsv);

/* =====================================================================
   init
===================================================================== */
loadSettings();
toggleTts.checked = ttsEnabled;
toggleAnimation.checked = animationEnabled;
document.body.classList.toggle('no-animation', !animationEnabled);
toggleGaze.checked = gazeEnabled;
toggleScan.checked = false; // scanMode itself always starts OFF regardless of stored gazeEnabled
scanSpeedRange.value = String(scanSpeed);
countBtns.forEach(function(b) {
  var on = Number(b.dataset.count) === questionCount;
  b.classList.toggle('active', on);
  b.setAttribute('aria-pressed', on ? 'true' : 'false');
});
if (gazeEnabled) enableGaze();
startLevel(level);
</script>
