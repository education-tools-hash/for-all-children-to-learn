<div id="donomanaAnnouncePolite" role="status" aria-live="polite" aria-atomic="true" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;padding:0;margin:-1px;"></div>
<div id="donomanaAnnounceAssertive" role="alert" aria-live="assertive" aria-atomic="true" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;padding:0;margin:-1px;"></div>
<script>
(function(){
  if (window.donomanaAnnounce) return;
  var politeTimer = null, assertiveTimer = null;
  function donomanaAnnounce(message, options){
    if (typeof message !== 'string') return;
    if (message.trim() === '') return;
    var opts = options || {};
    var priority = (opts.priority === 'assertive') ? 'assertive' : 'polite';
    var clearDelay = (typeof opts.clearDelay === 'number' && Number.isFinite(opts.clearDelay) && opts.clearDelay >= 0) ? opts.clearDelay : 50;
    var elId = (priority === 'assertive') ? 'donomanaAnnounceAssertive' : 'donomanaAnnouncePolite';
    var live = document.getElementById(elId);
    if (!live) return;
    if (priority === 'assertive') { clearTimeout(assertiveTimer); } else { clearTimeout(politeTimer); }
    live.textContent = '';
    var timer = setTimeout(function(){ live.textContent = message; }, clearDelay);
    if (priority === 'assertive') { assertiveTimer = timer; } else { politeTimer = timer; }
  }
  window.donomanaAnnounce = donomanaAnnounce;
})();
</script>

<div id="donomanaA11yStatus" role="status" aria-live="polite" aria-atomic="true" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;padding:0;margin:-1px;"></div>
<script>
(function(){
  var P = 'donomana-a11y-';
  function all(sel){return document.querySelectorAll(sel);}
  function mark(sel, dataAttr, value){
    all(sel).forEach(function(b){
      var on = b.dataset[dataAttr] === value;
      b.style.background = on ? '#00A99D' : '#fff';
      b.style.color = on ? '#fff' : '#333';
      b.style.borderColor = on ? '#00A99D' : '#ddd';
    });
  }
  var donomanaAnnounceA11yTimer = null;
  function donomanaAnnounceA11y(msg){
    var live = document.getElementById('donomanaA11yStatus');
    if (!live) return;
    clearTimeout(donomanaAnnounceA11yTimer);
    live.textContent = '';
    donomanaAnnounceA11yTimer = setTimeout(function(){ live.textContent = msg; }, 50);
  }
  function applyContrast(mode){
    // 背景を黒・文字を白に反転する方式(弱視・色覚特性のある方向けに、
    // 単純なコントラスト強調より確実に見やすくなるため)
    document.documentElement.style.filter = (mode === 'hc') ? 'invert(1) hue-rotate(180deg)' : '';
    mark('[data-a11y-contrast]', 'a11yContrast', mode);
    localStorage.setItem(P + 'contrast', mode);
  }
  function applyFont(size){
    var zoomMap = { normal: '', large: '125%', xlarge: '150%' };
    document.body.style.zoom = zoomMap[size] || '';
    mark('[data-a11y-font]', 'a11yFont', size);
    localStorage.setItem(P + 'font', size);
  }
  
  document.addEventListener('DOMContentLoaded', function(){
    var btn = document.getElementById('donomanaA11yBtn');
    var panel = document.getElementById('donomanaA11yPanel');
    if (!btn || !panel) return;
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var open = panel.style.display === 'block';
      panel.style.display = open ? 'none' : 'block';
      btn.setAttribute('aria-expanded', open ? 'false' : 'true');
      panel.setAttribute('aria-hidden', open ? 'true' : 'false');
    });
    document.addEventListener('click', function(e){
      if (!panel.contains(e.target) && e.target !== btn) {
        panel.style.display = 'none';
        btn.setAttribute('aria-expanded', 'false');
        panel.setAttribute('aria-hidden', 'true');
      }
    });
    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape' && panel.style.display === 'block') btn.click();
    });
    all('[data-a11y-contrast]').forEach(function(b){ b.addEventListener('click', function(){
      applyContrast(b.dataset.a11yContrast);
      donomanaAnnounceA11y(b.dataset.a11yContrast === 'hc' ? 'ハイコントラストをオンにしました' : 'ハイコントラストをオフにしました');
    }); });
    all('[data-a11y-font]').forEach(function(b){ b.addEventListener('click', function(){
      applyFont(b.dataset.a11yFont);
      donomanaAnnounceA11y('文字の大きさを' + ({normal:'標準',large:'大',xlarge:'特大'}[b.dataset.a11yFont] || '標準') + 'にしました');
    }); });
    
    
    var resetBtn = document.getElementById('donomanaA11yReset');
    if (resetBtn) resetBtn.addEventListener('click', function(){
      applyContrast('normal'); applyFont('normal'); 
      localStorage.removeItem(P + 'contrast'); localStorage.removeItem(P + 'font'); 
      donomanaAnnounceA11y('設定をリセットしました');
    });
    applyContrast(localStorage.getItem(P + 'contrast') || 'normal');
    applyFont(localStorage.getItem(P + 'font') || 'normal');
    
  });
})();
</script>

<script>
(function(){
  var locked=false, toastTimer=null;
  function toast(msg){
    var el=document.getElementById('donomanaLockToast');
    if(!el)return;
    el.textContent=msg;
    el.style.opacity='1'; el.style.transform='translateX(-50%) translateY(0)';
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){el.style.opacity='0';el.style.transform='translateX(-50%) translateY(-10px)';},2200);
  }
  function setLock(on){
    locked=on;
    var btn=document.getElementById('donomanaLockBtn');
    if(btn){
      btn.textContent=on?'🔒':'🔓';
      btn.style.background=on?'rgba(255,80,80,0.92)':'rgba(255,255,255,0.92)';
      btn.setAttribute('aria-label',on?'ロックちゅう（タップでかいじょ）':'がめんをロック');
    }
    if(on){
      history.pushState({donomanaLocked:true},'');
      history.pushState({donomanaLocked:true},'');
      toast('🔒 がめんをロックしたよ');
    } else {
      toast('🔓 ロックをかいじょしたよ');
    }
  }
  window.addEventListener('popstate',function(){
    if(locked){history.pushState({donomanaLocked:true},'');toast('🔒 まえの がめんには もどれないよ');}
  });
  window.addEventListener('beforeunload',function(e){
    if(locked){e.preventDefault();e.returnValue='';}
  });
  document.addEventListener('DOMContentLoaded',function(){
    var lockBtn=document.getElementById('donomanaLockBtn');
    if(lockBtn)lockBtn.addEventListener('click',function(){setLock(!locked);});
    var homeBtn=document.getElementById('donomanaHomeBtn');
    if(homeBtn){
      homeBtn.addEventListener('click',function(e){
        if(locked){e.preventDefault();toast('🔒 まえの がめんには もどれないよ');}
      });
    }
    var fsBtn=document.getElementById('donomanaFsBtn');
    function inFS(){return !!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement);}
    function updateFsBtn(){if(fsBtn){fsBtn.textContent=inFS()?'⊡':'⛶';fsBtn.setAttribute('aria-label',inFS()?'全画面を解除':'全画面表示');}}
    ['fullscreenchange','webkitfullscreenchange','mozfullscreenchange'].forEach(function(ev){document.addEventListener(ev,updateFsBtn);});
    if(fsBtn)fsBtn.addEventListener('click',function(){
      if(!inFS()){
        var el=document.documentElement;
        var req=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen;
        if(req)req.call(el);
      } else {
        var ex=document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen;
        if(ex)ex.call(document);
      }
    });
  });
})();

    font-size: var(--dm-font-size-caption); cursor: pointer; font-family: inherit;
  }
  .level-btn.active { background: var(--dm-color-primary); border-color: var(--dm-color-primary); color: #fff; }
  .toggle { position: relative; width: 50px; height: 27px; flex-shrink: 0; display: inline-block; }

  .toggle-slider { position: absolute; inset: 0; background: #ccc; border-radius: 27px; transition: background var(--dm-duration-base); pointer-events: none; }
  .toggle-slider::before { content: ''; position: absolute; width: 21px; height: 21px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform var(--dm-duration-base); box-shadow: 0 1px 4px rgba(0,0,0,.2); }
  .toggle input:checked + .toggle-slider { background: var(--dm-color-primary); }

  .stepper { display: flex; align-items: center; gap: var(--dm-space-2); }

    min-width: 44px; min-height: 44px; border-radius: var(--dm-radius-sm);

  .settings-close-btn {
    margin-top: var(--dm-space-4); width: 100%; min-height: 44px;
    border-radius: var(--dm-radius-pill); border: none; background: var(--dm-color-soft);
    color: var(--dm-color-ink); font-weight: 900; cursor: pointer; font-family: inherit;
    font-size: var(--dm-font-size-body);
  }

  /* ===== learning area ===== */
  .learn-area { text-align: center; }
  .prompt-text {
    font-size: var(--dm-font-size-display); font-weight: 900; min-height: 1.4em;
    margin: 0 0 var(--dm-space-7);
  }
  .level-view[hidden] { display: none; }
  .stimulus-stage, .compare-stage {
    display: flex; align-items: center; justify-content: center;
    gap: var(--dm-space-8); flex-wrap: wrap;
    min-height: 260px; margin-bottom: var(--dm-space-6);
  }
  .stimulus-shape {
    --stim-size: 180px;
    width: var(--stim-size); height: var(--stim-size);
    background: var(--dm-color-primary);
    cursor: pointer; border: none; padding: 0;
    display: inline-block; position: relative;
    transition: transform var(--dm-duration-fast) var(--dm-easing-standard);
  }
  .stimulus-shape.shape-circle { border-radius: 50%; }
  .stimulus-shape.shape-square { border-radius: var(--dm-radius-md); }
  /* length concept: fixed height so width/length is the dominant visual cue, not area */
  .stimulus-shape.shape-bar { height: 48px; min-width: 60px; border-radius: var(--dm-radius-sm); }
  .stimulus-shape.color-a { background: var(--dm-color-primary); }
  .stimulus-shape.color-b { background: var(--dm-color-accent); }
  .stimulus-shape:active { transform: scale(0.94); }
  .stimulus-shape.tap-pulse { transform: scale(1.12); }
  .stimulus-shape.auto-anim { animation: kurabeyouPulse 4s ease-in-out infinite; }
  body.no-animation .stimulus-shape.auto-anim { animation: none; }
  @keyframes kurabeyouPulse {
    0% { transform: scale(0.55); }
    50% { transform: scale(1.15); }
    100% { transform: scale(0.55); }
  }
  .next-btn {
    min-width: 160px; min-height: 52px; padding: var(--dm-space-3) var(--dm-space-6);
    border-radius: var(--dm-radius-pill); border: none;
    background: var(--dm-color-primary); color: #fff; font-weight: 900;
    font-size: var(--dm-font-size-body); cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 0 var(--dm-color-primary-dark);
  }
  .next-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--dm-color-primary-dark); }
  .result-text, .feedback-area {
    font-size: var(--dm-font-size-heading); font-weight: 900; min-height: 1.6em;
    margin: var(--dm-space-4) 0;
  }
  .result-text.show-big, .feedback-area.correct { color: var(--dm-color-primary-dark); }
  .feedback-area.incorrect { color: var(--dm-color-danger-text); }

  /* ===== switch scan highlight (class-based, distinct from native :focus-visible) ===== */
  .scan-focus {
    outline: 5px solid #FF6B35 !important;
    outline-offset: 4px !important;
    box-shadow: 0 0 0 9px rgba(255,107,53,.22) !important;
    position: relative; z-index: 20;
  }
  :focus-visible { outline: var(--dm-focus-width) solid var(--dm-focus-color); outline-offset: var(--dm-focus-offset); }

  /* ===== gaze dwell progress ring ===== */
  .gaze-dwell { position: relative; }
  .gaze-dwell::after {
    content: '';
    position: absolute; inset: -8px;
    border-radius: inherit;

    pointer-events: none; z-index: 21;

  body.high-contrast .stimulus-shape { border: 3px solid #fff; }
  body.high-contrast .settings-panel { border-color: #fff; }

</style>

<script>
'use strict';

/* =====================================================================
   SETTINGS / STATE
===================================================================== */
var STORAGE_SETTINGS_KEY = 'kurabeyou_settings';
var STORAGE_LOG_KEY = 'kurabeyou_log';
var LOG_MAX = 200;

var level = 1;
var ttsEnabled = true;
var animationEnabled = true;
var gazeEnabled = false;
var scanMode = false;
var scanSpeed = 2000;
var scanInterval = null;
var scanFocusIndex = -1;
var scanTargets = [];
var settingsOpen = false;
var answered = false; // Level3 gate: true while a decision is being processed/shown
var answered4 = false; // Level4 gate: same role as `answered`, for one ordering step's feedback
var currentInputMethod = null; // 'touch' | 'keyboard' | 'switch' | 'gaze' (best-effort, not guessed)
var comparisonMode = 'size'; // 'size' | 'length'
var QUESTION_COUNTS = [3, 5, 10];
var questionCount = 5;
var session = null; // { total, current, completed, correct, startedAt } — single source of truth for Level3/4 progress; null when level is 1 or 2
var LEVEL4_COLOR_CLASSES = ['color-a', 'color-b', 'color-c'];

var SIZE_PAIRS = [[210,120],[195,130],[180,135]]; // pair[0] is always the larger value
var LENGTH_PAIRS = [[280,110],[250,130],[220,150]]; // pair[0] is always the longer value; wider spread than SIZE_PAIRS so length reads as a width cue, not an area cue
var SHAPES = ['circle','square'];

/* per-concept text/config, keyed by comparisonMode. moreLabel/lessLabel are the
   internal (log/aria) vocabulary for "the bigger/longer one" and "the smaller/
   shorter one" respectively, kept stable across concepts so Level3's judgment
   logic never needs to branch on concept. */
var COMPARISON = {
  size: {
    pairs: SIZE_PAIRS,
    level1Stimuli: [{ shape: 'circle', size: 170 }, { shape: 'square', size: 170 }],
    level2Combos: [{ shape: 'circle', pair: 0 }, { shape: 'square', pair: 1 }, { shape: 'circle', pair: 2 }, { shape: 'square', pair: 0 }],
    level2Prompt: 'どっちが おおきいかな？',
    promptMore: 'おおきい ほうは どっち？',
    promptLess: 'ちいさい ほうは どっち？',
    feedbackMore: 'おおきいね',
    feedbackLess: 'ちいさいね',
    ariaMore: 'おおきいかたち',
    ariaLess: 'ちいさいかたち',
    moreLabel: 'big',
    lessLabel: 'small',
    level4Patterns: [[120,170,220],[130,180,230],[110,160,210]],
    level4PromptDesc: 'おおきい じゅんに ならべよう',
    level4PromptAsc: 'ちいさい じゅんに ならべよう'
  },
  length: {
    pairs: LENGTH_PAIRS,
    level1Stimuli: [{ shape: 'bar', size: 260 }],
    level2Combos: [{ shape: 'bar', pair: 0 }, { shape: 'bar', pair: 1 }, { shape: 'bar', pair: 2 }],
    level2Prompt: 'どっちが ながいかな？',
    promptMore: 'ながい ほうは どっち？',
    promptLess: 'みじかい ほうは どっち？',
    feedbackMore: 'ながいね',
    feedbackLess: 'みじかいね',
    ariaMore: 'ながいかたち',
    ariaLess: 'みじかいかたち',
    moreLabel: 'long',
    lessLabel: 'short',
    level4Patterns: [[100,190,280],[110,200,290],[90,180,270]],
    level4PromptDesc: 'ながい じゅんに ならべよう',
    level4PromptAsc: 'みじかい じゅんに ならべよう'
  }
};

/* DOM refs */
var settingsBtn = document.getElementById('settingsBtn');
var settingsPanel = document.getElementById('settingsPanel');
var settingsCloseBtn = document.getElementById('settingsCloseBtn');
var levelBtns = Array.from(document.querySelectorAll('.level-btn'));
var conceptBtns = Array.from(document.querySelectorAll('.concept-btn'));
var questionCountRow = document.getElementById('questionCountRow');
var questionCountBtns = Array.from(document.querySelectorAll('.count-btn'));
var toggleTts = document.getElementById('toggleTts');
var toggleAnimation = document.getElementById('toggleAnimation');
var toggleGaze = document.getElementById('toggleGaze');
var toggleScan = document.getElementById('toggleScan');
var scanSpeedMinus = document.getElementById('scanSpeedMinus');
var scanSpeedPlus = document.getElementById('scanSpeedPlus');
var scanSpeedDisplay = document.getElementById('scanSpeedDisplay');

var promptText = document.getElementById('promptText');
var progressArea = document.getElementById('progressArea');
var qNow = document.getElementById('qNow');
var qTotal = document.getElementById('qTotal');
var progressDots = document.getElementById('progressDots');
var level1View = document.getElementById('level1View');
var level2View = document.getElementById('level2View');
var level3View = document.getElementById('level3View');
var level3PlayArea = document.getElementById('level3PlayArea');
var level4View = document.getElementById('level4View');
var level4PlayArea = document.getElementById('level4PlayArea');
var shape1 = document.getElementById('shape1');
var level1NextBtn = document.getElementById('level1NextBtn');
var objBig2 = document.getElementById('objBig2');
var objSmall2 = document.getElementById('objSmall2');
var level2ResultText = document.getElementById('level2ResultText');
var level2NextBtn = document.getElementById('level2NextBtn');
var objA3 = document.getElementById('objA3');
var objB3 = document.getElementById('objB3');
var feedbackArea = document.getElementById('feedbackArea');
var item0 = document.getElementById('item0');
var item1 = document.getElementById('item1');
var item2 = document.getElementById('item2');
var level4Items = [item0, item1, item2];
var orderSlotEls = [document.getElementById('orderSlot0'), document.getElementById('orderSlot1'), document.getElementById('orderSlot2')];
var level4FeedbackArea = document.getElementById('level4FeedbackArea');
var sessionCompleteArea = document.getElementById('sessionCompleteArea');
var sessionCompleteText = document.getElementById('sessionCompleteText');
var sessionRestartBtn = document.getElementById('sessionRestartBtn');

/* =====================================================================
   localStorage: settings
===================================================================== */
function loadSettings() {
  var raw = null;
  try { raw = localStorage.getItem(STORAGE_SETTINGS_KEY); } catch (e) {}
  var s = {};
  if (raw) {
    try { s = JSON.parse(raw) || {}; } catch (e) { s = {}; }
  }
  level = (s.level === 1 || s.level === 2 || s.level === 3 || s.level === 4) ? s.level : 1;
  ttsEnabled = (typeof s.tts === 'boolean') ? s.tts : true;
  animationEnabled = (typeof s.animation === 'boolean') ? s.animation : true;
  gazeEnabled = (typeof s.gazeEnabled === 'boolean') ? s.gazeEnabled : false;
  scanSpeed = (typeof s.scanSpeed === 'number' && s.scanSpeed >= 500 && s.scanSpeed <= 5000) ? s.scanSpeed : 2000;
  comparisonMode = (s.comparisonMode === 'length') ? 'length' : 'size'; // missing/unknown value → safe default, no migration needed
  questionCount = (QUESTION_COUNTS.indexOf(s.questionCount) !== -1) ? s.questionCount : 5; // missing/unknown value → safe default
  // scanMode itself is never restored ON automatically (avoid surprising auto-scan on load)
}
function saveSettings() {
  var s = { level: level, tts: ttsEnabled, animation: animationEnabled, gazeEnabled: gazeEnabled, scanSpeed: scanSpeed, comparisonMode: comparisonMode, questionCount: questionCount };
  try { localStorage.setItem(STORAGE_SETTINGS_KEY, JSON.stringify(s)); } catch (e) {}
}

/* =====================================================================
   localStorage: learning log
===================================================================== */
function addLog(entry) {
  var log = [];
  try {
    var raw = localStorage.getItem(STORAGE_LOG_KEY);
    if (raw) log = JSON.parse(raw) || [];
    if (!Array.isArray(log)) log = [];
  } catch (e) { log = []; }
  log.push(entry);
  if (log.length > LOG_MAX) log = log.slice(log.length - LOG_MAX);
  try { localStorage.setItem(STORAGE_LOG_KEY, JSON.stringify(log)); } catch (e) {}
}

/* =====================================================================
   TTS (speechSynthesis only; no mp3 asset dependency)
===================================================================== */
function speak(text) {
  if (!ttsEnabled) return;
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  u.rate = 0.9;
  u.pitch = 1.05;
  window.speechSynthesis.speak(u);
}

/* =====================================================================
   sound (short WebAudio beep; no external asset)
===================================================================== */
var audioCtx = null;
function beep(freq, durationMs) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durationMs / 1000);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + durationMs / 1000);
  } catch (e) {}
}

/* =====================================================================
   helper6: Switch Scan 共通API
===================================================================== */
function isVisibleEnabled(el) {
  if (!el || el.disabled) return false;
  var cs = window.getComputedStyle(el);
  if (cs.display === 'none' || cs.visibility === 'hidden') return false;
  var rect = el.getBoundingClientRect();
  return rect.width > 0 && rect.height > 0;
}

function commonChromeCandidates() {
  var ids = ['donomanaA11yBtn', 'donomanaLockBtn', 'donomanaFsBtn', 'donomanaHomeBtn'];
  var out = [];
  ids.forEach(function(id) {
    var el = document.getElementById(id);
    if (el) out.push(el);
  });
  return out;
}

function buildScanItems() {
  var items = [];
  if (settingsOpen) {
    items = Array.from(settingsPanel.querySelectorAll('[tabindex="0"]'));
  } else if (level === 1) {
    items = [shape1, level1NextBtn];
  } else if (level === 2) {
    items = [objBig2, objSmall2, level2NextBtn];
  } else if (level === 3) {
    items = sessionComplete() ? [sessionRestartBtn] : (answered ? [] : [objA3, objB3]);
  } else if (level === 4) {
    items = sessionComplete() ? [sessionRestartBtn] : (answered4 ? [] : unplacedLevel4Els());
  }
  if (!settingsOpen) {
    items = items.concat(levelBtns, conceptBtns, questionCountBtns);
    items.push(settingsBtn);
  }
  items = items.concat(commonChromeCandidates());
  return items.filter(isVisibleEnabled);
}

function refreshSwitchScanItems() {
  scanFocusIndex = -1;
  var targets = buildScanItems();
  scanTargets = targets;
  clearScanHighlight_classOnly();
  if (targets.length) {
    scanFocusIndex = 0;
    targets[0].focus({ preventScroll: true });
    targets[0].classList.add('scan-focus');
    targets[0].scrollIntoView({ block: 'nearest', behavior: animationEnabled ? 'smooth' : 'auto' });
  }
}

function clearScanHighlight_classOnly() {
  document.querySelectorAll('.scan-focus').forEach(function(el) { el.classList.remove('scan-focus'); });
}

function clearScanHighlight() {
  document.body.classList.remove('scan-mode');
  clearScanHighlight_classOnly();
}

function startAutoScan() {
  stopAutoScan();
  scanInterval = setInterval(function() {
    var targets = buildScanItems();
    if (!targets.length) return;
    if (scanFocusIndex >= targets.length) scanFocusIndex = 0;
    scanFocusIndex = (scanFocusIndex + 1) % targets.length;
    var target = targets[scanFocusIndex];
    if (target) {
      clearScanHighlight_classOnly();
      target.focus({ preventScroll: true });
      target.classList.add('scan-focus');
      target.scrollIntoView({ block: 'nearest', behavior: animationEnabled ? 'smooth' : 'auto' });
    }
  }, scanSpeed);
}
function stopAutoScan() {
  clearInterval(scanInterval);
  scanInterval = null;
}

function startSwitchScan() {
  document.body.classList.add('scan-mode');
  setTimeout(function() { if (scanMode) refreshSwitchScanItems(); }, 200);
  startAutoScan();
}
function stopSwitchScan() {
  stopAutoScan();
  clearScanHighlight();
}

function activateCurrentScanItem() {
  var el = document.activeElement;
  if (el && el !== document.body) el.click();
}

/* =====================================================================
   keyboard input adapter (single handler; scanMode-aware; no duplicate
   listeners → 1 physical input = 1 activation by construction)
===================================================================== */
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') return;
  var tag = document.activeElement ? document.activeElement.tagName : '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if ((e.key === ' ' || e.key === 'Enter') && document.activeElement && document.activeElement !== document.body) {
    var el = document.activeElement;
    if (el.tagName === 'BUTTON' || el.getAttribute('role') === 'button' || el.hasAttribute('tabindex')) {
      e.preventDefault();
      currentInputMethod = 'keyboard';
      activateCurrentScanItem();
    }
  }
});

/* =====================================================================
   gaze / dwell input adapter
   ─ mousemove-based hit-testing (works for gaze-tracking devices that
     emulate pointer movement, and for regular mouse use during testing),
     mirroring the pattern used in kimochi-board.html.
   ─ Progress/completion is driven by a requestAnimationFrame loop rather
     than solely by mousemove events, so a genuinely still fixation still
     completes the dwell (a still pointer does not keep generating
     mousemove events, but real gaze devices report a still fixation the
     same way — the completion check must not depend on new events).
===================================================================== */
var DWELL_MS = 900;
var dwellTarget = null;
var dwellStart = 0;
var lastGazeX = null, lastGazeY = null;
var gazeRafId = null;

function getGazeTargets() {
  if (settingsOpen) return buildScanItems();
  var items = [];
  if (level === 1) {
    items = [level1NextBtn]; // Level1: looking alone is enough; only "next" needs a decision
  } else if (level === 2) {
    items = [objBig2, objSmall2, level2NextBtn];
  } else if (level === 3) {
    items = sessionComplete() ? [sessionRestartBtn] : (answered ? [] : [objA3, objB3]);
  } else if (level === 4) {
    items = sessionComplete() ? [sessionRestartBtn] : (answered4 ? [] : unplacedLevel4Els());
  }
  if (!settingsOpen) items.push(settingsBtn);
  return items.filter(isVisibleEnabled);
}

function hitTestTargets(targets, x, y) {
  for (var i = 0; i < targets.length; i++) {
    var r = targets[i].getBoundingClientRect();
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return targets[i];
  }
  return null;
}

function updateDwellVisual(el, ratio) {
  document.querySelectorAll('.gaze-dwell').forEach(function(o) {
    if (o !== el) { o.classList.remove('gaze-dwell'); o.style.removeProperty('--dwell-ratio'); }
  });
  el.style.setProperty('--dwell-ratio', ratio);
  el.classList.add('gaze-dwell');
}
function clearDwellVisual() {
  document.querySelectorAll('.gaze-dwell').forEach(function(el) {
    el.classList.remove('gaze-dwell');
    el.style.removeProperty('--dwell-ratio');
  });
}
function resetDwellState() {
  dwellTarget = null;
  dwellStart = 0;
  clearDwellVisual();
}

function onGazeMove(e) {
  if (!gazeEnabled) return;
  lastGazeX = e.clientX;
  lastGazeY = e.clientY;
}

function gazeTick() {
  if (!gazeEnabled) { gazeRafId = null; return; }
  if (lastGazeX !== null) {
    var targets = getGazeTargets();
    var hit = hitTestTargets(targets, lastGazeX, lastGazeY);
    if (hit !== dwellTarget) {
      clearDwellVisual();
      dwellTarget = hit;
      dwellStart = performance.now();
    }
    if (hit) {
      var elapsed = performance.now() - dwellStart;
      updateDwellVisual(hit, Math.min(elapsed / DWELL_MS, 1));
      if (elapsed >= DWELL_MS) {
        var target = hit;
        resetDwellState();
        currentInputMethod = 'gaze';
        target.click();
      }
    }
  }
  gazeRafId = requestAnimationFrame(gazeTick);
}

function enableGaze() {
  document.addEventListener('mousemove', onGazeMove);
  if (gazeRafId === null) gazeRafId = requestAnimationFrame(gazeTick);
}
function disableGaze() {
  document.removeEventListener('mousemove', onGazeMove);
  if (gazeRafId !== null) { cancelAnimationFrame(gazeRafId); gazeRafId = null; }
  lastGazeX = null; lastGazeY = null;
  resetDwellState();
}

/* =====================================================================
   gaze / Switch Scan mutual exclusion
===================================================================== */
function setScanMode(on) {
  scanMode = on;
  if (on) {
    if (gazeEnabled) {
      gazeEnabled = false;
      toggleGaze.checked = false;
      disableGaze();
    }
    startSwitchScan();
  } else {
    stopSwitchScan();
  }
  saveSettings();
}
function setGazeEnabled(on) {
  gazeEnabled = on;
  if (on) {
    if (scanMode) {
      scanMode = false;
      toggleScan.checked = false;
      stopSwitchScan();
    }
    enableGaze();
  } else {
    disableGaze();
  }
  saveSettings();
}

/* =====================================================================
   session (Level3/4 progress): single source of truth for "which question,
   how many total, how many completed" — the visible progress UI and the
   Switch Scan/gaze candidate gating both read from this one object, never
   computed separately.
===================================================================== */
function sessionComplete() {
  return !!session && session.completed >= session.total;
}

function startSession() {
  if (level3FeedbackTimeoutId) { clearTimeout(level3FeedbackTimeoutId); level3FeedbackTimeoutId = null; }
  if (level4FeedbackTimeoutId) { clearTimeout(level4FeedbackTimeoutId); level4FeedbackTimeoutId = null; }
  session = { total: questionCount, current: 1, completed: 0, correct: 0, startedAt: performance.now() };
  sessionCompleteArea.hidden = true;
  if (level === 3) level3PlayArea.hidden = false;
  if (level === 4) level4PlayArea.hidden = false;
  updateProgressUI();
}

function advanceSession() {
  if (!session) return;
  session.completed++;
  session.correct++;
  if (session.completed >= session.total) {
    showSessionComplete();
  } else {
    session.current++;
    updateProgressUI();
    if (level === 3) renderLevel3();
    else if (level === 4) renderLevel4();
  }
}

function showSessionComplete() {
  updateProgressUI();
  if (level === 3) level3PlayArea.hidden = true;
  if (level === 4) level4PlayArea.hidden = true;
  promptText.textContent = '';
  sessionCompleteArea.hidden = false;
  sessionCompleteText.textContent = 'できたね！ ぜんぶ おわったよ！';
  speak('できたね！ ぜんぶ おわったよ！');
  beep(1046, 220);
  resetDwellState();
  if (scanMode) refreshSwitchScanItems();
}

function updateProgressUI() {
  if (!session) { progressArea.hidden = true; return; }
  progressArea.hidden = false;
  var shownCurrent = Math.min(session.current, session.total);
  qNow.textContent = shownCurrent;
  qTotal.textContent = session.total;
  progressDots.setAttribute('aria-valuemin', '0');
  progressDots.setAttribute('aria-valuemax', String(session.total));
  progressDots.setAttribute('aria-valuenow', String(session.completed));
  progressDots.setAttribute('aria-valuetext', shownCurrent + 'もんめ、ぜんぶで' + session.total + 'もん');
  progressDots.innerHTML = '';
  for (var i = 0; i < session.total; i++) {
    var dot = document.createElement('span');
    var cls = 'progress-dot';
    if (i < session.completed) cls += ' done';
    else if (i === session.completed && !sessionComplete()) cls += ' current';
    dot.className = cls;
    progressDots.appendChild(dot);
  }
}

sessionRestartBtn.addEventListener('click', function() {
  startSession();
  if (level === 3) renderLevel3();
  else if (level === 4) renderLevel4();
});

/* =====================================================================
   stimulus rendering
===================================================================== */
function applyShape(el, shape, sizePx, colorClass) {
  el.classList.remove('shape-circle', 'shape-square', 'shape-bar');
  el.classList.add(shape === 'square' ? 'shape-square' : shape === 'bar' ? 'shape-bar' : 'shape-circle');
  el.style.setProperty('--stim-size', sizePx + 'px');
  el.classList.remove('color-a', 'color-b');
  el.classList.add(colorClass);
}

function tapPulse(el) {
  el.classList.remove('tap-pulse');
  // force reflow so the class can be re-applied even on rapid repeats
  void el.offsetWidth;
  el.classList.add('tap-pulse');
  setTimeout(function() { el.classList.remove('tap-pulse'); }, 220);
}

/* ---- Level 1 ---- */
var level1Index = 0;
function renderLevel1() {
  promptText.textContent = '';
  var stimuli = COMPARISON[comparisonMode].level1Stimuli;
  var cfg = stimuli[level1Index % stimuli.length];
  applyShape(shape1, cfg.shape, cfg.size, 'color-a');
  shape1.classList.toggle('auto-anim', true);
}
function level1Next() {
  var stimuli = COMPARISON[comparisonMode].level1Stimuli;
  level1Index = (level1Index + 1) % stimuli.length;
  renderLevel1();
  resetDwellState();
  if (scanMode) refreshSwitchScanItems();
}
shape1.addEventListener('click', function() {
  currentInputMethod = currentInputMethod || 'touch';
  tapPulse(shape1);
  beep(660, 120);
  currentInputMethod = null;
});
level1NextBtn.addEventListener('click', level1Next);

/* ---- Level 2 ---- */
var level2Index = 0;
function renderLevel2() {
  var cfg = COMPARISON[comparisonMode];
  promptText.textContent = cfg.level2Prompt;
  level2ResultText.textContent = '';
  level2ResultText.className = 'result-text';
  objBig2.setAttribute('aria-label', cfg.ariaMore);
  objSmall2.setAttribute('aria-label', cfg.ariaLess);
  var combo = cfg.level2Combos[level2Index % cfg.level2Combos.length];
  var pair = cfg.pairs[combo.pair % cfg.pairs.length];
  applyShape(objBig2, combo.shape, pair[0], 'color-a');
  applyShape(objSmall2, combo.shape, pair[1], 'color-b');
}
function level2Next() {
  level2Index++;
  renderLevel2();
  resetDwellState();
  if (scanMode) refreshSwitchScanItems();
}
function level2Select(which) {
  var cfg = COMPARISON[comparisonMode];
  var msg = which === 'more' ? cfg.feedbackMore : cfg.feedbackLess;
  level2ResultText.textContent = msg;
  level2ResultText.className = 'result-text show-big';
  speak(msg);
  tapPulse(which === 'more' ? objBig2 : objSmall2);
}
objBig2.addEventListener('click', function() { level2Select('more'); });
objSmall2.addEventListener('click', function() { level2Select('less'); });
level2NextBtn.addEventListener('click', level2Next);

/* ---- Level 3 ---- */
// question state is generated exactly once per question: prompt, stimulus
// sizes, and the correct answer all derive from this single object, so
// render / click-judgment / log / TTS can never see mutually inconsistent
// values (the previous implementation recomputed "which element is big"
// twice, via two independently-indexed conditionals, and the two
// computations silently disagreed half the time).
var level3State = null; // { concept, promptMore, moreEl, lessEl, correctEl, startTime }
var level3FeedbackTimeoutId = null;

function generateLevel3Question() {
  var cfg = COMPARISON[comparisonMode];
  var promptMore = Math.random() < 0.5; // true = prompt asks for the bigger/longer one
  var shape = comparisonMode === 'length' ? 'bar' : SHAPES[Math.floor(Math.random() * SHAPES.length)];
  var pair = cfg.pairs[Math.floor(Math.random() * cfg.pairs.length)]; // pair[0] > pair[1]
  var moreOnLeft = Math.random() < 0.5;

  var leftValue = moreOnLeft ? pair[0] : pair[1];
  var rightValue = moreOnLeft ? pair[1] : pair[0];
  var moreEl = moreOnLeft ? objA3 : objB3;
  var lessEl = moreOnLeft ? objB3 : objA3;

  return {
    concept: comparisonMode,
    promptMore: promptMore,
    shape: shape,
    leftValue: leftValue,
    rightValue: rightValue,
    moreEl: moreEl,
    lessEl: lessEl,
    correctEl: promptMore ? moreEl : lessEl,
    startTime: performance.now()
  };
}

function renderLevel3() {
  answered = false;
  feedbackArea.textContent = '';
  feedbackArea.className = 'feedback-area';

  var cfg = COMPARISON[comparisonMode];
  var q = generateLevel3Question();
  level3State = q;

  applyShape(objA3, q.shape, q.leftValue, 'color-a');
  applyShape(objB3, q.shape, q.rightValue, 'color-b');

  var promptStr = q.promptMore ? cfg.promptMore : cfg.promptLess;
  promptText.textContent = promptStr;
  speak(promptStr);

  resetDwellState();
  if (scanMode) refreshSwitchScanItems();
}

function level3Select(el) {
  if (answered || !level3State) return;
  answered = true;
  var q = level3State;
  var cfg = COMPARISON[q.concept];
  var correct = (el === q.correctEl);
  var responseTimeMs = Math.round(performance.now() - q.startTime);

  addLog({
    time: new Date().toISOString(),
    concept: q.concept,
    level: 3,
    prompt: q.promptMore ? cfg.moreLabel : cfg.lessLabel,
    selected: (el === q.moreEl) ? cfg.moreLabel : cfg.lessLabel,
    correct: correct,
    responseTimeMs: responseTimeMs,
    questionIndex: session ? session.current : null,
    questionTotal: session ? session.total : null,
    inputMethod: currentInputMethod || null
  });
  currentInputMethod = null;

  if (correct) {
    feedbackArea.textContent = 'せいかい！';
    feedbackArea.className = 'feedback-area correct';
    speak('せいかい！');
    beep(880, 160);
    if (animationEnabled) tapPulse(el);
  } else {
    feedbackArea.textContent = 'もういちど やってみよう';
    feedbackArea.className = 'feedback-area incorrect';
    speak('もういちど やってみよう');
    beep(330, 200);
  }

  // learning candidates are suspended while feedback is shown (buildScanItems()
  // returns [] for level3 while answered===true); resume/advance after a pause.
  if (scanMode) refreshSwitchScanItems();
  resetDwellState();

  level3FeedbackTimeoutId = setTimeout(function() {
    level3FeedbackTimeoutId = null;
    if (correct) {
      advanceSession();
    } else {
      answered = false;
      feedbackArea.textContent = '';
      feedbackArea.className = 'feedback-area';
      if (scanMode) refreshSwitchScanItems();
      resetDwellState();
    }
  }, correct ? 1400 : 1200);
}
objA3.addEventListener('click', function() { level3Select(objA3); });
objB3.addEventListener('click', function() { level3Select(objB3); });

/* =====================================================================
   Level 4: ordering ("じゅんばん")
   canonical question state is generated once per question — items' values,
   correctOrder (derived purely from those values, never from DOM position),
   and selectedOrder/currentStep all live on the same object, so render,
   click-judgment, log, and TTS can never disagree (same principle as
   Level3's generateLevel3Question, extended to a 3-item ranking).
===================================================================== */
var level4State = null; // { concept, order, shape, items, correctOrder, selectedOrder, currentStep, mistakes, startTime }
var level4FeedbackTimeoutId = null;

function shuffleArray(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function generateLevel4Question() {
  var cfg = COMPARISON[comparisonMode];
  var pattern = cfg.level4Patterns[Math.floor(Math.random() * cfg.level4Patterns.length)];
  var shape = comparisonMode === 'length' ? 'bar' : SHAPES[Math.floor(Math.random() * SHAPES.length)];
  var order = Math.random() < 0.5 ? 'desc' : 'asc'; // desc = biggest/longest first, asc = smallest/shortest first
  var domIds = ['item0', 'item1', 'item2'];
  var shuffledValues = shuffleArray(pattern);
  var items = domIds.map(function(id, i) { return { id: id, value: shuffledValues[i] }; });

  var sorted = items.slice().sort(function(a, b) { return order === 'desc' ? b.value - a.value : a.value - b.value; });
  var correctOrder = sorted.map(function(it) { return it.id; });

  return {
    concept: comparisonMode,
    order: order,
    shape: shape,
    items: items,
    correctOrder: correctOrder,
    selectedOrder: [],
    currentStep: 0,
    mistakes: 0,
    startTime: performance.now()
  };
}

function unplacedLevel4Els() {
  if (!level4State) return [];
  return level4Items.filter(function(el) { return level4State.selectedOrder.indexOf(el.dataset.itemId) === -1; });
}

function renderLevel4() {
  answered4 = false;
  level4FeedbackArea.textContent = '';
  level4FeedbackArea.className = 'feedback-area';

  var cfg = COMPARISON[comparisonMode];
  var q = generateLevel4Question();
  level4State = q;

  q.items.forEach(function(it, i) {
    var el = level4Items[i];
    applyShape(el, q.shape, it.value, LEVEL4_COLOR_CLASSES[i]);
    el.classList.remove('placed');
    el.setAttribute('tabindex', '0');
    el.dataset.itemId = it.id;
  });
  orderSlotEls.forEach(function(s, i) {
    s.textContent = String(i + 1);
    s.classList.remove('filled', 'color-a', 'color-b', 'color-c');
  });

  var promptStr = q.order === 'desc' ? cfg.level4PromptDesc : cfg.level4PromptAsc;
  promptText.textContent = promptStr;
  speak(promptStr);

  resetDwellState();
  if (scanMode) refreshSwitchScanItems();
}

function level4Select(el) {
  if (answered4 || !level4State) return;
  var q = level4State;
  var itemId = el.dataset.itemId;
  if (q.selectedOrder.indexOf(itemId) !== -1) return; // already placed; ignore (candidates already exclude it, this is a guard)

  var expectedId = q.correctOrder[q.currentStep];

  if (itemId === expectedId) {
    q.selectedOrder.push(itemId);
    var slotIndex = q.currentStep;
    q.currentStep++;
    el.classList.add('placed');
    el.setAttribute('tabindex', '-1');
    var itemIndex = level4Items.indexOf(el);
    var slotEl = orderSlotEls[slotIndex];
    slotEl.textContent = '✓';
    slotEl.classList.add('filled', LEVEL4_COLOR_CLASSES[itemIndex]);
    if (animationEnabled) tapPulse(el);
    beep(880, 120);

    if (q.currentStep >= 3) {
      answered4 = true;
      var responseTimeMs = Math.round(performance.now() - q.startTime);
      addLog({
        time: new Date().toISOString(),
        concept: q.concept,
        level: 4,
        order: q.order,
        correctOrder: q.correctOrder,
        selectedOrder: q.selectedOrder,
        mistakes: q.mistakes,
        responseTimeMs: responseTimeMs,
        questionIndex: session ? session.current : null,
        questionTotal: session ? session.total : null,
        inputMethod: currentInputMethod || null
      });
      currentInputMethod = null;
      level4FeedbackArea.textContent = 'できたね！';
      level4FeedbackArea.className = 'feedback-area correct';
      speak('できたね！');
      if (scanMode) refreshSwitchScanItems();
      resetDwellState();
      level4FeedbackTimeoutId = setTimeout(function() {
        level4FeedbackTimeoutId = null;
        advanceSession();
      }, 1400);
    } else {
      if (scanMode) refreshSwitchScanItems();
      resetDwellState();
    }
  } else {
    q.mistakes++;
    answered4 = true;
    level4FeedbackArea.textContent = 'もういちど やってみよう';
    level4FeedbackArea.className = 'feedback-area incorrect';
    speak('もういちど やってみよう');
    beep(330, 200);
    if (scanMode) refreshSwitchScanItems();
    resetDwellState();
    level4FeedbackTimeoutId = setTimeout(function() {
      level4FeedbackTimeoutId = null;
      answered4 = false;
      level4FeedbackArea.textContent = '';
      level4FeedbackArea.className = 'feedback-area';
      if (scanMode) refreshSwitchScanItems();
      resetDwellState();
    }, 1200);
  }
}
level4Items.forEach(function(el) { el.addEventListener('click', function() { level4Select(el); }); });

/* =====================================================================
   level switching
===================================================================== */
function showLevel(n) {
  if (level3FeedbackTimeoutId) { clearTimeout(level3FeedbackTimeoutId); level3FeedbackTimeoutId = null; }
  if (level4FeedbackTimeoutId) { clearTimeout(level4FeedbackTimeoutId); level4FeedbackTimeoutId = null; }
  level = n;
  level1View.hidden = (n !== 1);
  level2View.hidden = (n !== 2);
  level3View.hidden = (n !== 3);
  level4View.hidden = (n !== 4);
  levelBtns.forEach(function(b) {
    var on = Number(b.dataset.level) === n;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  questionCountRow.hidden = !(n === 3 || n === 4);
  answered = false;
  answered4 = false;
  sessionCompleteArea.hidden = true;
  if (n === 1) {
    session = null;
    progressArea.hidden = true;
    renderLevel1();
  } else if (n === 2) {
    session = null;
    progressArea.hidden = true;
    renderLevel2();
  } else if (n === 3) {
    startSession();
    renderLevel3();
  } else {
    startSession();
    renderLevel4();
  }
  resetDwellState();
  if (scanMode) refreshSwitchScanItems();
  saveSettings();
}

levelBtns.forEach(function(b) {
  b.addEventListener('click', function() { showLevel(Number(b.dataset.level)); });
});

/* =====================================================================
   comparison concept switching (size ⇄ length)
===================================================================== */
function setComparisonMode(mode) {
  if (mode !== 'size' && mode !== 'length') return;
  if (comparisonMode === mode) return;
  comparisonMode = mode;
  conceptBtns.forEach(function(b) {
    var on = b.dataset.concept === mode;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  // reuse showLevel()'s existing cleanup (pending timeout cancel, dwell reset,
  // scan candidate refresh, answered reset, fresh prompt) for the current level
  // under the new concept, so no old-concept state survives the switch.
  showLevel(level);
}

conceptBtns.forEach(function(b) {
  b.addEventListener('click', function() { setComparisonMode(b.dataset.concept); });
});

/* =====================================================================
   question count switching (3 / 5 / 10)
===================================================================== */
function setQuestionCount(n) {
  if (QUESTION_COUNTS.indexOf(n) === -1) return;
  if (questionCount === n) return;
  questionCount = n;
  questionCountBtns.forEach(function(b) {
    var on = Number(b.dataset.count) === n;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  saveSettings();
  // reuse showLevel()'s full reset + startSession() for the current level, same as concept switching
  if (level === 3 || level === 4) showLevel(level);
}

questionCountBtns.forEach(function(b) {
  b.addEventListener('click', function() { setQuestionCount(Number(b.dataset.count)); });
});

/* =====================================================================
   settings panel open/close (inline, non-modal; no Focus Trap)
===================================================================== */
function openSettings() {
  settingsOpen = true;
  settingsPanel.hidden = false;
  settingsBtn.setAttribute('aria-expanded', 'true');
  resetDwellState();
  if (scanMode) refreshSwitchScanItems();
}
function closeSettings() {
  settingsOpen = false;
  settingsPanel.hidden = true;
  settingsBtn.setAttribute('aria-expanded', 'false');
  resetDwellState();
  if (scanMode) {
    // Switch Scan owns focus while scanning; refreshSwitchScanItems() already
    // moves focus to the new first candidate. Overriding it here would leave
    // scanFocusIndex/DOM focus out of sync (the same class of bug fixed in
    // hiragana-learn/suji-manabou during Phase25 Group D).
    refreshSwitchScanItems();
  } else {
    settingsBtn.focus({ preventScroll: true });
  }
}
settingsBtn.addEventListener('click', function() {
  if (settingsOpen) closeSettings(); else openSettings();
});
settingsCloseBtn.addEventListener('click', closeSettings);

/* =====================================================================
   settings controls
===================================================================== */
toggleTts.addEventListener('change', function() {
  ttsEnabled = toggleTts.checked;
  saveSettings();
});
toggleAnimation.addEventListener('change', function() {
  animationEnabled = toggleAnimation.checked;
  document.body.classList.toggle('no-animation', !animationEnabled);
  saveSettings();
});
toggleGaze.addEventListener('change', function() { setGazeEnabled(toggleGaze.checked); });
toggleScan.addEventListener('change', function() { setScanMode(toggleScan.checked); });
scanSpeedMinus.addEventListener('click', function() {
  scanSpeed = Math.max(500, scanSpeed - 500);
  scanSpeedDisplay.textContent = (scanSpeed / 1000).toFixed(1) + '秒';
  saveSettings();
  if (scanMode) startAutoScan();
});
scanSpeedPlus.addEventListener('click', function() {
  scanSpeed = Math.min(5000, scanSpeed + 500);
  scanSpeedDisplay.textContent = (scanSpeed / 1000).toFixed(1) + '秒';
  saveSettings();
  if (scanMode) startAutoScan();
});

/* =====================================================================
   touch / pointer input method tagging (best-effort, for learning log only;
   never guessed beyond what the event itself tells us)
===================================================================== */
document.addEventListener('pointerdown', function(e) {
  if (e.pointerType === 'touch' || e.pointerType === 'pen') currentInputMethod = 'touch';
  else if (e.pointerType === 'mouse' && !gazeEnabled) currentInputMethod = 'touch';
}, true);

/* =====================================================================
   init
===================================================================== */
function init() {
  loadSettings();
  toggleTts.checked = ttsEnabled;
  toggleAnimation.checked = animationEnabled;
  document.body.classList.toggle('no-animation', !animationEnabled);
  toggleGaze.checked = gazeEnabled;
  toggleScan.checked = false; // scanMode itself always starts OFF regardless of stored gazeEnabled
  scanSpeedDisplay.textContent = (scanSpeed / 1000).toFixed(1) + '秒';
  conceptBtns.forEach(function(b) {
    var on = b.dataset.concept === comparisonMode;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  questionCountBtns.forEach(function(b) {
    var on = Number(b.dataset.count) === questionCount;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });

  showLevel(level);

  if (gazeEnabled) enableGaze();
}
init();
</script>
</body>
</html>
