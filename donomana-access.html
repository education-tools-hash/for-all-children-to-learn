<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>どのまな Access（開発版）</title>
<!--
  Donomana Access — Phase 5A: スワイプ専用モード（開発中のcheckpoint）。
  このファイルはまだ apps-data.json / index.html / generate.js へ登録していない
  （Production公開対象のアプリ一覧への追加は本Phaseでも行わない）。
  基本操作ログ・活動後の記録表示・端末内保存はPhase 3で実装済み。本Phaseで
  タッチ・外部スイッチに加え、スワイプを独立した入力方式として追加した
  (Design v2.0 1.2節。既存の12px・8pxしきい値はいずれも転用せず、10pxを
  未検証の暫定初期値として新規に用いる。教員による調整UIは対象外)。教師の
  観察メモ・JSONエクスポートは後続Phaseの対象。
  外部送信は一切行わない（localStorageのみ）。
-->
<style>
  :root {
    --donomana-teal: #00A99D;
    --donomana-teal-dark: #00857c;
    --bg: #fdfdfb;
    --text: #222;
    --surface-bg: #eef7f6;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; overflow-x: hidden;
    font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif;
    background: var(--bg); color: var(--text);
  }
  .screen { display: none; min-height: 100vh; padding: 24px 20px; }
  .screen.active { display: flex; flex-direction: column; }
  h1 { font-size: 1.6rem; margin: 0 0 8px; }
  h2 { font-size: 1.4rem; margin: 0 0 12px; }
  .lead { margin: 0 0 20px; font-size: 1.05rem; }
  fieldset {
    border: 2px solid #ddd; border-radius: 16px; padding: 14px 16px; margin: 0 0 16px;
  }
  legend { font-weight: bold; padding: 0 6px; }
  fieldset label {
    display: flex; align-items: center; gap: 10px; padding: 10px 4px; font-size: 1.05rem;
  }
  fieldset input[type="radio"], fieldset input[type="checkbox"] {
    width: 24px; height: 24px; flex: 0 0 auto;
  }
  button {
    font-family: inherit; cursor: pointer; border: none; border-radius: 16px;
  }
  button:focus-visible, input:focus-visible {
    outline: 3px solid var(--donomana-teal-dark); outline-offset: 2px;
  }
  .primary-btn {
    background: var(--donomana-teal); color: #fff; font-size: 1.3rem; font-weight: bold;
    padding: 18px 28px; margin-top: 12px; min-height: 56px;
  }
  .primary-btn:hover { background: var(--donomana-teal-dark); }

  #screen-activity { padding: 0; position: relative; }
  #activitySurface {
    flex: 1; width: 100%; min-height: 100vh; background: var(--surface-bg);
    touch-action: none; position: relative; overflow: hidden;
  }
  body.input-switch #activitySurface { touch-action: auto; }
  #switchActionBtn {
    display: none; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: min(60vw, 320px); height: min(60vw, 320px); border-radius: 50%;
    background: var(--donomana-teal); color: #fff; font-size: 1.4rem; font-weight: bold;
  }
  body.input-switch #switchActionBtn { display: block; }
  body.input-switch #activitySurface { background: #f4f4f4; }

  #switchActionBtn.scan-focus,
  #endBtn.scan-focus {
    outline: 6px solid #ff7a00; outline-offset: 3px;
  }

  #endBtn {
    position: fixed; top: 14px; right: 14px; z-index: 10;
    background: #fff; color: var(--text); border: 2px solid #999;
    font-size: 1.05rem; padding: 12px 20px; min-height: 48px;
  }

  #feedbackLayer {
    position: absolute; inset: 0; pointer-events: none; z-index: 5;
  }
  .feedback-dot {
    position: absolute; border-radius: 50%; background: #ffd400;
    transform: translate(-50%, -50%) scale(0.2); opacity: 0.9;
    transition: transform 320ms ease-out, opacity 320ms ease-out;
  }
  .feedback-dot.grow { transform: translate(-50%, -50%) scale(1); opacity: 0; }
  body.reduce-motion .feedback-dot {
    transition: opacity 260ms ease-out; transform: translate(-50%, -50%) scale(0.9);
  }
  body.reduce-motion .feedback-dot.grow {
    transform: translate(-50%, -50%) scale(0.9); opacity: 0;
  }

  #summaryText, #storedSummaryText { font-size: 1.1rem; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0);
  }
  #saveFailureBanner {
    display: none; background: #8a1c1c; color: #fff; font-weight: bold;
    padding: 10px 16px; border-radius: 12px; margin: 12px 0; font-size: 0.95rem;
  }
  .record-actions { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
  .secondary-btn {
    background: #fff; color: var(--text); border: 2px solid #999; font-size: 1rem;
    padding: 10px 18px; min-height: 44px;
  }
  .danger-btn { background: #fff; color: #8a1c1c; border: 2px solid #8a1c1c; font-size: 1rem; padding: 10px 18px; min-height: 44px; }
  #deleteConfirmRow { display: none; gap: 10px; }
  #deleteConfirmRow.show { display: flex; }

  #observationForm { margin-top: 20px; }
  #observationForm h3 { font-size: 1.15rem; margin: 20px 0 8px; }
  #observationForm h3:first-of-type { margin-top: 0; }
  .observation-note {
    font-size: 0.9rem; color: #555; margin: 0 0 12px; padding: 8px 12px;
    background: #f4f4f4; border-radius: 10px;
  }
  #supportTypesGroup { margin-top: 4px; }
  #supportTypesGroup label { padding-left: 20px; }
  #pruneNotice {
    display: none; background: #fff6e0; color: #6b4d00; font-weight: bold;
    padding: 10px 16px; border-radius: 12px; margin: 12px 0; font-size: 0.9rem;
  }
</style>
</head>
<body>

<div class="screen active" id="screen-setup" data-screen="setup">
  <h1>どのまな Access（開発版）</h1>
  <p class="lead">まず、つかう方法をえらんでください。</p>

  <fieldset id="inputMethodGroup">
    <legend>入力方法</legend>
    <label><input type="radio" name="inputMethod" value="touch" checked> タッチ（画面をさわる）</label>
    <label><input type="radio" name="inputMethod" value="switch"> 外部スイッチ</label>
    <label><input type="radio" name="inputMethod" value="swipe"> スワイプ（ゆびでなぞる）</label>
  </fieldset>

  <fieldset>
    <legend>かんきょう設定</legend>
    <label><input type="checkbox" id="soundToggle" checked> 音を出す</label>
    <label><input type="checkbox" id="reduceMotionToggle"> 動きを弱める</label>
  </fieldset>

  <button type="button" id="startBtn" class="primary-btn">はじめる</button>
  <p id="setupStatus" class="sr-only" role="status" aria-live="polite"></p>
</div>

<div class="screen" id="screen-activity" data-screen="activity">
  <div id="activitySurface" aria-label="操作エリア。タッチで働きかけてください。">
    <button type="button" id="switchActionBtn" class="scannable" data-scan="1" aria-label="はたらきかける">はたらきかける</button>
    <div id="feedbackLayer" aria-hidden="true"></div>
  </div>
  <button type="button" id="endBtn" class="scannable" data-scan="1">おわる</button>
  <p id="activityStatus" class="sr-only" role="status" aria-live="polite"></p>
</div>

<div class="screen" id="screen-end" data-screen="end">
  <h2>おつかれさまでした</h2>
  <div id="saveFailureBanner" role="alert" aria-live="assertive"></div>
  <p id="summaryText"></p>
  <p id="storedSummaryText"></p>
  <div id="pruneNotice" role="status" aria-live="polite"></div>

  <div id="observationForm">
    <h3>状況の記録</h3>

    <fieldset id="postureGroup">
      <legend>活動時の姿勢</legend>
      <label><input type="radio" name="posture" value="未記録" checked> 未記録</label>
      <label><input type="radio" name="posture" value="座位"> 座位</label>
      <label><input type="radio" name="posture" value="立位"> 立位</label>
      <label><input type="radio" name="posture" value="臥位"> 臥位</label>
      <label><input type="radio" name="posture" value="その他"> その他（抱かれている場合など）</label>
    </fieldset>

    <fieldset id="supportGroup">
      <legend>活動時の支援</legend>
      <label><input type="checkbox" id="supportUnrecordedToggle" checked> 未記録</label>
      <label><input type="checkbox" id="supportNoneConfirmedToggle"> 支援・環境調整は特になし（確認済み）</label>
      <div id="supportTypesGroup">
        <label><input type="checkbox" name="supportType" value="声かけ・音声による促し"> 声かけ・音声による促し</label>
        <label><input type="checkbox" name="supportType" value="視覚的な提示・促し"> 視覚的な提示・促し</label>
        <label><input type="checkbox" name="supportType" value="身体的な支援"> 身体的な支援</label>
        <label><input type="checkbox" name="supportType" value="姿勢・機器配置などの環境調整"> 姿勢・機器配置などの環境調整</label>
      </div>
    </fieldset>

    <fieldset id="operationPartGroup">
      <legend>主な操作部位</legend>
      <label><input type="radio" name="operationPart" value="未記録" checked> 未記録</label>
      <label><input type="radio" name="operationPart" value="手・指"> 手・指</label>
      <label><input type="radio" name="operationPart" value="頭部・顔"> 頭部・顔</label>
      <label><input type="radio" name="operationPart" value="足"> 足</label>
      <label><input type="radio" name="operationPart" value="その他"> その他</label>
      <label><input type="radio" name="operationPart" value="該当なし"> 該当なし</label>
    </fieldset>

    <h3>教員の観察</h3>
    <p class="observation-note">この項目は教員の所感・参考情報であり、機械的な操作記録とは異なります。この2つの選択肢に優劣はありません。</p>
    <fieldset id="teacherImpressionGroup">
      <legend>教員が観察した活動への関わり</legend>
      <label><input type="checkbox" name="teacherObservation" value="自分から働きかける様子が見られた"> 自分から働きかける様子が見られた</label>
      <label><input type="checkbox" name="teacherObservation" value="促しをきっかけに働きかける様子が見られた"> 促しをきっかけに働きかける様子が見られた</label>
      <label><input type="checkbox" name="teacherObservation" value="判断が難しい"> 判断が難しい</label>
    </fieldset>

    <button type="button" id="saveObservationBtn" class="secondary-btn">観察記録を保存する</button>
    <p id="observationStatus" class="sr-only" role="status" aria-live="polite"></p>
  </div>

  <button type="button" id="restartBtn" class="primary-btn">もういちど</button>
  <div class="record-actions">
    <button type="button" id="deleteRecordsBtn" class="secondary-btn">保存した記録を削除する</button>
    <div id="deleteConfirmRow">
      <span>本当に削除しますか？この操作は取り消せません。</span>
      <button type="button" id="deleteConfirmYesBtn" class="danger-btn">削除する</button>
      <button type="button" id="deleteConfirmNoBtn" class="secondary-btn">もどる</button>
    </div>
    <p id="deleteStatus" class="sr-only" role="status" aria-live="polite"></p>
  </div>
</div>

<script src="assets/js/donomana-access-core.js"></script>
<script>
(function () {
  'use strict';
  var Core = window.DonomanaAccessCore;

  var screens = {
    setup: document.getElementById('screen-setup'),
    activity: document.getElementById('screen-activity'),
    end: document.getElementById('screen-end')
  };
  var activitySurface = document.getElementById('activitySurface');
  var switchActionBtn = document.getElementById('switchActionBtn');
  var endBtn = document.getElementById('endBtn');
  var feedbackLayer = document.getElementById('feedbackLayer');
  var startBtn = document.getElementById('startBtn');
  var restartBtn = document.getElementById('restartBtn');
  var soundToggle = document.getElementById('soundToggle');
  var reduceMotionToggle = document.getElementById('reduceMotionToggle');
  var summaryText = document.getElementById('summaryText');
  var storedSummaryText = document.getElementById('storedSummaryText');
  var activityStatus = document.getElementById('activityStatus');
  var saveFailureBanner = document.getElementById('saveFailureBanner');
  var deleteRecordsBtn = document.getElementById('deleteRecordsBtn');
  var deleteConfirmRow = document.getElementById('deleteConfirmRow');
  var deleteConfirmYesBtn = document.getElementById('deleteConfirmYesBtn');
  var deleteConfirmNoBtn = document.getElementById('deleteConfirmNoBtn');
  var deleteStatus = document.getElementById('deleteStatus');
  var pruneNotice = document.getElementById('pruneNotice');
  var postureRadios = document.querySelectorAll('input[name="posture"]');
  var supportUnrecordedToggle = document.getElementById('supportUnrecordedToggle');
  var supportNoneConfirmedToggle = document.getElementById('supportNoneConfirmedToggle');
  var supportTypeCheckboxes = document.querySelectorAll('input[name="supportType"]');
  var operationPartRadios = document.querySelectorAll('input[name="operationPart"]');
  var teacherObservationCheckboxes = document.querySelectorAll('input[name="teacherObservation"]');
  var saveObservationBtn = document.getElementById('saveObservationBtn');
  var observationStatus = document.getElementById('observationStatus');

  // ===== 状態 =====
  // events[]はメモリ上の作業用バッファ。活動終了時にsession記録として
  // localStorageへ書き出す(Phase 3、設計文書7〜8章)。教師の解釈・メモは
  // ここに含めない(観測データと教師の記録を構造上分離する設計原則)。
  var state = {
    inputMethod: 'touch',
    soundOn: true,
    reduceMotion: false,
    events: [],
    sessionId: null,
    startedAt: null
  };

  var repeatGuard = Core.createRepeatGuard();
  var activePointers = Object.create(null); // pointerId -> {startTs, el}
  var scanState = { items: [], index: 0, timer: null };
  var pendingSwitchActivateTs = null; // 直近のswitch/keyboard activateのtimestamp（release時のduration計算用）
  var audioCtx = null;

  function showScreen(name) {
    Object.keys(screens).forEach(function (key) {
      screens[key].classList.toggle('active', key === name);
    });
  }

  // ===== 共通イベント記録 =====
  function recordEvent(opts) {
    var evt = Core.makeEvent(opts);
    state.events.push(evt);
    return evt;
  }

  // ===== フィードバック =====
  function unlockAudioContext() {
    if (audioCtx) return;
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) audioCtx = new Ctx();
    } catch (err) { audioCtx = null; }
  }

  function playTone() {
    if (!state.soundOn || !audioCtx) return;
    try {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.frequency.value = 660;
      gain.gain.value = 0.15;
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    } catch (err) { /* 音声再生に失敗しても活動は継続する */ }
  }

  // triggerFeedback(): 操作位置に視覚（拡大→消える円）＋聴覚（単音、ON/OFF可）の
  // 即時フィードバックを発生させる。正解/不正解の概念は持たない
  // (sawatte-hirogaru-app.htmlのtriggerReaction相当のADAPT、Design Approval文書2.1節#4)。
  function triggerFeedback(localX, localY) {
    var dot = document.createElement('div');
    dot.className = 'feedback-dot';
    var size = state.reduceMotion ? 90 : 70;
    dot.style.width = size + 'px';
    dot.style.height = size + 'px';
    dot.style.left = localX + 'px';
    dot.style.top = localY + 'px';
    feedbackLayer.appendChild(dot);
    requestAnimationFrame(function () {
      dot.classList.add('grow');
    });
    setTimeout(function () {
      if (dot.parentNode) dot.parentNode.removeChild(dot);
    }, 400);
    playTone();
  }

  function surfaceLocalXY(clientX, clientY) {
    var rect = activitySurface.getBoundingClientRect();
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  function elementCenterLocalXY(el) {
    var rect = el.getBoundingClientRect();
    var surfaceRect = activitySurface.getBoundingClientRect();
    return {
      x: rect.left + rect.width / 2 - surfaceRect.left,
      y: rect.top + rect.height / 2 - surfaceRect.top
    };
  }

  // ===== タッチ／スワイプ（Pointer Events） =====
  // sawatte-hirogaru-app.htmlのpointerdown/pointermove/pointerup/pointercancel
  // パターンを新規画面へ適用したもの（ADAPT、Design Approval文書2.1節#2）。
  // Phase 5A: スワイプはタッチと同じPointer Events経路を使うが、教師が明示的に
  // 選ぶ独立した入力方式であり（Design v2.0 1.2節）、記録されるinputMethodは
  // 選択中の値（'touch'または'swipe'）をそのまま使う。activate/release/cancelの
  // 意味はタッチと同一（接触の開始・終了・中断の観測事実）であり、「スワイプが
  // 成立した」という独自の判定・イベントは追加しない（1.3節：動きの意図性は
  // 判別できないという設計方針どおり）。移動量のしきい値判定はCore.meetsMoveThreshold()
  // （Core.TOUCH_MOVE_THRESHOLD_PX=12・Core.SWIPE_MOVE_THRESHOLD_PX=10）に委ねる。

  function isPointerInputMethod() {
    return state.inputMethod === 'touch' || state.inputMethod === 'swipe';
  }

  function onPointerDown(e) {
    if (!isPointerInputMethod()) return;
    unlockAudioContext();
    var pos = surfaceLocalXY(e.clientX, e.clientY);
    activePointers[e.pointerId] = { startTs: performance.now(), x: pos.x, y: pos.y };
    try { activitySurface.setPointerCapture(e.pointerId); } catch (err) {}
    recordEvent({
      type: 'activate', inputMethod: state.inputMethod, timestamp: performance.now(),
      position: { x: pos.x, y: pos.y }
    });
    triggerFeedback(pos.x, pos.y);
  }

  function onPointerMove(e) {
    if (!isPointerInputMethod()) return;
    var p = activePointers[e.pointerId];
    if (!p) return;
    var pos = surfaceLocalXY(e.clientX, e.clientY);
    // moveイベントは共通schemaに接続可能な形としてのみ記録する（過剰発火を避け、
    // 一定距離を超えた場合のみ記録する）。タッチの12pxとスワイプの10pxは意図的に
    // 異なる値であり、どちらも他方からの流用ではない（Design v2.0 1.2節）。
    var dx = pos.x - p.x, dy = pos.y - p.y;
    var threshold = state.inputMethod === 'swipe' ? Core.SWIPE_MOVE_THRESHOLD_PX : Core.TOUCH_MOVE_THRESHOLD_PX;
    if (!Core.meetsMoveThreshold(dx, dy, threshold)) return;
    p.x = pos.x; p.y = pos.y;
    recordEvent({
      type: 'move', inputMethod: state.inputMethod, timestamp: performance.now(),
      position: { x: pos.x, y: pos.y }, movement: { dx: dx, dy: dy }
    });
  }

  function endPointer(e, cancelled) {
    if (!isPointerInputMethod()) return;
    var p = activePointers[e.pointerId];
    if (!p) return;
    delete activePointers[e.pointerId];
    var now = performance.now();
    recordEvent({
      type: cancelled ? 'cancel' : 'release', inputMethod: state.inputMethod, timestamp: now,
      duration: Core.computeDuration(p.startTs, now),
      position: { x: p.x, y: p.y }
    });
  }
  function onPointerUp(e) { endPointer(e, false); }
  function onPointerCancel(e) { endPointer(e, true); }

  // ===== 外部スイッチ（Switch Scan、directions-app.htmlの6関数パターンを一般化） =====
  // 既存アプリ(directions-app.html等)側のコードは変更しない。Access側で同等の
  // ロジックを新規実装し、既存に無かったe.repeat抑制を追加する
  // (Design Approval文書4.2節で確認した既存21アプリ共通のギャップへの対応)。
  var SCAN_SPEED_MS = 1200;

  function clearScanHighlight() {
    scanState.items.forEach(function (el) { el.classList.remove('scan-focus'); });
  }

  function refreshScanItems() {
    var activeScreen = screens.activity;
    return Core.buildScanItems(activeScreen).filter(function (el) {
      return el.offsetParent !== null; // switchActionBtnはdisplay:noneの時があるため除外
    });
  }

  function stopScan() {
    if (scanState.timer) { clearInterval(scanState.timer); scanState.timer = null; }
    clearScanHighlight();
  }

  function startScan() {
    stopScan();
    if (state.inputMethod !== 'switch') return;
    var items = refreshScanItems();
    if (items.length === 0) return;
    scanState.items = items;
    scanState.index = 0;
    var highlight = function () {
      clearScanHighlight();
      if (scanState.items[scanState.index]) scanState.items[scanState.index].classList.add('scan-focus');
      scanState.index = (scanState.index + 1) % scanState.items.length;
    };
    highlight();
    scanState.timer = setInterval(highlight, SCAN_SPEED_MS);
  }

  function activateCurrentScanItem() {
    var focused = activitySurface.querySelector('.scan-focus') || (endBtn.classList.contains('scan-focus') ? endBtn : null);
    if (!focused) return;
    var now = performance.now();
    pendingSwitchActivateTs = now;
    var pos = elementCenterLocalXY(focused);
    recordEvent({
      type: 'activate', inputMethod: 'switch', timestamp: now,
      position: focused === endBtn ? null : pos
    });
    if (focused === endBtn) {
      endActivity();
      return;
    }
    triggerFeedback(pos.x, pos.y);
  }

  // 活動画面(#screen-activity)がactiveな時のみSpace/Enterをスキャン操作として
  // 扱う(Design v2.1 §6・承認事項5)。これが無いと、終了画面(#screen-end)の
  // 観察フォームのcheckbox/radioにフォーカスした状態でSpaceを押した際、
  // ネイティブのトグル操作をe.preventDefault()が妨げてしまう
  // (既存のvisibilitychangeハンドラのscreens.activity.classList.contains('active')
  // 確認と同じ前例を踏襲)。
  function onSwitchKeyDown(e) {
    if (!screens.activity.classList.contains('active')) return;
    if (state.inputMethod !== 'switch') return;
    if (e.key !== ' ' && e.key !== 'Enter') return;
    e.preventDefault();
    if (!repeatGuard.onKeyDown(e.key, e.repeat)) return; // OSキーリピート・二重押下開始を抑制
    unlockAudioContext();
    activateCurrentScanItem();
  }

  function onSwitchKeyUp(e) {
    if (!screens.activity.classList.contains('active')) return;
    if (e.key !== ' ' && e.key !== 'Enter') return;
    if (!repeatGuard.onKeyUp(e.key)) return;
    if (pendingSwitchActivateTs === null) return;
    var now = performance.now();
    recordEvent({
      type: 'release', inputMethod: 'switch', timestamp: now,
      duration: Core.computeDuration(pendingSwitchActivateTs, now)
    });
    pendingSwitchActivateTs = null;
  }

  // blur・画面非表示時の安全な解除（長押し誤発火防止・押下状態のリーク防止）。
  function releaseAllSwitchState() {
    var leaked = repeatGuard.releaseAll();
    if (leaked.length > 0 && pendingSwitchActivateTs !== null) {
      recordEvent({ type: 'cancel', inputMethod: 'switch', timestamp: performance.now() });
    }
    pendingSwitchActivateTs = null;
  }

  window.addEventListener('blur', releaseAllSwitchState);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      releaseAllSwitchState();
      stopScan();
    } else if (state.inputMethod === 'switch' && screens.activity.classList.contains('active')) {
      startScan();
    }
  });

  // ===== 入力方式切替・画面遷移時の状態初期化 =====
  // 入力方式切替・画面離脱のいずれでも、前の入力状態（走査タイマー・押下状態・
  // ポインタ）を必ずクリアしてから次の状態へ入る(Step 6・Step 9の明示要求)。
  function teardownInputState() {
    stopScan();
    releaseAllSwitchState();
    activePointers = Object.create(null);
  }

  function applyInputMethodToBody() {
    document.body.classList.toggle('input-switch', state.inputMethod === 'switch');
    document.body.classList.toggle('input-touch', state.inputMethod === 'touch');
  }

  // makeSessionId(): session識別のためだけのローカル一意文字列。個人情報は
  // 含まない。暗号学的な一意性は要求しない(衝突しても1件の記録表示が多少
  // ずれるだけで、安全性に影響しない用途のため)。
  function makeSessionId() {
    return 'access-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
  }

  function startActivity() {
    teardownInputState();
    state.events = [];
    state.sessionId = makeSessionId();
    state.startedAt = new Date().toISOString();
    applyInputMethodToBody();
    showScreen('activity');
    if (state.inputMethod === 'switch') {
      // レイアウト確定後にscanを開始する(switchActionBtnのoffsetParent判定が
      // display切替直後は不安定なため、次フレームへ回す)。
      requestAnimationFrame(function () { startScan(); });
    }
  }

  // showSaveFailureBanner(): 保存失敗時の表示(設計文書8章)。既存アプリの
  // donomanaRecordNotifySaveFailure()と同じ方針(視覚+スクリーンリーダー、
  // silentに握りつぶさない)をAccess側で新規実装したもの。
  function showSaveFailureBanner(reason) {
    var msg = '今回の記録を端末に保存できませんでした（理由: ' + reason + '）。' +
      '端末の空き容量やブラウザの設定をご確認ください。';
    saveFailureBanner.textContent = msg;
    saveFailureBanner.style.display = 'block';
  }
  function hideSaveFailureBanner() {
    saveFailureBanner.style.display = 'none';
    saveFailureBanner.textContent = '';
  }

  // ===== 教員観察記録(Design v2.1、2026-10-18承認) =====
  function showPruneNotice(msg) {
    pruneNotice.textContent = msg;
    pruneNotice.style.display = 'block';
  }
  function hidePruneNotice() {
    pruneNotice.style.display = 'none';
    pruneNotice.textContent = '';
  }

  // resetObservationForm(): 新しいsession（activity）ごとに観察フォームを
  // 初期状態（すべて未記録）へ戻す。前回sessionの入力が次回へ持ち越されない
  // ようにする(Design v2.1 §4：schemaVersion/sessionIdはsession単位で別)。
  function resetObservationForm() {
    postureRadios.forEach(function (r) { r.checked = (r.value === '未記録'); });
    operationPartRadios.forEach(function (r) { r.checked = (r.value === '未記録'); });
    teacherObservationCheckboxes.forEach(function (cb) { cb.checked = false; });
    supportUnrecordedToggle.checked = true;
    supportNoneConfirmedToggle.checked = false;
    supportTypeCheckboxes.forEach(function (cb) { cb.checked = false; });
    observationStatus.textContent = '';
  }

  // syncSupportState(): 「活動時の支援」3状態(未記録／特になし確認済み／具体的支援あり、
  // Design v2.1 §3-B)の排他制御を、disabled属性による操作ブロックではなく、常に
  // 操作可能なcheckbox群へのイベント駆動の相互調整で実現する(Phase 5B-3 UX修正)。
  // 「未記録」がONの状態で個別支援項目を直接タップできる(未記録を手動で外す
  // 追加操作を要求しない、UX仕様B)よう、どのcheckboxも無効化しない。
  //   trigger='unrecorded': 「未記録」がONにされた → 他を全解除する(仕様E)。
  //   trigger='noneConfirmed': 「特になし確認済み」がONにされた → 未記録・個別項目を解除する(仕様D)。
  //   trigger='type': 個別支援項目のON/OFFが変化した → 1件以上ONなら未記録・特になしを解除する(仕様B・C)。
  //   いずれのtriggerの結果でも、個別項目・特になしのいずれも選択されていない状態に
  //   なった場合は「未記録」へ復帰させる(仕様F：recorded=true・types=[]という曖昧な
  //   状態が、個別項目の解除だけで無断生成されることを防ぐ。「特になし確認済み」は
  //   明示的な選択によってのみ成立する、という§3-Bの3状態定義を保つ)。
  function syncSupportState(trigger) {
    if (trigger === 'unrecorded' && supportUnrecordedToggle.checked) {
      supportNoneConfirmedToggle.checked = false;
      supportTypeCheckboxes.forEach(function (cb) { cb.checked = false; });
      return;
    }
    if (trigger === 'noneConfirmed' && supportNoneConfirmedToggle.checked) {
      supportUnrecordedToggle.checked = false;
      supportTypeCheckboxes.forEach(function (cb) { cb.checked = false; });
      return;
    }
    var anyTypeChecked = Array.prototype.some.call(supportTypeCheckboxes, function (cb) { return cb.checked; });
    if (trigger === 'type' && anyTypeChecked) {
      supportUnrecordedToggle.checked = false;
      supportNoneConfirmedToggle.checked = false;
      return;
    }
    // 上記いずれにも該当しない(未記録を直接OFFにした・特になしをOFFにした・
    // 最後の個別項目をOFFにした等)場合、個別項目も特になしも選択されていなければ
    // 曖昧な状態を残さず未記録へ復帰する。
    if (!anyTypeChecked && !supportNoneConfirmedToggle.checked) {
      supportUnrecordedToggle.checked = true;
    }
  }

  supportUnrecordedToggle.addEventListener('change', function () { syncSupportState('unrecorded'); });
  supportNoneConfirmedToggle.addEventListener('change', function () { syncSupportState('noneConfirmed'); });
  supportTypeCheckboxes.forEach(function (cb) {
    cb.addEventListener('change', function () { syncSupportState('type'); });
  });

  // 「判断が難しい」と他の2項目は排他(UI側、Design v2.1 §3-D)。データ層でも
  // isValidTeacherImpression()で同じ制約を保存時に再検証する(§4.1)。
  teacherObservationCheckboxes.forEach(function (cb) {
    cb.addEventListener('change', function () {
      if (!cb.checked) return;
      if (cb.value === '判断が難しい') {
        teacherObservationCheckboxes.forEach(function (other) {
          if (other !== cb) other.checked = false;
        });
      } else {
        teacherObservationCheckboxes.forEach(function (other) {
          if (other.value === '判断が難しい') other.checked = false;
        });
      }
    });
  });

  // collectObservationInput(): フォームの現在値をnoteレコード相当の形
  // {posture,support,operationPart,teacherImpression}に集約する純粋な読み取り。
  function collectObservationInput() {
    var posture = '未記録';
    postureRadios.forEach(function (r) { if (r.checked) posture = r.value; });
    var operationPart = '未記録';
    operationPartRadios.forEach(function (r) { if (r.checked) operationPart = r.value; });
    var types = [];
    supportTypeCheckboxes.forEach(function (cb) { if (cb.checked) types.push(cb.value); });
    var observations = [];
    teacherObservationCheckboxes.forEach(function (cb) { if (cb.checked) observations.push(cb.value); });
    return {
      posture: posture,
      support: { recorded: !supportUnrecordedToggle.checked, types: types },
      operationPart: operationPart,
      teacherImpression: { recorded: observations.length > 0, observations: observations }
    };
  }

  // saveObservationBtn: 明示的な保存操作のみでnotesキーへ書き込む
  // (Design v2.1 §4)。保存を妨げるすべての条件（未入力・sessionId不在・
  // ログ側異常・既存note不正・書込失敗）は、既存データを一切変更せずに
  // 保留し、断定しすぎない文言で利用者に伝える(§4.2・§5-8と同じ精神)。
  saveObservationBtn.addEventListener('click', function () {
    var input = collectObservationInput();
    if (Core.isNoteContentEmpty(input)) {
      observationStatus.textContent = '記録する内容が選択されていなかったため、何も保存しませんでした。';
      return;
    }
    if (typeof state.sessionId !== 'string' || !state.sessionId) {
      observationStatus.textContent = '保存対象の活動が見つからなかったため、保存できませんでした。';
      return;
    }
    var logRead = Core.safeReadSessions(localStorage);
    if (logRead.anomaly !== null) {
      observationStatus.textContent = '活動記録を正しく読み込めなかったため、観察記録を保存できませんでした。';
      return;
    }
    if (!Core.findNoteBySessionId(logRead.items, state.sessionId)) {
      observationStatus.textContent = '対応する活動記録が見つからなかったため、観察記録を保存できませんでした。';
      return;
    }
    var note = Core.buildNoteRecord({
      sessionId: state.sessionId,
      posture: input.posture,
      support: input.support,
      operationPart: input.operationPart,
      teacherImpression: input.teacherImpression,
      recordedAt: new Date().toISOString()
    });
    if (!Core.isValidNoteRecord(note)) {
      observationStatus.textContent = '入力内容を確認できなかったため、観察記録を保存できませんでした。';
      return;
    }
    var notesRead = Core.safeReadNotes(localStorage);
    if (notesRead.anomaly !== null) {
      observationStatus.textContent = '既存の観察記録を正しく読み込めなかったため、今回の保存を見合わせました。保存済みの記録はそのまま保持されています。';
      return;
    }
    var upsertResult = Core.upsertNote(notesRead.items, note);
    if (!upsertResult.ok) {
      observationStatus.textContent = '以前の記録に問題が見つかったため、今回の保存を一時的に見合わせました。保存済みの記録はそのまま保持されています。';
      return;
    }
    var writeResult = Core.writeNotes(localStorage, upsertResult.items);
    if (!writeResult.ok) {
      observationStatus.textContent = '観察記録を端末に保存できませんでした（理由: ' + writeResult.reason + '）。';
      return;
    }
    observationStatus.textContent = '観察記録を保存しました。';
  });

  // attemptNotesPrune(): MAX_SESSIONS超過で切り捨てられたsessionIdに対応する
  // 孤立観察記録を整理する(Design v2.1 §5-4〜§5-5・§5-12)。ログ側・notes側
  // の両方が異常なく読み込めた場合のみ実行し、軸A（sessionId対応）のみを
  // 削除基準とする。renderStoredSummary()から1回の表示につき1回のみ呼ばれる
  // (§5-8「同一画面表示中に無制限な自動再試行を繰り返さない」)。
  function attemptNotesPrune() {
    hidePruneNotice();
    var logRead = Core.safeReadSessions(localStorage);
    if (logRead.anomaly !== null) return; // ログ側異常時はpruneしない(§5-6)
    var notesRead = Core.safeReadNotes(localStorage);
    if (notesRead.anomaly !== null) return; // notes側異常時もpruneしない(§5-7)
    var validSessionIds = logRead.items
      .map(function (s) { return s && s.sessionId; })
      .filter(function (id) { return typeof id === 'string' && id; });
    var pruneResult = Core.pruneOrphanNotes(validSessionIds, notesRead.items);
    if (!pruneResult.ok) return; // 軸Aを安全に判定できないレコードがある場合は保留(§5-12)
    if (pruneResult.items.length === notesRead.items.length) return; // 変更なし、書込不要
    var writeResult = Core.writeNotes(localStorage, pruneResult.items);
    if (!writeResult.ok) {
      // setItem()は1キー全体が成功するか例外を投げるかのいずれかであり、
      // 失敗時は既存の保存済み内容が変更されていないことが保証される(§5-8)。
      showPruneNotice('記録の整理を完了できませんでした。保存済みの記録はそのまま保持されています。');
    }
  }

  // renderStoredSummary(): 端末内に保存されている全記録の件数表示
  // (設計文書10章「終了後の簡易記録表示」)。件数のみの客観的事実であり、
  // 主体性・意欲の評価は一切行わない(設計文書7.4節原則)。
  function renderStoredSummary() {
    var read = Core.safeReadSessions(localStorage);
    var summary = Core.summarizeSessions(read.items);
    storedSummaryText.textContent = 'これまでに端末へ保存された記録は ' + summary.sessionCount +
      '件、合計の操作は ' + summary.totalActivateCount + '回です。';
    attemptNotesPrune();
  }

  function endActivity() {
    teardownInputState();
    hideSaveFailureBanner();
    resetObservationForm();
    var count = state.events.filter(function (e) { return e.type === 'activate'; }).length;
    var inputMethodLabel = state.inputMethod === 'touch' ? 'タッチ' :
      state.inputMethod === 'swipe' ? 'スワイプ' : '外部スイッチ';
    summaryText.textContent = '今回の操作（はたらきかけ）は ' + count + ' 回でした（入力方式: ' +
      inputMethodLabel + '）。';

    // ===== 端末内保存(設計文書8章、Must機能#7) =====
    var sessionRecord = Core.buildSessionRecord({
      sessionId: state.sessionId,
      inputMethod: state.inputMethod,
      startedAt: state.startedAt,
      endedAt: new Date().toISOString(),
      events: state.events
    });
    var existing = Core.safeReadSessions(localStorage);
    var updated = Core.appendSession(existing.items, sessionRecord, Core.MAX_SESSIONS);
    var writeResult = Core.writeSessions(localStorage, updated);
    if (!writeResult.ok) showSaveFailureBanner(writeResult.reason);
    renderStoredSummary();

    showScreen('end');
  }

  // ===== 記録削除(設計文書8章Must、他者との端末共用リスクへの対処) =====
  // Design v2.1 §5-1: notesキーを先に削除し、成功を確認した後にlogsキーを
  // 削除する(clearAllAccessData()。既存のclearSessions()自体は変更しない)。
  function resetDeleteConfirm() {
    deleteConfirmRow.classList.remove('show');
  }
  deleteRecordsBtn.addEventListener('click', function () {
    deleteConfirmRow.classList.add('show');
  });
  deleteConfirmNoBtn.addEventListener('click', resetDeleteConfirm);
  deleteConfirmYesBtn.addEventListener('click', function () {
    var result = Core.clearAllAccessData(localStorage);
    resetDeleteConfirm();
    if (result.ok) {
      deleteStatus.textContent = '保存されていた記録を削除しました。';
      renderStoredSummary();
    } else {
      var failedParts = [];
      if (!result.notes.ok) failedParts.push('観察記録');
      if (!result.logs.ok) failedParts.push('活動記録');
      deleteStatus.textContent = '記録の削除に失敗しました（対象: ' + failedParts.join('・') + '）。';
    }
  });

  // ===== イベント結線 =====
  activitySurface.addEventListener('pointerdown', onPointerDown);
  activitySurface.addEventListener('pointermove', onPointerMove);
  activitySurface.addEventListener('pointerup', onPointerUp);
  activitySurface.addEventListener('pointercancel', onPointerCancel);

  document.addEventListener('keydown', onSwitchKeyDown);
  document.addEventListener('keyup', onSwitchKeyUp);

  soundToggle.addEventListener('change', function () { state.soundOn = soundToggle.checked; });
  reduceMotionToggle.addEventListener('change', function () {
    state.reduceMotion = reduceMotionToggle.checked;
    document.body.classList.toggle('reduce-motion', state.reduceMotion);
  });

  document.querySelectorAll('input[name="inputMethod"]').forEach(function (radio) {
    radio.addEventListener('change', function () {
      if (radio.checked) state.inputMethod = radio.value;
    });
  });

  startBtn.addEventListener('click', startActivity);
  endBtn.addEventListener('click', endActivity);
  restartBtn.addEventListener('click', function () {
    resetDeleteConfirm();
    hideSaveFailureBanner();
    showScreen('setup');
  });

})();
</script>
</body>
</html>
