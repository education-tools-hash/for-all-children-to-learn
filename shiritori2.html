<div id="donomanaAnnouncePolite" role="status" aria-live="polite" aria-atomic="true" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;padding:0;margin:-1px;"></div>
<div id="donomanaAnnounceAssertive" role="alert" aria-live="assertive" aria-atomic="true" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;padding:0;margin:-1px;"></div>
<script>
(function(){
  if (window.donomanaAnnounce) return;
  var politeTimer = null, assertiveTimer = null;
  function donomanaAnnounce(message, options){
    if (typeof message !== 'string') return;
    if (message.trim() === '') return;
    var opts = options || {};
    var priority = (opts.priority === 'assertive') ? 'assertive' : 'polite';
    var clearDelay = (typeof opts.clearDelay === 'number' && Number.isFinite(opts.clearDelay) && opts.clearDelay >= 0) ? opts.clearDelay : 50;
    var elId = (priority === 'assertive') ? 'donomanaAnnounceAssertive' : 'donomanaAnnouncePolite';
    var live = document.getElementById(elId);
    if (!live) return;
    if (priority === 'assertive') { clearTimeout(assertiveTimer); } else { clearTimeout(politeTimer); }
    live.textContent = '';
    var timer = setTimeout(function(){ live.textContent = message; }, clearDelay);
    if (priority === 'assertive') { assertiveTimer = timer; } else { politeTimer = timer; }
  }
  window.donomanaAnnounce = donomanaAnnounce;
})();
</script>
<!-- /announce-helper -->

<style>.settings-btn{display:none !important;pointer-events:none !important;}</style>
<style>#donomanaA11yBtn:focus-visible,#donomanaA11yPanel button:focus-visible{outline:3px solid #00A99D;outline-offset:2px;}</style>
<button id="donomanaA11yBtn" class="scannable" data-scan="1" aria-label="アクセシビリティ設定" aria-expanded="false" aria-controls="donomanaA11yPanel" title="アクセシビリティ設定" style="position:fixed;bottom:16px;right:16px;z-index:99998;width:48px;height:48px;border-radius:50%;border:none;background:#00A99D;color:#fff;font-size:22px;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,0.25);display:flex;align-items:center;justify-content:center;">⚙</button>

    <button data-a11y-sr="off" style="flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;padding:8px 4px;border-radius:8px;border:2px solid #ddd;background:#fff;font-size:12px;font-weight:700;cursor:pointer;">オフ</button>
    <button data-a11y-sr="on" style="flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;padding:8px 4px;border-radius:8px;border:2px solid #ddd;background:#fff;font-size:12px;font-weight:700;cursor:pointer;">オン</button>

</div>
<div id="donomanaA11yStatus" role="status" aria-live="polite" aria-atomic="true" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;padding:0;margin:-1px;"></div>
<script>
(function(){
  var P = 'donomana-a11y-';
  function all(sel){return document.querySelectorAll(sel);}
  function mark(sel, dataAttr, value){
    all(sel).forEach(function(b){
      var on = b.dataset[dataAttr] === value;
      b.style.background = on ? '#00A99D' : '#fff';
      b.style.color = on ? '#fff' : '#333';
      b.style.borderColor = on ? '#00A99D' : '#ddd';
    });
  }
  var donomanaAnnounceA11yTimer = null;
  function donomanaAnnounceA11y(msg){
    var live = document.getElementById('donomanaA11yStatus');
    if (!live) return;
    clearTimeout(donomanaAnnounceA11yTimer);
    live.textContent = '';
    donomanaAnnounceA11yTimer = setTimeout(function(){ live.textContent = msg; }, 50);
  }
  function applyContrast(mode){
    // 背景を黒・文字を白に反転する方式(弱視・色覚特性のある方向けに、
    // 単純なコントラスト強調より確実に見やすくなるため)
    document.documentElement.style.filter = (mode === 'hc') ? 'invert(1) hue-rotate(180deg)' : '';
    mark('[data-a11y-contrast]', 'a11yContrast', mode);
    localStorage.setItem(P + 'contrast', mode);
  }
  function applyFont(size){
    var zoomMap = { normal: '', large: '125%', xlarge: '150%' };
    document.body.style.zoom = zoomMap[size] || '';
    mark('[data-a11y-font]', 'a11yFont', size);
    localStorage.setItem(P + 'font', size);
  }
  
  var srEnabled = false;
  function speak(text){
    if (!srEnabled || !window.speechSynthesis || !text) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text.trim());
    u.lang = 'ja-JP'; u.rate = 0.95;
    window.speechSynthesis.speak(u);
  }
  function onGlobalSpeakClick(e){
    if (!srEnabled) return;
    if (e.target.closest('#donomanaA11yPanel, #donomanaA11yBtn')) return;
    var el = e.target.closest('button, a, [role="button"]');
    if (!el) return;
    var text = (el.getAttribute('aria-label') || el.textContent || '').trim();
    if (text) speak(text);
  }
  function applyScreenReader(enabled){
    srEnabled = enabled;
    mark('[data-a11y-sr]', 'a11ySr', enabled ? 'on' : 'off');
    localStorage.setItem(P + 'sr', enabled ? '1' : '0');
    if (enabled) {
      speak('読み上げ機能をオンにしました');
      document.addEventListener('click', onGlobalSpeakClick, true);
    } else {
      window.speechSynthesis && window.speechSynthesis.cancel();
      document.removeEventListener('click', onGlobalSpeakClick, true);
    }
  }
  document.addEventListener('DOMContentLoaded', function(){
    var btn = document.getElementById('donomanaA11yBtn');
    var panel = document.getElementById('donomanaA11yPanel');
    if (!btn || !panel) return;
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var open = panel.style.display === 'block';
      panel.style.display = open ? 'none' : 'block';
      btn.setAttribute('aria-expanded', open ? 'false' : 'true');
      panel.setAttribute('aria-hidden', open ? 'true' : 'false');
    });
    document.addEventListener('click', function(e){
      if (!panel.contains(e.target) && e.target !== btn) {
        panel.style.display = 'none';
        btn.setAttribute('aria-expanded', 'false');
        panel.setAttribute('aria-hidden', 'true');
      }
    });
    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape' && panel.style.display === 'block') btn.click();
    });
    all('[data-a11y-contrast]').forEach(function(b){ b.addEventListener('click', function(){
      applyContrast(b.dataset.a11yContrast);
      donomanaAnnounceA11y(b.dataset.a11yContrast === 'hc' ? 'ハイコントラストをオンにしました' : 'ハイコントラストをオフにしました');
    }); });
    all('[data-a11y-font]').forEach(function(b){ b.addEventListener('click', function(){
      applyFont(b.dataset.a11yFont);
      donomanaAnnounceA11y('文字の大きさを' + ({normal:'標準',large:'大',xlarge:'特大'}[b.dataset.a11yFont] || '標準') + 'にしました');
    }); });
    all('[data-a11y-sr]').forEach(function(b){ b.addEventListener('click', function(){
      applyScreenReader(b.dataset.a11ySr === 'on');
      donomanaAnnounceA11y(b.dataset.a11ySr === 'on' ? '読み上げ機能をオンにしました' : '読み上げ機能をオフにしました');
    }); });
    
  var proxyBtn = document.getElementById('donomanaSettingsProxy');
  if (proxyBtn) {
    // フォーカス可能条件の最小十分セット(Phase16.44-C横断調査で導出、Phase16.45-Bでdisplay/opacity判定を追加):
    // 接続済み・disabledでない・tabIndex!==-1・hidden属性/祖先なし・inert配下でない・
    // クライアント矩形を持つ・display:noneでない・visibility:hidden/collapseでない・opacity:0でない。
    // pointer-events:noneはキーボードフォーカス可否と一致しないため判定条件に含めない。
    function donomanaIsFocusable(el){
      if (!el || !el.isConnected || el.disabled || el.tabIndex === -1) return false;
      if (el.hasAttribute('hidden') || el.closest('[hidden]') || el.closest('[inert]')) return false;
      if (el.getClientRects().length === 0) return false;
      var cs = getComputedStyle(el);
      if (cs.display === 'none' || cs.visibility === 'hidden' || cs.visibility === 'collapse') return false;
      if (Number.parseFloat(cs.opacity) === 0) return false;
      return true;
    }
    function donomanaFirstFocusable(root){
      if (!root) return null;
      var cands = root.querySelectorAll('button, input, select, textarea, a[href], [tabindex]');
      for (var i = 0; i < cands.length; i++) { if (donomanaIsFocusable(cands[i])) return cands[i]; }
      return null;
    }
    proxyBtn.addEventListener('click', function(e){
      // 実際のクリックイベントがこのままdocumentまでバブリングすると、
      // アプリ側の「パネル外をクリックしたら閉じる」処理が、いま開いたばかりの
      // 設定パネルを"外側クリック"と誤認してすぐ閉じてしまう(反応しないように見えるバグの原因)。
      // これを防ぐため、実クリックの伝播はここで止める。
      e.stopPropagation();
      var candidates = Array.from(document.querySelectorAll(".settings-btn"));
      // 複数該当する場合、実際に表示されている（offsetParentがnullでない）ものを優先
      var original = candidates.find(function(el){ return el.offsetParent !== null; }) || candidates[0];
      panel.style.display = 'none';
      btn.setAttribute('aria-expanded', 'false');
      panel.setAttribute('aria-hidden', 'true');
      if (!original) return;
      // Phase16.45-A: 上のpanel非表示により、フォーカス中だった#donomanaSettingsProxyの祖先が
      // display:noneになる。ブラウザは非同期にfocusout(relatedTarget=null)を発生させdocument.body
      // へフォーカスを落とす(Phase16.43調査で確認した既存の構造的バグ)。originalへ明示的にfocusして
      // からclickすることで大半のアプリではこれを未然に防げるが、original自身がdisplay:none等で
      // フォーカス不能なアプリも存在するため(Phase16.44-C調査)、その場合に備えたfallbackも用意する。
      var controlsId = original.getAttribute('aria-controls');
      var beforeVisible = null;
      if (!controlsId) {
        // aria-controlsが無いアプリ向け: クリック前の可視要素集合を保存し、
        // fallback時にクリック後との差分(新たに可視化された要素)を求める。
        beforeVisible = new Set();
        document.querySelectorAll('body *').forEach(function(el){
          if (el.getClientRects().length > 0) beforeVisible.add(el);
        });
      }
      original.focus();
      original.click();
      // BODYへ落ちた場合に加え、original.focus()自体は成功しているがoriginalがgenerate.jsにより
      // 恒常的にopacity:0/display:noneで隠されているため、キーボード操作者から見て不可視なフォーカス
      // (例: time-timerの#settingsToggle)が残るケースも救済する(Phase16.45-B)。アプリ独自のfocus処理が
      // 既にoriginal以外の要素へ移動させている場合はここで何もしない(既存の独自focus処理を壊さないため)。
      // janken-app/register-app等、自前で約50ms後にfocusを移すアプリより十分後の100msで判定する。
      setTimeout(function(){
        var active = document.activeElement;
        var needsFallback = (active === document.body) || (active === original && !donomanaIsFocusable(original));
        if (!needsFallback) return;
        var target = null;
        if (controlsId) {
          target = donomanaFirstFocusable(document.getElementById(controlsId));
        } else {
          var newly = [];
          document.querySelectorAll('body *').forEach(function(el){
            if (el.getClientRects().length > 0 && !beforeVisible.has(el)) newly.push(el);
          });
          for (var i = 0; i < newly.length; i++) {
            if (/^(BUTTON|INPUT|SELECT|TEXTAREA|A)$/.test(newly[i].tagName) && donomanaIsFocusable(newly[i])) { target = newly[i]; break; }
          }
        }
        if (target) target.focus();
      }, 100);
    });
  }
    var resetBtn = document.getElementById('donomanaA11yReset');
    if (resetBtn) resetBtn.addEventListener('click', function(){
      applyContrast('normal'); applyFont('normal'); applyScreenReader(false);
      localStorage.removeItem(P + 'contrast'); localStorage.removeItem(P + 'font'); localStorage.removeItem(P + 'sr');
      donomanaAnnounceA11y('設定をリセットしました');
    });
    applyContrast(localStorage.getItem(P + 'contrast') || 'normal');
    applyFont(localStorage.getItem(P + 'font') || 'normal');
    applyScreenReader(localStorage.getItem(P + 'sr') === '1');
  });
})();
</script>
<!-- /a11y-panel -->
<!-- lock-fs-btn: 自動挿入 (generate.js) -->
<style>#donomanaLockBtn:focus-visible,#donomanaFsBtn:focus-visible{outline:3px solid #00A99D;outline-offset:2px;}</style>
<div style="position:fixed;top:64px;right:12px;z-index:99999;display:flex;gap:8px;">
  <button id="donomanaLockBtn" class="scannable" data-scan="1" aria-label="がめんをロック" title="がめんをロック（画面がうしろに戻るのをふせぎます）" style="min-width:44px;min-height:44px;border-radius:50%;border:none;background:rgba(255,255,255,0.92);font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.2);display:flex;align-items:center;justify-content:center;">🔓</button>
  <button id="donomanaFsBtn" class="scannable" data-scan="1" aria-label="全画面表示" title="全画面表示" style="min-width:44px;min-height:44px;border-radius:50%;border:none;background:rgba(255,255,255,0.92);font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.2);display:flex;align-items:center;justify-content:center;">⛶</button>
</div>
<div id="donomanaLockToast" role="alert" aria-live="assertive" style="position:fixed;top:112px;left:50%;transform:translateX(-50%) translateY(-10px);background:#c0392b;color:#fff;font-size:14px;font-weight:700;padding:10px 20px;border-radius:40px;box-shadow:0 4px 24px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:100000;white-space:nowrap;"></div>
<script>
(function(){
  var locked=false, toastTimer=null;
  function toast(msg){
    var el=document.getElementById('donomanaLockToast');
    if(!el)return;
    el.textContent=msg;
    el.style.opacity='1'; el.style.transform='translateX(-50%) translateY(0)';
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){el.style.opacity='0';el.style.transform='translateX(-50%) translateY(-10px)';},2200);
  }
  function setLock(on){
    locked=on;
    var btn=document.getElementById('donomanaLockBtn');
    if(btn){
      btn.textContent=on?'🔒':'🔓';
      btn.style.background=on?'rgba(255,80,80,0.92)':'rgba(255,255,255,0.92)';
      btn.setAttribute('aria-label',on?'ロックちゅう（タップでかいじょ）':'がめんをロック');
    }
    if(on){
      history.pushState({donomanaLocked:true},'');
      history.pushState({donomanaLocked:true},'');
      toast('🔒 がめんをロックしたよ');
    } else {
      toast('🔓 ロックをかいじょしたよ');
    }
  }
  window.addEventListener('popstate',function(){
    if(locked){history.pushState({donomanaLocked:true},'');toast('🔒 まえの がめんには もどれないよ');}
  });
  window.addEventListener('beforeunload',function(e){
    if(locked){e.preventDefault();e.returnValue='';}
  });
  document.addEventListener('DOMContentLoaded',function(){
    var lockBtn=document.getElementById('donomanaLockBtn');
    if(lockBtn)lockBtn.addEventListener('click',function(){setLock(!locked);});
    var homeBtn=document.getElementById('donomanaHomeBtn');
    if(homeBtn){
      homeBtn.addEventListener('click',function(e){
        if(locked){e.preventDefault();toast('🔒 まえの がめんには もどれないよ');}
      });
    }
    var fsBtn=document.getElementById('donomanaFsBtn');
    function inFS(){return !!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement);}
    function updateFsBtn(){if(fsBtn){fsBtn.textContent=inFS()?'⊡':'⛶';fsBtn.setAttribute('aria-label',inFS()?'全画面を解除':'全画面表示');}}
    ['fullscreenchange','webkitfullscreenchange','mozfullscreenchange'].forEach(function(ev){document.addEventListener(ev,updateFsBtn);});
    if(fsBtn)fsBtn.addEventListener('click',function(){
      if(!inFS()){
        var el=document.documentElement;
        var req=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen;
        if(req)req.call(el);
      } else {
        var ex=document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen;
        if(ex)ex.call(document);
      }
    });
  });
})();
</script>

<!-- 設定パネル（Design System Ver.2.1 §7.6.1 Settings Panel準拠） -->
<div class="settings-scrim" id="settingsScrim" data-state="closed"></div>
<aside class="settings-panel" id="settingsPanel" role="region" aria-label="せってい" data-state="closed">
    <div class="settings-title">⚙️ せってい</div>

    <!-- ハイコントラスト -->
    <div class="settings-row">
      <label>🎨 ハイコントラスト</label>
      <div class="toggle-wrap">
        <label class="toggle">
          <input type="checkbox" id="toggleContrast" onchange="applyContrast()">
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <!-- 文字サイズ -->
    <div class="settings-row settings-slider-row">
      <label>🔡 もじのおおきさ</label>
      <div class="slider-ctrl">
        <input type="range" id="fontSizeSlider" min="0.8" max="1.6" step="0.1" value="1" oninput="applyFontSize()">
        <span class="settings-value" id="fontSizeVal">ふつう</span>
      </div>
    </div>

    <!-- 読み上げON/OFF -->
    <div class="settings-row">
      <label>🔊 よみあげ</label>
      <div class="toggle-wrap">
        <label class="toggle">
          <input type="checkbox" id="toggleSpeech" checked onchange="applySpeechEnabled()">
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <!-- 読み上げ速度 -->
    <div class="settings-row settings-slider-row" id="speechRateRow">
      <label>🔊 よみあげのはやさ</label>
      <div class="slider-ctrl">
        <input type="range" id="speechRateSlider" min="0.5" max="1.5" step="0.1" value="1" oninput="applySpeechRate()">
        <span class="settings-value" id="speechRateVal">ふつう</span>
      </div>
    </div>

    <!-- スイッチスキャン -->
    <div class="settings-row">
      <label>🕹️ スイッチスキャン</label>
      <div class="toggle-wrap">
        <label class="toggle">
          <input type="checkbox" id="toggleScan" onchange="applyScan()">

  const v = speechSynthesis.getVoices();
  return v.find(x => x.lang==='ja-JP' && /google/i.test(x.name))
      || v.find(x => x.lang==='ja-JP' && /microsoft/i.test(x.name))
      || v.find(x => x.lang==='ja-JP') || null;
}
function speak(text, rate, pitch=1.15) {
  if (!speechEnabled) return;
  if (!window.speechSynthesis) return;
  const r = rate !== undefined ? rate : speechRate;
  speechSynthesis.cancel();
  const parts = text.split('/').map(s => s.trim()).filter(Boolean);
  let delay = 0;
  parts.forEach(part => {
    setTimeout(() => {
      const u = new SpeechSynthesisUtterance(part);
      u.lang = 'ja-JP'; u.rate = r; u.pitch = pitch;
      const v = getJaVoice(); if (v) u.voice = v;
      speechSynthesis.speak(u);
    }, delay);
    delay += part.length * 120 + 300;
  });
}
if (typeof speechSynthesis !== 'undefined') speechSynthesis.onvoiceschanged = () => {};

function openSettings() {
  document.getElementById('settingsPanel').setAttribute('data-state', 'open');

  document.getElementById('settingsBtn').setAttribute('aria-expanded', 'true');
  const firstControl = document.getElementById('settingsPanel').querySelector('input, select, button');
  if (firstControl) firstControl.focus();
  if (scanEnabled) { stopScan(); startScan(); }
}
function closeSettings() {
  document.getElementById('settingsPanel').setAttribute('data-state', 'closed');
  document.getElementById('settingsScrim').setAttribute('data-state', 'closed');
  document.getElementById('settingsBtn').setAttribute('aria-expanded', 'false');

  // #settingsBtn 自体は生成時点で display:none のため、フォーカスしても意味を持たない。
  const visibleTrigger = document.getElementById('donomanaA11yBtn') || document.getElementById('settingsBtn');
  if (visibleTrigger) visibleTrigger.focus();
  if (scanEnabled) { stopScan(); startScan(); }
}

document.addEventListener('keydown', function(e) {

  document.documentElement.style.setProperty('--font-scale', val);
  const labels = {0.8:'ちいさい', 0.9:'すこしちいさい', 1.0:'ふつう', 1.1:'すこしおおきい', 1.2:'おおきい', 1.3:'もっとおおきい', 1.4:'とてもおおきい', 1.5:'さいだい', 1.6:'さいだい'};
  document.getElementById('fontSizeVal').textContent = labels[val] || 'ふつう';
}

function applySpeechEnabled() {
  speechEnabled = document.getElementById('toggleSpeech').checked;
  const rateRow = document.getElementById('speechRateRow');
  rateRow.style.opacity = speechEnabled ? '1' : '0.4';
  rateRow.style.pointerEvents = speechEnabled ? 'auto' : 'none';
  if (!speechEnabled) speechSynthesis.cancel();
}

function applySpeechRate() {
  speechRate = parseFloat(document.getElementById('speechRateSlider').value);
  const labels = {0.5:'とてもゆっくり', 0.6:'ゆっくり', 0.7:'すこしゆっくり', 0.8:'ちょっとゆっくり', 0.9:'すこしゆっくり', 1.0:'ふつう', 1.1:'すこしはやい', 1.2:'はやい', 1.3:'もっとはやい', 1.4:'とてもはやい', 1.5:'さいこく'};
  document.getElementById('speechRateVal').textContent = labels[speechRate.toFixed(1)] || 'ふつう';
}

function applyScan() {
  scanEnabled = document.getElementById('toggleScan').checked;
  scanMode = document.getElementById('scanMode').value;
  document.getElementById('scanSub').classList.toggle('visible', scanEnabled);
  if (scanEnabled) {
    startScan();
  } else {
    stopScan();
    clearScanFocus();
  }
}

function updateScanSpeed() {
  scanInterval = parseFloat(document.getElementById('scanSpeedSlider').value) * 1000;
  document.getElementById('scanSpeedVal').textContent = document.getElementById('scanSpeedSlider').value + '秒';
  if (scanEnabled) { stopScan(); startScan(); }
}

// ── スイッチスキャン ──
// buildScanItems: 候補取得（旧getScanTargetsから抽出。設定パネル分岐・ゲーム状態分岐は無変更）
function buildScanItems() {
  // 設定パネル表示中は、パネル内の操作要素をスキャン対象にする
  // （Phase16.1で発見：以前はここでスキャンが完全に停止し、パネルを閉じる手段すら
  //   スイッチで到達できなかった。ゲーム側とパネル側、常にどちらかを対象にする）
  if (isSettingsOpen()) {
    const panel = document.getElementById('settingsPanel');
    return Array.from(panel.querySelectorAll('input, select, button')).filter(el => el.offsetParent !== null);
  }
  const targets = [];
  const gameArea = document.getElementById('gameArea');
  const nextBtn = document.getElementById('nextBtn');
  if (gameArea && gameArea.style.display !== 'none' && !answered) {
    targets.push(document.getElementById('card0'));
    targets.push(document.getElementById('card1'));
  } else if (nextBtn && nextBtn.classList.contains('show')) {
    targets.push(nextBtn);
  }
  return targets.filter(Boolean);
}
function getScanTargets() { return buildScanItems(); } // 互換エイリアス（既存呼び出し箇所は無変更）

// clearScanHighlight: 旧clearScanFocusから抽出
function clearScanHighlight() {
  document.querySelectorAll('.scan-focus').forEach(el => el.classList.remove('scan-focus'));
}
function clearScanFocus() { clearScanHighlight(); } // 互換エイリアス（既存呼び出し箇所は無変更）

// refreshSwitchScanItems: 候補再取得＋範囲外時のみidxを0へclamp（無条件リセットはしない）。
// 旧highlightScan・旧activateScanTargetに共通する「再取得＋clamp」部分をそのまま抽出。
function refreshSwitchScanItems() {
  scanTargets = buildScanItems();
  if (scanIndex >= scanTargets.length) scanIndex = 0;
}

function startSwitchScan() {
  stopSwitchScan();
  if (!scanEnabled) return;
  scanTargets = buildScanItems();
  if (scanTargets.length === 0) return;
  scanIndex = 0;

  if (scanMode === '1') {
    // 1スイッチ: 自動でハイライトが移動、スペース/Enterで選択
    highlightScan();
    scanTimer = setInterval(() => {
      scanIndex = (scanIndex + 1) % scanTargets.length;
      highlightScan();
    }, scanInterval);
  } else {
    // 2スイッチ: スペースで進む、Enterで選択
    highlightScan();
  }
}
function startScan() { startSwitchScan(); } // 互換エイリアス（既存呼び出し箇所は無変更）

function stopSwitchScan() {
  // 既存どおりhighlightはここでは消さない（別途clearScanHighlight()の呼び出しに委ねる）
  if (scanTimer) { clearInterval(scanTimer); scanTimer = null; }
}
function stopScan() { stopSwitchScan(); } // 互換エイリアス（既存呼び出し箇所は無変更）

// highlightScan: 現在候補へのハイライト付与。6関数の外に残す内部helper。
function highlightScan() {
  clearScanHighlight();
  refreshSwitchScanItems();
  if (scanTargets.length === 0) return;
  const el = scanTargets[scanIndex];
  if (el) el.classList.add('scan-focus');
}

// キーボードイベント（スイッチ操作）
// 設定パネル表示中もスキャンは止めない。対象は buildScanItems() が
// パネル内の操作要素に自動的に切り替える（Phase16.1で発見した凍結バグの修正）。
// Space advance（2スイッチ時の「次へ進む」）はadapter側の責務としてここに残し、
// 6関数のいずれへも抽出しない（helper7等の新規抽象化は導入しない）。
document.addEventListener('keydown', e => {
  if (!scanEnabled) return;

  if (scanMode === '1') {
    // 1スイッチ: スペース・Enter・任意キーで選択
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      activateCurrentScanItem();
    }
  } else {
    // 2スイッチ: スペースで次へ進む、Enterで選択
    if (e.code === 'Space') {
      e.preventDefault();
      scanTargets = buildScanItems();
      if (scanTargets.length === 0) return;
      scanIndex = (scanIndex + 1) % scanTargets.length;
      highlightScan();
    } else if (e.code === 'Enter') {
      e.preventDefault();
      activateCurrentScanItem();
    }
  }
});

// activateCurrentScanItem: 旧activateScanTargetから抽出。refreshSwitchScanItems()と
// 同一の「再取得＋範囲外時のみclamp」処理を再利用する（元のロジックと完全一致）。
function activateCurrentScanItem() {
  refreshSwitchScanItems();
  if (scanTargets.length === 0) return;
  const el = scanTargets[scanIndex];
  if (el) el.click();
}
function activateScanTarget() { activateCurrentScanItem(); } // 互換エイリアス（既存呼び出し箇所は無変更）

// ── ゲームロジック ──
function getCorrectWords(char) { return wordData.filter(w => w.startN === char && !usedWords.has(w.word)); }
function getWrongWords(char) { return wordData.filter(w => w.startN !== char); }
function ensureContinuable(char) {
  if (getCorrectWords(char).length === 0) {
    usedWords.clear();
    const all = [...new Set(wordData.map(w => w.startN))];
    currentChar = all[Math.floor(Math.random() * all.length)];
  }
}

function loadQuestion() {
  answered = false; isTrapQuestion = false; trapWordShown = null;
  ensureContinuable(currentChar);
  const corrects = getCorrectWords(currentChar);
  const correctWord = corrects[Math.floor(Math.random() * corrects.length)];
  const trapCandidates = trapWords.filter(t => t.startN === currentChar);
  const useTrap = trapCandidates.length > 0 && Math.random() < 0.2;
  let wrongWord;
  if (useTrap) {
    isTrapQuestion = true;
    trapWordShown = trapCandidates[Math.floor(Math.random() * trapCandidates.length)];
    wrongWord = trapWordShown;
  } else {
    const wrongs = getWrongWords(currentChar);
    wrongWord = wrongs[Math.floor(Math.random() * wrongs.length)];
  }
  const left = Math.random() < 0.5;
  correctIdx = left ? 0 : 1;
  document.getElementById('currentCharDisplay').textContent = currentChar;
  document.getElementById('emoji0').textContent = (left ? correctWord : wrongWord).emoji;
  document.getElementById('name0').textContent  = (left ? correctWord : wrongWord).word;
  document.getElementById('emoji1').textContent = (left ? wrongWord : correctWord).emoji;
  document.getElementById('name1').textContent  = (left ? wrongWord : correctWord).word;
  [0,1].forEach(i => {
    const c = document.getElementById('card'+i);
    c.classList.remove('correct-anim','wrong-anim');
    c.style.pointerEvents = 'auto';
    document.getElementById('badge'+i).textContent = '';
  });
  document.getElementById('feedback').classList.remove('show','correct','wrong');
  document.getElementById('nextBtn').classList.remove('show');
  setTimeout(() => {
    speak(`${currentChar}！`, speechRate * 0.75, 1.3);
    setTimeout(() => speak(`から はじまる ことばは、 どれ？`, speechRate * 0.9, 1.0), 1800);
  }, 900);
  if (scanEnabled) setTimeout(() => startScan(), 400);
}

function choose(idx) {
  if (answered) return;
  answered = true;
  stopScan(); clearScanFocus();
  const shown = [
    {word: document.getElementById('name0').textContent},
    {word: document.getElementById('name1').textContent},
  ];
  const isCorrect = (idx === correctIdx);
  const correctWord = shown[correctIdx];
  const card = document.getElementById('card'+idx);
  const correctCard = document.getElementById('card'+correctIdx);
  const feedback = document.getElementById('feedback');
  speak(shown[idx].word, speechRate, 1.1);
  if (isCorrect) {
    card.classList.add('correct-anim');
    document.getElementById('badge'+idx).textContent = '⭕';
    score += streak >= 2 ? 20 : 10; streak++;
    feedback.textContent = `⭕ せいかい！ 「${correctWord.word}」 だよ！🎉`;
    feedback.className = 'feedback show correct';
    spawnStars(card);
    const m = wordData.find(w => w.word === correctWord.word);
    if (m) { usedWords.add(m.word); chain.push(m); currentChar = m.endN; updateChain(); }
    setTimeout(() => speak(`正解！`, speechRate, 1.2), 600);
  } else {
    card.classList.add('wrong-anim');
    document.getElementById('badge'+idx).textContent = '❌';
    correctCard.classList.add('correct-anim');
    document.getElementById('badge'+correctIdx).textContent = '⭕';
    streak = 0;
    if (isTrapQuestion) {
      feedback.textContent = `❌ ざんねん！「${shown[idx].word}」は「ん」でおわるよ！`;
      feedback.className = 'feedback show wrong';
      [0,1].forEach(i => document.getElementById('card'+i).style.pointerEvents = 'none');
      document.getElementById('scoreNum').textContent = score;
      document.getElementById('streakNum').textContent = streak;
      setTimeout(() => speak(`ざんねん！ / 「${shown[idx].word}」は、「ん」で おわるよ！ / しりとりは「ん」が ついたら まけ！`, speechRate, 1.05), 300);
      setTimeout(() => showTrapGameover(shown[idx].word), 2800);
      return;
    } else {
      feedback.textContent = `❌ ざんねん… 「${correctWord.word}」 だったよ！`;
      feedback.className = 'feedback show wrong';
      const m = wordData.find(w => w.word === correctWord.word);
      if (m) { usedWords.add(m.word); chain.push(m); currentChar = m.endN; updateChain(); }
      setTimeout(() => speak(`ざんねん。 / ${correctWord.word} だよ。 / また がんばろう！`, speechRate, 1.05), 600);
    }
  }
  [0,1].forEach(i => document.getElementById('card'+i).style.pointerEvents = 'none');
  document.getElementById('scoreNum').textContent = score;
  document.getElementById('streakNum').textContent = streak;
  questionsAnswered++;
  const nb = document.getElementById('nextBtn');
  nb.textContent = questionsAnswered >= MAX_QUESTIONS ? '🏁 けっか を みる！' : 'つぎへ ➡️';
  nb.classList.add('show');
  setTimeout(() => nb.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 300);
  if (scanEnabled) {
    scanIndex = 0;
    setTimeout(() => startScan(), 400);
  }
}

function updateChain() {
  const container = document.getElementById('chainWords');
  if (chain.length === 0) { container.innerHTML = '<span>はじめましょう！</span>'; return; }
  const display = chain.slice(-4);
  let html = '';
  display.forEach((w, i) => {
    const wordHtml = w.word.split('').map((c,ci) =>
      ci === w.word.length-1 ? `<span class="last-char">${c}</span>` : c
    ).join('');
    html += `<span class="chain-word">${w.emoji} ${wordHtml}</span>`;
    if (i < display.length-1) html += `<span class="chain-arrow">→</span>`;
  });
  html += `<span class="chain-arrow">→</span><span class="current-char">${currentChar}</span>`;
  container.innerHTML = html;
}

function nextQuestion() {
  if (questionsAnswered >= MAX_QUESTIONS) { showGameover(); return; }
  loadQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showTrapGameover(trapWord) {
  document.getElementById('gameArea').style.display = 'none';
  document.getElementById('chainDisplay').style.display = 'none';
  const go = document.getElementById('gameover'); go.classList.add('show');
  document.querySelector('.gameover-emoji').textContent = '😵';
  document.querySelector('.gameover-title').textContent = `「${trapWord}」は「ん」でおわるよ！`;
  document.querySelector('.gameover-score').innerHTML = `スコア: <strong>${score}</strong> てん`;
  document.querySelector('.question-select-label').textContent = 'もういちど あそぶ？';
}

function showGameover() {
  document.getElementById('gameArea').style.display = 'none';
  document.getElementById('chainDisplay').style.display = 'none';
  const go = document.getElementById('gameover'); go.classList.add('show');
  document.querySelector('.gameover-score').innerHTML = `${MAX_QUESTIONS}もん スコア: <strong>${score}</strong> てん`;
  const msg = score >= 160 ? '🌟 かんぺき！' : score >= 100 ? '🎊 すごい！' : '😊 よくがんばった！';
  document.querySelector('.gameover-emoji').textContent = score >= 160 ? '🏆' : '🎉';
  document.querySelector('.gameover-title').textContent = msg;
  speak(`ゲーム おわり！ / スコアは ${score}てん でした。 / すごい ね！ / ${score >= 100 ? 'かんぺき！' : 'よく がんばりました！'}`, speechRate, 1.1);
}

function restartGame(n) {
  MAX_QUESTIONS = n || MAX_QUESTIONS;
  score = 0; streak = 0; questionsAnswered = 0; currentChar = 'い'; chain = []; usedWords = new Set();
  document.getElementById('scoreNum').textContent = 0;
  document.getElementById('streakNum').textContent = 0;
  document.getElementById('gameover').classList.remove('show');
  document.getElementById('gameArea').style.display = 'block';
  document.getElementById('chainDisplay').style.display = 'block';
  updateChain(); loadQuestion();
}

function spawnStars(card) {
  const rect = card.getBoundingClientRect();
  const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
  const emojis = ['⭐','🌟','✨','💫'];
  for (let i = 0; i < 5; i++) {
    setTimeout(() => {
      const s = document.createElement('div');
      s.className = 'star';
      s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      s.style.left = (cx + (Math.random()-0.5)*80) + 'px';
      s.style.top = cy + 'px';
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 1000);
    }, i*80);
  }
}

function goHome() {
  speechSynthesis.cancel(); stopScan(); clearScanFocus();
  score = 0; streak = 0; questionsAnswered = 0; currentChar = 'い'; chain = []; usedWords = new Set();
  document.getElementById('scoreNum').textContent = 0;
  document.getElementById('streakNum').textContent = 0;
  document.getElementById('homeBtn').style.display = 'none';
  document.getElementById('startScreen').style.display = 'block';
  document.getElementById('chainDisplay').style.display = 'none';
  document.getElementById('gameArea').style.display = 'none';
  document.getElementById('gameover').classList.remove('show');
}

let isFullscreen = false;
function toggleFullscreen() {
  const btn = document.getElementById('fullscreenBtn');
  // まずネイティブFullscreen APIを試みる（Android Chrome等）
  if (!isFullscreen) {
    const el = document.documentElement;
    if (el.requestFullscreen) {
      el.requestFullscreen().catch(() => applyCSSFullscreen());
    } else if (el.webkitRequestFullscreen) {
      el.webkitRequestFullscreen();
    } else {
      applyCSSFullscreen();
    }
    isFullscreen = true;
    btn.textContent = '✕ 全画面終了';
  } else {
    if (document.exitFullscreen && document.fullscreenElement) {
      document.exitFullscreen();
    } else if (document.webkitExitFullscreen && document.webkitFullscreenElement) {
      document.webkitExitFullscreen();
    }
    removeCSSFullscreen();
    isFullscreen = false;
    btn.textContent = '⛶ 全画面';
  }
}

function applyCSSFullscreen() {
  document.body.style.cssText += ';position:fixed;top:0;left:0;width:100vw;height:100vh;overflow-y:auto;z-index:9999;';
}

function removeCSSFullscreen() {
  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.left = '';
  document.body.style.width = '';
  document.body.style.height = '';
  document.body.style.overflowY = '';
  document.body.style.zIndex = '';
}

document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) {
    removeCSSFullscreen();
    isFullscreen = false;
    document.getElementById('fullscreenBtn').textContent = '⛶ 全画面';
  }
});
document.addEventListener('webkitfullscreenchange', () => {
  if (!document.webkitFullscreenElement) {
    removeCSSFullscreen();
    isFullscreen = false;
    document.getElementById('fullscreenBtn').textContent = '⛶ 全画面';
  }
});

function startGame(n) {
  MAX_QUESTIONS = n;
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('chainDisplay').style.display = 'block';
  document.getElementById('gameArea').style.display = 'block';
  document.getElementById('homeBtn').style.display = 'inline-block';
  updateChain(); loadQuestion();
}
</script>
