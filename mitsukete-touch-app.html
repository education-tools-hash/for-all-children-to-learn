<script>
(function(){
  if (window.donomanaAnnounce) return;
  var politeTimer = null, assertiveTimer = null;
  function donomanaAnnounce(message, options){
    if (typeof message !== 'string') return;
    if (message.trim() === '') return;
    var opts = options || {};
    var priority = (opts.priority === 'assertive') ? 'assertive' : 'polite';
    var clearDelay = (typeof opts.clearDelay === 'number' && Number.isFinite(opts.clearDelay) && opts.clearDelay >= 0) ? opts.clearDelay : 50;
    var elId = (priority === 'assertive') ? 'donomanaAnnounceAssertive' : 'donomanaAnnouncePolite';
    var live = document.getElementById(elId);
    if (!live) return;
    if (priority === 'assertive') { clearTimeout(assertiveTimer); } else { clearTimeout(politeTimer); }
    live.textContent = '';
    var timer = setTimeout(function(){ live.textContent = message; }, clearDelay);
    if (priority === 'assertive') { assertiveTimer = timer; } else { politeTimer = timer; }
  }
  window.donomanaAnnounce = donomanaAnnounce;
})();

  <button id="donomanaA11yReset" style="width:100%;min-height:44px;display:flex;align-items:center;justify-content:center;padding:8px;border-radius:8px;border:none;background:#f0f0f0;color:#333;font-size:12px;font-weight:900;cursor:pointer;">↺ すべてリセット</button>
</div>
<div id="donomanaA11yStatus" role="status" aria-live="polite" aria-atomic="true" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;padding:0;margin:-1px;"></div>
<script>
(function(){
  var P = 'donomana-a11y-';
  function all(sel){return document.querySelectorAll(sel);}
  function mark(sel, dataAttr, value){
    all(sel).forEach(function(b){
      var on = b.dataset[dataAttr] === value;
      b.style.background = on ? '#00A99D' : '#fff';
      b.style.color = on ? '#fff' : '#333';
      b.style.borderColor = on ? '#00A99D' : '#ddd';
    });
  }
  var donomanaAnnounceA11yTimer = null;
  function donomanaAnnounceA11y(msg){
    var live = document.getElementById('donomanaA11yStatus');
    if (!live) return;
    clearTimeout(donomanaAnnounceA11yTimer);
    live.textContent = '';
    donomanaAnnounceA11yTimer = setTimeout(function(){ live.textContent = msg; }, 50);
  }
  function applyContrast(mode){
    // 背景を黒・文字を白に反転する方式(弱視・色覚特性のある方向けに、
    // 単純なコントラスト強調より確実に見やすくなるため)
    document.documentElement.style.filter = (mode === 'hc') ? 'invert(1) hue-rotate(180deg)' : '';
    mark('[data-a11y-contrast]', 'a11yContrast', mode);
    localStorage.setItem(P + 'contrast', mode);
  }
  function applyFont(size){
    var zoomMap = { normal: '', large: '125%', xlarge: '150%' };
    document.body.style.zoom = zoomMap[size] || '';
    mark('[data-a11y-font]', 'a11yFont', size);
    localStorage.setItem(P + 'font', size);
  }
  
  var srEnabled = false;
  function speak(text){
    if (!srEnabled || !window.speechSynthesis || !text) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text.trim());
    u.lang = 'ja-JP'; u.rate = 0.95;
    window.speechSynthesis.speak(u);
  }
  function onGlobalSpeakClick(e){
    if (!srEnabled) return;
    if (e.target.closest('#donomanaA11yPanel, #donomanaA11yBtn')) return;
    var el = e.target.closest('button, a, [role="button"]');
    if (!el) return;
    var text = (el.getAttribute('aria-label') || el.textContent || '').trim();
    if (text) speak(text);
  }
  function applyScreenReader(enabled){
    srEnabled = enabled;
    mark('[data-a11y-sr]', 'a11ySr', enabled ? 'on' : 'off');
    localStorage.setItem(P + 'sr', enabled ? '1' : '0');
    if (enabled) {
      speak('読み上げ機能をオンにしました');
      document.addEventListener('click', onGlobalSpeakClick, true);
    } else {
      window.speechSynthesis && window.speechSynthesis.cancel();
      document.removeEventListener('click', onGlobalSpeakClick, true);
    }
  }
  document.addEventListener('DOMContentLoaded', function(){
    var btn = document.getElementById('donomanaA11yBtn');
    var panel = document.getElementById('donomanaA11yPanel');
    if (!btn || !panel) return;
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var open = panel.style.display === 'block';
      panel.style.display = open ? 'none' : 'block';
      btn.setAttribute('aria-expanded', open ? 'false' : 'true');
      panel.setAttribute('aria-hidden', open ? 'true' : 'false');
    });
    document.addEventListener('click', function(e){
      if (!panel.contains(e.target) && e.target !== btn) {
        panel.style.display = 'none';
        btn.setAttribute('aria-expanded', 'false');
        panel.setAttribute('aria-hidden', 'true');
      }
    });
    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape' && panel.style.display === 'block') btn.click();
    });
    all('[data-a11y-contrast]').forEach(function(b){ b.addEventListener('click', function(){
      applyContrast(b.dataset.a11yContrast);
      donomanaAnnounceA11y(b.dataset.a11yContrast === 'hc' ? 'ハイコントラストをオンにしました' : 'ハイコントラストをオフにしました');
    }); });
    all('[data-a11y-font]').forEach(function(b){ b.addEventListener('click', function(){
      applyFont(b.dataset.a11yFont);
      donomanaAnnounceA11y('文字の大きさを' + ({normal:'標準',large:'大',xlarge:'特大'}[b.dataset.a11yFont] || '標準') + 'にしました');
    }); });
    all('[data-a11y-sr]').forEach(function(b){ b.addEventListener('click', function(){
      applyScreenReader(b.dataset.a11ySr === 'on');
      donomanaAnnounceA11y(b.dataset.a11ySr === 'on' ? '読み上げ機能をオンにしました' : '読み上げ機能をオフにしました');
    }); });
    
  var proxyBtn = document.getElementById('donomanaSettingsProxy');
  if (proxyBtn) {
    // フォーカス可能条件の最小十分セット(Phase16.44-C横断調査で導出、Phase16.45-Bでdisplay/opacity判定を追加):
    // 接続済み・disabledでない・tabIndex!==-1・hidden属性/祖先なし・inert配下でない・
    // クライアント矩形を持つ・display:noneでない・visibility:hidden/collapseでない・opacity:0でない。
    // pointer-events:noneはキーボードフォーカス可否と一致しないため判定条件に含めない。
    function donomanaIsFocusable(el){
      if (!el || !el.isConnected || el.disabled || el.tabIndex === -1) return false;
      if (el.hasAttribute('hidden') || el.closest('[hidden]') || el.closest('[inert]')) return false;
      if (el.getClientRects().length === 0) return false;
      var cs = getComputedStyle(el);
      if (cs.display === 'none' || cs.visibility === 'hidden' || cs.visibility === 'collapse') return false;
      if (Number.parseFloat(cs.opacity) === 0) return false;
      return true;
    }
    function donomanaFirstFocusable(root){
      if (!root) return null;
      var cands = root.querySelectorAll('button, input, select, textarea, a[href], [tabindex]');
      for (var i = 0; i < cands.length; i++) { if (donomanaIsFocusable(cands[i])) return cands[i]; }
      return null;
    }
    proxyBtn.addEventListener('click', function(e){
      // 実際のクリックイベントがこのままdocumentまでバブリングすると、
      // アプリ側の「パネル外をクリックしたら閉じる」処理が、いま開いたばかりの
      // 設定パネルを"外側クリック"と誤認してすぐ閉じてしまう(反応しないように見えるバグの原因)。
      // これを防ぐため、実クリックの伝播はここで止める。
      e.stopPropagation();
      var candidates = Array.from(document.querySelectorAll("#settingsBtn"));
      // 複数該当する場合、実際に表示されている（offsetParentがnullでない）ものを優先
      var original = candidates.find(function(el){ return el.offsetParent !== null; }) || candidates[0];
      panel.style.display = 'none';
      btn.setAttribute('aria-expanded', 'false');
      panel.setAttribute('aria-hidden', 'true');
      if (!original) return;
      // Phase16.45-A: 上のpanel非表示により、フォーカス中だった#donomanaSettingsProxyの祖先が
      // display:noneになる。ブラウザは非同期にfocusout(relatedTarget=null)を発生させdocument.body
      // へフォーカスを落とす(Phase16.43調査で確認した既存の構造的バグ)。originalへ明示的にfocusして
      // からclickすることで大半のアプリではこれを未然に防げるが、original自身がdisplay:none等で
      // フォーカス不能なアプリも存在するため(Phase16.44-C調査)、その場合に備えたfallbackも用意する。
      var controlsId = original.getAttribute('aria-controls');
      var beforeVisible = null;
      if (!controlsId) {
        // aria-controlsが無いアプリ向け: クリック前の可視要素集合を保存し、
        // fallback時にクリック後との差分(新たに可視化された要素)を求める。
        beforeVisible = new Set();
        document.querySelectorAll('body *').forEach(function(el){
          if (el.getClientRects().length > 0) beforeVisible.add(el);
        });
      }
      original.focus();
      original.click();
      // BODYへ落ちた場合に加え、original.focus()自体は成功しているがoriginalがgenerate.jsにより
      // 恒常的にopacity:0/display:noneで隠されているため、キーボード操作者から見て不可視なフォーカス
      // (例: time-timerの#settingsToggle)が残るケースも救済する(Phase16.45-B)。アプリ独自のfocus処理が
      // 既にoriginal以外の要素へ移動させている場合はここで何もしない(既存の独自focus処理を壊さないため)。
      // janken-app/register-app等、自前で約50ms後にfocusを移すアプリより十分後の100msで判定する。
      setTimeout(function(){
        var active = document.activeElement;
        var needsFallback = (active === document.body) || (active === original && !donomanaIsFocusable(original));
        if (!needsFallback) return;
        var target = null;
        if (controlsId) {
          target = donomanaFirstFocusable(document.getElementById(controlsId));
        } else {
          var newly = [];
          document.querySelectorAll('body *').forEach(function(el){
            if (el.getClientRects().length > 0 && !beforeVisible.has(el)) newly.push(el);
          });
          for (var i = 0; i < newly.length; i++) {
            if (/^(BUTTON|INPUT|SELECT|TEXTAREA|A)$/.test(newly[i].tagName) && donomanaIsFocusable(newly[i])) { target = newly[i]; break; }
          }
        }
        if (target) target.focus();
      }, 100);
    });
  }
    var resetBtn = document.getElementById('donomanaA11yReset');
    if (resetBtn) resetBtn.addEventListener('click', function(){
      applyContrast('normal'); applyFont('normal'); applyScreenReader(false);
      localStorage.removeItem(P + 'contrast'); localStorage.removeItem(P + 'font'); localStorage.removeItem(P + 'sr');
      donomanaAnnounceA11y('設定をリセットしました');
    });
    applyContrast(localStorage.getItem(P + 'contrast') || 'normal');
    applyFont(localStorage.getItem(P + 'font') || 'normal');
    applyScreenReader(localStorage.getItem(P + 'sr') === '1');
  });
})();
</script>

<div id="donomanaLockToast" role="alert" aria-live="assertive" style="position:fixed;top:112px;left:50%;transform:translateX(-50%) translateY(-10px);background:#c0392b;color:#fff;font-size:14px;font-weight:700;padding:10px 20px;border-radius:40px;box-shadow:0 4px 24px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:100000;white-space:nowrap;"></div>
<script>
(function(){
  var locked=false, toastTimer=null;
  function toast(msg){
    var el=document.getElementById('donomanaLockToast');
    if(!el)return;
    el.textContent=msg;
    el.style.opacity='1'; el.style.transform='translateX(-50%) translateY(0)';
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){el.style.opacity='0';el.style.transform='translateX(-50%) translateY(-10px)';},2200);
  }
  function setLock(on){
    locked=on;
    var btn=document.getElementById('donomanaLockBtn');
    if(btn){
      btn.textContent=on?'🔒':'🔓';
      btn.style.background=on?'rgba(255,80,80,0.92)':'rgba(255,255,255,0.92)';
      btn.setAttribute('aria-label',on?'ロックちゅう（タップでかいじょ）':'がめんをロック');
    }
    if(on){
      history.pushState({donomanaLocked:true},'');
      history.pushState({donomanaLocked:true},'');
      toast('🔒 がめんをロックしたよ');
    } else {
      toast('🔓 ロックをかいじょしたよ');
    }
  }
  window.addEventListener('popstate',function(){
    if(locked){history.pushState({donomanaLocked:true},'');toast('🔒 まえの がめんには もどれないよ');}
  });
  window.addEventListener('beforeunload',function(e){
    if(locked){e.preventDefault();e.returnValue='';}
  });
  document.addEventListener('DOMContentLoaded',function(){
    var lockBtn=document.getElementById('donomanaLockBtn');
    if(lockBtn)lockBtn.addEventListener('click',function(){setLock(!locked);});
    var homeBtn=document.getElementById('donomanaHomeBtn');
    if(homeBtn){
      homeBtn.addEventListener('click',function(e){
        if(locked){e.preventDefault();toast('🔒 まえの がめんには もどれないよ');}
      });
    }
    var fsBtn=document.getElementById('donomanaFsBtn');
    function inFS(){return !!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement);}
    function updateFsBtn(){if(fsBtn){fsBtn.textContent=inFS()?'⊡':'⛶';fsBtn.setAttribute('aria-label',inFS()?'全画面を解除':'全画面表示');}}
    ['fullscreenchange','webkitfullscreenchange','mozfullscreenchange'].forEach(function(ev){document.addEventListener(ev,updateFsBtn);});
    if(fsBtn)fsBtn.addEventListener('click',function(){
      if(!inFS()){
        var el=document.documentElement;
        var req=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen;
        if(req)req.call(el);
      } else {
        var ex=document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen;
        if(ex)ex.call(document);
      }
    });
  });
})();
</script>

<script>
/* =====================================================================
   Character assets — Phase M6.2: illustrated PNG assets (Visual Source of
   Truth: user-approved reference image), replacing the M6/M6.1 code-generated
   SVG characters. Rationale + extraction method are documented in
   docs/multi-input/mitsukete-touch-design-v1.md (§M6.2). The character asset
   is a purely presentational layer, kept independent of the semantic
   Touch/Gaze/Switch/Keyboard interaction (still activateItem(itemId, method)
   on the .mt-hidespot button) and of the cloud, which remains this app's own
   SVG so its reveal position can still be driven per Level.

   All 6 PNGs were normalized onto one shared 543x382 transparent canvas with
   each character's eyes aligned to the same (x,y) point, so a single
   width/top peek rule in CSS behaves consistently across every character
   (design doc §M6.2 "unified canvas" requirement) instead of needing
   per-character tuning.
===================================================================== */
var CHARACTERS = [
  { id: 'rabbit', label: 'うさぎ' },
  { id: 'cat',    label: 'ねこ' },
  { id: 'dog',    label: 'いぬ' },
  { id: 'chick',  label: 'ひよこ' },
  { id: 'bear',   label: 'くま' },
  { id: 'star',   label: 'おほしさま' }
];
var CHAR_BY_ID = {};
CHARACTERS.forEach(function(c) { CHAR_BY_ID[c.id] = c; });
var CHAR_ASSET_W = 543;
var CHAR_ASSET_H = 382;
function characterImg(charId) {
  return '<img class="mt-character-img" src="assets/mitsukete-touch/' + charId + '.png" ' +
         'width="' + CHAR_ASSET_W + '" height="' + CHAR_ASSET_H + '" alt="" aria-hidden="true" draggable="false">';
}
var CLOUD_SVG = '<svg viewBox="0 0 100 84" aria-hidden="true">' +
  '<ellipse cx="50" cy="58" rx="44" ry="20" fill="#FFFFFF" stroke="#B9C7D1" stroke-width="2.5"/>' +
  '<circle cx="28" cy="42" r="18" fill="#FFFFFF" stroke="#B9C7D1" stroke-width="2.5"/>' +
  '<circle cx="55" cy="32" r="23" fill="#FFFFFF" stroke="#B9C7D1" stroke-width="2.5"/>' +
  '<circle cx="78" cy="44" r="16" fill="#FFFFFF" stroke="#B9C7D1" stroke-width="2.5"/>' +

var audioCtx = null;
function playDiscoverySound() {
  if (!soundEnabled) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    var now = audioCtx.currentTime;
    [ [740, 0.00, 0.11], [988, 0.10, 0.13] ].forEach(function(spec) {
      var freq = spec[0], start = now + spec[1], dur = spec[2];
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.13, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(start); osc.stop(start + dur + 0.02);
    });
  } catch (e) {}
}

function pickFrom(pool, avoid) {

}
function buildTrialItems(level) {

  // itself only ever has 1 hide spot, never 7. Level2/3's lists are the fixed slot sets
  // actually used every trial (2 and 3 respectively), so they need no such narrowing.
  var slots = (level === 1) ? [pickFrom(LEVEL_POSITIONS[1], transient.previousPosition)] : LEVEL_POSITIONS[level];
  var targetSlot = (level === 1) ? slots[0] : pickFrom(slots, transient.previousPosition);
  var targetChar = CHAR_BY_ID[pickFrom(CHARACTERS.map(function(c) { return c.id; }), transient.previousCharacterId)];
  transient.previousPosition = targetSlot;

  return slots.map(function(pos, idx) {
    var isTarget = pos === targetSlot;

      id: 'item-' + canonical.trialIndex + '-' + idx,

/* =====================================================================
   Semantic Activation API (Phase M5 §12.1, M6 §17-18)
===================================================================== */
function activateItem(itemId, inputMethod) {

  var now = performance.now();

  var item = currentItems.filter(function(i) { return i.id === itemId; })[0];
  if (!item) return;

  transient.inputLockUntil = now + ACTIVATION_LOCK_MS;
  var responseTime = Math.round(now - trialStartedAt);
  var dwellDuration = (inputMethod === 'gaze') ? lastDwellDurationMs : null;
  lastDwellDurationMs = null;
  currentInputMethod = inputMethod;
  resetDwellState();
  if (scanMode) { stopAutoScan(); clearScanHighlight_classOnly(); }

  var targetItem = currentItems.filter(function(i) { return i.role === 'target'; })[0];
  canonical.totalActivationCount += 1;
  canonical.phase = 'feedback';

  if (item.role === 'target') {
    canonical.targetActivationCount += 1;
    item.active = true;
    playDiscoverySound();
    renderItems();
    document.getElementById('discoveryText').textContent = 'みつけた！';
    donomanaAnnounce('みつけた！' + item.label);
    addLog({
      time: new Date().toISOString(), level: canonical.level,
      selectedPosition: POSITION_LABEL[item.position], itemRole: 'target',
      inputMethod: inputMethod, responseTime: responseTime, dwellDuration: dwellDuration,
      targetPosition: POSITION_LABEL[item.position], trialIndex: canonical.trialIndex

      document.getElementById('discoveryText').textContent = '';
      maybeShowSoftCompletion();
      startNewTrial();

  } else {
    item.neutralPulse = true;
    renderItems();
    addLog({
      time: new Date().toISOString(), level: canonical.level,
      selectedPosition: POSITION_LABEL[item.position], itemRole: 'other',
      inputMethod: inputMethod, responseTime: responseTime, dwellDuration: dwellDuration,
      targetPosition: POSITION_LABEL[targetItem.position], trialIndex: canonical.trialIndex
    });
    transient.feedbackTimer = setTimeout(function() {
      item.neutralPulse = false;

}

===================================================================== */
var lastGazeX = null, lastGazeY = null;

}

// Gaze Standard §12.3/§13.2: hit area may exceed the visual hide spot (this app's
// existing principle — hit area is already the WHOLE cloud, not just the peeking
// character). At 100% scale + normal spacing this stays byte-for-byte the original
// elementFromPoint-based test (zero behavior change at default).
//
// §13.2 target spacing note: unlike miru-hirogaru (flex/grid gap), this app
// positions hide spots via absolute percentage coordinates carefully tuned against
// real overflow measurements (see .mt-pos-* comments above) — widening those
// percentages risks reopening that overflow work. Per the Phase M11.3-B brief's own
// guidance ("hit region側の調整を優先検討する"), spacing is instead implemented as
// an erosion applied to the *enlarged* hit box only (never below the native visual
// size), so "wide spacing" moderates how far enlargement can encroach toward a
// neighbor. With enlargement at 100% (its default), spacing has no visible effect,
// since the un-enlarged hide spots already have no overlap (verified in Rendered
// Validation, §Responsive).
function hitTestGazeTargets(x, y, targets) {
  if (gazeTargetScalePct <= TARGET_SCALE_STANDARD && !targetSpacingWide) {
    var el = document.elementFromPoint(x, y);

    for (var i = 0; i < targets.length; i++) { if (targets[i] === el || targets[i].contains(el)) return targets[i]; }
    return null;
  }

  for (var j = 0; j < targets.length; j++) {
    var r = targets[j].getBoundingClientRect();
    var padX = Math.max(0, (r.width * (scale - 1) / 2) - (targetSpacingWide ? SPACING_EROSION_PX : 0));
    var padY = Math.max(0, (r.height * (scale - 1) / 2) - (targetSpacingWide ? SPACING_EROSION_PX : 0));
    if (x >= r.left - padX && x <= r.right + padX && y >= r.top - padY && y <= r.bottom + padY) {
      var area = r.width * r.height;
      if (area < bestArea) { bestArea = area; best = targets[j]; }

function gazeTick() {

    var hitId = hit ? hit.dataset.itemId : null;
    var now = performance.now();

    // leave-and-reenter re-trigger gate (Gaze Standard §10.2 方式A): once an item
    // has just been activated via gaze (target OR distractor — a distractor return
    // to 'ready' keeps the SAME item in play, unlike a target hit which swaps in a
    // fresh trial), it must be looked away from *and* cooldownMs must have elapsed
    // (§10, whichever is later) before a new dwell can start on it again.
    if (transient.gazeAwaitingLeaveId && hitId !== transient.gazeAwaitingLeaveId && now >= transient.gazeAwaitingLeaveUntil) {
      transient.gazeAwaitingLeaveId = null;
    }
    if (hitId !== transient.gazeItemId) {
      resetDwellState();
      if (hit && hitId !== transient.gazeAwaitingLeaveId) {

        transient.gazeEntryAt = now;

/* ---- §12.3 gaze target enlargement (hit area only, cloud/character size unchanged) ---- */
function applyTargetScale(large) {
  gazeTargetScalePct = large ? TARGET_SCALE_LARGE : TARGET_SCALE_STANDARD;
}
var toggleGazeEnlarge = document.getElementById('toggleGazeEnlarge');
toggleGazeEnlarge.addEventListener('change', function() { applyTargetScale(toggleGazeEnlarge.checked); saveSettings(); });

/* ---- §13.2 target spacing (erosion on the enlarged hit box only, see hitTestGazeTargets) ---- */
function applyTargetSpacing(wide) {
  targetSpacingWide = wide;
}
var toggleGazeSpacing = document.getElementById('toggleGazeSpacing');
toggleGazeSpacing.addEventListener('change', function() { applyTargetSpacing(toggleGazeSpacing.checked); saveSettings(); });

/* ---- §14.2 motion / progression speed — affects post-activation pacing
   (next-trial wait, neutral-distractor pause, reveal sparkle) only, never the
   dwell timing itself. prefers-reduced-motion always takes precedence. ---- */
function applyMotionSpeed(level) {
  motionSpeedLevel = level;
  document.documentElement.style.setProperty('--mt-reveal-duration', (level === 'slow' ? MT_REVEAL_DURATION_SLOW_MS : MT_REVEAL_DURATION_NORMAL_MS) + 'ms');
}
var toggleGazeSlowMotion = document.getElementById('toggleGazeSlowMotion');
toggleGazeSlowMotion.addEventListener('change', function() { applyMotionSpeed(toggleGazeSlowMotion.checked ? 'slow' : 'normal'); saveSettings(); });

/* ---- Reset: restores all Gaze Standard settings (incl. ON/OFF) to their
   documented defaults, keeping UI/internal-state/persisted-value in sync. ---- */
function resetGazeSettingsToDefault() {
  setGazeEnabled(false); toggleGaze.checked = false;
  dwellDurationMs = DWELL_MS; refreshDwellVal();
  entryDelayMs = 0; refreshEntryDelayVal();
  cooldownMs = 900; refreshCooldownVal();
  applyDwellProgressVisible(true); toggleGazeProgress.checked = true;
  applyTargetScale(false); toggleGazeEnlarge.checked = false;
  applyTargetSpacing(false); toggleGazeSpacing.checked = false;
  applyMotionSpeed('normal'); toggleGazeSlowMotion.checked = false;
  saveSettings();
  donomanaAnnounce('視線入力の設定を既定にもどしました');
}
document.getElementById('gazeSettingsResetBtn').addEventListener('click', resetGazeSettingsToDefault);

/* =====================================================================
   Switch Scan — Level1 Direct Activation (single hide spot), Level2/3
   Auto Scan at 1500ms including distractors (Input Equity, M5 §11.3 /
   M6 §30-34).
===================================================================== */
function settingsPanelHidden() { return settingsPanel.hidden; }
function commonChromeCandidates() {
  return [
    document.getElementById('donomanaHomeBtn'),
    document.getElementById('donomanaLockBtn'),
    document.getElementById('donomanaFsBtn'),
    document.getElementById('donomanaA11yBtn')
  ].filter(Boolean);
}
function isVisibleEnabled(el) {
  if (!el || !el.isConnected || el.disabled) return false;
  if (el.closest('[hidden]')) return false;
  var cs = getComputedStyle(el);
  if (cs.display === 'none' || cs.visibility === 'hidden') return false;
  return true;
}
function buildScanItems() {
  var items = [];
  if (!settingsPanelHidden()) {
    items = Array.from(settingsPanel.querySelectorAll('[tabindex="0"]'));
  } else {
    items = items.concat(levelBtns);
    if (canonical.phase === 'ready') items = items.concat(Array.from(playArea.querySelectorAll('.mt-hidespot')));
    items.push(settingsBtn);
  }
  items = items.concat(commonChromeCandidates());
  return items.filter(isVisibleEnabled);
}
var scanTargets = [];
var scanFocusIndex = -1;
var scanInterval = null;
function refreshSwitchScanItems() {
  scanFocusIndex = -1;
  scanTargets = buildScanItems();
  clearScanHighlight_classOnly();
  if (scanTargets.length) {
    scanFocusIndex = 0;
    scanTargets[0].focus({ preventScroll: true });
    scanTargets[0].classList.add('scan-focus');
  }
}
function clearScanHighlight_classOnly() {
  document.querySelectorAll('.scan-focus').forEach(function(el) { el.classList.remove('scan-focus'); });
}
function clearScanHighlight() {
  document.body.classList.remove('scan-mode');
  clearScanHighlight_classOnly();
}
function startAutoScan() {
  stopAutoScan();
  if (settingsPanelHidden() && canonical.level === 1) return; // Direct Activation
  scanInterval = setInterval(function() {
    var targets = buildScanItems();
    if (!targets.length) return;
    scanTargets = targets;
    if (scanFocusIndex >= targets.length) scanFocusIndex = 0;
    scanFocusIndex = (scanFocusIndex + 1) % targets.length;
    var t = targets[scanFocusIndex];
    if (t) { clearScanHighlight_classOnly(); t.focus({ preventScroll: true }); t.classList.add('scan-focus'); }
  }, SCAN_INTERVAL_MS);
}
function stopAutoScan() { clearInterval(scanInterval); scanInterval = null; }
function startSwitchScan() {
  document.body.classList.add('scan-mode');
  setTimeout(function() { if (scanMode) refreshSwitchScanItems(); }, 200);
  startAutoScan();
}
function stopSwitchScan() { stopAutoScan(); clearScanHighlight(); }
function activateCurrentScanItem() {
  var el = document.activeElement;
  if (!el || el === document.body) return;
  if (el.classList.contains('mt-hidespot')) {
    activateItem(el.dataset.itemId, 'switch');
  } else {
    el.click();
  }
}
function setScanMode(on) {
  scanMode = on;
  if (on) { startSwitchScan(); } else { stopSwitchScan(); }
}
var toggleScan = document.getElementById('toggleScan');
toggleScan.addEventListener('change', function() { setScanMode(toggleScan.checked); });

document.addEventListener('keydown', function(e) {
  if (e.key === ' ' || e.key === 'Spacebar') {
    if (scanMode) {
      if (settingsPanelHidden() && canonical.level === 1) {
        if (canonical.phase === 'ready' && currentItems[0]) activateItem(currentItems[0].id, 'switch');
      } else {
        e.preventDefault();
        activateCurrentScanItem();
      }
    }
  }
});

/* =====================================================================
   Settings panel open/close
===================================================================== */
var settingsBtn = document.getElementById('settingsBtn');
var settingsPanel = document.getElementById('settingsPanel');
var settingsCloseBtn = document.getElementById('settingsCloseBtn');
function openSettings() {
  settingsPanel.hidden = false;
  settingsBtn.setAttribute('aria-expanded', 'true');
  renderRecords();
  if (scanMode) { refreshSwitchScanItems(); startAutoScan(); }
}
function closeSettings() {
  settingsPanel.hidden = true;
  settingsBtn.setAttribute('aria-expanded', 'false');
  if (scanMode) { refreshSwitchScanItems(); startAutoScan(); }
  // settingsBtn is CSS-hidden (SETTINGS_PROXY, generate.js) and its opener
  // (#donomanaSettingsProxy) sits inside the a11y panel, which is already closed by the
  // time this runs (Phase16.45-A) — neither is a valid focus target. Return focus to the
  // persistent #donomanaA11yBtn (always visible) instead of losing it to <body>.
  (document.getElementById('donomanaA11yBtn') || settingsBtn).focus();
}
settingsBtn.addEventListener('click', function() { settingsPanel.hidden ? openSettings() : closeSettings(); });
settingsCloseBtn.addEventListener('click', closeSettings);
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && !settingsPanel.hidden) closeSettings();
});

var toggleSound = document.getElementById('toggleSound');
toggleSound.addEventListener('change', function() { soundEnabled = toggleSound.checked; saveSettings(); });

/* =====================================================================
   Records / CSV — observed events only; target/other kept neutral,
   never "correct/mistake" (Phase M5 §14, M6 §42-51).
===================================================================== */
var recordsShowAll = false;
var RECORDS_SHOW_INITIAL = 5;
function groupIntoSessions(log) {
  var GAP_MS = 5 * 60 * 1000;
  var sessions = [];
  var current = null;
  var lastTime = null;
  log.forEach(function(entry) {
    var t = new Date(entry.time).getTime();
    var startsNew = !current || (lastTime !== null && (t - lastTime) > GAP_MS) || current.level !== entry.level;
    if (startsNew) { current = { level: entry.level, entries: [] }; sessions.push(current); }
    current.entries.push(entry);
    lastTime = t;
  });
  return sessions;
}
function formatRecordDate(iso) {
  try {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  } catch (e) { return ''; }
}
var LEVEL_NAME = { 1: 'どこかな？', 2: 'みつけた！', 3: 'いっぱいかくれんぼ' };
var INPUT_LABEL = { touch: 'タッチ', click: 'タッチ', gaze: 'しせん', switch: 'スイッチ', keyboard: 'キーボード' };
function summarizeSession(sess) {
  var first = sess.entries[0], last = sess.entries[sess.entries.length - 1];
  var durationMs = first && last ? (new Date(last.time) - new Date(first.time)) : 0;
  var foundCount = sess.entries.filter(function(e) { return e.itemRole === 'target'; }).length;
  var inputCounts = {};
  sess.entries.forEach(function(e) { inputCounts[e.inputMethod] = (inputCounts[e.inputMethod] || 0) + 1; });
  var mainInput = Object.keys(inputCounts).sort(function(a, b) { return inputCounts[b] - inputCounts[a]; })[0] || '-';
  return {
    dateStr: first ? formatRecordDate(first.time) : '',
    title: LEVEL_NAME[sess.level] || ('レベル' + sess.level),
    lines: ['活動時間：約' + Math.max(1, Math.round(durationMs / 1000)) + '秒 ／ みつけた回数：' + foundCount + '回 ／ 働きかけ回数：' + sess.entries.length + '回 ／ 主な入力：' + (INPUT_LABEL[mainInput] || mainInput)]
  };
}
function renderRecords() {
  var sessions = groupIntoSessions(readLog()).reverse();
  var list = document.getElementById('recordsList');
  var empty = document.getElementById('recordsEmpty');
  var showMoreBtn = document.getElementById('recordsShowMoreBtn');
  var csvBtn = document.getElementById('recordsCsvBtn');
  var deleteBtn = document.getElementById('recordsDeleteBtn');
  list.innerHTML = '';
  if (sessions.length === 0) {
    empty.hidden = false; showMoreBtn.hidden = true; csvBtn.hidden = true; deleteBtn.hidden = true;
    return;
  }
  empty.hidden = true; csvBtn.hidden = false; deleteBtn.hidden = false;
  var visibleCount = recordsShowAll ? sessions.length : Math.min(RECORDS_SHOW_INITIAL, sessions.length);
  for (var i = 0; i < visibleCount; i++) {
    var s = summarizeSession(sessions[i]);
    var item = document.createElement('div');
    item.className = 'record-item';
    var title = document.createElement('div');
    title.style.fontWeight = '700';
    title.textContent = (s.dateStr ? s.dateStr + '　' : '') + s.title;
    item.appendChild(title);
    s.lines.forEach(function(line) { var p = document.createElement('div'); p.textContent = line; item.appendChild(p); });
    list.appendChild(item);
  }
  showMoreBtn.hidden = recordsShowAll || sessions.length <= RECORDS_SHOW_INITIAL;
}
document.getElementById('recordsShowMoreBtn').addEventListener('click', function() {
  recordsShowAll = true; renderRecords();
  if (scanMode) refreshSwitchScanItems();
});

var CSV_HEADERS = ['日時', 'レベル', '選んだ場所', '種類', '入力方法', '反応時間ms', '注視時間ms', 'かくれていた場所', 'trial'];
var ROLE_LABEL = { target: 'みつけた', other: 'ほかのばしょ' };
function csvEscape(value) {
  var s = (value === null || value === undefined) ? '' : String(value);
  if (/[",\n\r]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function formatRecordDateTimeFull(iso) {
  try {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    function pad(n) { return n < 10 ? '0' + n : String(n); }
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  } catch (e) { return ''; }
}
function buildRecordsCsvRows() {
  var rows = [CSV_HEADERS.slice()];
  readLog().forEach(function(e) {
    rows.push([
      formatRecordDateTimeFull(e.time),
      LEVEL_NAME[e.level] || ('レベル' + e.level),
      e.selectedPosition,
      ROLE_LABEL[e.itemRole] || e.itemRole,
      INPUT_LABEL[e.inputMethod] || e.inputMethod,
      e.responseTime,
      (e.dwellDuration === null || e.dwellDuration === undefined) ? '' : e.dwellDuration,
      e.targetPosition,
      e.trialIndex
    ]);
  });
  return rows;
}
function downloadRecordsCsv() {
  var rows = buildRecordsCsvRows();
  var csv = rows.map(function(r) { return r.map(csvEscape).join(','); }).join('\r\n');
  var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'mitsukete-touch-records.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
document.getElementById('recordsCsvBtn').addEventListener('click', downloadRecordsCsv);
document.getElementById('recordsDeleteBtn').addEventListener('click', function() {
  document.getElementById('recordsConfirm').hidden = false;
});
document.getElementById('recordsConfirmDelete').addEventListener('click', function() {
  writeLog([]);
  document.getElementById('recordsConfirm').hidden = true;
  renderRecords();
  document.getElementById('recordsStatus').textContent = 'きろくをすべて消しました';
  if (scanMode) refreshSwitchScanItems();
});
document.getElementById('recordsConfirmCancel').addEventListener('click', function() {
  document.getElementById('recordsConfirm').hidden = true;
});

/* =====================================================================
   init
===================================================================== */
loadSettings();
toggleSound.checked = soundEnabled;

// Gaze Accessibility Standard v1.0 §16: apply the loaded (or default) values to
// every control's displayed state and to the underlying live effect (see
// miru-hirogaru-app.html's identical init pattern, Phase M11.3-A).
refreshDwellVal(); refreshEntryDelayVal(); refreshCooldownVal();
toggleGazeProgress.checked = dwellProgressVisible; applyDwellProgressVisible(dwellProgressVisible);
toggleGazeEnlarge.checked = (gazeTargetScalePct === TARGET_SCALE_LARGE); applyTargetScale(gazeTargetScalePct === TARGET_SCALE_LARGE);
toggleGazeSpacing.checked = targetSpacingWide; applyTargetSpacing(targetSpacingWide);
toggleGazeSlowMotion.checked = (motionSpeedLevel === 'slow'); applyMotionSpeed(motionSpeedLevel);
toggleGaze.checked = gazeEnabled;
setGazeEnabled(gazeEnabled); // starts the rAF loop only if the persisted value was true

startNewTrial();
</script>
</body>
